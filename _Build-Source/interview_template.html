<title>CSF Interview Assessment</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: engagement header, tab bar (Setup, Dashboard, Assess, Gap roadmap, Activities); Assess is a list-detail workspace */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212f; --muted:#5a6577; --line:#d6dce5; --accent:#245a7a; --accent-soft:#e2eef5; --chip:#eef1f5;
  --ok:#1e7a46; --ok-soft:#e3f3ea; --warn:#a96300; --warn-soft:#fcf0dc; --bad:#b42318; --bad-soft:#fbe7e5; --na:#7b8494; --na-soft:#f0f1f4;
  --req:#b42318; --exp:#1d4ed8; --opt:#8a93a3; --on-block:#ffffff;
  --cap-it:#2e7d4f; --cap-g:#b26a00; --cap-s:#8a2f8f;
  --f-body:"IBM Plex Sans Thai",system-ui,"Segoe UI",Tahoma,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#18202a; --ink:#e5e9f0; --muted:#9aa4b4; --line:#2c3644; --accent:#7fb6d6; --accent-soft:#1d3342; --chip:#222b37;
  --ok:#4cc27e; --ok-soft:#173326; --warn:#e3a33f; --warn-soft:#3a2c15; --bad:#ef6b61; --bad-soft:#3a1d1c; --na:#8a93a3; --na-soft:#232a35;
  --req:#e5534b; --exp:#5b8def; --opt:#7d8696; --on-block:#ffffff; --cap-it:#4fbf82; --cap-g:#e2a23b; --cap-s:#d07ad6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#18202a; --ink:#e5e9f0; --muted:#9aa4b4; --line:#2c3644; --accent:#7fb6d6; --accent-soft:#1d3342; --chip:#222b37;
  --ok:#4cc27e; --ok-soft:#173326; --warn:#e3a33f; --warn-soft:#3a2c15; --bad:#ef6b61; --bad-soft:#3a1d1c; --na:#8a93a3; --na-soft:#232a35;
  --req:#e5534b; --exp:#5b8def; --opt:#7d8696; --on-block:#ffffff; --cap-it:#4fbf82; --cap-g:#e2a23b; --cap-s:#d07ad6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
.wrap{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
header.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font-size:clamp(20px,2.6vw,27px);margin:0;line-height:1.2;text-wrap:balance}
.eng{color:var(--muted);font-size:13px;margin-top:2px}
.eng b{color:var(--ink)}
.hbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{font:600 13px var(--f-body);padding:6px 11px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{font-size:12px;padding:3px 8px}
.mchk{display:flex;flex-wrap:wrap;gap:4px 12px}
.mchk label{display:flex;gap:4px;align-items:center}
.btn.mono{font-family:var(--f-mono);white-space:nowrap}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.lang{display:flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.lang button{font:600 13px var(--f-body);padding:6px 12px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.savebar{font-size:12px;color:var(--muted);margin:8px 0 0}
.tabs{display:flex;gap:4px;margin:14px 0 12px;flex-wrap:wrap}
.tabs button{font:600 14px var(--f-body);padding:7px 14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:4px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{font:13px var(--f-body);padding:5px 7px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:54px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
.box{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.pad{padding:14px}
.scroll{overflow-x:auto}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px;max-width:110ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.form{display:grid;grid-template-columns:200px 1fr;gap:8px 12px;align-items:center}
.form label{font-size:13px;color:var(--muted)}
.form .help{grid-column:2;font-size:12px;color:var(--muted);margin-top:-4px}
@media (max-width:640px){.form{grid-template-columns:1fr}.form .help{grid-column:1}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
.seg button{font:600 12px var(--f-body);padding:3px 9px;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button[aria-pressed="true"][data-v="P"],.seg button[aria-pressed="true"][data-v="Exists"],.seg button[aria-pressed="true"][data-v="Y"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="F"],.seg button[aria-pressed="true"][data-v="Missing"],.seg button[aria-pressed="true"][data-v="N"]{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"][data-v="Partial"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="NA"]{background:var(--na);color:#fff}
.lv{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:2px;font:600 11px var(--f-mono);color:var(--on-block);flex:none}
.lv.Required{background:var(--req)} .lv.Expected{background:var(--exp)} .lv.Optional{background:var(--opt)}
.cap{flex:none;font:600 10px var(--f-mono);padding:0 4px;border-radius:2px;border:1px solid currentColor;line-height:15px;display:inline-block}
.cap.IT{color:var(--cap-it)} .cap.GUIDED{color:var(--cap-g)} .cap.SPEC{color:var(--cap-s)}
.st{display:inline-block;font:600 11px var(--f-body);padding:1px 8px;border-radius:10px;white-space:nowrap}
.st.Exists{background:var(--ok-soft);color:var(--ok)} .st.Partial{background:var(--warn-soft);color:var(--warn)} .st.Missing{background:var(--bad-soft);color:var(--bad)} .st.NA{background:var(--na-soft);color:var(--na)} .st.none{background:var(--chip);color:var(--muted)} .st.out{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.mono{font-family:var(--f-mono)}
.mini{font-size:12px;color:var(--muted)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{padding:10px 12px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--warn)} .kpi.bad b{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.bar .tr{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--chip)}
.bar .tr i{display:block;height:100%}
.bar .num{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:12px}
@media (max-width:560px){.bar{grid-template-columns:90px 1fr 54px}}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.heat>div{border-radius:4px;padding:8px;font-size:12px;border:1px solid var(--line)}
.heat b{display:block;font-family:var(--f-mono);font-size:13px}
.callout{border-left:4px solid var(--cap-s);background:var(--chip);padding:10px 12px;border-radius:4px;font-size:13px;margin:8px 0}
.callout.ok{border-left-color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:4px}
/* tables */
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface);position:sticky;top:0}
table.t tr.out td{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
/* assess workspace */
.ws{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:12px;align-items:start}
@media (max-width:900px){.ws{grid-template-columns:1fr}}
.list{max-height:78vh;overflow:auto}
.lfil{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.lfil input[type=search]{flex:1 1 100%}
.li{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 10px;cursor:pointer;font:13px var(--f-body)}
.li:hover{background:var(--chip)} .li.sel{background:var(--accent-soft)}
.li .id{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .pct{font:600 11px var(--f-mono);color:var(--muted);min-width:34px;text-align:right}
.li.out{opacity:.5}
.detail{min-width:0}
.dh{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dh h2{flex:1 1 300px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin:6px 0 10px}
.meta b{color:var(--ink);font-weight:600}
.ck{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.ck .q{font-weight:600;font-size:13px}
.ck .r{font-size:12px;color:var(--muted);grid-column:1}
.ck .seg{grid-row:1/span 2;grid-column:2;align-self:start}
.ck input{grid-column:1/-1;width:100%}
.ck.F .q{color:var(--bad)}
.actrow{border:1px solid var(--line);border-radius:4px;padding:8px;margin:6px 0}
.actrow .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actrow .top b{flex:1;min-width:0}
.actrow details{font-size:12px;margin-top:4px}
.actrow ol{margin:4px 0;padding-left:18px}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:20;display:flex;justify-content:center;align-items:flex-start;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal .panel{background:var(--surface);color:var(--ink);border-radius:8px;max-width:860px;width:100%;padding:22px 24px;border:1px solid var(--line)}
.modal p,.modal li{font-size:14px;max-width:80ch}
.modal h3{text-transform:none;letter-spacing:0;color:var(--ink);font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:13px;z-index:30}
/* interview additions */
.seg button[aria-pressed="true"][data-v="0"]{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"][data-v="1"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="2"]{background:#4d7ea8;color:#fff}
.seg button[aria-pressed="true"][data-v="3"],.seg button[aria-pressed="true"][data-v="4"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="S"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="O"]{background:#4d7ea8;color:#fff}
.seg button[aria-pressed="true"][data-v="D"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="open"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="recv"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="req"]{background:#4d7ea8;color:#fff}
.seg button[aria-pressed="true"][data-v="none"]{background:var(--bad);color:#fff}
.tier{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 4px;border-radius:3px;font:600 12px var(--f-mono);color:#fff}
.tier.t0{background:var(--bad)} .tier.t1{background:var(--warn)} .tier.t2{background:#4d7ea8} .tier.t3,.tier.t4{background:var(--ok)} .tier.tNA{background:var(--na)} .tier.tnone{background:var(--chip);color:var(--muted);border:1px solid var(--line)}
.qbox{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:4px;margin:8px 0}
.qbox .qq{font-size:16px;font-weight:600;line-height:1.45}
.probe{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13px}
.probe input{margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:12px var(--f-body);padding:3px 9px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.anchors{font-size:12px;color:var(--muted);margin:6px 0 0;padding-left:0;list-style:none}
.anchors li{padding:1px 0}
.anchors b{color:var(--ink)}
.flag{display:inline-block;font:600 11px var(--f-body);padding:1px 7px;border-radius:10px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.flag.info{background:var(--chip);color:var(--muted)}
.pair{display:grid;grid-template-columns:160px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.pair .tr{position:relative;height:16px;background:var(--chip);border-radius:3px}
.pair .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.pair .tr u{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink);text-decoration:none}
@media (max-width:560px){.pair{grid-template-columns:90px 1fr 60px}}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quad>div{border:1px solid var(--line);border-radius:6px;padding:10px}
.quad b.n{font-size:22px;display:block;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"][data-v="P"]{background:var(--warn);color:#fff}
.scene{border:1px solid var(--line);border-radius:6px;margin:8px 0;overflow:hidden}
.scene .st1{padding:10px 12px;background:var(--chip);font-size:13px}
.scene .st2{padding:10px 12px;border-top:1px solid var(--line);background:var(--warn-soft)}
.scene .st2 .qq{font-size:15px;font-weight:600;line-height:1.45}
.step{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg);font:600 11px var(--f-mono);margin-right:6px;vertical-align:1px}
.tc{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0}
.tc .top{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.tc .top .qt{flex:1 1 320px;font-weight:600;font-size:13px}
.tc .good{font-size:12px;background:var(--ok-soft);border-left:3px solid var(--ok);padding:6px 9px;border-radius:3px;margin:6px 0}
.tc .good b{color:var(--ok)}
.tc.N{border-left:4px solid var(--bad)} .tc.P{border-left:4px solid var(--warn)} .tc.Y{border-left:4px solid var(--ok)}
.ref{font:11px var(--f-mono);color:var(--muted)}
.sessgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.sess{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.sess .sh{display:flex;gap:8px;align-items:center}
.sess .sn{display:inline-grid;place-items:center;min-width:34px;height:24px;border-radius:4px;background:var(--ink);color:var(--bg);font:600 12px var(--f-mono)}
.sess .st3{flex:1;font-weight:600;font-size:14px;line-height:1.3}
.sess p{margin:0;font-size:12px;color:var(--muted)} .sess p b{color:var(--ink)}
.sess .bar2{height:6px;background:var(--chip);border-radius:3px;overflow:hidden} .sess .bar2 i{display:block;height:100%;background:var(--ok)}
.sess.par{border-style:dashed}
.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font:600 12px var(--f-mono);margin:6px 0 12px}
.flow span{padding:3px 8px;border-radius:4px;background:var(--chip)} .flow span.p{border:1px dashed var(--line);background:transparent} .flow em{color:var(--muted);font-style:normal}
table.sys td,table.sys th{padding:4px 5px} table.sys select,table.sys input[type=text]{font-size:12px;padding:3px 4px}
.crit{display:inline-grid;place-items:center;width:22px;height:20px;border-radius:3px;font:600 12px var(--f-mono);color:#fff}
.crit.A{background:var(--bad)} .crit.B{background:var(--warn)} .crit.C{background:var(--na)} .crit.none{background:var(--chip);color:var(--muted)}
td.cY{background:var(--ok-soft)} td.cP{background:var(--warn-soft)} td.cN{background:var(--bad-soft)} td.cU{background:var(--chip)}
.chipv{display:inline-block;font:600 11px var(--f-body);padding:1px 7px;border-radius:10px;margin:1px}
.chipv.Y{background:var(--ok-soft);color:var(--ok)} .chipv.P{background:var(--warn-soft);color:var(--warn)} .chipv.N{background:var(--bad-soft);color:var(--bad)} .chipv.NA,.chipv.U,.chipv.none{background:var(--chip);color:var(--muted)}
.linkbox{border:1px dashed var(--line);border-radius:6px;padding:10px 12px;font-size:13px}
td.rt-G{background:var(--ok-soft)} td.rt-W{background:var(--warn-soft)} td.rt-P{background:var(--bad-soft)} td.rt-U{background:var(--chip)}
table.sys select[multiple]{min-width:140px} table.sys td select{max-width:210px} .covline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
#printArea{display:none}
@media print{
  body{background:#fff;color:#000}
  .wrap,.modal,.toast{display:none!important}
  #printArea{display:block;font:11pt var(--f-body);color:#000}
  #printArea h1{font-size:16pt;margin:0 0 4pt}
  #printArea .pq{break-inside:avoid;border-bottom:1px solid #999;padding:6pt 0 18pt}
  #printArea .pq b{font-family:var(--f-mono)}
  #printArea .pl{min-height:40pt}
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1 id="t-title">CSF Interview Assessment</h1>
      <div class="eng" id="eng"></div>
    </div>
    <div class="hbtns">
      <button class="btn" id="b-help"></button>
      <button class="btn" id="b-open"></button><input type="file" id="file" accept=".json,application/json" hidden>
      <button class="btn" id="b-save"></button>
      <button class="btn pri" id="b-xlsx"></button>
      <div class="lang" role="group" aria-label="Language"><button id="b-th" aria-pressed="false">ไทย</button><button id="b-en" aria-pressed="true">EN</button></div>
    </div>
  </header>
  <p class="savebar" id="savebar"></p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <section id="v-setup"></section>
  <section id="v-plan" hidden></section>
  <section id="v-iv" hidden></section>
  <section id="v-score" hidden></section>
  <section id="v-dash" hidden></section>
  <section id="v-fu" hidden></section>
  <section id="v-tech" hidden></section>
  <section id="v-sys" hidden></section>
  <section id="v-ven" hidden></section>
  <section id="v-env" hidden></section>
  <section id="v-dept" hidden></section>
  <section id="v-obs" hidden></section>
</div>
<div id="printArea"></div>
<div class="modal" id="help" hidden role="dialog" aria-modal="true"><div class="panel" id="help-body"></div></div>
<div class="modal" id="confirm" hidden role="alertdialog" aria-modal="true" aria-labelledby="cf-title"><div class="panel" id="confirm-body" style="max-width:560px"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const DATA = __DATA__;

 helpHtml:`<h2>How to use the interview assessment</h2>
<p>Use this file to assess how a client actually operates when documents are missing or incomplete. It covers all 106 NIST CSF 2.0 Subcategories with an interview question, follow-up prompts, and the evidence to request for each.</p>
<h3>Steps</h3><ol>
<li><b>Setup.</b> Enter the engagement details, add interviewees with their roles, and confirm the scoring rules. Optionally link the Document Audit Tracker save file.</li>
<li><b>Interview plan.</b> See which questions belong to each role. Start a session for a role, or print the question sheet before the meeting.</li>
<li><b>Interview.</b> For each Subcategory, ask the main question and the prompts, record who answered, the observed tier, the evidence basis, notes, and the gap. Flag evidence to request.</li>
<li><b>Category tiers.</b> Review the suggested Current Tier per Category, override with a reason where needed, and confirm the Target Tier.</li>
<li><b>Dashboard and Evidence requests.</b> Review Current against Target, the practice and document cross-check, and send the evidence request list to the client.</li></ol>
<h3>Tier scale</h3><p>Tiers 1 to 4 follow the NIST CSF 2.0 Tier names (Partial, Risk Informed, Repeatable, Adaptive), applied here to each Subcategory practice. Tier 0 (Not in place) is a convention of this tool to separate "no practice" from "ad hoc practice"; it is not a CSF Tier.</p>
<h3>Tier Rubric</h3><p>Each Subcategory is rated against the Tier descriptors of its Category from the Tier Rubric, the same rubric the Target Profile Workshop and the Gap Analysis use. Three rules apply. R2: Tier 2 and above need documented or demonstrated evidence. R3: on a Coverage-applicable Subcategory, Tier 3 and above also need coverage of Largely or Full on sampled Criticality A systems; otherwise the counted tier stays at 2 and the outcome is flagged Next-tier ready. R4: the suggested Category tier is the highest Tier that at least half of the rated Subcategories reach.</p>
<h3>System profile</h3><p>Most clients have few documents, so collect facts per system with drop-down answers. In S2 Part A, ask business users which systems they use. In S2 Part B, ask IT to answer the Core profile for every system (about one to two minutes each). In S6, fill the Full profile for Criticality A and sampled systems, and the Development profile for systems that are customized, built in-house, or built by a contractor. Every answer has a rating (Good, Weak, Poor, Unknown). The ratings fill the System Sampling grid and the coverage calculation, so you never enter the same fact twice. The Population view shows how far a gap extends across all systems.</p>
<h3>Departments</h3><p>In S2C, interview frontline users department by department, for example Food and Beverage, Marketing and PR, and Finance. Questions U1 to U8 are standard; add engagement-specific questions as U9. The tool lists systems that IT did not name, and conflicts between what users do and what IT stated. Cite them in the Gap Analysis as DEPT:&lt;department&gt; or &lt;field&gt;:&lt;department&gt;, for example U2:Finance.</p>
<h3>Environment</h3><p>In S1, S3, and S6, record facts about the whole organization: sites, data center and disaster recovery site, network segmentation, staff remote access, workstations, medical devices and operational technology (OT), backup architecture, IT organization, security tools, incident history, changes in flight, and prior assessments. These answers have no rating. The Gap Analysis uses them for the Current IT Landscape section, checks every Improvement Action against the changes in flight and the tools already bought, and flags findings that repeat a prior assessment. Each repeating row gets an ID (for example TOOL-01) that the Gap Analysis cites as evidence.</p>
<h3>Vendors</h3><p>In S5, list every vendor that can reach systems or data, with access type, data access, contract clauses, data processing agreement, and due diligence. Link each vendor to its systems.</p>
<h3>Observations</h3><p>Record vulnerabilities and incident indicators seen during the assessment on the Observations tab. Observe only; do not test or exploit anything unless the Statement of Work authorizes testing. An incident indicator means stopping that work and notifying the client contact at once. Vulnerabilities are evidence for gaps and appear under the related Subcategories.</p>
<h3>Read-back</h3><p>Use the last five minutes of each session to read back the key facts and tick Read-back confirmed on the Interview plan tab. This replaces a separate review round with process owners.</p>
<h3>Interview sequence</h3><p>The Interview plan tab orders the work into ten sessions. Business context comes first (S1), then a Quick BIA that names the critical systems (S2). Governance, legal, and supplier sessions (S3 to S5) need only S1 and can run in parallel. Technical, detection, and response sessions (S6 to S8) use the critical systems from S2. S10 confirms the document request list.</p>
<h3>Systems and Quick BIA</h3><p>When the client has no asset inventory, build a working system list in S2, score impact and tolerable downtime, and confirm criticality with the client. Sample 3 to 5 critical systems in S6. State in the report that this is a preliminary assessment, not a full BIA, and that systems not named in interviews may exist.</p>
<h3>Document requests during interviews</h3><p>Clients often answer "none" to a written document request list, then mention the document in the interview. Tick the related document in each question, or type other documents named. The Requests tab builds one deduplicated list to confirm in S10.</p>
<h3>Scene and scenario</h3><p>Each Subcategory starts with a short scene-setting line and a scenario question. Use them with executives and business owners who are not security specialists: explain why the topic matters, ask them to picture a concrete situation, then confirm with the main question and prompts.</p>
<h3>Technical review</h3><p>The Technical review tab holds control checks for IT and security staff, grouped by technology area (identity, endpoint, network, email, data, backup, vulnerability, logging, cloud, application, third-party access, OT and medical devices, physical, incident response). Each check shows the good practice and its reference (CIS Controls v8.1 Safeguard, ISO/IEC 27002:2022, or NIST guidance). Mark Yes, Partial, No, or N/A and note what you saw. The good practice is a practitioner benchmark, not a legal requirement; scale it to the client's size and risk.</p>
<h3>Evidence rule</h3><p>With the default rule, a rating of Tier 2 or higher based only on what the interviewee said is counted as Tier 1 until evidence arrives. The stated rating stays on record, and an evidence request is created automatically.</p>
<h3>Working with the Document Audit Tracker</h3><p>Both tools read and write the same engagement file. Open an audit save file here to link it; the interview tool then shows document status and the practice and document cross-check. Save file stores both parts. Open the same file in the audit tracker to see interview tiers next to each document.</p>

 helpHtml:`<h2>วิธีใช้แบบประเมินด้วยการสัมภาษณ์</h2>
<p>ใช้ไฟล์นี้ประเมินการปฏิบัติงานจริงของลูกค้าเมื่อเอกสารไม่มีหรือไม่ครบ ครอบคลุม Subcategory ทั้ง 106 ข้อของ NIST CSF 2.0 พร้อมคำถามหลัก คำถามเจาะลึก และหลักฐานที่ควรขอในแต่ละข้อ</p>
<h3>ขั้นตอน</h3><ol>
<li><b>ตั้งค่า</b> กรอกข้อมูลงาน เพิ่มผู้ให้สัมภาษณ์พร้อมบทบาท และยืนยันหลักเกณฑ์การให้คะแนน เชื่อมไฟล์ Document Audit Tracker ได้หากมี</li>
<li><b>แผนการสัมภาษณ์</b> ดูว่าคำถามใดเป็นของบทบาทใด กดเริ่มสัมภาษณ์ตามบทบาท หรือพิมพ์แบบคำถามก่อนประชุม</li>
<li><b>สัมภาษณ์</b> ในแต่ละ Subcategory ถามคำถามหลักและคำถามเจาะลึก บันทึกผู้ตอบ Tier ที่พบ ฐานของหลักฐาน บันทึก และช่องว่าง และระบุหลักฐานที่จะขอ</li>
<li><b>Tier ราย Category</b> ทบทวน Current Tier ที่แนะนำ ปรับพร้อมเหตุผลเมื่อจำเป็น และยืนยัน Target Tier</li>
<li><b>แดชบอร์ดและรายการขอหลักฐาน</b> ดู Current เทียบ Target การเปรียบเทียบการปฏิบัติกับเอกสาร และส่งรายการขอหลักฐานให้ลูกค้า</li></ol>
<h3>ระดับ Tier</h3><p>Tier 1 ถึง 4 ใช้ชื่อตาม NIST CSF 2.0 (Partial, Risk Informed, Repeatable, Adaptive) โดยนำมาใช้กับการปฏิบัติของแต่ละ Subcategory ส่วน Tier 0 (ไม่มีการปฏิบัติ) เป็นข้อกำหนดของเครื่องมือนี้เพื่อแยก "ไม่มีการปฏิบัติ" ออกจาก "ปฏิบัติเฉพาะกิจ" ไม่ใช่ Tier ของ CSF</p>
<h3>Tier Rubric</h3><p>ให้คะแนนแต่ละ Subcategory เทียบกับคำอธิบาย Tier ของ Category นั้นใน Tier Rubric ซึ่งเป็นชุดเดียวกับที่ใช้ใน Target Profile Workshop และ Gap Analysis มีกติกา 3 ข้อ R2: Tier 2 ขึ้นไปต้องมีหลักฐานเป็นเอกสารหรือการสาธิต R3: Subcategory ที่วัดความครอบคลุมได้ จะได้ Tier 3 ขึ้นไปเมื่อความครอบคลุมบนระบบ Criticality A ที่สุ่มตรวจอยู่ระดับ Largely หรือ Full หากไม่ถึงจะนับเป็น Tier 2 และติดสถานะใกล้ถึง Tier ถัดไป R4: Tier ที่แนะนำของ Category คือ Tier สูงสุดที่ Subcategory ที่ให้คะแนนแล้วอย่างน้อยครึ่งหนึ่งทำได้ถึง</p>
<h3>System profile</h3><p>ลูกค้าส่วนใหญ่มีเอกสารน้อย จึงเก็บข้อเท็จจริงรายระบบด้วยคำตอบแบบเลือก ใน S2 ส่วน A ถามผู้ใช้งานธุรกิจว่าใช้ระบบใด ใน S2 ส่วน B ให้ IT ตอบ Core profile ของทุกระบบ (ประมาณ 1 ถึง 2 นาทีต่อระบบ) ใน S6 กรอก Full profile ของระบบ Criticality A และระบบที่สุ่มตรวจ และ Development profile ของระบบที่ปรับแต่ง พัฒนาเอง หรือจ้างพัฒนา ทุกคำตอบมีระดับ (ดี อ่อน แย่ ไม่ทราบ) ซึ่งใช้เติมตารางสุ่มตรวจและคำนวณความครอบคลุม จึงไม่ต้องกรอกข้อมูลเดียวกันซ้ำ ภาพรวมทุกระบบแสดงว่าช่องว่างกระจายไปกว้างแค่ไหน</p>
<h3>แผนก</h3><p>ใน S2C สัมภาษณ์ผู้ใช้งานหน้างานทีละแผนก เช่น Food and Beverage, Marketing and PR และ Finance คำถาม U1 ถึง U8 เป็นคำถามมาตรฐาน เพิ่มคำถามเฉพาะงานเป็น U9 เครื่องมือจะแสดงระบบที่ IT ไม่ได้ระบุ และจุดที่การปฏิบัติจริงขัดกับคำตอบของ IT อ้างอิงใน Gap Analysis เป็น DEPT:&lt;แผนก&gt; หรือ &lt;หัวข้อ&gt;:&lt;แผนก&gt; เช่น U2:Finance</p>
<h3>สภาพแวดล้อม</h3><p>ใน S1, S3 และ S6 บันทึกข้อเท็จจริงระดับองค์กร ได้แก่ สถานที่ ศูนย์ข้อมูลและศูนย์สำรอง การแบ่งส่วนเครือข่าย การเข้าถึงระยะไกลของพนักงาน เครื่องลูกข่าย อุปกรณ์การแพทย์และ OT สถาปัตยกรรมการสำรองข้อมูล โครงสร้างทีม IT เครื่องมือด้านความมั่นคงปลอดภัย ประวัติเหตุการณ์ การเปลี่ยนแปลงที่กำลังดำเนินการ และการประเมินครั้งก่อน คำตอบเหล่านี้ไม่มีระดับ Gap Analysis ใช้ข้อมูลนี้ในส่วน Current IT Landscape ตรวจ Improvement Action ทุกรายการกับการเปลี่ยนแปลงที่กำลังดำเนินการและเครื่องมือที่ซื้อแล้ว และระบุข้อตรวจพบที่ซ้ำกับการประเมินครั้งก่อน แถวข้อมูลแต่ละแถวมีรหัส (เช่น TOOL-01) เพื่อใช้อ้างอิงเป็นหลักฐาน</p>
<h3>ผู้ขาย</h3><p>ใน S5 ระบุผู้ขายทุกรายที่เข้าถึงระบบหรือข้อมูลได้ พร้อมประเภทการเข้าถึง การเข้าถึงข้อมูล ข้อสัญญา ข้อตกลงการประมวลผลข้อมูล และการตรวจสอบ แล้วเชื่อมผู้ขายกับระบบที่เกี่ยวข้อง</p>
<h3>ข้อสังเกต</h3><p>บันทึกช่องโหว่และร่องรอยเหตุการณ์ที่พบระหว่างการประเมินในแท็บข้อสังเกต สังเกตเท่านั้น ห้ามทดสอบหรือเจาะระบบ เว้นแต่ SoW อนุญาต หากพบร่องรอยเหตุการณ์ให้หยุดงานส่วนนั้นและแจ้งผู้ติดต่อของลูกค้าทันที ช่องโหว่เป็นหลักฐานของช่องว่างและแสดงใต้ Subcategory ที่เกี่ยวข้อง</p>
<h3>การทวนข้อมูล</h3><p>ใช้ 5 นาทีสุดท้ายของแต่ละรอบทวนข้อเท็จจริงสำคัญ แล้วติ๊กทวนข้อมูลแล้วในแท็บแผนการสัมภาษณ์ แทนการทบทวนกับเจ้าของกระบวนการอีกรอบ</p>
<h3>ลำดับการสัมภาษณ์</h3><p>แท็บแผนการสัมภาษณ์จัดงานเป็น 10 รอบ เริ่มจากบริบทธุรกิจ (S1) ต่อด้วย Quick BIA เพื่อระบุระบบสำคัญ (S2) รอบการกำกับดูแล กฎหมาย และผู้ให้บริการ (S3 ถึง S5) ขึ้นกับ S1 เท่านั้นจึงทำคู่ขนานได้ รอบเทคนิค การตรวจจับ และการรับมือ (S6 ถึง S8) ใช้ระบบสำคัญจาก S2 และ S10 ใช้ยืนยันรายการขอเอกสาร</p>
<h3>ระบบและ Quick BIA</h3><p>เมื่อลูกค้าไม่มีทะเบียนทรัพย์สิน ให้จัดทำรายชื่อระบบเบื้องต้นใน S2 ให้คะแนนผลกระทบและเวลาหยุดที่รับได้ และยืนยันระดับความสำคัญกับลูกค้า แล้วสุ่มตรวจระบบสำคัญ 3 ถึง 5 ระบบใน S6 ระบุในรายงานว่าเป็นการประเมินเบื้องต้น ไม่ใช่ BIA เต็มรูปแบบ และอาจมีระบบที่ไม่ได้ถูกกล่าวถึงในการสัมภาษณ์</p>
<h3>การขอเอกสารระหว่างสัมภาษณ์</h3><p>ลูกค้ามักตอบรายการขอเอกสารว่า "ไม่มี" แล้วพูดถึงเอกสารนั้นระหว่างสัมภาษณ์ ให้ติ๊กเอกสารที่เกี่ยวข้องในแต่ละคำถาม หรือพิมพ์ชื่อเอกสารอื่นที่ได้ยิน แท็บรายการขอเอกสารจะรวมเป็นรายการเดียวไม่ซ้ำกัน เพื่อยืนยันใน S10</p>
<h3>การปูพื้นและคำถามเชิงสถานการณ์</h3><p>แต่ละ Subcategory เริ่มด้วยประโยคปูพื้นสั้น ๆ และคำถามเชิงสถานการณ์ ใช้กับผู้บริหารและเจ้าของกระบวนการธุรกิจที่ไม่ใช่ผู้เชี่ยวชาญด้านความมั่นคงปลอดภัย โดยอธิบายว่าทำไมหัวข้อนี้สำคัญ ให้เขานึกภาพสถานการณ์จริง แล้วยืนยันด้วยคำถามหลักและคำถามเจาะลึก</p>
<h3>ตรวจ Technical Control</h3><p>แท็บตรวจ Technical Control มีรายการตรวจสำหรับเจ้าหน้าที่ IT และความมั่นคงปลอดภัย จัดกลุ่มตามด้านเทคโนโลยี (ตัวตน เครื่องลูกข่าย เครือข่าย อีเมล ข้อมูล การสำรองข้อมูล ช่องโหว่ การบันทึก คลาวด์ ระบบงาน การเข้าถึงของผู้ให้บริการ OT และอุปกรณ์การแพทย์ กายภาพ และการรับมือเหตุการณ์) แต่ละข้อแสดงแนวปฏิบัติที่ดีและแหล่งอ้างอิง (CIS Controls v8.1 Safeguard, ISO/IEC 27002:2022 หรือแนวทางของ NIST) บันทึกผล มี บางส่วน ไม่มี หรือ N/A พร้อมสิ่งที่เห็น แนวปฏิบัติที่ดีเป็นเกณฑ์อ้างอิงจากผู้ปฏิบัติงาน ไม่ใช่ข้อกำหนดทางกฎหมาย ให้ปรับตามขนาดและความเสี่ยงของลูกค้า</p>
<h3>หลักเกณฑ์หลักฐาน</h3><p>ตามค่าตั้งต้น Tier 2 ขึ้นไปที่อ้างอิงคำบอกเล่าเท่านั้นจะนับเป็น Tier 1 จนกว่าจะได้รับหลักฐาน ระดับที่บอกเล่ายังถูกบันทึกไว้ และระบบสร้างรายการขอหลักฐานให้อัตโนมัติ</p>
<h3>การทำงานร่วมกับ Document Audit Tracker</h3><p>ทั้งสองเครื่องมืออ่านและเขียนไฟล์งานรูปแบบเดียวกัน เปิดไฟล์ที่บันทึกจาก Audit ที่นี่เพื่อเชื่อมข้อมูล แล้วเครื่องมือนี้จะแสดงสถานะเอกสารและการเปรียบเทียบการปฏิบัติกับเอกสาร การบันทึกไฟล์จะเก็บข้อมูลทั้งสองส่วน และเมื่อเปิดไฟล์เดียวกันใน Audit จะเห็น Tier จากการสัมภาษณ์คู่กับแต่ละเอกสาร</p>
<h3>ข้อมูลถูกเก็บที่ไหน</h3><p>ข้อมูลบันทึกอัตโนมัติในเบราว์เซอร์นี้สำหรับไฟล์นี้เท่านั้น หากล้างข้อมูลเบราว์เซอร์ ข้อมูลจะหายไป กด <b>บันทึกไฟล์</b> หลังสัมภาษณ์ทุกครั้ง และเก็บไฟล์ไว้กับเอกสารของงาน ลูกค้าแต่ละรายควรใช้สำเนาไฟล์ HTML นี้แยกกัน</p>
<h3>แหล่งที่มา</h3><p>ผลลัพธ์ของ Subcategory มาจาก NIST CSF 2.0 คำถาม คำถามเจาะลึก รายการหลักฐาน และการจับคู่บทบาท เป็นแนวทางจากผู้ปฏิบัติงานที่เขียนสำหรับกรอบนี้ รายการที่ระบุ VERIFY ต้องตรวจสอบกับประกาศของไทยฉบับปัจจุบัน</p>`}
