<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}
/* View mode: Presentation / Editor */
#b-vm{white-space:nowrap}
body.vm-pres #b-open,body.vm-pres #b-save,body.vm-pres #b-xlsx,body.vm-pres #savebar{display:none!important}
#audseg{display:none!important}
</style>
</head>
<body>
<title>CSF Gap Analysis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: engagement header, tab bar (Setup, Dashboard, Assess, Gap roadmap, Activities); Assess is a list-detail workspace */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212f; --muted:#5a6577; --line:#d6dce5; --accent:#245a7a; --accent-soft:#e2eef5; --chip:#eef1f5;
  --ok:#1e7a46; --ok-soft:#e3f3ea; --warn:#a96300; --warn-soft:#fcf0dc; --bad:#b42318; --bad-soft:#fbe7e5; --na:#7b8494; --na-soft:#f0f1f4;
  --req:#b42318; --exp:#1d4ed8; --opt:#8a93a3; --on-block:#ffffff;
  --cap-it:#2e7d4f; --cap-g:#b26a00; --cap-s:#8a2f8f;
  --f-body:"IBM Plex Sans Thai",system-ui,"Segoe UI",Tahoma,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#18202a; --ink:#e5e9f0; --muted:#9aa4b4; --line:#2c3644; --accent:#7fb6d6; --accent-soft:#1d3342; --chip:#222b37;
  --ok:#4cc27e; --ok-soft:#173326; --warn:#e3a33f; --warn-soft:#3a2c15; --bad:#ef6b61; --bad-soft:#3a1d1c; --na:#8a93a3; --na-soft:#232a35;
  --req:#e5534b; --exp:#5b8def; --opt:#7d8696; --on-block:#ffffff; --cap-it:#4fbf82; --cap-g:#e2a23b; --cap-s:#d07ad6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#18202a; --ink:#e5e9f0; --muted:#9aa4b4; --line:#2c3644; --accent:#7fb6d6; --accent-soft:#1d3342; --chip:#222b37;
  --ok:#4cc27e; --ok-soft:#173326; --warn:#e3a33f; --warn-soft:#3a2c15; --bad:#ef6b61; --bad-soft:#3a1d1c; --na:#8a93a3; --na-soft:#232a35;
  --req:#e5534b; --exp:#5b8def; --opt:#7d8696; --on-block:#ffffff; --cap-it:#4fbf82; --cap-g:#e2a23b; --cap-s:#d07ad6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
.wrap{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
header.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font-size:clamp(20px,2.6vw,27px);margin:0;line-height:1.2;text-wrap:balance}
.eng{color:var(--muted);font-size:13px;margin-top:2px}
.eng b{color:var(--ink)}
.hbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{font:600 13px var(--f-body);padding:6px 11px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{font-size:12px;padding:3px 8px}
.mchk{display:flex;flex-wrap:wrap;gap:4px 12px}
.mchk label{display:flex;gap:4px;align-items:center}
.btn.mono{font-family:var(--f-mono);white-space:nowrap}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.lang{display:flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.lang button{font:600 13px var(--f-body);padding:6px 12px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.savebar{font-size:12px;color:var(--muted);margin:8px 0 0}
.tabs{display:flex;gap:4px;margin:14px 0 12px;flex-wrap:wrap}
.tabs button{font:600 14px var(--f-body);padding:7px 14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:4px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{font:13px var(--f-body);padding:5px 7px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:54px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
.box{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.pad{padding:14px}
.scroll{overflow-x:auto}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px;max-width:110ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.form{display:grid;grid-template-columns:200px 1fr;gap:8px 12px;align-items:center}
.form label{font-size:13px;color:var(--muted)}
.form .help{grid-column:2;font-size:12px;color:var(--muted);margin-top:-4px}
@media (max-width:640px){.form{grid-template-columns:1fr}.form .help{grid-column:1}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
.seg button{font:600 12px var(--f-body);padding:3px 9px;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button[aria-pressed="true"][data-v="P"],.seg button[aria-pressed="true"][data-v="Exists"],.seg button[aria-pressed="true"][data-v="Y"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="F"],.seg button[aria-pressed="true"][data-v="Missing"],.seg button[aria-pressed="true"][data-v="N"]{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"][data-v="Partial"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="NA"]{background:var(--na);color:#fff}
.lv{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:2px;font:600 11px var(--f-mono);color:var(--on-block);flex:none}
.lv.Required{background:var(--req)} .lv.Expected{background:var(--exp)} .lv.Optional{background:var(--opt)}
.cap{flex:none;font:600 10px var(--f-mono);padding:0 4px;border-radius:2px;border:1px solid currentColor;line-height:15px;display:inline-block}
.cap.IT{color:var(--cap-it)} .cap.GUIDED{color:var(--cap-g)} .cap.SPEC{color:var(--cap-s)}
.st{display:inline-block;font:600 11px var(--f-body);padding:1px 8px;border-radius:10px;white-space:nowrap}
.st.Exists{background:var(--ok-soft);color:var(--ok)} .st.Partial{background:var(--warn-soft);color:var(--warn)} .st.Missing{background:var(--bad-soft);color:var(--bad)} .st.NA{background:var(--na-soft);color:var(--na)} .st.none{background:var(--chip);color:var(--muted)} .st.out{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.mono{font-family:var(--f-mono)}
.mini{font-size:12px;color:var(--muted)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{padding:10px 12px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--warn)} .kpi.bad b{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.bar .tr{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--chip)}
.bar .tr i{display:block;height:100%}
.bar .num{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:12px}
@media (max-width:560px){.bar{grid-template-columns:90px 1fr 54px}}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.heat>div{border-radius:4px;padding:8px;font-size:12px;border:1px solid var(--line)}
.heat b{display:block;font-family:var(--f-mono);font-size:13px}
.callout{border-left:4px solid var(--cap-s);background:var(--chip);padding:10px 12px;border-radius:4px;font-size:13px;margin:8px 0}
.callout.ok{border-left-color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:4px}
/* tables */
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface);position:sticky;top:0}
table.t tr.out td{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
/* assess workspace */
.ws{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:12px;align-items:start}
@media (max-width:900px){.ws{grid-template-columns:1fr}}
.list{max-height:78vh;overflow:auto}
.lfil{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.lfil input[type=search]{flex:1 1 100%}
.li{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 10px;cursor:pointer;font:13px var(--f-body)}
.li:hover{background:var(--chip)} .li.sel{background:var(--accent-soft)}
.li .id{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .pct{font:600 11px var(--f-mono);color:var(--muted);min-width:34px;text-align:right}
.li.out{opacity:.5}
.detail{min-width:0}
.dh{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dh h2{flex:1 1 300px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin:6px 0 10px}
.meta b{color:var(--ink);font-weight:600}
.ck{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.ck .q{font-weight:600;font-size:13px}
.ck .r{font-size:12px;color:var(--muted);grid-column:1}
.ck .seg{grid-row:1/span 2;grid-column:2;align-self:start}
.ck input{grid-column:1/-1;width:100%}
.ck.F .q{color:var(--bad)}
.actrow{border:1px solid var(--line);border-radius:4px;padding:8px;margin:6px 0}
.actrow .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actrow .top b{flex:1;min-width:0}
.actrow details{font-size:12px;margin-top:4px}
.actrow ol{margin:4px 0;padding-left:18px}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:20;display:flex;justify-content:center;align-items:flex-start;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal .panel{background:var(--surface);color:var(--ink);border-radius:8px;max-width:860px;width:100%;padding:22px 24px;border:1px solid var(--line)}
.modal p,.modal li{font-size:14px;max-width:80ch}
.modal h3{text-transform:none;letter-spacing:0;color:var(--ink);font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:13px;z-index:30}
/* interview additions */
.seg button[aria-pressed="true"][data-v="0"]{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"][data-v="1"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="2"]{background:#4d7ea8;color:#fff}
.seg button[aria-pressed="true"][data-v="3"],.seg button[aria-pressed="true"][data-v="4"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="S"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="O"]{background:#4d7ea8;color:#fff}
.seg button[aria-pressed="true"][data-v="D"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="open"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="recv"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="req"]{background:#4d7ea8;color:#fff}
.seg button[aria-pressed="true"][data-v="none"]{background:var(--bad);color:#fff}
.tier{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 4px;border-radius:3px;font:600 12px var(--f-mono);color:#fff}
.tier.t0{background:var(--bad)} .tier.t1{background:var(--warn)} .tier.t2{background:#4d7ea8} .tier.t3,.tier.t4{background:var(--ok)} .tier.tNA{background:var(--na)} .tier.tnone{background:var(--chip);color:var(--muted);border:1px solid var(--line)}
.qbox{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:4px;margin:8px 0}
.qbox .qq{font-size:16px;font-weight:600;line-height:1.45}
.probe{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13px}
.probe input{margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:12px var(--f-body);padding:3px 9px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.anchors{font-size:12px;color:var(--muted);margin:6px 0 0;padding-left:0;list-style:none}
.anchors li{padding:1px 0}
.anchors b{color:var(--ink)}
.flag{display:inline-block;font:600 11px var(--f-body);padding:1px 7px;border-radius:10px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.flag.info{background:var(--chip);color:var(--muted)}
.pair{display:grid;grid-template-columns:160px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.pair .tr{position:relative;height:16px;background:var(--chip);border-radius:3px}
.pair .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.pair .tr u{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink);text-decoration:none}
@media (max-width:560px){.pair{grid-template-columns:90px 1fr 60px}}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quad>div{border:1px solid var(--line);border-radius:6px;padding:10px}
.quad b.n{font-size:22px;display:block;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"][data-v="P"]{background:var(--warn);color:#fff}
.scene{border:1px solid var(--line);border-radius:6px;margin:8px 0;overflow:hidden}
.scene .st1{padding:10px 12px;background:var(--chip);font-size:13px}
.scene .st2{padding:10px 12px;border-top:1px solid var(--line);background:var(--warn-soft)}
.scene .st2 .qq{font-size:15px;font-weight:600;line-height:1.45}
.step{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg);font:600 11px var(--f-mono);margin-right:6px;vertical-align:1px}
.tc{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0}
.tc .top{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.tc .top .qt{flex:1 1 320px;font-weight:600;font-size:13px}
.tc .good{font-size:12px;background:var(--ok-soft);border-left:3px solid var(--ok);padding:6px 9px;border-radius:3px;margin:6px 0}
.tc .good b{color:var(--ok)}
.tc.N{border-left:4px solid var(--bad)} .tc.P{border-left:4px solid var(--warn)} .tc.Y{border-left:4px solid var(--ok)}
.ref{font:11px var(--f-mono);color:var(--muted)}
.sessgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.sess{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.sess .sh{display:flex;gap:8px;align-items:center}
.sess .sn{display:inline-grid;place-items:center;min-width:34px;height:24px;border-radius:4px;background:var(--ink);color:var(--bg);font:600 12px var(--f-mono)}
.sess .st3{flex:1;font-weight:600;font-size:14px;line-height:1.3}
.sess p{margin:0;font-size:12px;color:var(--muted)} .sess p b{color:var(--ink)}
.sess .bar2{height:6px;background:var(--chip);border-radius:3px;overflow:hidden} .sess .bar2 i{display:block;height:100%;background:var(--ok)}
.sess.par{border-style:dashed}
.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font:600 12px var(--f-mono);margin:6px 0 12px}
.flow span{padding:3px 8px;border-radius:4px;background:var(--chip)} .flow span.p{border:1px dashed var(--line);background:transparent} .flow em{color:var(--muted);font-style:normal}
table.sys td,table.sys th{padding:4px 5px} table.sys select,table.sys input[type=text]{font-size:12px;padding:3px 4px}
.crit{display:inline-grid;place-items:center;width:22px;height:20px;border-radius:3px;font:600 12px var(--f-mono);color:#fff}
.crit.A{background:var(--bad)} .crit.B{background:var(--warn)} .crit.C{background:var(--na)} .crit.none{background:var(--chip);color:var(--muted)}
td.cY{background:var(--ok-soft)} td.cP{background:var(--warn-soft)} td.cN{background:var(--bad-soft)} td.cU{background:var(--chip)}
.chipv{display:inline-block;font:600 11px var(--f-body);padding:1px 7px;border-radius:10px;margin:1px}
.chipv.Y{background:var(--ok-soft);color:var(--ok)} .chipv.P{background:var(--warn-soft);color:var(--warn)} .chipv.N{background:var(--bad-soft);color:var(--bad)} .chipv.NA,.chipv.U,.chipv.none{background:var(--chip);color:var(--muted)}
.linkbox{border:1px dashed var(--line);border-radius:6px;padding:10px 12px;font-size:13px}
td.rt-G{background:var(--ok-soft)} td.rt-W{background:var(--warn-soft)} td.rt-P{background:var(--bad-soft)} td.rt-U{background:var(--chip)}
table.sys select[multiple]{min-width:140px} table.sys td select{max-width:210px} .covline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
#printArea{display:none}
@media print{
  body{background:#fff;color:#000}
  .wrap,.modal,.toast{display:none!important}
  #printArea{display:block;font:11pt var(--f-body);color:#000}
  #printArea h1{font-size:16pt;margin:0 0 4pt}
  #printArea .pq{break-inside:avoid;border-bottom:1px solid #999;padding:6pt 0 18pt}
  #printArea .pq b{font-family:var(--f-mono)}
  #printArea .pl{min-height:40pt}
}
</style>
<style>
.stage{display:inline-block;font:600 11px var(--f-body);padding:1px 8px;border-radius:10px;background:var(--chip);color:var(--muted);white-space:nowrap}
.stage.s1,.stage.s2{background:var(--warn-soft);color:var(--warn)} .stage.s3{background:var(--accent-soft);color:var(--accent)} .stage.lk{background:var(--ok-soft);color:var(--ok)}
.band{display:inline-block;font:600 11px var(--f-body);padding:1px 8px;border-radius:10px;color:#fff;white-space:nowrap}
.band.C{background:var(--bad)} .band.H{background:var(--warn)} .band.M{background:#4d7ea8} .band.L{background:var(--na)} .band.none{background:var(--chip);color:var(--muted)}
.fcard{border:1px solid var(--line);border-radius:6px;padding:12px;margin:10px 0;background:var(--surface)}
.fcard .fh{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fcard .fh b.id{font-family:var(--f-mono)}
.fcard .stmt{font-size:14px;font-weight:600;line-height:1.5;margin:6px 0}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:13px;margin:6px 0}
.kv>span:nth-child(odd){color:var(--muted)}
@media (max-width:640px){.kv{grid-template-columns:1fr}}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}

<script>
const DATA = {"appVersion":"1.3","methodVersion":"1.4","rubricVersion":"1.2","meta":{"functions":{"GV":["Govern","กำกับดูแล"],"ID":["Identify","ระบุ"],"PR":["Protect","ป้องกัน"],"DE":["Detect","ตรวจจับ"],"RS":["Respond","ตอบสนอง"],"RC":["Recover","กู้คืน"]},"categories":{"GV.OC":["Organizational Context","บริบทขององค์กร"],"GV.RM":["Risk Management Strategy","กลยุทธ์การบริหารความเสี่ยง"],"GV.RR":["Roles, Responsibilities, and Authorities","บทบาท ความรับผิดชอบ และอำนาจหน้าที่"],"GV.PO":["Policy","นโยบาย"],"GV.OV":["Oversight","การกำกับติดตาม"],"GV.SC":["Cybersecurity Supply Chain Risk Management","การบริหารความเสี่ยงห่วงโซ่อุปทานด้านไซเบอร์"],"ID.AM":["Asset Management","การบริหารจัดการทรัพย์สิน"],"ID.RA":["Risk Assessment","การประเมินความเสี่ยง"],"ID.IM":["Improvement","การปรับปรุง"],"PR.AA":["Identity Management, Authentication, and Access Control","การบริหารตัวตน การยืนยันตัวตน และการควบคุมการเข้าถึง"],"PR.AT":["Awareness and Training","การสร้างความตระหนักรู้และการฝึกอบรม"],"PR.DS":["Data Security","ความมั่นคงปลอดภัยของข้อมูล"],"PR.PS":["Platform Security","ความมั่นคงปลอดภัยของแพลตฟอร์ม"],"PR.IR":["Technology Infrastructure Resilience","ความยืดหยุ่นของโครงสร้างพื้นฐานเทคโนโลยี"],"DE.CM":["Continuous Monitoring","การเฝ้าระวังอย่างต่อเนื่อง"],"DE.AE":["Adverse Event Analysis","การวิเคราะห์เหตุการณ์ไม่พึงประสงค์"],"RS.MA":["Incident Management","การบริหารจัดการเหตุการณ์"],"RS.AN":["Incident Analysis","การวิเคราะห์เหตุการณ์"],"RS.CO":["Incident Response Reporting and Communication","การรายงานและการสื่อสารระหว่างรับมือเหตุการณ์"],"RS.MI":["Incident Mitigation","การลดผลกระทบของเหตุการณ์"],"RC.RP":["Incident Recovery Plan Execution","การดำเนินการตามแผนกู้คืน"],"RC.CO":["Incident Recovery Communication","การสื่อสารระหว่างการกู้คืน"]},"subcats":{"GV.OC-01":"Organizational mission is understood and informs cybersecurity risk management","GV.OC-02":"Internal and external stakeholders and their cybersecurity expectations are understood","GV.OC-03":"Legal, regulatory, and contractual cybersecurity requirements are understood and managed","GV.OC-04":"Critical objectives, capabilities, and services that external stakeholders depend on are understood","GV.OC-05":"Outcomes, capabilities, and services that the organization depends on are understood","GV.RM-01":"Risk management objectives are established and agreed to by stakeholders","GV.RM-02":"Risk appetite and risk tolerance statements are established, communicated, and maintained","GV.RM-03":"Cybersecurity risk management is included in enterprise risk management processes","GV.RM-04":"Strategic direction for appropriate risk response options is established and communicated","GV.RM-05":"Lines of communication for cybersecurity risks, including supplier risks, are established","GV.RM-06":"A standardized method for calculating, documenting, categorizing, and prioritizing risks is established","GV.RM-07":"Strategic opportunities (positive risks) are characterized and included in discussions","GV.RR-01":"Leadership is responsible and accountable for cybersecurity risk and fosters a risk-aware culture","GV.RR-02":"Cybersecurity roles, responsibilities, and authorities are established, communicated, and enforced","GV.RR-03":"Adequate resources are allocated commensurate with risk strategy, roles, and policies","GV.RR-04":"Cybersecurity is included in human resources practices","GV.PO-01":"Cybersecurity policy is established, communicated, and enforced based on context, strategy, and priorities","GV.PO-02":"Cybersecurity policy is reviewed, updated, communicated, and enforced to reflect changes","GV.OV-01":"Risk management strategy outcomes are reviewed to inform and adjust strategy and direction","GV.OV-02":"Risk management strategy is reviewed and adjusted to ensure coverage of requirements and risks","GV.OV-03":"Risk management performance is evaluated and reviewed for adjustments needed","GV.SC-01":"A cybersecurity supply chain risk management program, strategy, objectives, policies, and processes are established","GV.SC-02":"Cybersecurity roles for suppliers, customers, and partners are established and coordinated","GV.SC-03":"Supply chain risk management is integrated into cybersecurity and enterprise risk management","GV.SC-04":"Suppliers are known and prioritized by criticality","GV.SC-05":"Requirements to address supply chain risks are established, prioritized, and integrated into contracts","GV.SC-06":"Planning and due diligence are performed to reduce risks before entering supplier relationships","GV.SC-07":"Supplier risks are understood, recorded, prioritized, assessed, responded to, and monitored","GV.SC-08":"Relevant suppliers are included in incident planning, response, and recovery activities","GV.SC-09":"Supply chain security practices are integrated and monitored throughout the technology product and service life cycle","GV.SC-10":"Supply chain risk management plans include provisions for activities after a partnership or service ends","ID.AM-01":"Inventories of hardware managed by the organization are maintained","ID.AM-02":"Inventories of software, services, and systems managed by the organization are maintained","ID.AM-03":"Representations of authorized network communication and data flows are maintained","ID.AM-04":"Inventories of services provided by suppliers are maintained","ID.AM-05":"Assets are prioritized based on classification, criticality, resources, and impact on the mission","ID.AM-07":"Inventories of data and corresponding metadata for designated data types are maintained","ID.AM-08":"Systems, hardware, software, services, and data are managed throughout their life cycles","ID.RA-01":"Vulnerabilities in assets are identified, validated, and recorded","ID.RA-02":"Cyber threat intelligence is received from information sharing forums and sources","ID.RA-03":"Internal and external threats to the organization are identified and recorded","ID.RA-04":"Potential impacts and likelihoods of threats exploiting vulnerabilities are identified and recorded","ID.RA-05":"Threats, vulnerabilities, likelihoods, and impacts are used to understand inherent risk and inform prioritization","ID.RA-06":"Risk responses are chosen, prioritized, planned, tracked, and communicated","ID.RA-07":"Changes and exceptions are managed, assessed for risk impact, recorded, and tracked","ID.RA-08":"Processes for receiving, analyzing, and responding to vulnerability disclosures are established","ID.RA-09":"The authenticity and integrity of hardware and software are assessed prior to acquisition and use","ID.RA-10":"Critical suppliers are assessed prior to acquisition","ID.IM-01":"Improvements are identified from evaluations","ID.IM-02":"Improvements are identified from security tests and exercises","ID.IM-03":"Improvements are identified from execution of operational processes, procedures, and activities","ID.IM-04":"Incident response plans and other cybersecurity plans that affect operations are established, communicated, maintained, and improved","PR.AA-01":"Identities and credentials for authorized users, services, and hardware are managed","PR.AA-02":"Identities are proofed and bound to credentials based on the context of interactions","PR.AA-03":"Users, services, and hardware are authenticated","PR.AA-04":"Identity assertions are protected, conveyed, and verified","PR.AA-05":"Access permissions, entitlements, and authorizations are defined, managed, enforced, and reviewed","PR.AA-06":"Physical access to assets is managed, monitored, and enforced commensurate with risk","PR.AT-01":"Personnel are provided with awareness and training for general tasks with cybersecurity risks in mind","PR.AT-02":"Individuals in specialized roles are provided with awareness and training for those roles","PR.DS-01":"The confidentiality, integrity, and availability of data-at-rest are protected","PR.DS-02":"The confidentiality, integrity, and availability of data-in-transit are protected","PR.DS-10":"The confidentiality, integrity, and availability of data-in-use are protected","PR.DS-11":"Backups of data are created, protected, maintained, and tested","PR.PS-01":"Configuration management practices are established and applied","PR.PS-02":"Software is maintained, replaced, and removed commensurate with risk","PR.PS-03":"Hardware is maintained, replaced, and removed commensurate with risk","PR.PS-04":"Log records are generated and made available for continuous monitoring","PR.PS-05":"Installation and execution of unauthorized software are prevented","PR.PS-06":"Secure software development practices are integrated and their performance is monitored","PR.IR-01":"Networks and environments are protected from unauthorized logical access and usage","PR.IR-02":"Technology assets are protected from environmental threats","PR.IR-03":"Mechanisms are implemented to achieve resilience requirements in normal and adverse situations","PR.IR-04":"Adequate resource capacity to ensure availability is maintained","DE.CM-01":"Networks and network services are monitored to find potentially adverse events","DE.CM-02":"The physical environment is monitored to find potentially adverse events","DE.CM-03":"Personnel activity and technology usage are monitored to find potentially adverse events","DE.CM-06":"External service provider activities and services are monitored to find potentially adverse events","DE.CM-09":"Computing hardware and software, runtime environments, and their data are monitored to find potentially adverse events","DE.AE-02":"Potentially adverse events are analyzed to better understand associated activities","DE.AE-03":"Information is correlated from multiple sources","DE.AE-04":"The estimated impact and scope of adverse events are understood","DE.AE-06":"Information on adverse events is provided to authorized staff and tools","DE.AE-07":"Cyber threat intelligence and other contextual information are integrated into the analysis","DE.AE-08":"Incidents are declared when adverse events meet the defined incident criteria","RS.MA-01":"The incident response plan is executed in coordination with relevant third parties once an incident is declared","RS.MA-02":"Incident reports are triaged and validated","RS.MA-03":"Incidents are categorized and prioritized","RS.MA-04":"Incidents are escalated or elevated as needed","RS.MA-05":"The criteria for initiating incident recovery are applied","RS.AN-03":"Analysis is performed to establish what has taken place during an incident and the root cause","RS.AN-06":"Actions performed during an investigation are recorded and the records' integrity and provenance are preserved","RS.AN-07":"Incident data and metadata are collected, and their integrity and provenance are preserved","RS.AN-08":"An incident's magnitude is estimated and validated","RS.CO-02":"Internal and external stakeholders are notified of incidents","RS.CO-03":"Information is shared with designated internal and external stakeholders","RS.MI-01":"Incidents are contained","RS.MI-02":"Incidents are eradicated","RC.RP-01":"The recovery portion of the incident response plan is executed once initiated","RC.RP-02":"Recovery actions are selected, scoped, prioritized, and performed","RC.RP-03":"The integrity of backups and other restoration assets is verified before using them for restoration","RC.RP-04":"Critical mission functions and cybersecurity risk management are considered to establish post-incident operational norms","RC.RP-05":"The integrity of restored assets is verified, systems and services are restored, and normal operating status is confirmed","RC.RP-06":"The end of incident recovery is declared based on criteria, and incident-related documentation is completed","RC.CO-03":"Recovery activities and progress in restoring operational capabilities are communicated to designated stakeholders","RC.CO-04":"Public updates on incident recovery are shared using approved methods and messaging"}},"rubric":{"GV.OC":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Cybersecurity is discussed without reference to the mission, stakeholders, or legal duties. No record of requirements.","พูดถึงความมั่นคงปลอดภัยโดยไม่เชื่อมกับพันธกิจ ผู้มีส่วนได้เสีย หรือหน้าที่ตามกฎหมาย ไม่มีการบันทึกข้อกำหนด"],"2":["Leadership knows key services, stakeholders, and legal duties (for example CII, PDPA). Some are written down but not maintained or used in decisions.","ผู้บริหารรู้บริการหลัก ผู้มีส่วนได้เสีย และหน้าที่ตามกฎหมาย (เช่น CII, PDPA) มีบันทึกบางส่วนแต่ไม่ปรับปรุงและไม่ใช้ประกอบการตัดสินใจ"],"3":["Approved scope statement, legal and regulatory requirements register, and critical service and dependency list. Reviewed at least annually and on major change. Used to set priorities.","มีขอบเขต ทะเบียนข้อกำหนดตามกฎหมายและหน่วยงานกำกับ และรายการบริการสำคัญกับการพึ่งพา ที่อนุมัติแล้ว ทบทวนอย่างน้อยปีละครั้งและเมื่อมีการเปลี่ยนแปลงสำคัญ และใช้กำหนดลำดับความสำคัญ"],"4":["Context is updated as business, threat, and regulatory changes occur. Stakeholder expectations are tracked and drive program changes.","ปรับบริบทตามการเปลี่ยนแปลงของธุรกิจ ภัยคุกคาม และกฎหมาย ติดตามความคาดหวังของผู้มีส่วนได้เสียและใช้ปรับแผนงาน"]},"GV.RM":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["No risk appetite or risk method. Risks are handled case by case.","ไม่มีระดับความเสี่ยงที่ยอมรับได้และไม่มีวิธีบริหารความเสี่ยง จัดการเป็นรายกรณี"],"2":["Management accepts cybersecurity as a business risk. A risk method or appetite exists in draft or for IT only.","ผู้บริหารยอมรับว่าความมั่นคงปลอดภัยเป็นความเสี่ยงทางธุรกิจ มีวิธีหรือระดับความเสี่ยงที่ยอมรับได้ในรูปแบบร่าง หรือใช้เฉพาะ IT"],"3":["Approved risk appetite and tolerance, one standard risk method, and cybersecurity risk in enterprise risk reporting. Applied consistently and reviewed annually.","มีระดับความเสี่ยงที่ยอมรับได้ที่อนุมัติแล้ว วิธีประเมินความเสี่ยงมาตรฐานเดียว และรายงานความเสี่ยงไซเบอร์ในระดับองค์กร ใช้สม่ำเสมอและทบทวนทุกปี"],"4":["Appetite and method are adjusted from performance data and threat changes. Cyber risk is expressed in financial terms and used in investment decisions.","ปรับระดับความเสี่ยงและวิธีการจากข้อมูลผลการดำเนินงานและภัยคุกคาม แสดงความเสี่ยงไซเบอร์เป็นตัวเงินและใช้ตัดสินใจลงทุน"]},"GV.RR":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Security duties fall on IT staff informally. No accountable executive.","งานความมั่นคงปลอดภัยตกอยู่กับเจ้าหน้าที่ IT อย่างไม่เป็นทางการ ไม่มีผู้บริหารที่รับผิดชอบ"],"2":["A person holds security duties with management support, but authority, resources, and roles across departments are unclear.","มีผู้รับผิดชอบงานความมั่นคงปลอดภัยและผู้บริหารสนับสนุน แต่อำนาจ ทรัพยากร และบทบาทข้ามหน่วยงานยังไม่ชัด"],"3":["Approved roles and RACI matrix, a named accountable executive, a defined reporting line, and a planned budget. HR practices include security. Reviewed annually.","มีบทบาทและ RACI ที่อนุมัติแล้ว ผู้บริหารที่รับผิดชอบ สายการรายงาน และงบประมาณที่วางแผนไว้ งานบุคคลครอบคลุมเรื่องความมั่นคงปลอดภัย ทบทวนทุกปี"],"4":["Roles, staffing, and skills are adjusted from performance and workload data. Security accountability is part of leaders' performance goals.","ปรับบทบาท กำลังคน และทักษะจากข้อมูลผลงานและภาระงาน ความรับผิดชอบด้านความมั่นคงปลอดภัยเป็นส่วนหนึ่งของเป้าหมายผลงานผู้บริหาร"]},"GV.PO":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["No approved policy, or an outdated draft not communicated.","ไม่มีนโยบายที่อนุมัติ หรือมีเพียงร่างเก่าที่ไม่ได้สื่อสาร"],"2":["A policy is approved but outdated, incomplete, or not communicated to all staff.","มีนโยบายที่อนุมัติแล้ว แต่ล้าสมัย ไม่ครบ หรือไม่ได้สื่อสารให้พนักงานทุกคน"],"3":["An approved policy set aligned with the risk strategy, communicated, acknowledged, enforced, and reviewed at least annually. Exceptions are recorded.","มีชุดนโยบายที่อนุมัติและสอดคล้องกับกลยุทธ์ความเสี่ยง สื่อสาร รับทราบ บังคับใช้ และทบทวนอย่างน้อยปีละครั้ง บันทึกการยกเว้น"],"4":["Policies change promptly after incidents, audit results, and threat changes. Policy compliance is measured.","ปรับนโยบายทันทีหลังเกิดเหตุ ผลการตรวจสอบ และภัยคุกคามที่เปลี่ยนไป และวัดการปฏิบัติตามนโยบาย"]},"GV.OV":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Leadership receives no regular cybersecurity reporting.","ผู้บริหารไม่ได้รับรายงานด้านความมั่นคงปลอดภัยเป็นประจำ"],"2":["Leadership receives occasional updates, usually after events. No review of strategy results.","ผู้บริหารได้รับข้อมูลเป็นครั้งคราว มักหลังเกิดเหตุ ไม่มีการทบทวนผลของกลยุทธ์"],"3":["Scheduled reporting to a steering committee or board with defined metrics. Strategy and performance are reviewed at least annually and decisions are recorded.","รายงานต่อคณะกรรมการตามรอบด้วยตัวชี้วัดที่กำหนด ทบทวนกลยุทธ์และผลการดำเนินงานอย่างน้อยปีละครั้งและบันทึกการตัดสินใจ"],"4":["Oversight uses trend metrics and independent assurance. Strategy changes based on results.","การกำกับใช้แนวโน้มตัวชี้วัดและการตรวจสอบอิสระ และปรับกลยุทธ์ตามผลลัพธ์"]},"GV.SC":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Suppliers are selected and managed without security criteria.","คัดเลือกและบริหารผู้ให้บริการโดยไม่มีเกณฑ์ด้านความมั่นคงปลอดภัย"],"2":["Security clauses or questionnaires are used for some suppliers, mostly at onboarding. No supplier criticality.","ใช้ข้อสัญญาหรือแบบสอบถามด้านความมั่นคงปลอดภัยกับผู้ให้บริการบางราย ส่วนใหญ่ตอนเริ่มใช้ ไม่มีการจัดระดับความสำคัญ"],"3":["Supplier inventory with criticality. Security requirements in contracts with critical suppliers. Due diligence, monitoring, and offboarding run consistently. Supplier risk is in the risk register.","มีทะเบียนผู้ให้บริการพร้อมระดับความสำคัญ มีข้อกำหนดในสัญญากับผู้ให้บริการสำคัญ ตรวจสอบก่อนใช้ ติดตาม และยุติบริการอย่างสม่ำเสมอ ความเสี่ยงอยู่ในทะเบียนความเสี่ยง"],"4":["Supplier risk is monitored continuously. Incident plans are coordinated with critical suppliers. The program changes based on supplier performance and incidents.","ติดตามความเสี่ยงผู้ให้บริการต่อเนื่อง ประสานแผนรับมือเหตุการณ์กับผู้ให้บริการสำคัญ และปรับแผนงานตามผลงานและเหตุการณ์"]},"ID.AM":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["No reliable inventory. Knowledge sits with individuals.","ไม่มีทะเบียนที่เชื่อถือได้ ความรู้อยู่กับตัวบุคคล"],"2":["Inventories exist for some asset types or sites but are incomplete, unowned, or out of date.","มีทะเบียนสำหรับบางประเภทหรือบางสถานที่ แต่ไม่ครบ ไม่มีเจ้าของ หรือไม่เป็นปัจจุบัน"],"3":["Inventories of hardware, software, services, data, and network flows with owners and criticality, covering all in-scope sites. Updated through change management and reconciled at least every six months.","มีทะเบียนฮาร์ดแวร์ ซอฟต์แวร์ บริการ ข้อมูล และการไหลของเครือข่าย พร้อมเจ้าของและระดับความสำคัญ ครบทุกสถานที่ในขอบเขต ปรับผ่านการควบคุมการเปลี่ยนแปลงและกระทบยอดอย่างน้อยทุกหกเดือน"],"4":["Inventories update automatically in near real time. Discrepancies are detected and resolved. Criticality drives control selection.","ทะเบียนปรับอัตโนมัติแบบเกือบทันที ตรวจพบและแก้ความคลาดเคลื่อน ระดับความสำคัญใช้กำหนดการควบคุม"]},"ID.RA":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Risks and vulnerabilities are found only after events or by vendors.","พบความเสี่ยงและช่องโหว่หลังเกิดเหตุหรือเมื่อผู้ขายแจ้งเท่านั้น"],"2":["Vulnerability scans or risk assessments happen occasionally or for some systems. Results are not tracked to closure.","สแกนช่องโหว่หรือประเมินความเสี่ยงเป็นครั้งคราวหรือบางระบบ ไม่ได้ติดตามผลจนปิด"],"3":["Scheduled risk assessments using the approved method. Vulnerability scanning of in-scope assets with remediation timelines. Threat information is used. The risk register is maintained and reviewed.","ประเมินความเสี่ยงตามรอบด้วยวิธีที่อนุมัติ สแกนช่องโหว่ทรัพย์สินในขอบเขตพร้อมกำหนดเวลาแก้ไข ใช้ข้อมูลภัยคุกคาม ดูแลและทบทวนทะเบียนความเสี่ยง"],"4":["Threat and exposure data update risk scenarios continuously. The effectiveness of risk responses is measured.","ใช้ข้อมูลภัยคุกคามและการเปิดเผยปรับสถานการณ์ความเสี่ยงต่อเนื่อง และวัดประสิทธิผลของการจัดการความเสี่ยง"]},"ID.IM":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Improvements are not recorded. Lessons from events are not captured.","ไม่บันทึกการปรับปรุง ไม่เก็บบทเรียนจากเหตุการณ์"],"2":["Lessons learned or audit findings are recorded for some events, but follow-up is not tracked.","บันทึกบทเรียนหรือข้อตรวจพบบางเหตุการณ์ แต่ไม่ติดตามผล"],"3":["An improvement register fed by assessments, audits, exercises, and incidents. Corrective actions are owned and tracked to closure. Exercises are planned annually.","มีทะเบียนการปรับปรุงจากการประเมิน การตรวจสอบ การซ้อม และเหตุการณ์ มีเจ้าของและติดตามจนปิด วางแผนการซ้อมทุกปี"],"4":["Improvement is continuous and data-driven. The effect of each change is verified.","ปรับปรุงต่อเนื่องด้วยข้อมูล และตรวจสอบผลของทุกการเปลี่ยนแปลง"]},"PR.AA":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Accounts are created and removed on request. Shared accounts are common and multi-factor authentication (MFA) is absent.","สร้างและลบบัญชีตามคำขอ ใช้บัญชีร่วมกันทั่วไป และไม่มี MFA"],"2":["Identity and access practices are approved and applied to some systems. MFA or access reviews are partial.","แนวปฏิบัติด้านตัวตนและสิทธิ์ได้รับอนุมัติและใช้กับบางระบบ MFA หรือการทบทวนสิทธิ์ยังไม่ครบ"],"3":["An identity and authentication standard is enforced across in-scope systems. MFA covers remote, privileged, and critical access. Joiner, mover, and leaver steps are linked to HR. Privileged accounts are limited and logged. Access is reviewed at defined intervals.","บังคับใช้มาตรฐานตัวตนและการยืนยันตัวตนทุกระบบในขอบเขต MFA ครอบคลุมการเข้าถึงระยะไกล สิทธิ์สูง และระบบสำคัญ การเข้า ย้าย ออกเชื่อมกับ HR จำกัดและบันทึกบัญชีสิทธิ์สูง และทบทวนสิทธิ์ตามรอบ"],"4":["Access decisions are risk-based (conditional access, just-in-time privilege). Access anomalies are detected automatically. Review results drive role redesign.","ตัดสินใจให้สิทธิ์ตามความเสี่ยง (Conditional access, Just-in-time privilege) ตรวจจับความผิดปกติอัตโนมัติ และใช้ผลทบทวนออกแบบบทบาทใหม่"]},"PR.AT":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["No structured awareness training.","ไม่มีการอบรมสร้างความตระหนักอย่างเป็นระบบ"],"2":["Training happens at onboarding or occasionally. No role-based content or completion tracking.","อบรมตอนเริ่มงานหรือเป็นครั้งคราว ไม่มีเนื้อหาตามบทบาทและไม่ติดตามการเข้าอบรม"],"3":["An annual awareness program for all staff with completion tracking. Role-based training for privileged users, developers, and executives. Phishing exercises.","มีโปรแกรมสร้างความตระหนักประจำปีสำหรับทุกคนพร้อมติดตามผล อบรมตามบทบาทสำหรับผู้มีสิทธิ์สูง นักพัฒนา และผู้บริหาร และมีการทดสอบฟิชชิง"],"4":["Training changes based on phishing results, incidents, and behavior metrics. Behavior change is measured.","ปรับการอบรมตามผลฟิชชิง เหตุการณ์ และตัวชี้วัดพฤติกรรม และวัดการเปลี่ยนพฤติกรรม"]},"PR.DS":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Data protection depends on individual practice. Backups are irregular.","การปกป้องข้อมูลขึ้นกับแต่ละบุคคล สำรองข้อมูลไม่สม่ำเสมอ"],"2":["Encryption and backups cover some systems. Data classification is not defined or not applied.","การเข้ารหัสและสำรองข้อมูลครอบคลุมบางระบบ ไม่มีหรือไม่ได้ใช้การจัดชั้นข้อมูล"],"3":["Data classification is applied. Sensitive data is encrypted at rest and in transit. Backups have an offline or immutable copy and restores are tested at defined intervals across in-scope systems.","ใช้การจัดชั้นข้อมูล เข้ารหัสข้อมูลอ่อนไหวขณะจัดเก็บและส่งผ่าน มีสำเนาสำรองแบบ Offline หรือ Immutable และทดสอบกู้คืนตามรอบทุกระบบในขอบเขต"],"4":["Data protection controls are monitored and tuned, for example data loss prevention (DLP). Backup and restore performance is measured against recovery objectives.","เฝ้าระวังและปรับการควบคุมการปกป้องข้อมูล เช่น DLP และวัดผลการสำรองและกู้คืนเทียบกับเป้าหมายการกู้คืน"]},"PR.PS":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Systems are configured and patched case by case. Unsupported software is common.","ตั้งค่าและแพตช์ระบบเป็นรายกรณี มีซอฟต์แวร์ที่หมดการสนับสนุนจำนวนมาก"],"2":["Baselines or patching exist for some platforms. Logging and software control are partial.","มี Baseline หรือการแพตช์บางแพลตฟอร์ม การบันทึกและการควบคุมซอฟต์แวร์ยังไม่ครบ"],"3":["Secure configuration baselines, patching within defined timelines, end-of-life management, log generation, and software control apply to in-scope platforms. In-house software follows secure development. Compliance is checked.","ใช้ Secure configuration baseline แพตช์ตามกำหนดเวลา จัดการระบบหมดอายุ สร้างบันทึก และควบคุมซอฟต์แวร์ทุกแพลตฟอร์มในขอบเขต ซอฟต์แวร์ที่พัฒนาเองใช้การพัฒนาที่ปลอดภัย และตรวจการปฏิบัติตาม"],"4":["Configuration drift and patch compliance are monitored automatically. Exceptions are risk-assessed and time-bound.","เฝ้าระวังการเบี่ยงเบนของการตั้งค่าและการแพตช์อัตโนมัติ ข้อยกเว้นมีการประเมินความเสี่ยงและมีกำหนดเวลา"]},"PR.IR":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["The network is largely flat. No resilience planning for capacity or environmental threats.","เครือข่ายส่วนใหญ่ไม่แบ่งส่วน ไม่มีแผนรองรับด้านความจุหรือภัยด้านสิ่งแวดล้อม"],"2":["Some segmentation and resilience measures exist but are not based on risk or not documented.","มีการแบ่งส่วนเครือข่ายและมาตรการรองรับบางส่วน แต่ไม่ได้อิงความเสี่ยงหรือไม่มีเอกสาร"],"3":["The network is segmented by risk with filtered access. Resilience mechanisms meet agreed recovery needs for critical services. Capacity and environmental protection are reviewed.","แบ่งส่วนเครือข่ายตามความเสี่ยงและกรองการเข้าถึง กลไกรองรับตอบสนองความต้องการกู้คืนของบริการสำคัญ ทบทวนความจุและการป้องกันด้านสิ่งแวดล้อม"],"4":["Architecture changes based on threat and performance data. Resilience is tested regularly under realistic conditions.","ปรับสถาปัตยกรรมจากข้อมูลภัยคุกคามและผลการทำงาน ทดสอบความทนทานสม่ำเสมอในสภาพใกล้เคียงจริง"]},"DE.CM":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Monitoring happens only when users report problems.","เฝ้าระวังเฉพาะเมื่อผู้ใช้แจ้งปัญหา"],"2":["Some logs or antimalware alerts are collected. Review is irregular or limited to some systems.","เก็บบันทึกหรือการแจ้งเตือนจาก Antimalware บางส่วน ตรวจดูไม่สม่ำเสมอหรือบางระบบ"],"3":["Networks, endpoints, user activity, and service providers are monitored for in-scope assets through central logging or a security operations function, with defined review and escalation.","เฝ้าระวังเครือข่าย เครื่องลูกข่าย กิจกรรมผู้ใช้ และผู้ให้บริการของทรัพย์สินในขอบเขต ผ่านระบบบันทึกส่วนกลางหรือหน่วยปฏิบัติการด้านความมั่นคงปลอดภัย พร้อมขั้นตอนตรวจดูและยกระดับ"],"4":["Monitoring is tuned continuously from threat information and incidents. Monitoring coverage is measured.","ปรับการเฝ้าระวังต่อเนื่องจากข้อมูลภัยคุกคามและเหตุการณ์ และวัดความครอบคลุม"]},"DE.AE":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Alerts are not analyzed. Users notice events first.","ไม่วิเคราะห์การแจ้งเตือน ผู้ใช้พบเหตุการณ์ก่อน"],"2":["IT staff analyze some alerts when time allows. No criteria to declare an incident.","เจ้าหน้าที่ IT วิเคราะห์การแจ้งเตือนบางรายการเมื่อมีเวลา ไม่มีเกณฑ์ประกาศเหตุการณ์"],"3":["A defined triage and correlation process with detection use cases. Incident declaration criteria exist. Events are analyzed within defined times.","มีกระบวนการคัดกรองและเชื่อมโยงพร้อม Use case การตรวจจับ มีเกณฑ์ประกาศเหตุการณ์ และวิเคราะห์ภายในเวลาที่กำหนด"],"4":["Analysis is automated and enriched with threat information. Use cases improve from lessons learned.","วิเคราะห์อัตโนมัติและเสริมด้วยข้อมูลภัยคุกคาม ปรับ Use case จากบทเรียน"]},"RS.MA":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Incidents are handled ad hoc by whoever is available.","จัดการเหตุการณ์เฉพาะหน้าโดยใครก็ได้ที่ว่าง"],"2":["An incident response plan exists but is untested or unknown to some responders. Contacts are partly defined.","มีแผนรับมือเหตุการณ์ แต่ยังไม่ทดสอบหรือผู้รับมือบางคนไม่รู้จัก รายชื่อผู้ติดต่อยังไม่ครบ"],"3":["An approved incident response plan and playbooks for priority scenarios. Roles and contacts are current. The plan is exercised at least annually. Incidents are recorded.","มีแผนรับมือเหตุการณ์ที่อนุมัติและ Playbook สำหรับสถานการณ์สำคัญ บทบาทและผู้ติดต่อเป็นปัจจุบัน ซ้อมอย่างน้อยปีละครั้ง และบันทึกเหตุการณ์"],"4":["The plan changes based on exercises and incidents. Response performance is measured. Coordination with external parties is practiced.","ปรับแผนจากการซ้อมและเหตุการณ์ วัดผลการรับมือ และฝึกประสานกับหน่วยงานภายนอก"]},"RS.AN":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["No investigation beyond restoring service.","ไม่มีการสืบสวนนอกจากกู้บริการ"],"2":["Basic investigation for some incidents. Evidence is not preserved consistently.","สืบสวนเบื้องต้นบางเหตุการณ์ เก็บรักษาหลักฐานไม่สม่ำเสมอ"],"3":["Investigations establish root cause and scope. Evidence is collected and preserved. Incidents are categorized and prioritized by defined criteria.","สืบสวนหาสาเหตุและขอบเขต เก็บและรักษาหลักฐาน จัดประเภทและลำดับความสำคัญตามเกณฑ์"],"4":["Forensic capability (in-house or retained) is used routinely. Findings feed detection and prevention.","ใช้ขีดความสามารถด้านนิติวิทยาศาสตร์ดิจิทัล (ภายในหรือจ้างไว้) เป็นปกติ และนำผลไปปรับการตรวจจับและป้องกัน"]},"RS.CO":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Notification is decided case by case. Regulatory duties are unclear.","ตัดสินใจแจ้งเหตุเป็นรายกรณี หน้าที่ตามกฎหมายไม่ชัด"],"2":["Some notification steps are known. Regulatory timelines (CII, PDPA) are not built into procedures.","รู้ขั้นตอนแจ้งเหตุบางส่วน กรอบเวลาตามกฎหมาย (CII, PDPA) ยังไม่อยู่ในขั้นตอน"],"3":["Internal and external notification procedures include regulatory timelines and templates. Communication roles are defined and followed in exercises and incidents.","ขั้นตอนแจ้งเหตุภายในและภายนอกมีกรอบเวลาตามกฎหมายและแบบฟอร์ม กำหนดบทบาทการสื่อสารและปฏิบัติจริงในการซ้อมและเหตุการณ์"],"4":["Communication is tested with stakeholders and regulators. Messages and timelines improve from experience.","ทดสอบการสื่อสารกับผู้มีส่วนได้เสียและหน่วยงานกำกับ ปรับข้อความและกรอบเวลาจากประสบการณ์"]},"RS.MI":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Containment is improvised.","ควบคุมเหตุการณ์แบบเฉพาะหน้า"],"2":["Containment steps are known for common cases but not documented or rehearsed.","รู้ขั้นตอนควบคุมสำหรับกรณีทั่วไป แต่ไม่มีเอกสารหรือไม่ได้ซ้อม"],"3":["Playbooks document containment and eradication steps. Authority to isolate systems is defined. Newly found vulnerabilities are mitigated or recorded as accepted risk.","Playbook ระบุขั้นตอนควบคุมและกำจัด กำหนดอำนาจตัดระบบ ช่องโหว่ใหม่ได้รับการแก้ไขหรือบันทึกเป็นความเสี่ยงที่ยอมรับ"],"4":["Containment is partly automated. Its effectiveness is measured.","การควบคุมเป็นอัตโนมัติบางส่วน และวัดประสิทธิผล"]},"RC.RP":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Recovery depends on individual knowledge. No recovery plan.","การกู้คืนขึ้นกับความรู้ของบุคคล ไม่มีแผนกู้คืน"],"2":["Recovery plans exist for some systems. Recovery objectives are not agreed or not tested.","มีแผนกู้คืนบางระบบ เป้าหมายการกู้คืนยังไม่ตกลงหรือไม่ได้ทดสอบ"],"3":["The recovery
