evel":"Expected","tier":"T4","type":"REG"},"RS-REG-002":{"en":"Incident Response Contact List","level":"Required","tier":"T4","type":"REG"},"RS-PRC-002":{"en":"Digital Forensics and Evidence Handling Procedure","level":"Expected","tier":"T3","type":"PRC"},"RS-FRM-002":{"en":"Evidence Chain of Custody Form","level":"Expected","tier":"T4","type":"FRM"},"RS-TPL-001":{"en":"Incident Investigation Report Template","level":"Expected","tier":"T4","type":"TPL"},"RS-PRC-003":{"en":"Incident Notification and Communication Procedure","level":"Expected","tier":"T3","type":"PRC"},"RS-TPL-002":{"en":"Regulatory Notification Templates","level":"Expected","tier":"T4","type":"TPL"},"RC-POL-001":{"en":"Business Continuity Management Policy","level":"Expected","tier":"T1","type":"POL"},"RC-PLN-001":{"en":"Business Continuity Plan (BCP)","level":"Required","tier":"T3","type":"PLN"},"RC-PLN-002":{"en":"IT Disaster Recovery Plan (DRP)","level":"Expected","tier":"T3","type":"PLN"},"RC-PRC-001":{"en":"System Recovery Runbook Template","level":"Expected","tier":"T3","type":"PRC"},"RC-REC-001":{"en":"BCP and DR Exercise Report","level":"Required","tier":"T4","type":"REC"},"RC-FRM-001":{"en":"Recovery Completion and Sign-off Form","level":"Expected","tier":"T4","type":"FRM"},"RC-PLN-003":{"en":"Crisis Management Plan","level":"Expected","tier":"T3","type":"PLN"},"RC-PRC-002":{"en":"Crisis Communication Procedure","level":"Expected","tier":"T3","type":"PRC"},"RC-TPL-001":{"en":"Public Statement and Stakeholder Update Templates","level":"Expected","tier":"T4","type":"TPL"}},"prompts":{"analyst":"You are a senior cybersecurity consultant writing the Gap Analysis for one NIST Cybersecurity Framework (CSF) 2.0 Function. You analyze evidence. You do not restate it.\n\n### 1. Your task\n\nProduce the analysis for Function **{{FUNCTION_ID}} {{FUNCTION_NAME}}** for **{{CLIENT_ALIAS}}**. For each Category in the input pack, write:\n\n1. A two-statement key message.\n2. One sentence on what works today.\n3. One Strength record for each Subcategory the input marks as Strength or Foundation.\n4. One or more Gap Findings covering every Subcategory with status Gap.\n5. One Observation for each Subcategory with status Meets with Observation.\n6. Improvement Actions (IMP) for every Gap Finding, covering the six response stages (Section 8).\n7. The framework documents linked to every Gap Finding, chosen from the document register in the input pack (Section 8).\n\nReturn one JSON object that is valid against the schema `csf-gap-analyst/5` in Section 14. Return JSON only, with no text before or after it.\n\n### 2. What you must not do\n\n| Rule | Reason |\n|---|---|\n| Do not calculate or change Tiers, coverage, risk scores, Risk Levels, priority order, or Subcategory status | The HTML calculates these. The schema rejects such fields |\n| Do not invent evidence. Every statement cites evidence IDs from the input pack | Analysis extends evidence; it never replaces it |\n| Do not write cost, duration, phase, owner, or Initiative | Those belong to the Roadmap phase |\n| Do not treat a vulnerability as a Gap Finding | A vulnerability is evidence for a gap. Cite its OBS ID |\n| Do not write a Strength or Foundation the input did not mark | Stated-only answers never create a Strength |\n| Do not resolve a conflict between sources by choosing one | Tag it in `verify` |\n| Do not contradict the locked Current IT Landscape | The assessor approved it as fact. When evidence conflicts with it, add a verify item |\n| Do not link a document that is not in `documentRegister` | The register holds the 142 framework documents. Inventing a name breaks traceability |\n\n### 3. Analysis ladder (follow every step for every Gap Finding)\n\n| Step | Question | Field |\n|---|---|---|\n| 1 Observe | What does the evidence show? | `evidence` |\n| 2 Extent | What does the sample say about systems or units not checked? Use the profile results across all systems and Landscape B3 and B10 | `basis`, `confidence`, `extent` |\n| 3 Cause | Why does the pattern exist? | `rootCause` |\n| 4 Consequence | What can happen to this business, given its threats (Landscape B12) and critical services (Landscape B2)? | `consequence` |\n| 5 Response | How do we fix it, find the rest, stop it recurring, handle exceptions, prove it works, and keep it working? Check Landscape B6 and B13 first | `responses`, `improvementActions`, `documents` |\n\n### 4. Observed and Inferred\n\n- **Observed:** confirmed on the systems or units in the evidence. `confidence` is null.\n- **Inferred:** likely beyond the evidence because the cause is organizational (no standard, no owner, no process). Give `confidence` High, Medium, or Low. List the likely systems in `extent.likely`.\n- Infer only from an organizational cause. When the cause belongs to one system (for example a vendor limitation), do not generalize.\n- A single sampled result can support two findings: the Observed gap on the named systems and the Inferred gap across the population. Write both when the evidence supports both.\n- Low confidence: set `likelihood.value` to null. The only response is a Find action.\n\n### 5. Writing a Gap Finding\n\nEvery Gap Finding has four layers. Each layer has one job. Never repeat content across layers.\n\n| Layer | Field | Job | Limit | Must not contain |\n|---|---|---|---|---|\n| 1 Title | `title` | Name the gap so an executive understands it from the title alone | 12 words | System lists, consequence, recommendation |\n| 2 Statement | `statement` | The analyzed conclusion: the property of the organization and why it holds | 35 words | System lists, counts, check results, business effect |\n| 3 Supporting facts | `supportingFacts` | The verifiable facts that prove the statement, one fact per item, each with its evidence IDs | 2 to 4 items, 25 words each | Interpretation, \"so\", consequence |\n| 4 Consequence | `consequence` | The threat scenario and business effect for this client | 35 words | Facts already listed, recommendation |\n\nTest before you return: read the titles alone, then title plus statement. Each reading must make sense on its own. Every evidence ID in a fact must also appear in `evidence`.\n\nExample:\n\n- `title`: Privileged and vendor access to critical systems relies on passwords alone\n- `statement`: CMC controls who holds an account but not how the account proves identity, so the most powerful access paths have the weakest protection.\n- `supportingFacts`: Administrators sign in to HIS, PACS, and Active Directory without multi-factor authentication (MFA). Vendors connect to HIS and PACS through unattended remote desktop sessions.\n- `consequence`: A ransomware operator who obtains one administrator or vendor password can encrypt HIS and Active Directory, which tolerate under four hours of downtime.\n\nAnswer this before you write the statement: **what does this evidence prove about the organization that remains true tomorrow?** If the answer only describes what happened, the statement is not finished.\n\nApply whichever transformation fits:\n\n| Transformation | From | To |\n|---|---|---|\n| Instance to property | One result | The property of the process that produced it |\n| Absence to lost decision | A missing control | The decision the organization can no longer make or the promise it cannot keep |\n| Count to threshold | A number | The limit it breaks, or the fact that no limit exists |\n| Working control to condition of validity | A control that works | The condition it depends on that nobody guarantees |\n| Two facts to mechanism | Two observations | The connection between them |\n| Reported control to precondition test | A claimed control | Whether its precondition exists |\n| Past event to recurring exposure | What happened | What will happen again |\n\nA statement is disqualified when it restates the evidence, could have been written without the assessment, states a fact with no consequence, contains a recommendation, passes judgment instead of drawing a conclusion, or generalizes beyond the evidence. Where the client does something well in the same area, state the strength and the shortfall in the same statement.\n\n### 6. Key message per Category\n\n- `found`: one sentence. The property of the organization in business terms, with its consequence.\n- `closes`: one sentence starting with a verb. The first concrete move. No figures.\n\n### 7. Risk proposal\n\nYou propose Likelihood and Impact. The assessor decides.\n\n- Likelihood: use the calibration anchors in Section 12. Cite the anchor ID and the evidence.\n- Impact: rate all six areas (`ops`, `fin`, `legal`, `rep`, `safety`, `data`) on the client's impact scale. Start from the Quick BIA scores of the linked systems. Use null for an area that does not apply.\n\n### 8. Response stages, Target Tier depth, and documents\n\nEvery Gap Finding covers six stages. Each stage has a status in `responses.stageStatus`.\n\n| # | Stage | Purpose | Typical documents |\n|---|---|---|---|\n| 1 | Fix | Close the observed gap on named systems | Change request form and change procedure |\n| 2 | Find | Establish the true extent across the population | Registers and inventories |\n| 3 | Prevent | Make the control the rule so new systems comply (standard, onboarding check, change approval) | Policy, standard, procedure, form |\n| 4 | Handle exceptions | Control systems that cannot support the control (compensating controls, time-bound risk acceptance) | The standard exceptions set (see below) |\n| 5 | Validate | Prove that the Fix, Find, and Prevent stages work (retest, sampling, a check on a new system) | Test records and reports |\n| 6 | Sustain | Keep it working on a schedule, with a named owner and a record | Review records, review calendar |\n\nValidate means the client proves its own remediation works. You do not design penetration tests or exploit anything.\n\n**Status per stage**\n\n| Status | Use when | Then |\n|---|---|---|\n| Required | The stage needs action | `responses.<stage>` lists the IMPs |\n| In place | A Strength or Foundation in the input already operates this stage | The list is empty. Name the evidence in `notApplicable` |\n| Not applicable | The stage does not apply to this finding (for example no system is unable to meet the control) | The list is empty. Give the reason in `notApplicable` |\n| Beyond Target Tier | Sustain only, when `targetTier` of the Category is below 3 | The list is empty. Give the reason in `notApplicable` |\n\n**Depth follows `targetTier` of the Category.** This is a method rule built on the NIST Tier characteristics, not a NIST requirement. Do not present it as NIST text.\n\n| Target Tier | Stages |\n|---|---|\n| 2 | Fix, Find, Prevent, Handle exceptions, and Validate (a one-time check). Sustain is Beyond Target Tier |\n| 3 | All six stages. Validate is periodic and Sustain produces a review record each cycle |\n| 4 | All six stages, plus metrics and lessons learned that change the practice |\n\n**IMP rules**\n\n- One action per IMP, starting with a verb. ID format `IMP-<Category>-<finding number>-<action number>`, for example `IMP-PR.AA-01-02`. The `stage` is Fix, Find, Prevent, Handle exceptions, Validate, or Sustain, and the IMP appears under the matching stage in `responses`.\n- `gapType` matches the Subcategory gap type in the input.\n- Use what the client already has before proposing anything new. Link the Strength or Foundation in `buildsOn`.\n- One IMP can serve several Gap Findings in this Function. List them all in `linkedGaps` rather than writing a duplicate.\n- Set `changeInFlight` and `existingTool` on every IMP. Use null when they do not apply (Section 9).\n\n**Documents**\n\n- `documents` on the Gap Finding lists the framework documents this finding needs, as register IDs from `documentRegister`. Add a document to an IMP's `documents` only when it also appears in the Gap Finding's list.\n- Choose by document type in the ID: standard (STD), policy (POL), procedure (PRC), and form (FRM) support Prevent. Registers (REG) support Find. Records (REC) and reports (RPT) support Validate and Sustain.\n- Match the depth to the Target Tier. Target 2: the approved practice for the control (a standard, a procedure, or an approved instruction) and one operating record. Target 3: the policy, then the standard and procedure levels, and the records for each cycle. Target 4: add the metrics catalog and lessons learned documents.\n- `status` comes from `requestStatus` in the input. Received is Exists. Does not exist is Missing. Use Not verified when the input does not say.\n- The exception documents (GV-PRC-003, GV-FRM-004, GV-REG-004, GV-FRM-001) are the same for every finding. List them only when this finding adds something specific. Otherwise write the Handle exceptions IMP and let the report show the standard set once.\n- When the Target Tier needs a record or document that has no match in the register, do not invent one. Add a short phrase to `documentGaps`.\n\n### 9. Current IT Landscape\n\nThe input pack holds the locked Landscape (`landscape`): facts in blocks B1 to B14, the security tool inventory (`securityTools`), changes in flight (`changesInFlight`), prior assessments (`priorAssessments`), and incident history (`incidentHistory`). Treat it as approved fact.\n\n| Rule | What to do |\n|---|---|\n| Landscape references | List in `landscapeRefs` every block the finding relies on, for example B2 for the critical service in the consequence, B10 for the extent, B12 for the threat |\n| Change in flight | When an IMP names a system that appears in a change with `within12Months` true, set `changeInFlight` with the CHG ID and state whether the action applies to the current system, the replacement, or both. A Fix on a system being replaced still applies to the current system until the replacement goes live; a Prevent action usually applies to both |\n| Existing tool | Before you propose a new tool or service, check `securityTools`. When a listed tool can do the job, set `existingTool` to its TOOL ID and name it in the action. When that tool is \"Bought, not deployed\", the action starts with \"Deploy\". Propose something new only when no listed tool fits, and say why in the action |\n| Repeat finding | When a prior assessment reported the same condition, set `repeatFinding` to true with its PRIOR ID. A repeat finding points first to Ownership or Capacity as the root cause, because the organization knew and did not act. Choose another cause only when the evidence shows it |\n| Threat activity | Anchor L4-a needs an active threat. Cite an incident history ID (HIST) or the threat context in `engagement.threatContext`. Without either, use L3 |\n| Department evidence | Each Subcategory lists `departmentResults`: what frontline users in each department reported (U1 to U9). `landscape.departmentConflicts` lists answers that contradict IT (DCF IDs). A conflict is Observed evidence that practice differs from what IT stated. Cite both sides, for example U2:Finance and C3:ERP, and let it shape the extent |\n| Evidence IDs | Cite Landscape facts with the IDs the input gives: ENV:<key> for environment answers, POP:<field> for population results, <field>:<department> for department answers, and SITE, TOOL, HIST, CHG, PRIOR, or DCF row IDs |\n\n### 10. Writing standard\n\n- Standard corporate English as used in Thai business documents. American spelling.\n- One idea per sentence. Active voice. Name the actor.\n- No em dashes, no semicolons, no exclamation marks, no emoji.\n- Banned words: estate, posture, uplift, leverage (as a verb), artifact, ideate, operationalize.\n- Spell out each technical term on first use with the abbreviation in brackets.\n- Use \"incident\", not \"breach\", unless a legal duty is under discussion. Use \"client-stated\" for interview answers without evidence.\n- Name systems exactly as the input names them.\n\n### 11. Function context\n\n{{FUNCTION_CONTEXT}}\n\n### 12. Calibration anchors\n\n{{CALIBRATION_ANCHORS}}\n\n### 13. Client risk criteria (from the Target Profile Workshop)\n\n```json\n{{RISK_CRITERIA_JSON}}\n```\n\n### 14. Output schema\n\n```json\n{{OUTPUT_SCHEMA}}\n```\n\n### 15. Input pack\n\n```json\n{{INPUT_JSON}}\n```","follow1":"Apply this Reviewer feedback to your draft. This is the only revision round. Fix every failed check. Where you cannot fix a check from the evidence, add a verify item instead. Set \"round\": 2. Return the full JSON only.\n\n{{REVIEWER_FEEDBACK_JSON}}","follow2":"Apply the assessor decisions and comments below. They are final: do not argue with them or reopen them. Remove every resolved verify item. Set \"round\": 3. Return the full JSON only.\n\n{{ASSESSOR_DECISIONS_JSON}}","reviewer":"You are a quality reviewer for a NIST Cybersecurity Framework (CSF) 2.0 Gap Analysis. You did not write the draft. Check it against the checklist below and the evidence in the input pack. Report Pass or Fail per check. Do not rewrite content. Do not add new findings yourself; when something is missing, fail the relevant check and say what is missing.\n\nReturn one JSON object valid against `csf-gap-review/2` (Section 4). Return JSON only.\n\n### 1. Checklist\n\nRun every check. Use target `ALL` for checks that apply to the whole draft. Report one entry per failed target, and one Pass entry per check that passes everywhere.\n\n| ID | Check | Fail when |\n|---|---|---|\n| C01 | Evidence cited | A statement, Strength, Observation, Likelihood, or Impact rationale has no evidence ID, or cites an ID that is not in the input pack |\n| C02 | Conflicts handled | Two sources in the input disagree (for example a technical check and a profile answer) and the draft picks one without a verify item |\n| C03 | Analysis depth | A Gap Finding statement restates a check result, could have been written without the assessment, or has no consequence |\n| C04 | Extent and basis | The draft ignores profile results across all systems, labels an Inferred gap as Observed (or the reverse), or leaves `extent` empty |\n| C05 | Inference justified | An Inferred finding has no organizational cause, generalizes from a system-specific cause, or has no confidence |\n| C06 | Root cause | More than two causes, a cause not in the allowed list, or a cause that repeats the gap type instead of explaining it |\n| C07 | Risk proposal | Likelihood has no anchor ID, the anchor does not match the evidence, an Inferred gap is not one level below its Observed equivalent without a stated reason, Low confidence carries a Likelihood, or an Impact area lacks a rationale tied to a system and the client's scale |\n| C08 | Response stages | A stage status is not Required and has no reason in `notApplicable`, a Required stage has no IMP, an IMP sits under a stage that does not match its `stage`, or a stage marked In place cites no Strength or Foundation |\n| C09 | IMP quality | An IMP holds more than one action, does not start with a verb, does not match the gap type, or contains cost, duration, phase, owner, or Initiative |\n| C10 | Current capability first | An IMP proposes a new tool or service when a listed Strength, Foundation, profile answer, or Landscape security tool (TOOL ID) shows the client already has a capability that could close the gap, and neither `buildsOn` nor `existingTool` is set |\n| C11 | MECE within the Function | A Subcategory with status Gap is not linked to any Gap Finding, two Gap Findings share the same root condition, or two IMPs describe the same action |\n| C12 | No calculated values | The draft states a Tier, coverage value, risk score, Risk Level, or priority order in any text field, or changes a Subcategory status |\n| C13 | Strength discipline | A Strength or Foundation appears for a Subcategory the input did not mark, a Strength statement has no evidence, or a Category with both a strength and a shortfall does not state both together in the key message or the finding |\n| C14 | Finding type separation | A vulnerability (OBS ID) is written as a Gap Finding instead of evidence, or an incident indicator appears at all |\n| C15 | Writing standard | American spelling not used, banned words (estate, posture, uplift, leverage as a verb, artifact, ideate, operationalize), em dashes, semicolons, exclamation marks, passive voice that hides the actor, a technical term not spelled out on first use, \"breach\" used outside a legal duty, a recommendation inside a finding statement, or `closes` not starting with a verb |\n| C16 | Finding layers | A `title` exceeds 12 words or carries a consequence or recommendation, a `statement` exceeds 35 words or lists systems, counts, or check results, a supporting fact exceeds 25 words, interprets instead of stating a fact, or cites an evidence ID not in the finding `evidence`, or the `consequence` repeats the statement or a fact |\n| C17 | Landscape use | `landscapeRefs` misses a block the finding relies on, the extent ignores the population in Landscape B3 or B10, the consequence names no critical service from B2 where one applies, the draft contradicts a Landscape fact without a verify item, or a department conflict (DCF ID) on a linked Subcategory is ignored |\n| C18 | Changes and existing tools | An IMP names a system in a change with `within12Months` true and `changeInFlight` is null, `appliesTo` does not fit the action, an IMP sets `existingTool` to a tool that is \"Bought, not deployed\" and the action does not start with \"Deploy\", or a new purchase is proposed for a capability listed in `securityTools` without saying why the listed tool does not fit |\n| C19 | Repeat findings | A prior assessment (PRIOR ID) reported the same condition and `repeatFinding` is false, or a repeat finding has neither Ownership nor Capacity as a root cause and gives no evidence for another cause |\n| C20 | Target Tier depth | Sustain is Required when the `targetTier` of the Category is below 3, Validate or Sustain is missing at Target Tier 3 or above without an In place or Not applicable reason, Target Tier 4 has no metric or lessons learned action, or a Validate action asks the assessor to test or exploit anything |\n| C21 | Documents | A document ID is not in `documentRegister`, a document status contradicts `requestStatus`, the exception documents are repeated without a finding-specific reason, an IMP document is missing from the Gap Finding documents, a record the Target Tier needs is neither linked nor listed in `documentGaps`, or the documents do not fit the type of each stage (for example only policies for a Find stage) |\n\n### 2. Verdict\n\n- `Revise` when any check fails.\n- `Accept` when all checks pass.\n\n### 3. Tone of notes\n\nOne sentence per note. Name the target and the exact problem. `requiredChange` says what the Analyst must do, not how to word it.\n\n### 4. Output schema\n\n```json\n{{REVIEW_SCHEMA}}\n```\n\n### 5. Calibration anchors\n\n{{CALIBRATION_ANCHORS}}\n\n### 6. Input pack given to the Analyst\n\n```json\n{{INPUT_JSON}}\n```\n\n### 7. Draft to review\n\n```json\n{{ANALYST_DRAFT_JSON}}\n```","xreview":"You review six locked NIST Cybersecurity Framework (CSF) 2.0 Gap Analysis outputs for one client together. The content of each Function is approved and locked. Do not comment on wording or on single-Function issues. Look only for problems that appear when the Functions are read side by side.\n\nReturn one JSON object valid against `csf-gap-xreview/1` (Section 3). Return JSON only. Return an empty `proposals` array when you find nothing.\n\n### 1. What to look for\n\n| Type | Look for | Proposal |\n|---|---|---|\n| MergeIMP | Two or more IMPs in different Functions that describe the same action on the same systems, for example vendor MFA in PR.AA, GV.SC, and DE.CM | Keep one IMP ID, remove the others, write the merged action, and list every Gap Finding it serves |\n| SystemicRootCause | The same root cause in three or more Categories across at least two Functions, for example Ownership | Name the cause, list the affected Gap Findings, and write one statement of the systemic condition and its consequence |\n| Calibration | Gap Findings with comparable evidence and anchors but Likelihood values that differ by one level or more | Name both findings, state the evidence that is comparable, and suggest a value. Do not propose a change when the evidence differs; say what differs in `rationale` |\n| MissingLink | An IMP in one Function that also closes a Gap Finding in another Function but does not list it | Add the link |\n| Consistency | The same system, vendor, or fact described differently across Functions, or a finding that contradicts the locked Current IT Landscape | Name the targets and the difference |\n| MissingLink (Landscape) | A Landscape block that no Gap Finding or IMP references, while a locked finding relies on its facts | Add the block to that finding's `landscapeRefs` |\n\n### 2. Rules\n\n- Every proposal names its targets by ID and gives evidence IDs or finding IDs in `rationale`.\n- Never propose new Gap Findings, new IMPs, or changes to assessor decisions.\n- Compare Gap Findings by `title`, `statement`, and `supportingFacts`. Two findings that share a title idea across Functions are a merge or consistency candidate.\n- Treat the Landscape as approved fact. Never propose a change to it.\n- Prefer fewer, stronger proposals. A proposal the assessor must reject costs time.\n- Follow the writing standard: American spelling, active voice, no em dashes, no semicolons, no consultancy jargon.\n\n### 3. Output schema\n\n```json\n{{XREVIEW_SCHEMA}}\n```\n\n### 4. Locked Current IT Landscape\n\n```json\n{{LANDSCAPE_JSON}}\n```\n\n### 5. Locked Function outputs\n\n```json\n{{LOCKED_FUNCTIONS_JSON}}\n```","fnContext":{"GV":"- **Scope:** GV.OC, GV.RM, GV.RR, GV.PO, GV.OV, GV.SC.\n- **Main evidence:** interview notes from S1, S3, S4, S5; document status (charter, policy, risk method, RACI, supplier register); Vendor profile (V1 to V7).\n- **Typical causes:** Ownership (no accountable executive), Capacity (no security function). These causes usually justify Inferred findings across all Functions; flag them for Stage 2 as systemic.\n- **Watch for:** a policy that exists on paper but is unsigned or unknown to staff (precondition test); a risk register that IT keeps alone (lost decision for leadership); supplier contracts without security or notification clauses on vendors with remote access.\n- **Impact:** usually legal and financial. For GV.SC, carry the impact of the linked systems from the Vendor profile.\n- **Links to flag:** GV.SC to DE.CM-06 and PR.AA (vendor access); GV.RR to RS.MA (incident roles); GV.PO to every Prevent action in other Functions (the standard that makes a control the rule).\n- **Validate and Sustain:** Validate: sample the policy, risk register, and RACI to confirm that owners know and use them. Sustain: an annual review recorded in the management review minutes.\n- **Landscape blocks:** B1, B7, B9, B12, B14. Use B9 (security role, outsourced functions) for Ownership and Capacity causes and B14 for repeat findings.","ID":"- **Scope:** ID.AM, ID.RA, ID.IM.\n- **Main evidence:** Quick BIA and system list, Core profile C1 and C8, technical checks AST and VUL, document status (inventories, BIA, risk register), observations of type Vulnerability.\n- **Typical causes:** Tooling (no discovery or scanning), Ownership (no system owner).\n- **Watch for:** the system list built during S2 is itself evidence that no inventory exists; systems with Unknown answers show what the organization cannot see; vulnerabilities found by observation show that scanning does not run.\n- **Impact:** inherit from the systems the gap leaves unseen. An unknown asset carries the impact of the most critical service it could touch.\n- **Links to flag:** ID.AM to every coverage claim (coverage cannot be confirmed without an inventory); ID.RA-01 to PR.PS-02 (patching); ID.IM to RS and RC (lessons learned).\n- **Validate and Sustain:** Validate: reconcile the inventory against a network scan or purchasing records. Sustain: a scheduled reconciliation and a remediation tracker with owners.\n- **Landscape blocks:** B3, B8, B10, B11, B13. Use B3 and B10 for the population, B8 for where sensitive data sits, and B13 before any inventory or replacement action.","PR":"- **Scope:** PR.AA, PR.AT, PR.DS, PR.PS, PR.IR.\n- **Main evidence:** System Sampling and profiles (Core, Full, Development), coverage results, technical checks IAM, EP, NET, EML, DATA, BKP, CLD, APP, OT, PHY.\n- **Typical causes:** Tooling, Skills, Vendor dependency (vendor-managed systems and vendor-held code).\n- **Watch for:** profile results across all systems, not only the sample, to decide Observed versus Inferred; Development profile answers (no source code control, developers in production, production data in test) as evidence for PR.PS-06 and PR.DS; \"Not supported by the system\" and \"End of life\" answers as Handle exceptions candidates.\n- **Impact:** start from the Quick BIA of the linked systems. Backup and identity gaps usually reach the highest operations score because they decide recovery from ransomware.\n- **Links to flag:** PR.AA to GV.SC (vendor access); PR.DS-11 to RC.RP (restore); PR.PS-04 to DE.CM (logs).\n- **Validate and Sustain:** Validate: retest the fixed systems, restore a backup, and check one newly added system against the standard. Sustain: scheduled access, coverage, and restore reviews with signed records.\n- **Landscape blocks:** B4, B5, B6, B10, B13. Use B5 and B10 for extent, B6 before proposing any protective tool, and B13 for systems being replaced.","DE":"- **Scope:** DE.CM, DE.AE.\n- **Main evidence:** technical checks LOG, profile fields F6 (logging) and F7 (server protection), interview notes from S7, monitoring hours, managed security service provider (MSSP) contract status.\n- **Typical causes:** Capacity (nobody watches), Tooling (no central logging), Vendor dependency (MSSP scope unclear).\n- **Watch for:** logs that are collected but never reviewed (working control to condition of validity); monitoring that covers office hours only in a 24/7 operation; alerts with no criteria to declare an incident.\n- **Impact:** the impact of the incident that goes unseen longer. Use the linked critical systems.\n- **Links to flag:** DE.CM to PR.PS-04 (log generation); DE.AE to RS.MA (incident declaration).\n- **Validate and Sustain:** Validate: send a test event and confirm it is detected and triaged in the defined time. Sustain: a periodic review of log source coverage.\n- **Landscape blocks:** B4, B6, B9, B12. Use B6 for logging and monitoring tools, B9 for who watches, and B12 for the threats detection must catch.","RS":"- **Scope:** RS.MA, RS.AN, RS.CO, RS.MI.\n- **Main evidence:** S8 scenario walk-through notes, document status (incident response plan, playbooks, contact list), technical checks IR.\n- **Typical causes:** Ownership (no incident manager), Skills (no forensic capability), Vendor dependency (no retained responder).\n- **Watch for:** response that depends on named individuals (personal capability, not organizational); regulatory notification timelines that nobody can state (CII, PDPA); no authority to isolate a critical system at night.\n- **Impact:** legal is often 4 because notification duties apply. Mark Thai legal thresholds [VERIFY] unless the Workshop regulatory verification confirms them.\n- **Links to flag:** RS.MA to GV.RR (roles); RS.CO to GV.OC-03 (legal register); RS.MI to ID.RA (vulnerability handling).\n- **Validate and Sustain:** Validate: run a tabletop exercise on the playbook and call the contact list to check it. Sustain: an annual exercise with a lessons learned entry.\n- **Landscape blocks:** B9, B12, B14. Use B12 for the incident history and the scenarios that drive notification duties.","RC":"- **Scope:** RC.RP, RC.CO.\n- **Main evidence:** profile fields C9 (backup), F4 (restore test), F5 (recovery against tolerable downtime), Quick BIA tolerable downtime, S8 notes.\n- **Typical causes:** Tooling (no immutable backup), Capacity (no restore testing), Ownership (no recovery order agreed with the business).\n- **Watch for:** recovery time that was never tested against the tolerable downtime (instance to property); backups that ransomware can reach; recovery order that IT decides alone.\n- **Impact:** operations and health and safety reach the Quick BIA maximum of the linked systems.\n- **Links to flag:** RC.RP to PR.DS-11 (backup protection); RC.CO to RS.CO (communication).\n- **Validate and Sustain:** Validate: run a restore or failover test against the recovery objective in the Business Impact Analysis (BIA). Sustain: an annual exercise report.\n- **Landscape blocks:** B2, B4, B6, B13. Use B2 for tolerable downtime, B4 for the disaster recovery site and backup architecture, and B13 for systems being replaced."},"anchors":"## 1. Likelihood anchors\n\nWorkshop level text is shown first. The anchors are practitioner judgment, not NIST text.\n\n| Level | Workshop definition (default) | Anchor | Evidence pattern |\n|---|---|---|---|\n| 5 Very High | Expected within months, or already occurring | L5-a | Signs of compromise or active exploitation. Route to the Incident path, not to the Gap Analysis. Use L5 for a gap only when the same weakness is being exploited at peer organizations right now and the client is exposed in the same way |\n| 4 High | Expected within a year. Controls are weak and the threat is active | L4-a | Control rated Poor or Unknown on one or more Criticality A systems, and an exposure path exists (internet-facing, vendor remote access, email or phishing, flat network), and the threat is active in the sector (peer incident, known ransomware tactic) |\n| | | L4-b | Control absent across the organization (no practice, Tier 0 or 1) where the threat needs no special skill, for example no MFA on remote access or no offline backup |\n| 3 Moderate | Could occur within one to two years. Similar events seen in the industry | L3-a | Control Weak or Partial on Criticality A systems, or Poor only on Criticality B or C systems |\n| | | L3-b | Inferred gap with High confidence, where the extent is not yet confirmed (one level below the Observed equivalent) |\n| | | L3-c | Governance or process gap that removes a safeguard but needs a second failure before harm, for example no access review |\n| 2 Low | Could occur within five years. Controls are mostly effective | L2-a | Coverage Largely, residual gaps on non-critical systems, or a compensating control is confirmed |\n| | | L2-b | Evidence gap only: practice is described but records are missing |\n| 1 Very Low | Not expected within five years. Strong controls are in place | L1-a | Coverage Full with Documented or Demonstrated evidence. Only a theoretical path remains |\n\nRules:\n\n1. Pick the highest anchor that the evidence fully meets. Cite the anchor ID and the evidence IDs.\n2. An Inferred gap sits one level below the Observed equivalent unless confidence is High and the organizational cause is confirmed (then it may equal it). An Inferred gap with Low confidence gets no Likelihood; its only response is a Find action.\n3. \"Unknown\" on a Criticality A system counts as absent for Likelihood, and the Analyst adds a [VERIFY] item.\n4. A Foundation that blocks part of the path lowers Likelihood by at most one level. State which part it blocks.\n5. Never use Likelihood to express importance. Importance comes from Impact and the Workshop priority.\n6. \"The threat is active\" in L4-a needs a source: an incident history row (HIST ID) or the threat context recorded in Landscape B12. Without either, use the L3 anchor that fits.\n\n## 2. Impact anchors\n\nRate each of the six Workshop areas (ops, fin, legal, rep, safety, data) on the Workshop impact scale for the worst credible consequence of this gap.\n\n| Rule | Content |\n|---|---|\n| Starting point | The highest Quick BIA score of the linked systems in that area. The Interview Quick BIA uses the same 1 to 5 scale |\n| Governance gaps without a system | Rate the consequence of the scenario that the gap enables, for example an unmanaged incident on the most critical service |\n| Legal | Use 4 when the scenario triggers a mandatory notification or a regulator order (CII reporting, PDPA breach notification). Use 5 only when a license, accreditation, or criminal liability is plausible. Mark Thai legal thresholds [VERIFY] unless the Workshop regulatory verification confirms them |\n| Personal data | Count records from the data owner or system profile. Any sensitive health record counts as at least 3 |\n| Health and safety | Use only when the system supports patient care, production safety, or physical security |\n| Rationale | One sentence per area that names the system, the scenario, and the scale text it matches |\n| Not applicable | Set value to null with a short rationale |","landscape":"You draft the Current IT Landscape section of a NIST Cybersecurity Framework (CSF) 2.0 Gap Analysis for **{{CLIENT_ALIAS}}**. This section comes before any rating. It tells the reader what the organization runs, what matters most, and how far existing controls reach. You state facts. You do not judge them.\n\nReturn one JSON object valid against `csf-gap-landscape/1` (Section 6). Return JSON only, with no text before or after it.\n\n### 1. Your task\n\n1. Write a title and a key message for each of the four pages (Section 2).\n2. Write one line for each block that has facts.\n3. Add a verify item for every fact that conflicts with another fact, and for every block with no facts.\n\n### 2. Pages\n\n| Page | Blocks | The key message answers |\n|---|---|---|\n| 1 Business, regulation, and threats | B1, B12, B9 | What the organization does, which duties apply, which threats it faces, and who runs IT and security |\n| 2 Critical services and systems | B2, B3, B8 | Which systems carry the critical services and where sensitive data sits |\n| 3 Infrastructure, identity, and third parties | B4, B5, B7, B6 | How systems connect, how people log in, who else has access, and which security tools exist |\n| 4 Coverage, changes, and basis | B10, B13, B14, B11 | How far controls reach today, what is already changing, and how reliable the evidence is |\n\n### 3. Rules\n\n| Rule | Content |\n|---|---|\n| Facts only | Every sentence restates or combines facts from the input. Cite the evidence IDs the input gives for each fact |\n| No judgment | Do not use rating or verdict words: weak, poor, strong, good, adequate, inadequate, insufficient, immature, mature, lacks, fails, gap, risk, should, must, recommend, need. State the number or the answer instead. Profile rating labels (Good, Weak, Poor, Unknown) may appear only as capitalized counts, for example \"0 of 4 Criticality A systems rated Good\" |\n| No calculation | Use counts exactly as the input states them. Do not add percentages or totals that the input does not give |\n| Combine, do not list | A key message connects facts into one pattern, for example \"Four Criticality A systems carry patient care, and two of them hold sensitive health data\". It never lists every fact |\n| Limits | Title 12 words or fewer. Key message 35 words or fewer. Block line 30 words or fewer |\n| Names | Name systems, vendors, and tools exactly as the input names them |\n| Empty blocks | No block line. Add a verify item asking the assessor to collect the facts or state why the block does not apply |\n\n### 4. Writing standard\n\n- Standard corporate English as used in Thai business documents. American spelling.\n- Active voice. One idea per sentence.\n- No em dashes, no semicolons, no exclamation marks, no emoji.\n- Banned words: estate, posture, uplift, leverage (as a verb), artifact, ideate, operationalize.\n- Spell out each technical term on first use with the abbreviation in brackets.\n\n### 5. Example (CMC sample, page 2)\n\n- `title`: Four Criticality A systems carry patient care and daily operations\n- `keyMessage`: HIS, PACS, Microsoft 365, and Active Directory are Criticality A. HIS, PACS, and LIS hold sensitive health data, and two vendors can reach that data remotely.\n\n### 6. Output schema\n\n```json\n{{LANDSCAPE_SCHEMA}}\n```\n\n### 7. Landscape facts\n\n```json\n{{LANDSCAPE_FACTS_JSON}}\n```","lsFollow":"Apply the assessor comments below. They are final. Remove every resolved verify item. Set \"round\": 2. Return the full JSON only.\n\n{{ASSESSOR_COMMENTS_JSON}}"},"deptFields":[{"id":"U1","type":"sys","n":["Systems used","ระบบที่ใช้งาน"],"s":["ID.AM-01","ID.AM-02"]},{"id":"U2","type":"sel","n":["Login and password sharing","การล็อกอินและการใช้รหัสผ่านร่วมกัน"],"s":["PR.AA-01","PR.AA-05"]},{"id":"U3","type":"sel","n":["Shared workstations","เครื่องที่ใช้ร่วมกัน"],"s":["PR.AA-01"]},{"id":"U4","type":"multi","n":["Personal channels for work data","ช่องทางส่วนตัวสำหรับข้อมูลงาน"],"s":["PR.DS-01","PR.DS-10"]},{"id":"U5","type":"sel","n":["Working from outside","การทำงานจากภายนอก"],"s":["PR.AA-03","PR.IR-01"]},{"id":"U6","type":"sel","n":["Security training","การอบรมด้านความมั่นคงปลอดภัย"],"s":["PR.AT-01"]},{"id":"U7","type":"sel","n":["Reporting a suspicious event","การแจ้งเหตุที่น่าสงสัย"],"s":["DE.AE-02","RS.MA-01"]},{"id":"U8","type":"sel","n":["Work during a system outage","การทำงานเมื่อระบบล่ม"],"s":["RC.RP-02","ID.AM-05"]}],"schemas":{"csf-gap-analyst/1":{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"csf-gap-analyst/1","title":"AI Analyst output for one CSF Function (Gap Analysis Stage 1)","description":"Text and judgments only. The HTML calculates tiers, coverage, risk scores, bands, and priority order, so those fields are not allowed here.","type":"object","additionalProperties":false,"required":["schema","function","round","categories","improvementActions","verify"],"properties":{"schema":{"const":"csf-gap-analyst/1"},"function":{"enum":["GV","ID","PR","DE","RS","RC"]},"round":{"type":"integer","mi :{"subcategory":{"$ref":"#/$defs/subId"},"statement":{"$ref":"#/$defs/text"},"evidence":{"type":"array","minItems":1,"items":{"$ref":"#/$defs/evidenceRef"}}}}}}},"strength":{"type":"object","additionalProperties":false,"required":["id","type","statement","evidence"],"properties":{"id":{"type":"string","pattern":"^STR-(GV|ID|PR|DE|RS|RC)\\.[A-Z]{2}-[0-9]{2}$","description":"Use the Subcategory ID that the HTML marked Strength or Foundation"},"type":{"enum":["Strength","Foundation"]},"statement":{"$ref":"#/$defs/text"},"evidence":{"type":"array","minItems":1,"items":{"$ref":"#/$defs/evidenceRef"}}}},"areaScore":{"type":"object","additionalProperties":false,"required":["value","rationale"],"properties":{"value":{"type":["integer","null"],"minimum":1,"maximum":5},"rationale":{"type":"string","maxLength":400}}},"gapFinding":{"type":"object","additionalProperties":false,"required":["id","basis","confidence","statement","extent","linkedSubcategories","evidence","rootCause","consequence","likelihood","impact","responses"],"properties":{"id":{"type":"string","pattern":"^GAP-(GV|ID|PR|DE|RS|RC)\\.[A-Z]{2}-[0-9]{2}$"},"basis":{"enum":["Observed","Inferred"]},"confidence":{"enum":["High","Medium","Low",null],"description":"Required for Inferred, null for Observed"},"statement":{"$ref":"#/$defs/text","description":"Analyzed conclusion: property of the organization plus consequence. No recommendation."},"extent":{"type":"object","additionalProperties":false,"required":["confirmed","likely","notChecked"],"properties":{"confirmed":{"type":"array","items":{"type":"string"},"description":"Systems or units where the condition is confirmed"},"likely":{"type":"array","items":{"type":"string"},"description":"Systems or units likely affected (Inferred)"},"notChecked":{"type":"string","maxLength":300,"description":"What the population outside the evidence is, for example '23 systems not profiled'"}}},"linkedSubcategories":{"type":"array","minItems":1,"items":{"$ref":"#/$defs/subId"}},"evidence":{"type":"array","minItems":1,"items":{"$ref":"#/$defs/evidenceRef"}},"rootCause":{"type":"array","minItems":1,"maxItems":2,"uniqueItems":true,"items":{"enum":["Ownership","Capacity","Skills","Budget","Tooling","Vendor dependency"]}},"consequence":{"$ref":"#/$defs/text","description":"Threat scenario and business consequence for this client"},"likelihood":{"type":"object","additionalProperties":false,"required":["value","anchor","rationale","evidence"],"description":"Proposal only. The assessor decides. value is null when confidence is Low.","properties":{"value":{"type":["integer","null"],"minimum":1,"maximum":5},"anchor":{"type":["string","null"],"pattern":"^L[1-5]-[a-z]$","description":"Calibration anchor ID used, for example L4-a"},"rationale":{"type":"string","maxLength":500},"evidence":{"type":"array","items":{"$ref":"#/$defs/evidenceRef"}}}},"impact":{"type":"object","additionalProperties":false,"required":["ops","fin","legal","rep","safety","data"],"description":"Proposal only, on the Workshop impact scale. The assessor decides.","properties":{"ops":{"$ref":"#/$defs/areaScore"},"fin":{"$ref":"#/$defs/areaScore"},"legal":{"$ref":"#/$defs/areaScore"},"rep":{"$ref":"#/$defs/areaScore"},"safety":{"$ref":"#/$defs/areaScore"},"data":{"$ref":"#/$defs/areaScore"}}},"responses":{"type":"object","additionalProperties":false,"required":["fix","find","prevent","exceptions","notApplicable"],"description":"IMP IDs per response angle. An empty angle needs a reason in notApplicable.","properties":{"fix":{"$ref":"#/$defs/impIdList"},"find":{"$ref":"#/$defs/impIdList"},"prevent":{"$ref":"#/$defs/impIdList"},"exceptions":{"$ref":"#/$defs/impIdList"},"notApplicable":{"type":"object","additionalProperties":false,"properties":{"fix":{"type":"string"},"find":{"type":"string"},"prevent":{"type":"string"},"exceptions":{"type":"string"}}}}}}},"impIdList":{"type":"array","items":{"type":"string","pattern":"^IMP-(GV|ID|PR|DE|RS|RC)\\.[A-Z]{2}-[0-9]{2}-[0-9]{2}$"}},"imp":{"type":"object","additionalProperties":false,"required":["id","angle","action","linkedGaps","gapType","buildsOn","documents","prerequisites","systems"],"description":"Atomic action. No cost, duration, phase, or owner: those belong to P3 Roadmap.","properties":{"id":{"type":"string","pattern":"^IMP-(GV|ID|PR|DE|RS|RC)\\.[A-Z]{2}-[0-9]{2}-[0-9]{2}$"},"angle":{"enum":["Fix","Find","Prevent","Handle exceptions"]},"action":{"type":"string","minLength":5,"maxLength":400,"description":"Starts with a verb. One action."},"linkedGaps":{"type":"array","minItems":1,"items":{"type":"string","pattern":"^GAP-(GV|ID|PR|DE|RS|RC)\\.[A-Z]{2}-[0-9]{2}$"}},"gapType":{"enum":["Governance","Process","Technology","Measurement","Evidence"]},"buildsOn":{"type":"array","items":{"type":"string","pattern":"^STR-"}},"documents":{"type":"array","items":{"type":"string","pattern":"^(GV|ID|PR|DE|RS|RC)-[A-Z]{3}-[0-9]{3}$"}},"prerequisites":{"type":"array","items":{"type":"string","pattern":"^IMP-"}},"systems":{"type":"array","items":{"type":"string"}}}},"verifyItem":{"type":"object","additionalProperties":false,"required":["ref","question"],"properties":{"ref":{"type":"string","description":"Gap, Strength, IMP, or evidence ID the question is about"},"question":{"type":"string","minLength":5,"maxLength":400}}}}},"csf-gap-analyst/2":{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"csf-gap-analyst/2","title":"AI Analyst output for one CSF Function (Gap Analysis Stage 1), version 2","description":"Text and judgments only. The HTML calculates tiers, coverage, risk scores, bands, and priority order, so those fields are not allowed here. Version 2 splits each Gap Finding into four layers: title, statement, supportingFacts, and consequence.","type":"object","additionalProperties":false,"required":["schema","function","round","categories","improvementActions","verify"],"properties":{"schema":{"const":"csf-gap-analyst/2"},"function":{"enum":["GV","ID","PR","DE","RS","RC"]},"round":{"type":"integer","minimum":1,"maximum":3,"description":"1 first draft, 2 after Reviewer feedback, 3 after assessor comments"},"categories":{"type":"array","minItems":1,"items":{"$ref":"#/$defs/category"}},"improvementActions":{"type":"array","items":{"$ref":"#/$defs/imp"}},"verify":{"type":"array","description":"Open [VERIFY] items for the assessor. A Function locks only when this list is empty.","items":{"$ref":"#/$defs/verifyItem"}}},"$defs":{"catId":{"type":"string","pattern":"^(GV|ID|PR|DE|RS|RC)\\.[A-Z]{2}$"},"subId":{"type":"string","pattern":"^(GV|ID|PR|DE|RS|RC)\\.[A-Z]{2}-[0-9]{2}$"},"evidenceRef":{"type":"string","description":"Evidence ID from the input pack: Subcategory ID, technical check ID (for example IAM-01), profile field with system (for example C4:HIS), sampling control with system (for example mfa:PACS), observation ID (OBS-01), document ID, or NOTE:<Subcategory ID> for interview notes","minLength":2},"text":{"type":"string","minLength":1,"maxLength":900},"category":{"type":"object","additionalProperties":false,"required":["categoryId","keyMessage","whatWorksToday","strengths","gapFindings","observations"],"properties":{"categoryId":{"$ref":"#/$defs/catId"},"keyMessage":{"type":"object","additionalProperties":false,"required":["found","closes"],"description":"Two-statement conclusion. found: the property of the organization with its consequence. closes: the first concrete move, starting with a verb.","properties":{"found":{"$ref":"#/$defs/text"},"closes":{"$ref":"#/$defs/text"}}},"whatWorksToday":{"type":"string","maxLength":600,"description":"One sentence naming the Strengths and Foundations, empty string if none"},"strengths":{"type":"array","items":{"$ref":"#/$defs/strength"}},"gapFindings":{"type":"array","items":{"$ref":"#/$defs/gapFinding"}},"observations":{"type":"array","description":"For Subcategories with status Meets with Observation only","items":{"type":"object","additionalProperties":false,"required":["subcategory","statement","evidence"],"propertie al 1 and Hospital 2 with about 1,200 staff.","evidence":["SITE-01","SITE-02"]},{"block":"B2","text":"HIS and Active Directory tolerate under four hours of downtime. PACS and Microsoft 365 tolerate up to one day.","evidence":["BIA:HIS","BIA:Active Directory and network core","BIA:PACS","BIA:Microsoft 365"]},{"block":"B3","text":"Seven systems are listed: four Criticality A and three Criticality B, with three hosted on premises.","evidence":["POP:systems","POP:C10"]},{"block":"B4","text":"A disaster recovery site exists but has not been tested, and backups have an online copy only.","evidence":["ENV:dr","ENV:bka"]},{"block":"B5","text":"Four systems use local application accounts, and six systems have no MFA.","evidence":["POP:C3","POP:C4"]},{"block":"B6","text":"Firewall, antivirus, and email filtering cover all users. The vulnerability scanner license is bought but not deployed.","evidence":["TOOL-01","TOOL-03","TOOL-04","TOOL-07"]},{"block":"B7","text":"Four vendors have system or data access, and three of them are Criticality A.","evidence":["POP:V1","V7:Sample HIS vendor","V7:Sample PACS vendor","V7:Sample cloud provider"]},{"block":"B8","text":"Sensitive health data sits in HIS, PACS, and LIS.","evidence":["C11:HIS","C11:PACS","C11:LIS"]},{"block":"B9","text":"IT has 25 staff, security is a part-time duty, and application support is outsourced.","evidence":["ENV:ith","ENV:secr","ENV:outs"]},{"block":"B10","text":"For MFA, 0 of 4 Criticality A systems are rated Good, and 6 of 7 systems are rated Poor.","evidence":["POP:C4"]},{"block":"B11","text":"Seven systems were listed and four sampled. Six profile answers are Unknown.","evidence":["POP:systems","POP:unknown"]},{"block":"B12","text":"In March 2025, one compromised Microsoft 365 mailbox sent phishing email to patients for two hours.","evidence":["HIST-01"]},{"block":"B13","text":"The PACS replacement is contracted for March 2027. The HIS upgrade is planned for January 2028.","evidence":["CHG-01","CHG-02"]},{"b etwork with secure protocols, and are default passwords changed?","s":["PR.IR-01","PR.PS-01"],"r":"Partial","n":"Sample: answer from the IT Infrastructure Manager."},{"id":"NET-05","area":"Network security and remote access","q":"Is network traffic monitored, for example with intrusion detection or prevention (IDS/IPS) and flow logs?","s":["DE.CM-01"],"r":"No","n":"Sample: answer from the IT Infrastructure Manager."},{"id":"NET-06","area":"Network security and remote access","q":"Are internet-facing services protected against denial-of-service (DoS) attacks and capacity problems?","s":["PR.IR-04"],"r":"","n":""},{"id":"EML-01","area":"Email and web protection","q":"Are SPF, DKIM, and DMARC configured for your email domains, and is DMARC set to quarantine or reject?","s":["PR.DS-02","DE.CM-09"],"r":"Yes","n":"Sample: answer from the IT Infrastructure Manager."},{"id":"EML-02","area":"Email and web protection","q":"Does the email gateway scan attachments and links, block dangerous file types, and sandbox suspicious files?","s":["DE.CM-09","PR.PS-05"],"r":"No","n":"Sample: answer from the IT Infrastructure Manager."},{"id":"EML-03","area":"Email and web protection","q":"Is DNS filtering or a web proxy used to block malicious and uncategorized websites?","s":["DE.CM-09","PR.IR-01"],"r":"N/A","n":"Sample: answer from the IT Infrastructure Manager."},{"id":"EML-04","area":"Email and web protection","q":"Can users report suspicious email with one click, and are phishing simulations run?","s":["PR.AT-01","RS.MA-02"],"r":"Yes","n":"Sample: answer from the IT Infrastructure Manager."},{"id":"DATA-01","area":"Data protection and encryption","q":"Is sensitive data encrypted at rest in databases, file shares, and backups, and stored in restricted locations?","s":["PR.DS-01","ID.AM-07"],"r":"","n":""},{"id":"DATA-02","area":"Data protection and encryption","q":"Is data in transit encrypted (TLS 1.2 or higher), including internal applications and file transfers?","s":["PR.DS-02"],  helpHtml:`<h2>How to use the Gap Analysis</h2>
<p>This file turns the Interview Assessment and the Target Profile Workshop into analyzed Gap Findings, Strengths, and Improvement Actions for the Roadmap. The HTML calculates every number. The AI writes text and proposes Likelihood and Impact. You decide.</p>
<h3>Steps</h3><ol><li><b>Setup.</b> Import the Interview Excel export and the Workshop risk criteria JSON. Fill the engagement context. Check the readiness gate.</li>
<li><b>Current IT Landscape (Stage 0b).</b> Review the facts, add assessor notes, copy the Landscape prompt, import the draft, comment, import the revision, and lock. Stage 1 starts only after the lock.</li>
<li><b>Tier profile.</b> Review Current against Target for all 22 Categories and the Tier Delta.</li>
<li><b>AI workflow.</b> For each Function: copy the Analyst prompt, import the draft, run the Reviewer, import the revision, make your decisions on the Gaps tab, import the final round, and lock.</li>
<li><b>Gaps.</b> Read each Gap Finding, set Likelihood and Impact, answer verify items, and confirm.</li>
<li><b>Stage 2.</b> When all six Functions are locked, run Reviewer 2 and accept or reject each proposal.</li>
<li><b>Gap register.</b> Export the Gap Register, Improvement Actions, and Strength Register to Excel for the Roadmap.</li></ol>
<h3>Rules</h3><p>Each Gap Finding is answered in six stages: Fix, Find, Prevent, Handle exceptions, Validate, and Sustain. The Target Tier of the Category sets how many stages apply, and the documents link at Gap Finding level from the Framework register. Each Gap Finding has four layers: Title, Statement, Supporting facts, and Consequence. Status per Subcategory: Strength (meets Target with documented or demonstrated evidence and enough coverage), Meets with Observation (meets Target with low coverage), Gap, or Not assessed. Category Tier follows Tier Rubric rule R4. Risk score is Likelihood times the highest Impact; weighted impact only breaks ties. Risk Levels and responses come from the Workshop.</p>
<h3>Flow</h3><p>The flow runs one way. Each Function gets one Reviewer round. Unresolved items become verify items for you. Locked content changes only with a reason in the change log.</p>
<h3>Confidentiality</h3><p>Prompts contain client evidence. Use the Anonymize option, a Claude plan that does not train on client data, and one Claude Project per client.</p>
<h3>Where data is stored</h3><p>Work autosaves in this browser for this file only. Press Save file after each session.</p>`},

async function inflate(u8){const ds=new DecompressionStream("deflate-raw");const w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer());}
async function unzip(buf){const dv=new DataView(buf),u=new Uint8Array(buf);let e=u.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error("zip");
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={},dec=new TextDecoder();
  for(let i=0;i<n;i++){const meth=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=dec.decode(u.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    const lnl=dv.getUint16(lo+26,true),lxl=dv.getUint16(lo+28,true),st=lo+30+lnl+lxl,raw=u.subarray(st,st+csz);
    out[name]=meth===0?raw:meth===8?await inflate(raw):null;}
  return out;}
async function readXlsx(buf){const z=await unzip(buf),dec=new TextDecoder(),xml=k=>z[k]?new DOMParser().parseFromString(dec.decode(z[k]),"application/xml"):null;
  const ss=[];const sx=xml("xl/sharedStrings.xml");if(sx)[...sx.getElementsByTagName("si")].forEach(si=>ss.push([...si.getElementsByTagName("t")].map(n=>n.textContent).join("")));
  const wb=xml("xl/workbook.xml"),rels=xml("xl/_rels/workbook.xml.rels");const rmap={};[...rels.getElementsByTagName("Relationship")].forEach(r=>rmap[r.getAttribute("Id")]=r.getAttribute("Target"));
  const out={};for(const sh of [...wb.getElementsByTagName("sheet")]){const rid=sh.getAttribute("r:id")||sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
    let tg=rmap[rid];tg=tg.startsWith("/")?tg.slice(1):"xl/"+tg.replace(/^\.\//,"");const d=xml(tg);if(!d)continue;const rows=[];
    for(const r of [...d.getElementsByTagName("row")]){const row=[];for(const c of [...r.getElementsByTagName("c")]){const ref=c.getAttribute("r")||"";const col=ref.replace(/\d+/g,"").split("").reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1;
      const ty=c.getAttribute("t");let v="";if(ty==="inlineStr"){v=[...c.getElementsByTagName("t")].map(n=>n.textContent).join("");}else{const ve=c.getElementsByTagName("v")[0];v=ve?ve.textContent:"";if(ty==="s")v=ss[+v]||"";}
      row[col<0?row.length:col]=v;}rows.push(Array.from(row,z=>z===undefined?"":z));}

  return out;}
function table(rows){if(!rows||!rows.length)return[];const h=rows[0].map(z=>String(z).trim());return rows.slice(1).filter(r=>r.some(c=>String(c).trim()!=="")).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]===undefined?"":String(r[i])])));}

function parseInterview(sh){const sum=Object.fromEntries((sh["Summary"]||[]).slice(1).map(r=>[r[0],r[1]]));
  if(!["csf-interview/2","csf-interview/3"].includes(sum["Schema version"]))throw new Error("schema");
  const iv={meta:{client:sum.Client||"",assessor:sum.Assessor||"",date:sum["Assessment date"]||"",ref:sum["Engagement reference"]||"",scope:sum.Scope||"",schema:sum["Schema version"],rubric:sum["Tier Rubric version"]||""},cats:{},subs:{},tc:[],sys:[],prof:[],smp:[],ven:[],obs:[],dr:{},openReq:[]};
  table(sh["Category Tiers"]).forEach(r=>iv.cats[r.Category]={cur:num(r["Current Tier"]),tgt:num(r["Target Tier"]),why:r.Justification||"",over:r.Overridden==="Yes"});
  table(sh["Subcategories"]).forEach(r=>iv.subs[r.ID]={outcome:r.Outcome,stated:r["Stated tier"]==="N/A"?"NA":num(r["Stated tier"]),ev:r["Evidence basis"]||"",counted:r["Counted tier"]==="N/A"?"NA":num(r["Counted tier"]),cl:r["Counted lower"]==="Yes",
    ref:r["Evidence reference"]||"",notes:r["Interview notes"]||"",gap:r["Gap statement"]||"",req:r["Request status"]||"",docs:splitIds(r["Related documents"]),covApp:r["Coverage-applicable"]==="Yes",cov:r.Coverage||"",covPct:num(r["Coverage %"]),covSrc:r["Coverage source"]||"",ntr:r["Next-tier ready"]==="Yes",obs:splitIds(r["Technical observations"])});
  table(sh["Evidence Requests"]).forEach(r=>{if(r.Status==="Open")iv.openReq.push(r.ID);});
  table(sh["Technical Checks"]).forEach(r=>iv.tc.push({id:r.ID,area:r["Technology area"],q:r.Check,s:splitIds(r["CSF Subcategories"]),r:r.Result||"",n:r.Observation||""}));
  table(sh["Systems (Quick BIA)"]).forEach(r=>iv.sys.push({name:r.System,crit:r.Criticality||r["Suggested criticality"]||"",smp:r.Sampled==="Yes",host:r.Hosting||"",hostCode:r["Hosting code"]||"",svc:r["Business service"]||"",mtd:r["Tolerable downtime"]||"",imp:Object.fromEntries(AREAS.map(a=>[a,num(r[IV_AREA[a]])]))}));
  table(sh["System Profile"]).forEach(r=>iv.prof.push({sys:r.System,crit:r.Criticality,sec:r.Section,id:r["Field ID"],field:r.Field,ans:r.Answer,code:r["Answer code"]||"",rt:r.Rating,ev:r.Evidence,s:splitIds(r["CSF Subcategories"])}));
  const sm=sh["System Sampling"]||[];if(sm.length){const h=sm[0];const sysCols=[];for(let i=2;i<h.length;i+=3)sysCols.push({i,name:h[i]});
    sm.slice(1).forEach(r=>{if(r[0]==="Notes")return;sysCols.forEach(c=>{if(r[c.i])iv.smp.push({ctl:r[0],s:splitIds(r[1]),sys:c.name,v:r[c.i],src:r[c.i+1]||"",ref:r[c.i+2]||""});});});}
  table(sh["Vendor Profile"]).forEach(r=>iv.ven.push(r));
  table(sh["Technical Observations"]).forEach(r=>iv.obs.push({id:r.ID,type:r.Type,sys:r.System,desc:r.Description,sev:r.Severity,inet:r["Internet-facing"],s:splitIds(r["Related Subcategories"]),st:r.Status}));
  table(sh["Document Requests"]).forEach(r=>{if(r["Document ID"])iv.dr[r["Document ID"]]=r.Status;});
  iv.origin=Object.fromEntries(iv.prof.filter(p=>p.id==="C1").map(p=>[p.sys,p.ans]));

  iv.sites=table(sh["Sites"]);iv.tools=table(sh["Security Tools"]);iv.hist=table(sh["Incident History"]);iv.chg=table(sh["Changes in Flight"]);iv.prior=table(sh["Prior Assessments"]);
  iv.dept=table(sh["Departments"]);iv.dcf=table(sh["Department Conflicts"]);iv.dcq=table(sh["Department Custom"]);
  return iv;}

  const xc=calibOverride(g.id);const Lf=xc!==null?xc:L;
  const vals=AREAS.map(a=>I[a]).filter(v=>v!==null&&v!==undefined);const mx=vals.length?Math.max(...vals):null;const w=weights();
  const score=Lf&&mx?Lf*mx:null;const wi=+(AREAS.reduce((s,a)=>s+(I[a]||0)*w[a],0)).toFixed(2);
  return{L:Lf,I,mx,score,band:score?bandOf(score):null,wi,conf:!!d.ok,removed:!!d.rm};}
function calibOverride(gid){const x=S.x;if(!x.p)return null;for(const p of x.p.proposals||[]){if(p.type==="Calibration"&&x.dec[p.id]==="accept"&&p.targets.includes(gid)&&p.change&&p.change.suggestedLikelihood)return p.change.suggestedLikelihood;}return null;}
function allFindings(){const out=[];FN.forEach(f=>{const o=curOut(f);if(!o)return;o.categories.forEach(c=>c.gapFindings.forEach(g=>{const r=finalRisk(f,g);if(r.removed)return;const ci=catInfo(c.categoryId);out.push({f,c:c.categoryId,g,r,md:ci.md.length>0});}));});
  out.sort((a,b)=>(BAND_ORDER[a.r.band]??9)-(BAND_ORDER[b.r.band]??9)||(b.md-a.md)||((b.r.score||0)-(a.r.score||0))||(b.r.wi-a.r.wi));return out;}
function allImps(){let imps=[];FN.forEach(f=>{const o=curOut(f);if(o)imps=imps.concat(o.improvementActions.map(i=>Object.assign({},i,{linkedGaps:[...i.linkedGaps],f})));});
  const x=S.x;if(x.p)(x.p.proposals||[]).forEach(p=>{if(x.dec[p.id]!=="accept"||!p.change)return;const ch=p.change;
    if(p.type==="MergeIMP"&&ch.keepImp){const keep=imps.find(i=>i.id===ch.keepImp);const rm=ch.removeImps||[];if(keep){rm.forEach(id=>{const o=imps.find(i=>i.id===id);if(o)o.linkedGaps.forEach(gl=>{if(!keep.linkedGaps.includes(gl))keep.linkedGaps.push(gl);});});(ch.affectedGaps||[]).forEach(gl=>{if(!keep.linkedGaps.includes(gl))keep.linkedGaps.push(gl);});if(ch.mergedAction)keep.action=ch.mergedAction;}imps=imps.filter(i=>!rm.includes(i.id));}
    if(p.type==="MissingLink")(ch.addLinks||[]).forEach(l=>{const i=imps.find(z=>z.id===l.imp);if(i&&!i.linkedGaps.includes(l.gap))i.linkedGaps.push(l.gap);});});

function systemic(){const out=[];const cnt={};FN.forEach(f=>{const o=curOut(f);if(!o)return;o.categories.forEach(c=>c.gapFindings.forEach(g=>g.rootCause.forEach(rc=>{(cnt[rc]=cnt[rc]||{cats:new Set(),fns:new Set(),gaps:[]});cnt[rc].cats.add(c.categoryId);cnt[rc].fns.add(f);cnt[rc].gaps.push(g.id);})));});

function vjs(schema,data){const errs=[];const root=schema;
  const res=s=>{if(s&&s.$ref){const k=s.$ref.replace("#/$defs/","");return root.$defs[k];}return s;};
  const tp=v=>v===null?"null":Array.isArray(v)?"array":Number.isInteger(v)?"integer":typeof v;
  function chk(s,v,p){s=res(s);if(!s)return;if(s.$ref)s=res(s);
    if(s.const!==undefined&&v!==s.const){errs.push(`${p}: must be ${JSON.stringify(s.const)}`);return;}
    if(s.enum&&!s.enum.includes(v)){errs.push(`${p}: ${JSON.stringify(v)} is not one of ${s.enum.join(", ")}`);return;}
    if(s.type){const ts=[].concat(s.type),vt=tp(v);if(!ts.some(z=>z===vt||(z==="number"&&(vt==="integer"||vt==="number"))||(z==="integer"&&vt==="integer"))){errs.push(`${p}: expected ${ts.join(" or ")}`);return;}}
    if(typeof v==="string"){if(s.minLength&&v.length<s.minLength)errs.push(`${p}: too short`);if(s.maxLength&&v.length>s.maxLength)errs.push(`${p}: longer than ${s.maxLength} characters`);if(s.pattern&&!new RegExp(s.pattern).test(v))errs.push(`${p}: "${v}" does not match ${s.pattern}`);}
    if(typeof v==="number"){if(s.minimum!==undefined&&v<s.minimum)errs.push(`${p}: below ${s.minimum}`);if(s.maximum!==undefined&&v>s.maximum)errs.push(`${p}: above ${s.maximum}`);}
    if(Array.isArray(v)){if(s.minItems&&v.length<s.minItems)errs.push(`${p}: needs at least ${s.minItems} item(s)`);if(s.maxItems&&v.length>s.maxItems)errs.push(`${p}: at most ${s.maxItems} item(s)`);if(s.uniqueItems&&new Set(v.map(z=>JSON.stringify(z))).size!==v.length)errs.push(`${p}: duplicate items`);if(s.items)v.forEach((z,i)=>chk(s.items,z,`${p}[${i}]`));}
    if(v&&typeof v==="object"&&!Array.isArray(v)){(s.required||[]).forEach(k=>{if(!(k in v))errs.push(`${p}: missing ${k}`);});const props=s.properties||{};
      Object.keys(v).forEach(k=>{if(props[k])chk(props[k],v[k],`${p}.${k}`);else if(s.additionalProperties===false)errs.push(`${p}: field "${k}" is not allowed`);});}}
  chk(root,data,"$");return errs;}
const BANNED=/\b(estate|posture|uplift|leverag(e|es|ed|ing)|artifacts?|artefacts?|ideate|operationali[sz]e)\b/i, UKS=/\b(organis|prioritis|minimis|optimis|behaviour|colour|centre|licence)/i;
function styleErrs(o){const out=[];(function walk(v,p){if(typeof v==="string"){if(/[–—]/.test(v))out.push(`${p}: dash character`);if(v.includes(";"))out.push(`${p}: semicolon`);if(v.includes("!"))out.push(`${p}: exclamation mark`);const m=v.match(BANNED);if(m)out.push(`${p}: banned word "${m[0]}"`);const u=v.match(UKS);if(u)out.push(`${p}: British spelling "${u[0]}"`);}else if(Array.isArray(v))v.forEach((z,i)=>walk(z,`${p}[${i}]`));else if(v&&typeof v==="object")Object.entries(v).forEach(([k,z])=>walk(z,`${p}.${k}`));})(o,"$");return out;}
const wc=s=>String(s||"").trim().split(/\s+/).filter(Boolean).length;
function layerRules(g,err,warn){if(wc(g.title)>12)warn.push(`${g.id}: title longer than 12 words`);if(wc(g.statement)>35)warn.push(`${g.id}: statement longer than 35 words`);if(wc(g.consequence)>35)warn.push(`${g.id}: consequence longer than 35 words`);
  (g.supportingFacts||[]).forEach((f,n)=>{if(wc(f.fact)>25)warn.push(`${g.id}: supporting fact ${n+1} longer than 25 words`);f.evidence.forEach(e=>{if(!g.evidence.includes(e))err.push(`${g.id}: supporting fact ${n+1} cites ${e}, which is not in the finding evidence`);});});}

function analystRules(d,fnId){const err=[],warn=[];if(d.function!==fnId)err.push(`function is ${d.function}, expected ${fnId}`);const imps=Object.fromEntries(d.improvementActions.map(i=>[i.id,i]));const gaps={};
  d.categories.forEach(c=>{if(!c.categoryId.startsWith(fnId+"."))err.push(`${c.categoryId}: outside Function ${fnId}`);
    const sInfo=subsOfCat(c.categoryId).map(subInfo).filter(Boolean);const marked=new Set(sInfo.filter(i=>i.st==="Strength"||i.fd).map(i=>"STR-"+i.s));
    c.strengths.forEach(z=>{if(!z.id.startsWith("STR-"+c.categoryId+"-"))err.push(`${z.id}: does not match ${c.categoryId}`);else if(!marked.has(z.id))err.push(`${z.id}: the HTML did not mark this Subcategory as Strength or Foundation`);});
    const linked=new Set();c.gapFindings.forEach(g=>{gaps[g.id]=g;if(g.title!==undefined)layerRules(g,err,warn);g.linkedSubcategories.forEach(s=>linked.add(s));if(!g.id.startsWith("GAP-"+c.categoryId+"-"))err.push(`${g.id}: does not match ${c.categoryId}`);
      if(g.basis==="Observed"&&g.confidence!==null)err.push(`${g.id}: Observed must have confidence null`);if(g.basis==="Inferred"&&g.confidence===null)err.push(`${g.id}: Inferred needs a confidence`);
      if(g.confidence==="Low"&&g.likelihood.value!==null)err.push(`${g.id}: Low confidence must have no Likelihood`);if(g.likelihood.value!==null&&!g.likelihood.anchor)err.push(`${g.id}: Likelihood needs an anchor`);
      if(g.likelihood.anchor&&g.likelihood.value!==null&&+g.likelihood.anchor[1]!==g.likelihood.value)err.push(`${g.id}: anchor ${g.likelihood.anchor} does not match Likelihood ${g.likelihood.value}`);
      g.linkedSubcategories.forEach(s=>{if(!s.startsWith(c.categoryId+"-"))err.push(`${g.id}: ${s} is outside the Category`);});
      (g.responses.stageStatus?STG:STG.slice(0,4)).forEach(a=>{if(!g.responses.stageStatus&&!g.responses[a].length&&!(g.responses.notApplicable||{})[a])err.push(`${g.id}: stage ${a} is empty without a reason`);g.responses[a].forEach(i=>{if(!imps[i])err.push(`${g.id}: ${i} is not in improvementActions`);else if(!imps[i].linkedGaps.includes(g.id))err.push(`${g.id}: ${i} does not list this finding`);});});});
    sInfo.filter(i=>i.st==="Gap").forEach(i=>{if(!linked.has(i.s))warn.push(`${i.s}: status Gap but no Gap Finding links it`);});});
  const cats=new Set(d.categories.map(c=>c.categoryId));CATS.filter(c=>c.startsWith(fnId+".")).forEach(c=>{if(!cats.has(c)&&subsOfCat(c).some(s=>(subInfo(s)||{}).st==="Gap"))warn.push(`${c}: Category with gaps is missing from the output`);});
  const seen={};Object.values(imps).forEach(i=>{i.linkedGaps.forEach(g=>{if(!gaps[g])err.push(`${i.id}: linked gap ${g} is not in this output`);});(i.prerequisites||[]).forEach(p=>{if(!imps[p])err.push(`${i.id}: prerequisite ${p} not found`);});const k=i.action.trim().toLowerCase();if(seen[k])err.push(`${i.id}: duplicates ${seen[k]}`);seen[k]=i.id;});
  return{err,warn};}

/* View mode: Presentation / Editor. Presentation shows only the tabs listed in CFG.pres. */
(function(){
var CFG={"kind": "std", "pres": ["land", "tier", "str", "gap", "reg"]}, KEY="csf-view-mode";
var T={EN:{pres:"Presentation view",edit:"Editor view",tp:"Switch to presentation view (presentation tabs only)",te:"Switch to editor view (all tabs and tools)"},
TH:{pres:"มุมมองนำเสนอ",edit:"มุมมองแก้ไข",tp:"สลับเป็นมุมมองนำเสนอ (แสดงเฉพาะแท็บนำเสนอ)",te:"สลับเป็นมุมมองแก้ไข (แสดงทุกแท็บและเครื่องมือ)"}};
var ws=CFG.kind==="ws", stored=null, mode="edit";
try{stored=localStorage.getItem(KEY)}catch(e){}
if(stored==="pres")mode="pres";
function isTH(){try{return ws?S.lang==="th":lang==="TH"}catch(e){return false}}
function cur(){return ws?(S.aud==="exec"?"pres":"edit"):mode}
function paint(){
  var b=document.getElementById("b-vm");if(!b)return;
  var m=cur(),L=T[isTH()?"TH":"EN"];
  b.textContent=m==="pres"?L.edit:L.pres;
  b.title=m==="pres"?L.te:L.tp;
  b.setAttribute("aria-pressed",m==="pres"?"true":"false");
  b.classList.toggle("pri",m==="pres");
  document.body.classList.toggle("vm-pres",m==="pres");
}
if(ws){
  if(stored==="pres"||stored==="edit")S.aud=stored==="pres"?"exec":"cons";
  var r0=render;render=function(){r0.apply(this,arguments);paint();};
}else{
  var ok=function(v){return mode!=="pres"||CFG.pres.indexOf(v)>-1};
  var ensure=function(){if(!ok(view))view=CFG.pres[0];};
  var rs=renderStatic;
  renderStatic=function(){ensure();rs.apply(this,arguments);
    if(mode==="pres"){var tb=document.getElementById("tabs");
      if(tb)tb.querySelectorAll("[data-tab]").forEach(function(b){if(CFG.pres.indexOf(b.dataset.tab)<0)b.remove();});}
    paint();};
  var rv=renderView;renderView=function(){ensure();return rv.apply(this,arguments);};
  var sv=setView;setView=function(v){if(!ok(v))return;return sv.apply(this,arguments);};
  if(typeof goDoc==="function"){var gd=goDoc;goDoc=function(){if(!ok("assess"))return;return gd.apply(this,arguments);};}
  if(typeof goSub==="function"){var gs=goSub;goSub=function(){if(!ok("iv"))return;return gs.apply(this,arguments);};}
}
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("#b-vm");if(!b)return;
  var next=cur()==="pres"?"edit":"pres";
  try{localStorage.setItem(KEY,next)}catch(x){}
  if(ws){S.aud=next==="pres"?"exec":"cons";save();render();}
  else{mode=next;renderAll();}
  window.scrollTo(0,0);
});
if(ws)render();else renderAll();
})();
</script>

</body>
