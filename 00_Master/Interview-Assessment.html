<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}
/* View mode: Presentation / Editor */
#b-vm{white-space:nowrap}
body.vm-pres #b-open,body.vm-pres #b-save,body.vm-pres #b-xlsx,body.vm-pres #savebar{display:none!important}
#audseg{display:none!important}
</style>
</head>
<body>
<title>CSF Interview Assessment</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: engagement header, tab bar (Setup, Dashboard, Assess, Gap roadmap, Activities); Assess is a list-detail workspace */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212f; --muted:#5a6577; --line:#d6dce5; --accent:#245a7a; --accent-soft:#e2eef5; --chip:#eef1f5;
  --ok:#1e7a46; --ok-soft:#e3f3ea; --warn:#a96300; --warn-soft:#fcf0dc; --bad:#b42318; --bad-soft:#fbe7e5; --na:#7b8494; --na-soft:#f0f1f4;
  --req:#b42318; --exp:#1d4ed8; --opt:#8a93a3; --on-block:#ffffff;
  --cap-it:#2e7d4f; --cap-g:#b26a00; --cap-s:#8a2f8f;
  --f-body:"IBM Plex Sans Thai",system-ui,"Segoe UI",Tahoma,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#18202a; --ink:#e5e9f0; --muted:#9aa4b4; --line:#2c3644; --accent:#7fb6d6; --accent-soft:#1d3342; --chip:#222b37;
  --ok:#4cc27e; --ok-soft:#173326; --warn:#e3a33f; --warn-soft:#3a2c15; --bad:#ef6b61; --bad-soft:#3a1d1c; --na:#8a93a3; --na-soft:#232a35;
  --req:#e5534b; --exp:#5b8def; --opt:#7d8696; --on-block:#ffffff; --cap-it:#4fbf82; --cap-g:#e2a23b; --cap-s:#d07ad6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#18202a; --ink:#e5e9f0; --muted:#9aa4b4; --line:#2c3644; --accent:#7fb6d6; --accent-soft:#1d3342; --chip:#222b37;
  --ok:#4cc27e; --ok-soft:#173326; --warn:#e3a33f; --warn-soft:#3a2c15; --bad:#ef6b61; --bad-soft:#3a1d1c; --na:#8a93a3; --na-soft:#232a35;
  --req:#e5534b; --exp:#5b8def; --opt:#7d8696; --on-block:#ffffff; --cap-it:#4fbf82; --cap-g:#e2a23b; --cap-s:#d07ad6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
.wrap{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
header.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font-size:clamp(20px,2.6vw,27px);margin:0;line-height:1.2;text-wrap:balance}
.eng{color:var(--muted);font-size:13px;margin-top:2px}
.eng b{color:var(--ink)}
.hbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{font:600 13px var(--f-body);padding:6px 11px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{font-size:12px;padding:3px 8px}
.mchk{display:flex;flex-wrap:wrap;gap:4px 12px}
.mchk label{display:flex;gap:4px;align-items:center}
.btn.mono{font-family:var(--f-mono);white-space:nowrap}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.lang{display:flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.lang button{font:600 13px var(--f-body);padding:6px 12px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.savebar{font-size:12px;color:var(--muted);margin:8px 0 0}
.tabs{display:flex;gap:4px;margin:14px 0 12px;flex-wrap:wrap}
.tabs button{font:600 14px var(--f-body);padding:7px 14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:4px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{font:13px var(--f-body);padding:5px 7px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:54px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
.box{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.pad{padding:14px}
.scroll{overflow-x:auto}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px;max-width:110ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.form{display:grid;grid-template-columns:200px 1fr;gap:8px 12px;align-items:center}
.form label{font-size:13px;color:var(--muted)}
.form .help{grid-column:2;font-size:12px;color:var(--muted);margin-top:-4px}
@media (max-width:640px){.form{grid-template-columns:1fr}.form .help{grid-column:1}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
.seg button{font:600 12px var(--f-body);padding:3px 9px;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button[aria-pressed="true"][data-v="P"],.seg button[aria-pressed="true"][data-v="Exists"],.seg button[aria-pressed="true"][data-v="Y"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="F"],.seg button[aria-pressed="true"][data-v="Missing"],.seg button[aria-pressed="true"][data-v="N"]{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"][data-v="Partial"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="NA"]{background:var(--na);color:#fff}
.lv{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:2px;font:600 11px var(--f-mono);color:var(--on-block);flex:none}
.lv.Required{background:var(--req)} .lv.Expected{background:var(--exp)} .lv.Optional{background:var(--opt)}
.cap{flex:none;font:600 10px var(--f-mono);padding:0 4px;border-radius:2px;border:1px solid currentColor;line-height:15px;display:inline-block}
.cap.IT{color:var(--cap-it)} .cap.GUIDED{color:var(--cap-g)} .cap.SPEC{color:var(--cap-s)}
.st{display:inline-block;font:600 11px var(--f-body);padding:1px 8px;border-radius:10px;white-space:nowrap}
.st.Exists{background:var(--ok-soft);color:var(--ok)} .st.Partial{background:var(--warn-soft);color:var(--warn)} .st.Missing{background:var(--bad-soft);color:var(--bad)} .st.NA{background:var(--na-soft);color:var(--na)} .st.none{background:var(--chip);color:var(--muted)} .st.out{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.mono{font-family:var(--f-mono)}
.mini{font-size:12px;color:var(--muted)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{padding:10px 12px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--warn)} .kpi.bad b{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.bar .tr{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--chip)}
.bar .tr i{display:block;height:100%}
.bar .num{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:12px}
@media (max-width:560px){.bar{grid-template-columns:90px 1fr 54px}}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.heat>div{border-radius:4px;padding:8px;font-size:12px;border:1px solid var(--line)}
.heat b{display:block;font-family:var(--f-mono);font-size:13px}
.callout{border-left:4px solid var(--cap-s);background:var(--chip);padding:10px 12px;border-radius:4px;font-size:13px;margin:8px 0}
.callout.ok{border-left-color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:4px}
/* tables */
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface);position:sticky;top:0}
table.t tr.out td{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
/* assess workspace */
.ws{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:12px;align-items:start}
@media (max-width:900px){.ws{grid-template-columns:1fr}}
.list{max-height:78vh;overflow:auto}
.lfil{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.lfil input[type=search]{flex:1 1 100%}
.li{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 10px;cursor:pointer;font:13px var(--f-body)}
.li:hover{background:var(--chip)} .li.sel{background:var(--accent-soft)}
.li .id{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .pct{font:600 11px var(--f-mono);color:var(--muted);min-width:34px;text-align:right}
.li.out{opacity:.5}
.detail{min-width:0}
.dh{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dh h2{flex:1 1 300px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin:6px 0 10px}
.meta b{color:var(--ink);font-weight:600}
.ck{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.ck .q{font-weight:600;font-size:13px}
.ck .r{font-size:12px;color:var(--muted);grid-column:1}
.ck .seg{grid-row:1/span 2;grid-column:2;align-self:start}
.ck input{grid-column:1/-1;width:100%}
.ck.F .q{color:var(--bad)}
.actrow{border:1px solid var(--line);border-radius:4px;padding:8px;margin:6px 0}
.actrow .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actrow .top b{flex:1;min-width:0}
.actrow details{font-size:12px;margin-top:4px}
.actrow ol{margin:4px 0;padding-left:18px}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:20;display:flex;justify-content:center;align-items:flex-start;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal .panel{background:var(--surface);color:var(--ink);border-radius:8px;max-width:860px;width:100%;padding:22px 24px;border:1px solid var(--line)}
.modal p,.modal li{font-size:14px;max-width:80ch}
.modal h3{text-transform:none;letter-spacing:0;color:var(--ink);font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:13px;z-index:30}
/* interview additions */
.seg button[aria-pressed="true"][data-v="0"]{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"][data-v="1"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="2"]{background:#4d7ea8;color:#fff}
.seg button[aria-pressed="true"][data-v="3"],.seg button[aria-pressed="true"][data-v="4"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="S"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="O"]{background:#4d7ea8;color:#fff}
.seg button[aria-pressed="true"][data-v="D"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="open"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="recv"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="req"]{background:#4d7ea8;color:#fff}
.seg button[aria-pressed="true"][data-v="none"]{background:var(--bad);color:#fff}
.tier{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 4px;border-radius:3px;font:600 12px var(--f-mono);color:#fff}
.tier.t0{background:var(--bad)} .tier.t1{background:var(--warn)} .tier.t2{background:#4d7ea8} .tier.t3,.tier.t4{background:var(--ok)} .tier.tNA{background:var(--na)} .tier.tnone{background:var(--chip);color:var(--muted);border:1px solid var(--line)}
.qbox{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:4px;margin:8px 0}
.qbox .qq{font-size:16px;font-weight:600;line-height:1.45}
.probe{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13px}
.probe input{margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:12px var(--f-body);padding:3px 9px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.anchors{font-size:12px;color:var(--muted);margin:6px 0 0;padding-left:0;list-style:none}
.anchors li{padding:1px 0}
.anchors b{color:var(--ink)}
.flag{display:inline-block;font:600 11px var(--f-body);padding:1px 7px;border-radius:10px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.flag.info{background:var(--chip);color:var(--muted)}
.pair{display:grid;grid-template-columns:160px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.pair .tr{position:relative;height:16px;background:var(--chip);border-radius:3px}
.pair .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.pair .tr u{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink);text-decoration:none}
@media (max-width:560px){.pair{grid-template-columns:90px 1fr 60px}}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quad>div{border:1px solid var(--line);border-radius:6px;padding:10px}
.quad b.n{font-size:22px;display:block;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"][data-v="P"]{background:var(--warn);color:#fff}
.scene{border:1px solid var(--line);border-radius:6px;margin:8px 0;overflow:hidden}
.scene .st1{padding:10px 12px;background:var(--chip);font-size:13px}
.scene .st2{padding:10px 12px;border-top:1px solid var(--line);background:var(--warn-soft)}
.scene .st2 .qq{font-size:15px;font-weight:600;line-height:1.45}
.step{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg);font:600 11px var(--f-mono);margin-right:6px;vertical-align:1px}
.tc{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0}
.tc .top{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.tc .top .qt{flex:1 1 320px;font-weight:600;font-size:13px}
.tc .good{font-size:12px;background:var(--ok-soft);border-left:3px solid var(--ok);padding:6px 9px;border-radius:3px;margin:6px 0}
.tc .good b{color:var(--ok)}
.tc.N{border-left:4px solid var(--bad)} .tc.P{border-left:4px solid var(--warn)} .tc.Y{border-left:4px solid var(--ok)}
.ref{font:11px var(--f-mono);color:var(--muted)}
.sessgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.sess{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.sess .sh{display:flex;gap:8px;align-items:center}
.sess .sn{display:inline-grid;place-items:center;min-width:34px;height:24px;border-radius:4px;background:var(--ink);color:var(--bg);font:600 12px var(--f-mono)}
.sess .st3{flex:1;font-weight:600;font-size:14px;line-height:1.3}
.sess p{margin:0;font-size:12px;color:var(--muted)} .sess p b{color:var(--ink)}
.sess .bar2{height:6px;background:var(--chip);border-radius:3px;overflow:hidden} .sess .bar2 i{display:block;height:100%;background:var(--ok)}
.sess.par{border-style:dashed}
.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font:600 12px var(--f-mono);margin:6px 0 12px}
.flow span{padding:3px 8px;border-radius:4px;background:var(--chip)} .flow span.p{border:1px dashed var(--line);background:transparent} .flow em{color:var(--muted);font-style:normal}
table.sys td,table.sys th{padding:4px 5px} table.sys select,table.sys input[type=text]{font-size:12px;padding:3px 4px}
.crit{display:inline-grid;place-items:center;width:22px;height:20px;border-radius:3px;font:600 12px var(--f-mono);color:#fff}
.crit.A{background:var(--bad)} .crit.B{background:var(--warn)} .crit.C{background:var(--na)} .crit.none{background:var(--chip);color:var(--muted)}
td.cY{background:var(--ok-soft)} td.cP{background:var(--warn-soft)} td.cN{background:var(--bad-soft)} td.cU{background:var(--chip)}
.chipv{display:inline-block;font:600 11px var(--f-body);padding:1px 7px;border-radius:10px;margin:1px}
.chipv.Y{background:var(--ok-soft);color:var(--ok)} .chipv.P{background:var(--warn-soft);color:var(--warn)} .chipv.N{background:var(--bad-soft);color:var(--bad)} .chipv.NA,.chipv.U,.chipv.none{background:var(--chip);color:var(--muted)}
.linkbox{border:1px dashed var(--line);border-radius:6px;padding:10px 12px;font-size:13px}
td.rt-G{background:var(--ok-soft)} td.rt-W{background:var(--warn-soft)} td.rt-P{background:var(--bad-soft)} td.rt-U{background:var(--chip)}
table.sys select[multiple]{min-width:140px} table.sys td select{max-width:210px} .covline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
#printArea{display:none}
@media print{
  body{background:#fff;color:#000}
  .wrap,.modal,.toast{display:none!important}
  #printArea{display:block;font:11pt var(--f-body);color:#000}
  #printArea h1{font-size:16pt;margin:0 0 4pt}
  #printArea .pq{break-inside:avoid;border-bottom:1px solid #999;padding:6pt 0 18pt}
  #printArea .pq b{font-family:var(--f-mono)}
  #printArea .pl{min-height:40pt}
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1 id="t-title">CSF Interview Assessment</h1>
      <div class="eng" id="eng"></div>
    </div>
    <div class="hbtns">
      <button class="btn" id="b-help"></button>
      <button class="btn" id="b-open"></button><input type="file" id="file" accept=".json,application/json" hidden>
      <button class="btn" id="b-save"></button>
      <button class="btn pri" id="b-xlsx"></button>
      <button class="btn" id="b-vm" type="button" aria-pressed="false">Presentation view</button>
      <div class="lang" role="group" aria-label="Language"><button id="b-th" aria-pressed="false">ไทย</button><button id="b-en" aria-pressed="true">EN</button></div>
    </div>
  </header>
  <p class="savebar" id="savebar"></p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <section id="v-setup"></section>
  <section id="v-plan" hidden></section>
  <section id="v-iv" hidden></section>
  <section id="v-score" hidden></section>
  <section id="v-dash" hidden></section>
  <section id="v-fu" hidden></section>
  <section id="v-tech" hidden></section>
  <section id="v-sys" hidden></section>
  <section id="v-ven" hidden></section>
  <section id="v-env" hidden></section>
  <section id="v-dept" hidden></section>
  <section id="v-obs" hidden></section>

liers, customers, and partners are established and coordinated","GV.SC-03":"Supply chain risk management is integrated into cybersecurity and enterprise risk management","GV.SC-04":"Suppliers are known and prioritized by criticality","GV.SC-05":"Requirements to address supply chain risks are established, prioritized, and integrated into contracts","GV.SC-06":"Planning and due diligence are performed to reduce risks before entering supplier relationships","GV.SC-07":"Supplier risks are understood, recorded, prioritized, assessed, responded to, and monitored","GV.SC-08":"Relevant suppliers are included in incident planning, response, and recovery activities","GV.SC-09":"Supply chain security practices are integrated and monitored throughout the technology product and service life cycle","GV.SC-10":"Supply chain risk management plans include provisions for activities after a partnership or service ends","ID.AM-01":"Inventories of hardware managed by the organization are maintained","ID.AM-02":"Inventories of software, services, and systems managed by the organization are maintained","ID.AM-03":"Representations of authorized network communication and data flows are maintained","ID.AM-04":"Inventories of services provided by suppliers are maintained","ID.AM-05":"Assets are prioritized based on classification, criticality, resources, and impact on the mission","ID.AM-07":"Inventories of data and corresponding metadata for designated data types are maintained","ID.AM-08":"Systems, hardware, software, services, and data are managed throughout their life cycles","ID.RA-01":"Vulnerabilities in assets are identified, validated, and recorded","ID.RA-02":"Cyber threat intelligence is received from information sharing forums and sources","ID.RA-03":"Internal and external threats to the organization are identified and recorded","ID.RA-04":"Potential impacts and likelihoods of threats exploiting vulnerabilities are identified and recorded","ID.RA-05":"Threats, vulnerabilities, likelihoods, and impacts are used to understand inherent risk and inform prioritization","ID.RA-06":"Risk responses are chosen, prioritized, planned, tracked, and communicated","ID.RA-07":"Changes and exceptions are managed, assessed for risk impact, recorded, and tracked","ID.RA-08":"Processes for receiving, analyzing, and responding to vulnerability disclosures are established","ID.RA-09":"The authenticity and integrity of hardware and software are assessed prior to acquisition and use","ID.RA-10":"Critical suppliers are assessed prior to acquisition","ID.IM-01":"Improvements are identified from evaluations","ID.IM-02":"Improvements are identified from security tests and exercises","ID.IM-03":"Improvements are identified from execution of operational processes, procedures, and activities","ID.IM-04":"Incident response plans and other cybersecurity plans that affect operations are established, communicated, maintained, and improved","PR.AA-01":"Identities and credentials for authorized users, services, and hardware are managed","PR.AA-02":"Identities are proofed and bound to credentials based on the context of interactions","PR.AA-03":"Users, services, and hardware are authenticated","PR.AA-04":"Identity assertions are protected, conveyed, and verified","PR.AA-05":"Access permissions, entitlements, and authorizations are defined, managed, enforced, and reviewed","PR.AA-06":"Physical access to assets is managed, monitored, and enforced commensurate with risk","PR.AT-01":"Personnel are provided with awareness and training for general tasks with cybersecurity risks in mind","PR.AT-02":"Individuals in specialized roles are provided with awareness and training for those roles","PR.DS-01":"The confidentiality, integrity, and availability of data-at-rest are protected","PR.DS-02":"The confidentiality, integrity, and availability of data-in-transit are protected","PR.DS-10":"The confidentiality, integrity, and availability of data-in-use are protected","PR.DS-11":"Backups of data are created, protected, maintained, and tested","PR.PS-01":"Configuration management practices are established and applied","PR.PS-02":"Software is maintained, replaced, and removed commensurate with risk","PR.PS-03":"Hardware is maintained, replaced, and removed commensurate with risk","PR.PS-04":"Log records are generated and made available for continuous monitoring","PR.PS-05":"Installation and execution of unauthorized software are prevented","PR.PS-06":"Secure software development practices are integrated and their performance is monitored","PR.IR-01":"Networks and environments are protected from unauthorized logical access and usage","PR.IR-02":"Technology assets are protected from environmental threats","PR.IR-03":"Mechanisms are implemented to achieve resilience requirements in normal and adverse situations","PR.IR-04":"Adequate resource capacity to ensure availability is maintained","DE.CM-01":"Networks and network services are monitored to find potentially adverse events","DE.CM-02":"The physical environment is monitored to find potentially adverse events","DE.CM-03":"Personnel activity and technology usage are monitored to find potentially adverse events","DE.CM-06":"External service provider activities and services are monitored to find potentially adverse events","DE.CM-09":"Computing hardware and software, runtime environments, and their data are monitored to find potentially adverse events","DE.AE-02":"Potentially adverse events are analyzed to better understand associated activities","DE.AE-03":"Information is correlated from multiple sources","DE.AE-04":"The estimated impact and scope of adverse events are understood","DE.AE-06":"Information on adverse events is provided to authorized staff and tools","DE.AE-07":"Cyber threat intelligence and other contextual information are integrated into the analysis","DE.AE-08":"Incidents are declared when adverse events meet the defined incident criteria","RS.MA-01":"The incident response plan is executed i ากที่สุดได้หรือไม่"],["Is cybersecurity mentioned in the corporate strategy or annual plan?","แผนกลยุทธ์หรือแผนประจำปีขององค์กรกล่าวถึงด้านไซเบอร์หรือไม่"]],"e":["Corporate strategy or annual plan, governance charter, cybersecurity strategy","แผนกลยุทธ์หรือแผนประจำปี กฎบัตรการกำกับดูแล ยุทธศาสตร์ด้านไซเบอร์"],"f":["Security budgets are limited, so we want to protect first what matters most to the business. That starts from your priorities, not from IT.","งบด้านความมั่นคงปลอดภัยมีจำกัด จึงควรปกป้องสิ่งที่สำคัญต่อธุรกิจที่สุดก่อน และสิ่งนั้นต้องเริ่มจากลำดับความสำคัญของผู้บริหาร ไม่ใช่จากฝ่าย IT"],"x":["If all systems went down tomorrow morning and IT could restore only one by noon, which one would you choose, and why?","หากพรุ่งนี้เช้าระบบทั้งหมดล่ม และ IT กู้คืนได้เพียงระบบเดียวภายในเที่ยง ท่านจะเลือกระบบใด และเพราะอะไร"]},"GV.OC-02":{"r":["CISO","CIO","COMMS"],"q":["Who are the internal and external stakeholders with cybersecurity expectations of the organization, and how do you capture those expectations?","ผู้มีส่วนได้ส่วนเสียภายในและภายนอกที่คาดหวังด้านไซเบอร์จากองค์กรคือใคร และองค์กรรวบรวมความคาดหวังเหล่านั้นอย่างไร"],"p":[["Do customers, regulators, or partners send security questionnaires or requirements?","ลูกค้า หน่วยงานกำกับ หรือคู่ค้าส่งแบบสอบถามหรือข้อกำหนดด้านความมั่นคงปลอดภัยมาหรือไม่"],["Is there a list of stakeholders and their expectations that is reviewed?","มีรายชื่อผู้มีส่วนได้ส่วนเสียและความคาดหวังที่ได้รับการทบทวนหรือไม่"]],"e":["Stakeholder register, customer security requirements, regulator correspondence","ทะเบียนผู้มีส่วนได้ส่วนเสีย ข้อกำหนดด้านความมั่นคงปลอดภัยจากลูกค้า หนังสือจากหน่วยงานกำกับ"],"f":["Customers, regulators, auditors, and partners increasingly ask how we protect data. Their expectations shape what we must do.","ลูกค้า หน่วยงานกำกับ ผู้ตรวจสอบ และคู่ค้า สอบถามมากขึ้นเรื่อย ๆ ว่าองค์กรปกป้องข้อมูลอย่างไร ความคาดหวังเหล่านี้เป็นตัวกำหนดสิ่งที่องค์กรต้องทำ"],"x":["In the last year, did any customer, partner, or regulator ask for proof of your security? Who answered, and how long did it take?","ในปีที่ผ่านมา มีลูกค้า คู่ค้า หรือหน่วยงานกำกับขอหลักฐานด้านความมั่นคงปลอดภัยหรือไม่ ใครเป็นผู้ตอบ และใช้เวลานานเท่าใด"]},"GV.OC-03":{"r":["LEGAL","DPO","CISO"],"q":["How does the organization identify and track legal, regulatory, and contractual cybersecurity requirements, such as the Cybersecurity Act, PDPA, and sector rules?","องค์กรระบุและติดตามข้อกำหนดด้านไซเบอร์ตามกฎหมาย หน่วยงานกำกับ และสัญญา เช่น พ.ร.บ.ไซเบอร์ PDPA และกฎเฉพาะอุตสาหกรรม อย่างไร"],"p":[["Is the organization designated as Critical Information Infrastructure (CII)? Who confirmed it?","องค์กรเป็นหน่วยงานโครงสร้างพื้นฐานสำคัญทางสารสนเทศ (CII) หรือไม่ และใครเป็นผู้ยืนยัน"],["Who updates the requirement list when a new notification is issued?","เมื่อมีประกาศใหม่ ใครเป็นผู้ปรับปรุงรายการข้อกำหนด"]],"e":["Legal and regulatory requirements register, compliance calendar, contract clauses","ทะเบียนข้อกำหนดทางกฎหมาย ปฏิทินการปฏิบัติตามกฎหมาย ข้อสัญญา"],"f":["Several Thai laws now carry cybersecurity duties, such as the Cybersecurity Act and the PDPA. Missing one can lead to fines or orders from a regulator.","ปัจจุบันกฎหมายไทยหลายฉบับมีหน้าที่ด้านไซเบอร์ เช่น พ.ร.บ.ไซเบอร์ และ PDPA หากพลาดไปข้อหนึ่งอาจถูกปรับหรือถูกสั่งการจากหน่วยงานกำกับ"],"x":["If a new regulator notification were published next month, who would notice it first, and how would it reach the people who must act?","หากเดือนหน้ามีประกาศใหม่จากหน่วยงานกำกับ ใครจะรู้ก่อน และเรื่องจะไปถึงผู้ที่ต้องดำเนินการได้อย่างไร"]},"GV.OC-04":{"r":["CEO","BCM","SYSOWN"],"q":["Which services do customers, patients, or partners depend on, and what availability or recovery commitments have you made to them?","ลูกค้า ผู้รับบริการ หรือคู่ค้าพึ่งพาบริการใดขององค์กร และองค์กรให้คำมั่นเรื่องความพร้อมใช้งานหรือการกู้คืนไว้อย่างไร"],"p":[["Are service level agreements (SLA) or recovery time objectives (RTO) defined for these services?","มีการกำหนดข้อตกลงระดับบริการ (SLA) หรือเวลาเป้าหมายในการกู้คืน (RTO) สำหรับบริการเหล่านี้หรือไม่"],["Was a Business Impact Analysis (BIA) performed?","มีการวิเคราะห์ผลกระทบทางธุรกิจ (BIA) หรือไม่"]],"e":["Service catalog, SLA, Business Impact Analysis report","แคตตาล็อกบริการ SLA รายงานการวิเคราะห์ผลกระทบทางธุรกิจ"],"f":["Customers and partners rely on some of our services every day. Knowing which ones, and how long they can wait, tells us where security must be strongest.","ลูกค้าและคู่ค้าพึ่งพาบริการบางอย่างขององค์กรทุกวัน การรู้ว่าบริการใดและรอได้นานเท่าใด บอกได้ว่าความมั่นคงปลอดภัยต้องเข้มแข็งที่สุดตรงไหน"],"x":["If your main customer-facing service stopped for four hours, what would customers do, and what would it cost you?","หากบริการหลักที่ให้ลูกค้าหยุดไป 4 ชั่วโมง ลูกค้าจะทำอย่างไร และองค์กรจะเสียหายเท่าใด"]},"GV.OC-05":{"r":["CIO","BCM","PROC"],"q":["Which external services, suppliers, and internal capabilities does the organization depend on to operate?","องค์กรต้องพึ่งพาบริการภายนอก ผู้ให้บริการ และขีดความสามารถภายในใดบ้างเพื่อดำเนินงาน"],"p":[["What happens if your cloud, internet, or key software provider is unavailable for a day?","หากผู้ให้บริการคลาวด์ อินเทอร์เน็ต หรือซอฟต์แวร์หลักใช้งานไม่ได้หนึ่งวันจะเกิดอะไรขึ้น"],["Are these dependencies recorded and linked to critical services?","การพึ่งพาเหล่านี้ถูกบันทึกและเชื่อมโยงกับบริการสำคัญหรือไม่"]],"e":["Dependency map, BIA, supplier inventory","แผนผังการพึ่งพา BIA ทะเบียนผู้ให้บริการ"],"f":["We also depend on others: internet, cloud, software vendors, and key people. A failure on their side becomes our failure.","องค์กรเองก็พึ่งพาผู้อื่น เช่น อินเทอร์เน็ต คลาวด์ ผู้ขายซอฟต์แวร์ และบุคลากรสำคัญ หากฝั่งเขาล้มเหลว ก็กลายเป็นความล้มเหลวขององค์กร"],"x":["If your main software vendor went out of business tomorrow, or your internet link was cut for a day, what would stop working?","หากผู้ขายซอฟต์แวร์หลักเลิกกิจการพรุ่งนี้ หรืออินเทอร์เน็ตถูกตัดหนึ่งวัน อะไรจะใช้งานไม่ได้บ้าง"]},"GV.RM-01":{"r":["CRO","CISO","CEO"],"q":["What are the organization's cybersecurity risk management objectives, and who agreed to them?","วัตถุประสงค์การบริหารความเสี่ยงด้านไซเบอร์ขององค์กรคืออะไร และใครเป็นผู้เห็นชอบ"],"p":[["Are the objectives measurable and reviewed each year?","วัตถุประสงค์วัดผลได้และได้รับการทบทวนทุกปีหรือไม่"],["Did executive management or the board approve them?","ผู้บริหารระดับสูงหรือคณะกรรมการอนุมัติหรือไม่"]],"e":["Risk management framework or policy, approved objectives, meeting minutes","กรอบหรือนโยบายการบริหารความเสี่ยง วัตถุประสงค์ที่ได้รับอนุมัติ รายงานการประชุม"],"f":["Risk management needs a clear aim, for example \"no critical service down for more than four hours\". Without an aim, every risk looks equally urgent.","การบริหารความเสี่ยงต้องมีเป้าหมายชัดเจน เช่น \"บริการสำคัญต้องไม่หยุดเกิน 4 ชั่วโมง\" หากไม่มีเป้าหมาย ทุกความเสี่ยงจะดูเร่งด่วนเท่ากันหมด"],"x":["If I asked three of your managers what cybersecurity must achieve this year, would they give me the same answer?","หากถามผู้จัดการ 3 คนว่าปีนี้ด้านไซเบอร์ต้องบรรลุอะไร ทั้งสามคนจะตอบเหมือนกันหรือไม่"]},"GV.RM-02":{"r":["CRO","CEO","BOARD"],"q":["Has management defined how much cybersecurity risk the organization is willing to accept, and how is that communicated?","ผู้บริหารได้กำหนดระดับความเสี่ยงด้านไซเบอร์ที่องค์กรยอมรับได้หรือไม่ และสื่อสารอย่างไร"],"p":[["Can you give an example of a risk that was rejected or accepted because of the appetite?","ยกตัวอย่างความเสี่ยงที่ถูกปฏิเสธหรือยอมรับเพราะระดับความเสี่ยงที่ยอมรับได้ได้หรือไม่"],["Are tolerance thresholds stated in numbers, such as maximum downtime or data loss?","มีการกำหนดค่าเบี่ยงเบนที่ยอมรับได้เป็นตัวเลข เช่น เวลาหยุดระบบหรือการสูญหายข้อมูลสูงสุด หรือไม่"]],"e":["Risk appetite statement, board resolution, risk tolerance thresholds","แถลงการณ์ระดับความเสี่ยงที่ยอมรับได้ มติคณะกรรมการ เกณฑ์ค่าเบี่ยงเบน"],"f":["Risk appetite is how much loss or disruption management can live with. It lets staff make decisions without asking you every time.","ระดับความเสี่ยงที่ยอมรับได้คือความเสียหายหรือการหยุดชะงักที่ผู้บริหารรับได้ ช่วยให้พนักงานตัดสินใจได้เองโดยไม่ต้องถามผู้บริหารทุกครั้ง"],"x":["Would you accept losing one day of patient or customer data in exchange for a cheaper backup solution? Where is your limit?","ท่านยอมรับการสูญเสียข้อมูลผู้รับบริการหรือลูกค้า 1 วัน เพื่อแลกกับระบบสำรองข้อมูลที่ถูกลงได้หรือไม่ ขีดจำกัดของท่านอยู่ที่ใด"]},"GV.RM-03":{"r":["CRO","CISO","IA"],"q":["How are cybersecurity risks included in the enterprise risk management (ERM) process and register?","ความเสี่ยงด้านไซเบอร์ถูกรวมอยู่ในกระบวนการและทะเบียนการบริหารความเสี่ยงองค์กร (ERM) อย่างไร"],"p":[["Does the enterprise risk register contain cybersecurity risks with owners?","ทะเบียนความเสี่ยงองค์กรมีความเสี่ยงด้านไซเบอร์พร้อมเจ้าของหรือไม่"],["Does the risk committee discuss cybersecurity risks regularly?","คณะกรรมการความเสี่ยงพิจารณาความเสี่ยงด้านไซเบอร์อย่างสม่ำเสมอหรือไม่"]],"e":["Enterprise risk register, risk committee minutes","ทะเบียนความเสี่ยงองค์กร รายงานการประชุมคณะกรรมการความเสี่ยง"],"f":["Most organizations already manage financial and operational risks in one register. Cyber risk should sit in the same place, judged by the same people.","องค์กรส่วนใหญ่บริหารความเสี่ยงด้านการเงินและการดำเนินงานไว้ในทะเบียนเดียวอยู่แล้ว ความเสี่ยงไซเบอร์ควรอยู่ที่เดียวกันและพิจารณาโดยคนกลุ่มเดียวกัน"],"x":["At the last risk committee meeting, was ransomware or data leakage on the agenda next to other business risks?","ในการประชุมคณะกรรมการความเสี่ยงครั้งล่าสุด แรนซัมแวร์หรือข้อมูลรั่วไหลอยู่ในวาระคู่กับความเสี่ยงธุรกิจอื่นหรือไม่"]},"GV.RM-04":{"r":["CRO","CISO"],"q":["What direction has management given on risk response options: mitigate, transfer, avoid, or accept, and who can accept risk?","ผู้บริหารให้แนวทางเรื่องทางเลือกการตอบสนองความเสี่ยง คือ ลด โอน หลีกเลี่ยง หรือยอมรับ ไว้อย่างไร และใครมีอำนาจยอมรับความเสี่ยง"],"p":[["Is there a risk acceptance authority matrix?","มีตารางอำนาจการยอมรับความเสี่ยงหรือไม่"],["Does the organization use cyber insurance?","องค์กรใช้ประกันภัยไซเบอร์หรือไม่"]],"e":["Risk treatment guideline, risk acceptance forms, insurance policy","แนวทางการจัดการความเสี่ยง แบบฟอร์มการยอมรับความเสี่ยง กรมธรรม์ประกันภัย"],"f":["For each risk there are four choices: reduce it, insure or outsource it, stop the activity, or accept it. Someone must have the authority to choose.","ความเสี่ยงแต่ละเรื่องมีทางเลือก 4 ทาง คือ ลด โอนด้วยประกันหรือจ้างภายนอก เลิกทำกิจกรรมนั้น หรือยอมรับ และต้องมีผู้มีอำนาจตัดสินใจเลือก"],"x":["If IT said an old system cannot be secured and costs 5 million baht to replace, who would decide whether to replace it, insure it, or live with it?","หาก IT แจ้งว่าระบบเก่าระบบหนึ่งทำให้ปลอดภัยไม่ได้ และต้องใช้งบ 5 ล้านบาทในการเปลี่ยน ใครจะตัดสินใจว่าจะเปลี่ยน ทำประกัน หรือยอมรับความเสี่ยง"]},"GV.RM-05":{"r":["CISO","CRO","PROC"],"q":["How do cybersecurity risks, including supplier risks, get reported upward and across departments?","ความเสี่ยงด้านไซเบอร์ รวมถึงความเสี่ยงจากผู้ให้บริการ ถูกรายงานขึ้นไปยังผู้บริหารและข้ามหน่วยงานอย่างไร"],"p":[["Who would you tell if you found a serious risk today, and how fast?","หากพบความเสี่ยงร้ายแรงวันนี้ คุณจะแจ้งใครและภายในเวลาเท่าใด"],["Is the escalation path written down?","เส้นทางการยกระดับเป็นลายลักษณ์อักษรหรือไม่"]],"e":["Escalation matrix, risk reporting procedure, recent risk reports","ตารางการยกระดับ ขั้นตอนการรายงานความเสี่ยง รายงานความเสี่ยงล่าสุด"],"f":["Bad news must travel fast. A risk found by a junior engineer is only useful if it reaches someone who can act.","ข่าวร้ายต้องไปถึงเร็ว ความเสี่ยงที่วิศวกรระดับต้นพบจะมีประโยชน์ก็ต่อเมื่อไปถึงผู้ที่ตัดสินใจได้"],"x":["If a supplier told an IT staff member on Friday night that your data might be exposed, when would you personally hear about it?","หากคืนวันศุกร์ผู้ให้บริการแจ้งเจ้าหน้าที่ IT ว่าข้อมูลขององค์กรอาจรั่วไหล ท่านจะทราบเรื่องเมื่อใด"]},"GV.RM-06":{"r":["CRO","CISO"],"q":["What method does the organization use to rate, document, and prioritize cybersecurity risks?","องค์กรใช้วิธีใดในการให้คะแนน บันทึก และจัดลำดับความสำคัญของความเสี่ยงด้านไซเบอร์"],"p":[["Are likelihood and impact criteria defined and the same as the ERM criteria?","มีการกำหนดเกณฑ์โอกาสและผลกระทบ และสอดคล้องกับเกณฑ์ของ ERM หรือไม่"],["Do two assessors get the same score for the same risk?","ผู้ประเมินสองคนให้คะแนนความเสี่ยงเดียวกันได้ผลเท่ากันหรือไม่"]],"e":["Risk assessment methodology, risk matrix, sample completed assessment","ระเบียบวิธีการประเมินความเสี่ยง ตารางความเสี่ยง ตัวอย่างผลการประเมิน"],"f":["Risks must be rated the same way every time, otherwise the loudest person wins the budget.","ความเสี่ยงต้องให้คะแนนด้วยวิธีเดียวกันทุกครั้ง มิฉะนั้นผู้ที่พูดเสียงดังที่สุดจะได้งบประมาณไป"],"x":["If two departments each claimed their security project was urgent, how would you compare them fairly?","หากสองฝ่ายต่างอ้างว่าโครงการด้านความมั่นคงปลอดภัยของตนเร่งด่วน ท่านจะเปรียบเทียบอย่างเป็นธรรมได้อย่างไร"]},"GV.RM-07":{"r":["CEO","CIO","CISO"],"q":["Does the organization discuss positive risks, such as new technology or digital services, when making cybersecurity decisions?","องค์กรพิจารณาความเสี่ยงเชิงบวก เช่น เทคโนโลยีหรือบริการดิจิทัลใหม่ ในการตัดสินใจด้านไซเบอร์หรือไม่"],"p":[["Can you give an example where security enabled a business opportunity?","ยกตัวอย่างกรณีที่ความมั่นคงปลอดภัยช่วยเปิดโอกาสทางธุรกิจได้หรือไม่"],["Are opportunities recorded alongside risks?","มีการบันทึกโอกาสควบคู่กับความเสี่ยงหรือไม่"]],"e":["Risk register with opportunities, project business cases","ทะเบียนความเสี่ยงที่รวมโอกาส กรณีธุรกิจของโครงการ"],"f":["Security is not only about loss. Good security can win customers, enable new digital services, or support a certification.","ความมั่นคงปลอดภัยไม่ได้มีแค่เรื่องความเสียหาย ความมั่นคงปลอดภัยที่ดีช่วยให้ได้ลูกค้า เปิดบริการดิจิทัลใหม่ หรือสนับสนุนการได้รับการรับรอง"],"x":["Has a strong security record ever helped you win a contract or launch a new service? Do you discuss that upside when planning?","เคยมีกรณีที่ความมั่นคงปลอดภัยที่ดีช่วยให้ได้สัญญาหรือเปิดบริการใหม่หรือไม่ และได้พิจารณาประโยชน์ด้านนี้ตอนวางแผนหรือไม่"]},"GV.RR-01":{"r":["CEO","BOARD","CISO"],"q":["How does executive leadership show accountability for cybersecurity risk?","ผู้บริหารระดับสูงแสดงความรับผิดชอบต่อความเสี่ยงด้านไซเบอร์อย่างไร"],"p":[["How often does the board or executive committee receive a cybersecurity briefing?","คณะกรรมการหรือคณะผู้บริหารได้รับรายงานด้านไซเบอร์บ่อยเพียงใด"],["Has an executive sponsored a security initiative or message in the last year?","ในปีที่ผ่านมามีผู้บริหารสนับสนุนโครงการหรือสื่อสารเรื่องความมั่นคงปลอดภัยหรือไม่"]],"e":["Governance charter, board agenda and minutes, executive communications","กฎบัตรการกำกับดูแล วาระและรายงานการประชุมคณะกรรมการ การสื่อสารของผู้บริหาร"],"f":["Regulators and courts now expect leadership, not only IT, to own cyber risk, the same way leadership owns financial risk. Staff follow what leaders pay attention to.","ปัจจุบันหน่วยงานกำกับคาดหวังให้ผู้บริหาร ไม่ใช่แค่ IT เป็นเจ้าของความเสี่ยงไซเบอร์ เช่นเดียวกับความเสี่ยงทางการเงิน และพนักงานจะทำตามสิ่งที่ผู้บริหารให้ความสำคัญ"],"x":["Imagine a peer company was hit by ransomware last week and a journalist calls you. Who in your leadership team answers for cybersecurity, and when did the board last discuss it?","สมมติสัปดาห์ที่แล้วบริษัทในธุรกิจเดียวกันโดนแรนซัมแวร์ แล้วนักข่าวโทรมาหาท่าน ใครในทีมผู้บริหารเป็นผู้รับผิดชอบเรื่องไซเบอร์ และคณะกรรมการพูดเรื่องนี้ครั้งล่าสุดเมื่อใด"]},"GV.RR-02":{"r":["CISO","CIO","HR"],"q":["Are cybersecurity roles, responsibilities, and authorities defined, communicated, and enforced?","บทบาท ความรับผิดชอบ และอำนาจหน้าที่ด้านไซเบอร์ได้รับการกำหนด สื่อสาร และบังคับใช้หรือไม่"],"p":[["Who is accountable for security decisions today, and does that person have authority to stop a risky change?","ปัจจุบันใครรับผิดชอบการตัดสินใจด้านความมั่นคงปลอดภัย และมีอำนาจระงับการเปลี่ยนแปลงที่มีความเสี่ยงหรือไม่"],["Is there a RACI (Responsible, Accountable, Consulted, Informed) matrix?","มีตาราง RACI (ผู้ปฏิบัติ ผู้รับผิดชอบ ผู้ให้คำปรึกษา ผู้รับทราบ) หรือไม่"]],"e":["Organization chart, RACI matrix, job descriptions, appointment orders","แผนผังองค์กร ตาราง RACI คำบรรยายลักษณะงาน คำสั่งแต่งตั้ง"],"f":["When everyone is a little responsible, no one is accountable. Each security task needs a named owner with the authority to act.","เมื่อทุกคนรับผิดชอบนิดหน่อย จะไม่มีใครรับผิดชอบจริง งานด้านความมั่นคงปลอดภัยแต่ละเรื่องต้องมีเจ้าของที่ระบุชื่อและมีอำนาจดำเนินการ"],"x":["If a project manager wanted to launch a system next week without a security review, who could say no, and would that person be backed by management?","หากผู้จัดการโครงการต้องการเปิดใช้ระบบสัปดาห์หน้าโดยไม่ผ่านการตรวจด้านความมั่นคงปลอดภัย ใครปฏิเสธได้ และผู้บริหารจะสนับสนุนคนนั้นหรือไม่"]},"GV.RR-03":{"r":["CIO","CFO","CISO"],"q":["How is the cybersecurity budget and headcount decided, and is it based on risk?","งบประมาณและอัตรากำลังด้านไซเบอร์ถูกกำหนดอย่างไร และอ้างอิงความเสี่ยงหรือไม่"],"p":[["What share of the IT budget goes to security?","งบด้านความมั่นคงปลอดภัยคิดเป็นสัดส่วนเท่าใดของงบ IT"],["Were any security requests rejected last year, and why?","ปีที่ผ่านมามีคำขอด้านความมั่นคงปลอดภัยที่ถูกปฏิเสธหรือไม่ เพราะอะไร"]],"e":["Security budget, business cases, staffing plan","งบประมาณด้านความมั่นคงปลอดภัย กรณีธุรกิจ แผนอัตรากำลัง"],"f":["Security spending should follow the size of the risk, not last year's budget plus five percent.","งบด้านความมั่นคงปลอดภัยควรสัมพันธ์กับขนาดของความเสี่ยง ไม่ใช่งบปีที่แล้วบวกเพิ่มร้อยละ 5"],"x":["If your security lead asked for budget for one extra person next year, what would they need to show you to get a yes?","หากหัวหน้าด้านความมั่นคงปลอดภัยของบเพิ่มคนหนึ่งตำแหน่งในปีหน้า เขาต้องแสดงอะไรให้ท่านเห็นจึงจะอนุมัติ"]},"GV.RR-04":{"r":["HR","CISO"],"q":["How is cybersecurity built into human resources practices: screening, onboarding, role changes, discipline, and exit?","ด้านไซเบอร์ถูกรวมไว้ในงานทรัพยากรบุคคลอย่างไร ตั้งแต่การคัดกรอง การรับเข้า การเปลี่ยนตำแหน่ง การลงโทษ และการพ้นสภาพ"],"p":[["Do employees sign confidentiality and acceptable use agreements?","พนักงานลงนามข้อตกลงรักษาความลับและการใช้งานที่ยอมรับได้หรือไม่"],["How quickly does HR notify IT when someone leaves?","ฝ่ายทรัพยากรบุคคลแจ้ง IT เร็วเพียงใดเมื่อมีพนักงานลาออก"]],"e":["HR security procedure, signed NDAs, onboarding and exit checklists","ขั้นตอนความมั่นคงปลอดภัยด้านบุคลากร NDA ที่ลงนามแล้ว รายการตรวจสอบการรับเข้าและพ้นสภาพ"],"f":["Many incidents start with people: a new hire with too much access, or a leaver whose account still works. HR processes are a security control.","เหตุการณ์จำนวนมากเริ่มจากเรื่องคน เช่น พนักงานใหม่ได้สิทธิ์มากเกินไป หรือพนักงานที่ลาออกแล้วแต่บัญชียังใช้ได้ กระบวนการ HR จึงเป็นการควบคุมด้านความมั่นคงปลอดภัยด้วย"],"x":["If a system administrator resigned angrily this afternoon, what would happen to their access before they left the building?","หากผู้ดูแลระบบลาออกอย่างไม่พอใจบ่ายวันนี้ สิทธิ์การเข้าถึงของเขาจะถูกจัดการอย่างไรก่อนเขาออกจากอาคาร"]},"GV.PO-01":{"r":["CISO","CIO"],"q":["Is there an approved cybersecurity policy, and how is it communicated and enforced?","มีนโยบายด้านไซเบอร์ที่ได้รับอนุมัติหรือไม่ และสื่อสารและบังคับใช้อย่างไร"],"p":[["Who approved the policy and when?","ใครอนุมัตินโยบายและเมื่อใด"],["How do you know staff have read it? What happens when someone violates it?","รู้ได้อย่างไรว่าพนักงานได้อ่านแล้ว และเมื่อมีผู้ฝ่าฝืนจะเกิดอะไรขึ้น"]],"e":["Approved information security policy, acknowledgment records, violation cases","นโยบายความมั่นคงปลอดภัยสารสนเทศที่อนุมัติแล้ว บันทึกการรับทราบ กรณีการฝ่าฝืน"],"f":["A policy is management's written instruction on security. Without it, staff cannot be held to a rule and auditors will find nothing to test.","นโยบายคือคำสั่งที่เป็นลายลักษณ์อักษรของผู้บริหารเรื่องความมั่นคงปลอดภัย หากไม่มี ก็ไม่สามารถให้พนักงานถือปฏิบัติ และผู้ตรวจสอบก็ไม่มีอะไรให้ทดสอบ"],"x":["If an employee shared patient or customer data on a personal LINE group, which written rule would you point to when taking action?","หากพนักงานส่งข้อมูลผู้รับบริการหรือลูกค้าในกลุ่ม LINE ส่วนตัว ท่านจะอ้างกฎข้อใดที่เป็นลายลักษณ์อักษรเมื่อดำเนินการ"]},"GV.PO-02":{"r":["CISO"],"q":["How often is the policy reviewed, and what triggers an update?","นโยบายได้รับการทบทวนบ่อยเพียงใด และอะไรเป็นเหตุให้ต้องปรับปรุง"],"p":[["When was the last review, and what changed?","ทบทวนครั้งล่าสุดเมื่อใด และมีอะไรเปลี่ยนแปลง"],["Is there a policy exception process?","มีกระบวนการขอยกเว้นนโยบายหรือไม่"]],"e":["Revision history, review minutes, exception register","ประวัติการแก้ไข รายงานการทบทวน ทะเบียนการยกเว้น"],"f":["Technology, threats, and laws change every year. A policy written five years ago may not mention cloud, remote work, or AI.","เทคโนโลยี ภัยคุกคาม และกฎหมายเปลี่ยนทุกปี นโยบายที่เขียนเมื่อ 5 ปีก่อนอาจไม่ได้พูดถึงคลาวด์ การทำงานจากที่บ้าน หรือ AI"],"x":["Does your current policy say anything about staff using ChatGPT or working from home? When did someone last check?","นโยบายปัจจุบันพูดถึงการใช้ ChatGPT หรือการทำงานจากที่บ้านหรือไม่ และมีคนตรวจสอบครั้งล่าสุดเมื่อใด"]},"GV.OV-01":{"r":["CEO","ISSC","CISO"],"q":["How does management review the results of the cybersecurity risk strategy and adjust direction?","ผู้บริหารทบทวนผลลัพธ์ของกลยุทธ์ความเสี่ยงด้านไซเบอร์และปรับทิศทางอย่างไร"],"p":[["Is there a steering committee that meets regularly?","มีคณะกรรมการกำกับที่ประชุมสม่ำเสมอหรือไม่"],["Name one decision the committee made last year.","ระบุการตัดสินใจหนึ่งเรื่องที่คณะกรรมการทำในปีที่ผ่านมา"]],"e":["Steering committee minutes, strategy review report","รายงานการประชุมคณะกรรมการกำกับ รายงานการทบทวนกลยุทธ์"],"f":["Strategy needs a feedback loop: management checks whether security work is producing the intended results and changes course if not.","กลยุทธ์ต้องมีการติดตามผล ผู้บริหารต้องตรวจว่างานด้านความมั่นคงปลอดภัยให้ผลตามที่ตั้งใจหรือไม่ และปรับทิศทางเมื่อไม่เป็นไปตามเป้า"],"x":["Can you name one security decision management changed in the last year because results were not good enough?","ระบุการตัดสินใจด้านความมั่นคงปลอดภัยหนึ่งเรื่องที่ผู้บริหารเปลี่ยนในปีที่ผ่านมาเพราะผลยังไม่ดีพอได้หรือไม่"]},"GV.OV-02":{"r":["CISO","CRO","IA"],"q":["Is the risk strategy reviewed to confirm it still covers current requirements and threats?","มีการทบทวนกลยุทธ์ความเสี่ยงเพื่อยืนยันว่ายังครอบคลุมข้อกำหนดและภัยคุกคามปัจจุบันหรือไม่"],"p":[["Did a recent incident, audit, or new law cause a change in strategy?","เหตุการณ์ การตรวจสอบ หรือกฎหมายใหม่ล่าสุดทำให้กลยุทธ์เปลี่ยนหรือไม่"],["Does internal audit review cybersecurity?","ฝ่ายตรวจสอบภายในตรวจด้านไซเบอร์หรือไม่"]],"e":["Strategy review record, internal audit reports","บันทึกการทบทวนกลยุทธ์ รายงานการตรวจสอบภายใน"],"f":["The threat picture changes, for example ransomware groups now target hospitals and factories. The strategy must be rechecked against new risks and new laws.","ภาพของภัยคุกคามเปลี่ยนไป เช่น กลุ่มแรนซัมแวร์หันมาโจมตีโรงพยาบาลและโรงงาน กลยุทธ์จึงต้องตรวจทานใหม่เทียบกับความเสี่ยงและกฎหมายใหม่"],"x":["After the last major cyber attack in the news in Thailand, did anyone review whether the same thing could happen here?","หลังเหตุโจมตีไซเบอร์ครั้งใหญ่ล่าสุดในไทยที่เป็นข่าว มีใครทบทวนหรือไม่ว่าเหตุการณ์แบบเดียวกันจะเกิดที่นี่ได้หรือไม่"]},"GV.OV-03":{"r":["CISO","ISSC"],"q":["How is cybersecurity performance measured and reported?","วัดและรายงานผลการดำเนินงานด้านไซเบอร์อย่างไร"],"p":[["Which key performance indicators (KPI) and key risk indicators (KRI) are tracked?","ติดตามตัวชี้วัดผลการดำเนินงาน (KPI) และตัวชี้วัดความเสี่ยง (KRI) ใดบ้าง"],["Who receives the report and what action follows?","ใครได้รับรายงาน และมีการดำเนินการต่ออย่างไร"]],"e":["KPI and KRI dashboard, management reports","แดชบอร์ด KPI และ KRI รายงานต่อผู้บริหาร"],"f":["What gets measured gets managed. A few simple numbers show management whether security is improving.","สิ่งที่วัดผลได้จึงจะบริหารได้ ตัวเลขง่าย ๆ ไม่กี่ตัวช่วยให้ผู้บริหารเห็นว่าความมั่นคงปลอดภัยดีขึ้นหรือไม่"],"x":["If I asked you today whether security is better than last year, what number or report would you look at?","หากวันนี้ถามว่าความมั่นคงปลอดภัยดีกว่าปีที่แล้วหรือไม่ ท่านจะดูตัวเลขหรือรายงานใดเพื่อตอบ"]},"GV.SC-01":{"r":["CISO","PROC"],"q":["Does the organization have a defined program for managing cybersecurity risk from suppliers?","องค์กรมีแผนงานที่กำหนดไว้สำหรับบริหารความเสี่ยงด้านไซเบอร์จากผู้ให้บริการหรือไม่"],"p":[["Is there a supplier security policy or procedure?","มีนโยบายหรือขั้นตอนด้านความมั่นคงปลอดภัยของผู้ให้บริการหรือไม่"],["Who owns supplier risk: procurement, IT, or security?","ใครเป็นเจ้าของความเสี่ยงผู้ให้บริการ จัดซื้อ IT หรือฝ่ายความมั่นคงปลอดภัย"]],"e":["Supplier security policy, third-party risk procedure","นโยบายความมั่นคงปลอดภัยของผู้ให้บริการ ขั้นตอนบริหารความเสี่ยงบุคคลที่สาม"],"f":["Many recent breaches came through a supplier: an IT vendor, a cloud service, or a maintenance company with remote access. Supplier risk needs its own rules.","การละเมิดหลายครั้งในช่วงหลังเข้ามาทางผู้ให้บริการ เช่น ผู้ขาย IT บริการคลาวด์ หรือบริษัทบำรุงรักษาที่เข้าถึงจากระยะไกลได้ ความเสี่ยงจากผู้ให้บริการจึงต้องมีกติกาเฉพาะ"],"x":["If a vendor that maintains your core system were hacked, could the attacker reach your network? Who is responsible for checking that today?","หากผู้ขายที่ดูแลระบบหลักขององค์กรถูกเจาะ ผู้โจมตีจะเข้าถึงเครือข่ายขององค์กรได้หรือไม่ และปัจจุบันใครรับผิดชอบตรวจสอบเรื่องนี้"]},"GV.SC-02":{"r":["PROC","CISO"],"q":["Are cybersecurity roles and responsibilities agreed with suppliers and partners?","มีการตกลงบทบาทและความรับผิดชอบด้านไซเบอร์กับผู้ให้บริการและคู่ค้าหรือไม่"],"p":[["For cloud services, is the shared responsibility split documented?","สำหรับบริการคลาวด์ มีการบันทึกการแบ่งความรับผิดชอบร่วมกันหรือไม่"],["Is there a named security contact at each critical supplier?","ผู้ให้บริการสำคัญแต่ละรายมีผู้ติดต่อด้านความมั่นคงปลอดภัยที่ระบุชื่อหรือไม่"]],"e":["Contracts, responsibility matrix, supplier contact list","สัญญา ตารางความรับผิดชอบ รายชื่อผู้ติดต่อของผู้ให้บริการ"],"f":["With outsourced and cloud services, it must be clear who does what. Gaps appear where each side assumes the other is responsible.","เมื่อใช้บริการภายนอกหรือคลาวด์ ต้องชัดเจนว่าใครทำอะไร ช่องโหว่มักเกิดตรงที่แต่ละฝ่ายคิดว่าอีกฝ่ายรับผิดชอบ"],"x":["If data in your cloud service were deleted by mistake, would the provider restore it, or is that your job?","หากข้อมูลในบริการคลาวด์ถูกลบโดยไม่ตั้งใจ ผู้ให้บริการจะกู้คืนให้ หรือเป็นหน้าที่ขององค์กรเอง"]},"GV.SC-03":{"r":["CRO","CISO","PROC"],"q":["Are supplier risks included in the cybersecurity and enterprise risk registers?","ความเสี่ยงจากผู้ให้บริการถูกรวมไว้ในทะเบียนความเสี่ยงด้านไซเบอร์และความเสี่ยงองค์กรหรือไม่"],"p":[["Give an example of a supplier risk in the register.","ยกตัวอย่างความเสี่ยงจากผู้ให้บริการที่อยู่ในทะเบียน"],["Is supplier concentration risk considered?","พิจารณาความเสี่ยงจากการพึ่งพาผู้ให้บริการรายเดียวหรือไม่"]],"e":["Risk register entries for suppliers","รายการความเสี่ยงผู้ให้บริการในทะเบียนความเสี่ยง"],"f":["Supplier risks should be judged alongside other business risks, not handled only by procurement.","ความเสี่ยงจากผู้ให้บริการควรพิจารณาคู่กับความเสี่ยงธุรกิจอื่น ไม่ใช่ให้ฝ่ายจัดซื้อจัดการเพียงฝ่ายเดียว"],"x":["Is there any supplier you could not replace within a month? Is that dependency written down as a risk?","มีผู้ให้บริการรายใดที่หากต้องเปลี่ยนจะทำไม่ได้ภายในหนึ่งเดือนหรือไม่ และการพึ่งพานี้ถูกบันทึกเป็นความเสี่ยงหรือไม่"]},"GV.SC-04":{"r":["PROC","CISO","ITM"],"q":["Is there a complete list of suppliers, ranked by how critical they are?","มีรายชื่อผู้ให้บริการครบถ้วน พร้อมจัดลำดับตามความสำคัญหรือไม่"],"p":[["What criteria decide that a supplier is critical?","ใช้เกณฑ์ใดตัดสินว่าผู้ให้บริการรายใดสำคัญ"],["Which suppliers have remote access to your systems?","ผู้ให้บริการรายใดมีสิทธิ์เข้าถึงระบบจากระยะไกล"]],"e":["Supplier register with criticality tiers","ทะเบียนผู้ให้บริการพร้อมระดับความสำคัญ"],"f":["You cannot protect against suppliers you do not know about. A list ranked by importance tells you where to look first.","องค์กรไม่สามารถป้องกันความเสี่ยงจากผู้ให้บริการที่ไม่รู้ว่ามีอยู่ รายชื่อที่จัดลำดับความสำคัญบอกได้ว่าควรดูที่ใดก่อน"],"x":["How many suppliers can connect to your systems remotely today? Could IT give me that list within an hour?","ปัจจุบันมีผู้ให้บริการกี่รายที่เชื่อมต่อเข้าระบบจากระยะไกลได้ IT ส่งรายชื่อให้ได้ภายในหนึ่งชั่วโมงหรือไม่"]},"GV.SC-05":{"r":["PROC","LEGAL","CISO"],"q":["Do supplier contracts include cybersecurity requirements?","สัญญากับผู้ให้บริการมีข้อกำหนดด้านไซเบอร์หรือไม่"],"p":[["Do contracts cover breach notification, right to audit, data protection, and subcontractors?","สัญญาครอบคลุมการแจ้งเหตุละเมิด สิทธิ์ในการตรวจสอบ การคุ้มครองข้อมูล และผู้รับจ้างช่วงหรือไม่"],["Is there a data processing agreement for suppliers that handle personal data?","มีสัญญาประมวลผลข้อมูลกับผู้ให้บริการที่ประมวลผลข้อมูลส่วนบุคคลหรือไม่"]],"e":["Contract security clause template, sample signed contracts, data processing agreements","แม่แบบข้อสัญญาด้านความมั่นคงปลอดภัย ตัวอย่างสัญญาที่ลงนามแล้ว สัญญาประมวลผลข้อมูล"],"f":["The contract is your strongest lever with a supplier. If security duties are not written in, you cannot enforce them after a breach.","สัญญาคือเครื่องมือที่มีน้ำหนักที่สุดกับผู้ให้บริการ หากไม่ได้เขียนหน้าที่ด้านความมั่นคงปลอดภัยไว้ ก็บังคับไม่ได้เมื่อเกิดเหตุ"],"x":["If a supplier leaked your data, would the contract require them to tell you within a set time and pay for the damage?","หากผู้ให้บริการทำข้อมูลขององค์กรรั่วไหล สัญญากำหนดให้ต้องแจ้งภายในเวลาที่กำหนดและชดใช้ความเสียหายหรือไม่"]},"GV.SC-06":{"r":["PROC","CISO"],"q":["What security due diligence is done before selecting a new supplier?","มีการตรวจสอบความมั่นคงปลอดภัยใดก่อนเลือกผู้ให้บริการรายใหม่"],"p":[["Is a security questionnaire or certificate (such as ISO 27001 or SOC 2) required?","กำหนดให้ตอบแบบสอบถามหรือแสดงใบรับรอง เช่น ISO 27001 หรือ SOC 2 หรือไม่"],["Can security block a purchase?","ฝ่ายความมั่นคงปลอดภัยระงับการจัดซื้อได้หรือไม่"]],"e":["Supplier assessment questionnaire, completed due diligence records","แบบประเมินผู้ให้บริการ บันทึกการตรวจสอบก่อนคัดเลือก"],"f":["It is much easier to check a supplier before signing than to fix problems after.","การตรวจสอบผู้ให้บริการก่อนลงนามทำได้ง่ายกว่าการแก้ปัญหาภายหลังมาก"],"x":["When you bought your last major system, did anyone ask the vendor how they protect your data before the contract was signed?","ตอนจัดซื้อระบบใหญ่ครั้งล่าสุด มีใครถามผู้ขายหรือไม่ว่าเขาปกป้องข้อมูลขององค์กรอย่างไร ก่อนลงนามสัญญา"]},"GV.SC-07":{"r":["PROC","CISO"],"q":["How are risks from existing suppliers assessed and monitored over time?","ประเมินและติดตามความเสี่ยงจากผู้ให้บริการปัจจุบันอย่างต่อเนื่องอย่างไร"],"p":[["When was the last reassessment of a critical supplier?","ประเมินผู้ให้บริการสำคัญซ้ำครั้งล่าสุดเมื่อใด"],["Are supplier findings tracked to closure?","ข้อตรวจพบของผู้ให้บริการได้รับการติดตามจนปิดหรือไม่"]],"e":["Periodic supplier assessments, supplier review minutes","ผลการประเมินผู้ให้บริการตามรอบ รายงานการทบทวนผู้ให้บริการ"],"f":["A supplier that was safe three years ago may not be safe today. Critical suppliers need periodic checks.","ผู้ให้บริการที่ปลอดภัยเมื่อ 3 ปีก่อนอาจไม่ปลอดภัยในวันนี้ ผู้ให้บริการสำคัญจึงต้องได้รับการตรวจตามรอบ"],"x":["When did anyone last review how your most critical supplier handles security?","มีการทบทวนครั้งล่าสุดเมื่อใดว่าผู้ให้บริการที่สำคัญที่สุดจัดการความมั่นคงปลอดภัยอย่างไร"]},"GV.SC-08":{"r":["CISO","SOC","PROC"],"q":["Are critical suppliers included in incident response plans and exercises?","ผู้ให้บริการสำคัญถูกรวมไว้ในแผนรับมือเหตุการณ์และการฝึกซ้อมหรือไม่"],"p":[["Do you know who to call at each critical supplier during an incident at night?","หากเกิดเหตุตอนกลางคืน ทราบหรือไม่ว่าต้องติดต่อใครที่ผู้ให้บริการสำคัญแต่ละราย"],["Has a supplier joined a tabletop exercise?","ผู้ให้บริการเคยเข้าร่วมการฝึกซ้อมบนโต๊ะหรือไม่"]],"e":["Incident response plan supplier section, exercise reports","ส่วนผู้ให้บริการในแผนรับมือเหตุการณ์ รายงานการฝึกซ้อม"],"f":["During an incident you may need a supplier's help at 2 a.m. That only works if it was agreed and practiced in advance.","ระหว่างเกิดเหตุ องค์กรอาจต้องการความช่วยเหลือจากผู้ให้บริการตอนตีสอง ซึ่งจะได้ผลก็ต่อเมื่อตกลงและซ้อมไว้ล่วงหน้า"],"x":["If your core system were encrypted by ransomware on a Sunday night, who at the vendor would you call, and would they answer?","หากระบบหลักถูกแรนซัมแวร์เข้ารหัสคืนวันอาทิตย์ ท่านจะโทรหาใครที่ผู้ขาย และเขาจะรับสายหรือไม่"]},"GV.SC-09":{"r":["PROC","ITM","DEV"],"q":["How are supply chain security practices applied across the life cycle of technology products and services?","นำแนวปฏิบัติความมั่นคงปลอดภัยของห่วงโซ่อุปทานไปใช้ตลอดวงจรชีวิตของผลิตภัณฑ์และบริการเทคโนโลยีอย่างไร"],"p":[["Do you track software components or vendor patch support?","มีการติดตามส่วนประกอบซอฟต์แวร์หรือการสนับสนุนแพตช์จากผู้ขายหรือไม่"],["Are supplier security commitments checked during the contract?","มีการตรวจสอบคำมั่นด้านความมั่นคงปลอดภัยของผู้ให้บริการระหว่างสัญญาหรือไม่"]],"e":["Supplier performance reviews, software bill of materials (SBOM) where available","การทบทวนผลงานผู้ให้บริการ รายการส่วนประกอบซอฟต์แวร์ (SBOM) หากมี"],"f":["Security commitments from suppliers must be checked through the whole life of the product or service, including updates and support.","คำมั่นด้านความมั่นคงปลอดภัยของผู้ให้บริการต้องได้รับการตรวจตลอดอายุของผลิตภัณฑ์หรือบริการ รวมถึงการอัปเดตและการสนับสนุน"],"x":["Do you know when your key vendors will stop providing security updates for the products you use?","ทราบหรือไม่ว่าผู้ขายหลักจะหยุดให้อัปเดตด้านความมั่นคงปลอดภัยสำหรับผลิตภัณฑ์ที่องค์กรใช้เมื่อใด"]},"GV.SC-10":{"r":["PROC","ITM","LEGAL"],"q":["What happens to access and data when a supplier contract ends?","เมื่อสัญญากับผู้ให้บริการสิ้นสุด สิทธิ์การเข้าถึงและข้อมูลได้รับการจัดการอย่างไร"],"p":[["Is there an exit checklist that covers account removal and data return or deletion?","มีรายการตรวจสอบเมื่อสิ้นสุดสัญญาที่ครอบคลุมการลบบัญชีและการคืนหรือลบข้อมูลหรือไม่"],["Do you obtain a certificate of data destruction?","ได้รับหนังสือรับรองการทำลายข้อมูลหรือไม่"]],"e":["Supplier offboarding checklist, data destruction certificates","รายการตรวจสอบการยุติผู้ให้บริการ หนังสือรับรองการทำลายข้อมูล"],"f":["When a contract ends, old accounts and copies of data often stay behind. Exit steps prevent that.","เมื่อสัญญาสิ้นสุด บัญชีเก่าและสำเนาข้อมูลมักยังค้างอยู่ ขั้นตอนการยุติช่วยป้องกันปัญหานี้"],"x":["Think of the last vendor you stopped using. Can you be sure their accounts are disabled and your data is deleted?","นึกถึงผู้ขายรายล่าสุดที่เลิกใช้บริการ มั่นใจได้หรือไม่ว่าบัญชีของเขาถูกระงับและข้อมูลขององค์กรถูกลบแล้ว"]},"ID.AM-01":{"r":["ITM","SYSOWN"],"q":["How does the organization maintain its hardware inventory, and how complete and current is it?","องค์กรจัดทำทะเบียนทรัพย์สินฮาร์ดแวร์อย่างไร และครบถ้วนเป็นปัจจุบันเพียงใด"],"p":[["Is the inventory updated automatically or by hand? When was it last reconciled?","ทะเบียนปรับปรุงอัตโนมัติหรือด้วยมือ และกระทบยอดครั้งล่าสุดเมื่อใด"],["Are medical devices, OT, and network devices included?","รวมอุปกรณ์การแพทย์ ระบบควบคุมอุตสาหกรรม (OT) และอุปกรณ์เครือข่ายหรือไม่"]],"e":["Hardware asset register, discovery tool export","ทะเบียนทรัพย์สินฮาร์ดแวร์ ผลส่งออกจากเครื่องมือสำรวจ"],"f":["Attackers look for the forgotten computer in the corner. You can only protect devices you know you have.","ผู้โจมตีมักมองหาคอมพิวเตอร์ที่ถูกลืมไว้ ปกป้องได้เฉพาะอุปกรณ์ที่รู้ว่ามีอยู่"],"x":["If I walked into your server room or a ward and picked a random device, could IT tell me who owns it and whether it is patched?","หากผมเดินเข้าห้องเซิร์ฟเวอร์หรือแผนกหนึ่งแล้วชี้อุปกรณ์สุ่มหนึ่งเครื่อง IT บอกได้หรือไม่ว่าใครเป็นเจ้าของและอัปเดตแล้วหรือยัง"]},"ID.AM-02":{"r":["ITM","SYSOWN","DEV"],"q":["Is there an inventory of software, systems, and cloud services, including who owns each?","มีทะเบียนซอฟต์แวร์ ระบบ และบริการคลาวด์ พร้อมเจ้าของแต่ละรายการหรือไม่"],"p":[["How do you find software or cloud services bought without IT (shadow IT)?","ค้นหาซอฟต์แวร์หรือบริการคลาวด์ที่จัดหาโดยไม่ผ่าน IT ได้อย่างไร"],["Are versions and support end dates recorded?","มีการบันทึกเวอร์ชันและวันสิ้นสุดการสนับสนุนหรือไม่"]],"e":["Software and application inventory, system owner list","ทะเบียนซอฟต์แวร์และระบบงาน รายชื่อเจ้าของระบบ"],"f":["Every application and cloud service holds data and needs updates. Software bought by departments without IT is a common blind spot.","ทุกระบบงานและบริการคลาวด์มีข้อมูลและต้องอัปเดต ซอฟต์แวร์ที่หน่วยงานซื้อเองโดยไม่ผ่าน IT เป็นจุดบอดที่พบบ่อย"],"x":["If a department signed up for an online tool with a company credit card, would IT ever find out?","หากหน่วยงานหนึ่งสมัครใช้เครื่องมือออนไลน์ด้วยบัตรเครดิตบริษัท IT จะรู้หรือไม่"]},"ID.AM-03":{"r":["ITM"],"q":["Are network diagrams and data flow diagrams maintained for key systems?","มีการจัดทำและปรับปรุงแผนผังเครือข่ายและแผนผังการไหลของข้อมูลสำหรับระบบสำคัญหรือไม่"],"p":[["When was the network diagram last updated?","แผนผังเครือข่ายปรับปรุงครั้งล่าสุดเมื่อใด"],["Are connections to suppliers and the internet shown?","แสดงการเชื่อมต่อกับผู้ให้บริการและอินเทอร์เน็ตหรือไม่"]],"e":["Network diagram, data flow diagrams","แผนผังเครือข่าย แผนผังการไหลของข้อมูล"],"f":["A network map shows how data moves and where an attacker could travel. Without it, response during an incident is guesswork.","แผนผังเครือข่ายแสดงว่าข้อมูลไหลอย่างไรและผู้โจมตีจะเคลื่อนที่ไปได้ทางใด หากไม่มี การรับมือเหตุการณ์ก็เป็นการเดา"],"x":["If an infected computer were found in the finance department, could IT quickly show which other systems it can reach?","หากพบคอมพิวเตอร์ติดมัลแวร์ในฝ่ายการเงิน IT แสดงได้เร็วหรือไม่ว่าเครื่องนั้นเข้าถึงระบบอื่นใดได้บ้าง"]},"ID.AM-04":{"r":["PROC","ITM"],"q":["Is there an inventory of services provided by suppliers, including cloud and managed services?","มีทะเบียนบริการที่ได้รับจากผู้ให้บริการ รวมถึงบริการคลาวด์และบริการบริหารจัดการหรือไม่"],"p":[["Does it show which business process each service supports?","แสดงว่าบริการแต่ละรายการสนับสนุนกระบวนการธุรกิจใดหรือไม่"],["Who keeps it up to date?","ใครเป็นผู้ปรับปรุงให้เป็นปัจจุบัน"]],"e":["Supplier service inventory","ทะเบียนบริการของผู้ให้บริการ"],"f":["Outsourced services are part of your environment too. A list of them shows what you depend on outside your walls.","บริการที่จ้างภายนอกก็เป็นส่วนหนึ่งของสภาพแวดล้อมขององค์กร รายการบริการเหล่านี้แสดงสิ่งที่องค์กรพึ่งพาจากภายนอก"],"x":["If a cloud provider announced a breach, how fast could you tell whether you use that provider and for what?","หากผู้ให้บริการคลาวด์รายหนึ่งประกาศว่าถูกเจาะ องค์กรรู้ได้เร็วเพียงใดว่าใช้ผู้ให้บริการรายนั้นหรือไม่และใช้ทำอะไร"]},"ID.AM-05":{"r":["CISO","SYSOWN","BCM"],"q":["How are assets classified and prioritized by criticality and business impact?","จัดประเภทและจัดลำดับความสำคัญของทรัพย์สินตามความสำคัญและผลกระทบทางธุรกิจอย่างไร"],"p":[["Which systems are rated most critical, and who decided?","ระบบใดถูกจัดว่าสำคัญที่สุด และใครเป็นผู้ตัดสิน"],["Does criticality drive patching, backup, and monitoring priorities?","ระดับความสำคัญใช้กำหนดลำดับการแพตช์ การสำรองข้อมูล และการเฝ้าระวังหรือไม่"]],"e":["Asset classification scheme, critical asset list, BIA","เกณฑ์การจัดประเภททรัพย์สิน รายการทรัพย์สินสำคัญ BIA"],"f":["Not every system deserves the same protection. Ranking systems by business impact lets you spend where it matters.","ไม่ใช่ทุกระบบที่ต้องการการปกป้องระดับเดียวกัน การจัดลำดับระบบตามผลกระทบทางธุรกิจช่วยให้ใช้งบตรงจุด"],"x":["If you had budget to fully protect only five systems, which five, and does IT agree with your list?","หากมีงบปกป้องเต็มที่ได้เพียง 5 ระบบ ท่านจะเลือกระบบใด และ IT เห็นตรงกับท่านหรือไม่"]},"ID.AM-07":{"r":["DPO","CISO","SYSOWN"],"q":["Does the organization know where its sensitive data is stored and processed?","องค์กรทราบหรือไม่ว่าข้อมูลสำคัญถูกจัดเก็บและประมวลผลที่ใด"],"p":[["Is there a Record of Processing Activities (ROPA) under PDPA s.39?","มีบันทึกรายการกิจกรรมการประมวลผล (ROPA) ตาม PDPA มาตรา 39 หรือไม่"],["Is data classified, and are labels used?","มีการจัดชั้นข้อมูลและการติดป้ายกำกับหรือไม่"]],"e":["ROPA, data inventory, data classification standard","ROPA ทะเบียนข้อมูล มาตรฐานการจัดชั้นข้อมูล"],"f":["Sensitive data such as health, ID card, or payroll records attracts attackers and regulators. You need to know where it lives.","ข้อมูลอ่อนไหว เช่น ข้อมูลสุขภาพ เลขบัตรประชาชน หรือเงินเดือน เป็นเป้าหมายของผู้โจมตีและเป็นจุดที่หน่วยงานกำกับสนใจ องค์กรต้องรู้ว่าข้อมูลอยู่ที่ใด"],"x":["If a regulator asked where all copies of patient or customer ID card data are stored, including Excel files and email, could you answer?","หากหน่วยงานกำกับถามว่าสำเนาข้อมูลบัตรประชาชนของผู้รับบริการหรือลูกค้าอยู่ที่ใดบ้าง รวมถึงไฟล์ Excel และอีเมล องค์กรตอบได้หรือไม่"]},"ID.AM-08":{"r":["ITM","SYSOWN"],"q":["How are systems and data managed across their life cycle, from acquisition to secure disposal?","บริหารจัดการระบบและข้อมูลตลอดวงจรชีวิต ตั้งแต่การจัดหาจนถึงการทำลายอย่างปลอดภัยอย่างไร"],"p":[["How are old disks and devices wiped or destroyed?","ล้างหรือทำลายดิสก์และอุปกรณ์เก่าอย่างไร"],["Are end-of-life systems tracked with a replacement plan?","ระบบที่หมดอายุการสนับสนุนได้รับการติดตามพร้อมแผนทดแทนหรือไม่"]],"e":["Asset life cycle procedure, disposal records, end-of-life list","ขั้นตอนวงจรชีวิตทรัพย์สิน บันทึกการทำลาย รายการระบบหมดอายุ"],"f":["Old equipment and unsupported systems are easy targets, and discarded disks often still hold data.","อุปกรณ์เก่าและระบบที่หมดการสนับสนุนเป็นเป้าหมายง่าย และดิสก์ที่ทิ้งแล้วมักยังมีข้อมูลอยู่"],"x":["When you replace old computers, where do the hard disks go, and who confirms the data is gone?","เมื่อเปลี่ยนคอมพิวเตอร์เก่า ฮาร์ดดิสก์ไปอยู่ที่ใด และใครยืนยันว่าข้อมูลถูกลบแล้ว"]},"ID.RA-01":{"r":["ITM","SOC","CISO"],"q":["How are vulnerabilities identified, validated, and recorded?","ระบุ ยืนยัน และบันทึกช่องโหว่อย่างไร"],"p":[["How often are vulnerability scans run, and do they cover all critical systems?","สแกนช่องโหว่บ่อยเพียงใด และครอบคลุมระบบสำคัญทั้งหมดหรือไม่"],["When was the last penetration test, and were findings fixed?","ทดสอบเจาะระบบครั้งล่าสุดเมื่อใด และแก้ไขข้อตรวจพบแล้วหรือไม่"]],"e":["Scan reports, penetration test report, vulnerability tracker","รายงานการสแกน รายงานทดสอบเจาะระบบ ทะเบียนติดตามช่องโหว่"],"f":["Every system has weaknesses. The question is whether you find them before attackers do.","ทุกระบบมีจุดอ่อน คำถามคือองค์กรพบก่อนผู้โจมตีหรือไม่"],"x":["If a well-known vulnerability were announced today, how would you find out which of your systems are affected?","หากวันนี้มีการประกาศช่องโหว่ร้ายแรงที่เป็นที่รู้จัก องค์กรจะรู้ได้อย่างไรว่าระบบใดบ้างได้รับผลกระทบ"]},"ID.RA-02":{"r":["SOC","CISO"],"q":["Does the organization receive cyber threat intelligence, and from which sources?","องค์กรได้รับข้อมูลข่าวกรองภัยคุกคามไซเบอร์หรือไม่ และจากแหล่งใด"],"p":[["Are you a member of ThaiCERT, a sector CERT, or an information sharing group?","เป็นสมาชิก ThaiCERT ศูนย์ CERT ของภาคส่วน หรือกลุ่มแลกเปลี่ยนข้อมูลหรือไม่"],["Who reads the alerts and what do they do with them?","ใครอ่านการแจ้งเตือน และนำไปดำเนินการอย่างไร"]],"e":["Threat intelligence subscriptions, advisory handling records","การสมัครรับข้อมูลข่าวกรอง บันทึกการจัดการประกาศเตือน"],"f":["Threat intelligence is early warning from others: government CERTs, industry groups, and vendors. It gives you time to prepare.","ข้อมูลข่าวกรองภัยคุกคามคือการเตือนล่วงหน้าจากผู้อื่น เช่น ศูนย์ CERT ภาครัฐ กลุ่มอุตสาหกรรม และผู้ขาย ช่วยให้มีเวลาเตรียมตัว"],"x":["When ThaiCERT or the NCSA publishes a warning about an active attack, who in your organization receives it and acts on it?","เมื่อ ThaiCERT หรือ สกมช. ออกประกาศเตือนการโจมตีที่กำลังเกิดขึ้น ใครในองค์กรได้รับและนำไปดำเนินการ"]},"ID.RA-03":{"r":["CISO","SOC"],"q":["Are internal and external threats to the organization identified and recorded?","มีการระบุและบันทึกภัยคุกคามภายในและภายนอกต่อองค์กรหรือไม่"],"p":[["What are the top threats you worry about, such as ransomware or insider misuse?","ภัยคุกคามหลักที่กังวลคืออะไร เช่น แรนซัมแวร์หรือการใช้งานผิดวัตถุประสงค์โดยบุคคลภายใน"],["Is there a threat catalog used in risk assessment?","มีบัญชีภัยคุกคามที่ใช้ในการประเมินความเสี่ยงหรือไม่"]],"e":["Threat catalog or threat profile, risk assessment report","บัญชีภัยคุกคาม รายงานการประเมินความเสี่ยง"],"f":["Different organizations face different attackers: criminals after money, insiders, or hacktivists. Knowing yours shapes your defenses.","แต่ละองค์กรเผชิญผู้โจมตีต่างกัน เช่น อาชญากรที่ต้องการเงิน บุคคลภายใน หรือกลุ่มแฮกเกอร์ที่มีแรงจูงใจทางอุดมการณ์ การรู้ว่าองค์กรเผชิญกลุ่มใดช่วยกำหนดการป้องกัน"],"x":["Who would most want to attack your organization, and what would they be after?","ใครน่าจะอยากโจมตีองค์กรของท่านมากที่สุด และเขาต้องการอะไร"]},"ID.RA-04":{"r":["CISO","CRO","SYSOWN"],"q":["How are the likelihood and impact of threats exploiting vulnerabilities assessed?","ประเมินโอกาสและผลกระทบที่ภัยคุกคามจะใช้ช่องโหว่อย่างไร"],"p":[["Do business owners take part in rating impact?","เจ้าของกระบวนการธุรกิจมีส่วนร่วมในการให้คะแนนผลกระทบหรือไม่"],["Is the assessment repeated at least once a year?","มีการประเมินซ้ำอย่างน้อยปีละครั้งหรือไม่"]],"e":["Risk assessment worksheets, workshop records","แบบประเมินความเสี่ยง บันทึกการประชุมเชิงปฏิบัติการ"],"f":["Risk is how likely something is to happen and how bad it would be. Business owners know the impact better than IT.","ความเสี่ยงคือโอกาสที่จะเกิดและความรุนแรงหากเกิด เจ้าของกระบวนการธุรกิจรู้ผลกระทบดีกว่า IT"],"x":["If your billing system were unavailable for a week, how would you estimate the loss? Has anyone asked you that before?","หากระบบเรียกเก็บเงินใช้งานไม่ได้หนึ่งสัปดาห์ ท่านจะประเมินความเสียหายอย่างไร และเคยมีใครถามท่านเรื่องนี้มาก่อนหรือไม่"]},"ID.RA-05":{"r":["CISO","CRO"],"q":["How does the organization combine threats, vulnerabilities, likelihood, and impact to decide which risks to address first?","องค์กรนำภัยคุกคาม ช่องโหว่ โอกาส และผลกระทบ มาประกอบกันเพื่อตัดสินใจว่าจะจัดการความเสี่ยงใดก่อนอย่างไร"],"p":[["Can you show the current top ten cybersecurity risks?","แสดงความเสี่ยงด้านไซเบอร์ 10 อันดับแรกในปัจจุบันได้หรือไม่"],["Is inherent risk recorded separately from residual risk?","บันทึกความเสี่ยงก่อนควบคุมแยกจากความเสี่ยงคงเหลือหรือไม่"]],"e":["Cybersecurity risk register, risk heat map","ทะเบียนความเสี่ยงด้านไซเบอร์ แผนภาพความเสี่ยง"],"f":["Combining threats, weaknesses, likelihood, and impact gives a ranked list of risks. That list should drive the security plan.","การนำภัยคุกคาม จุดอ่อน โอกาส และผลกระทบมารวมกัน จะได้รายการความเสี่ยงที่จัดลำดับแล้ว และรายการนี้ควรเป็นตัวขับเคลื่อนแผนด้านความมั่นคงปลอดภัย"],"x":["What are your top three cyber risks today, and do the current security projects address them?","ความเสี่ยงไซเบอร์ 3 อันดับแรกในวันนี้คืออะไร และโครงการด้านความมั่นคงปลอดภัยปัจจุบันตอบโจทย์ความเสี่ยงเหล่านั้นหรือไม่"]},"ID.RA-06":{"r":["CISO","RISK"],"q":["How are risk responses chosen, planned, tracked, and reported?","เลือก วางแผน ติดตาม และรายงานการตอบสนองความเสี่ยงอย่างไร"],"p":[["Does each risk have a treatment owner and target date?","ความเสี่ยงแต่ละรายการมีเจ้าของแผนจัดการและวันที่เป้าหมายหรือไม่"],["How many treatment actions are overdue?","มีแผนจัดการความเสี่ยงที่เกินกำหนดกี่รายการ"]],"e":["Risk treatment plan, status reports","แผนจัดการความเสี่ยง รายงานความคืบหน้า"],"f":["A risk register is only useful if each risk has an action, an owner, and a date, and someone follows up.","ทะเบียนความเสี่ยงจะมีประโยชน์ก็ต่อเมื่อความเสี่ยงแต่ละเรื่องมีการดำเนินการ เจ้าของ วันที่ และมีคนติดตาม"],"x":["Pick one high risk from last year's assessment. What was done about it, and who checked that it was done?","เลือกความเสี่ยงสูงหนึ่งเรื่องจากการประเมินปีที่แล้ว มีการดำเนินการอะไร และใครตรวจว่าทำแล้ว"]},"ID.RA-07":{"r":["ITM","CISO"],"q":["How are changes and exceptions assessed for security risk, approved, and tracked?","ประเมินความเสี่ยงด้านความมั่นคงปลอดภัย อนุมัติ และติดตามการเปลี่ยนแปลงและการยกเว้นอย่างไร"],"p":[["Does the change advisory board (CAB) review security impact?","คณะกรรมการพิจารณาการเปลี่ยนแปลง (CAB) พิจารณาผลกระทบด้านความมั่นคงปลอดภัยหรือไม่"],["Do exceptions have an expiry date?","การยกเว้นมีวันหมดอายุหรือไม่"]],"e":["Change management procedure, change records, exception register","ขั้นตอนบริหารการเปลี่ยนแปลง บันทึกการเปลี่ยนแปลง ทะเบียนการยกเว้น"],"f":["Many outages and breaches follow an unreviewed change. Exceptions to rules should be temporary and visible.","เหตุระบบล่มและการละเมิดจำนวนมากเกิดหลังการเปลี่ยนแปลงที่ไม่ได้ทบทวน การยกเว้นกฎควรเป็นการชั่วคราวและมองเห็นได้"],"x":["If a vendor asked to open a firewall port 'just for a week', who would approve it, and who would close it afterwards?","หากผู้ขายขอเปิดพอร์ตไฟร์วอลล์ 'แค่หนึ่งสัปดาห์' ใครเป็นผู้อนุมัติ และใครเป็นผู้ปิดหลังจากนั้น"]},"ID.RA-08":{"r":["CISO","DEV"],"q":["Is there a process to receive and respond to vulnerability reports from outside parties?","มีกระบวนการรับและตอบสนองรายงานช่องโหว่จากบุคคลภายนอกหรือไม่"],"p":[["If a researcher found a flaw in your website, how would they contact you?","หากนักวิจัยพบช่องโหว่ในเว็บไซต์ จะติดต่อองค์กรได้อย่างไร"],["Do you track vendor security advisories for products you use?","ติดตามประกาศด้านความมั่นคงปลอดภัยของผู้ขายสำหรับผลิตภัณฑ์ที่ใช้หรือไม่"]],"e":["Vulnerability disclosure policy, security contact page","นโยบายการเปิดเผยช่องโหว่ หน้าช่องทางติดต่อด้านความมั่นคงปลอดภัย"],"f":["Sometimes outsiders find your weaknesses first. A simple reporting channel turns that into a warning instead of a headline.","บางครั้งบุคคลภายนอกพบจุดอ่อนขององค์กรก่อน ช่องทางรับแจ้งง่าย ๆ ช่วยเปลี่ยนเรื่องนั้นเป็นการเตือนแทนที่จะเป็นข่าว"],"x":["If a university student found a flaw in your website and wanted to report it politely, where would they send it?","หากนักศึกษาพบช่องโหว่ในเว็บไซต์และต้องการแจ้งอย่างสุภาพ เขาจะส่งเรื่องไปที่ใด"]},"ID.RA-09":{"r":["ITM","PROC"],"q":["How do you confirm that hardware and software are genuine and unaltered before use?","ยืนยันว่าฮาร์ดแวร์และซอฟต์แวร์เป็นของแท้และไม่ถูกดัดแปลงก่อนใช้งานอย่างไร"],"p":[["Is software downloaded only from official sources and checked against hashes or signatures?","ดาวน์โหลดซอฟต์แวร์จากแหล่งทางการเท่านั้นและตรวจสอบค่าแฮชหรือลายมือชื่อดิจิทัลหรือไม่"],["Is hardware bought only from authorized resellers?","จัดซื้อฮาร์ดแวร์จากตัวแทนจำหน่ายที่ได้รับอนุญาตเท่านั้นหรือไม่"]],"e":["Procurement rules, software approval records","หลักเกณฑ์การจัดซื้อ บันทึกการอนุมัติซอฟต์แวร์"],"f":["Fake or tampered hardware and software can carry hidden malware. Buying from trusted sources reduces that risk.","ฮาร์ดแวร์และซอฟต์แวร์ปลอมหรือที่ถูกดัดแปลงอาจมีมัลแวร์ซ่อนอยู่ การซื้อจากแหล่งที่เชื่อถือได้ช่วยลดความเสี่ยงนี้"],"x":["If a staff member found a cheaper network switch on an online marketplace, could they buy and install it?","หากพนักงานพบสวิตช์เครือข่ายราคาถูกกว่าในตลาดออนไลน์ เขาสามารถซื้อมาติดตั้งเองได้หรือไม่"]},"ID.RA-10":{"r":["PROC","CISO"],"q":["Are critical suppliers assessed for cybersecurity risk before purchase?","มีการประเมินความเสี่ยงด้านไซเบอร์ของผู้ให้บริการสำคัญก่อนจัดซื้อหรือไม่"],"p":[["Show an example assessment for a recent critical purchase.","แสดงตัวอย่างผลการประเมินสำหรับการจัดซื้อสำคัญครั้งล่าสุด"],["Are high-risk findings resolved before signing?","ข้อตรวจพบความเสี่ยงสูงได้รับการแก้ไขก่อนลงนามหรือไม่"]],"e":["Pre-contract supplier risk assessments","ผลการประเมินความเสี่ยงผู้ให้บริการก่อนทำสัญญา"],"f":["Critical suppliers should pass a security check before you depend on them, just as you check their financial health.","ผู้ให้บริการสำคัญควรผ่านการตรวจด้านความมั่นคงปลอดภัยก่อนที่องค์กรจะพึ่งพา เช่นเดียวกับการตรวจฐานะการเงิน"],"x":["For your newest critical supplier, what security information did you see before choosing them?","สำหรับผู้ให้บริการสำคัญรายล่าสุด ท่านเห็นข้อมูลด้านความมั่นคงปลอดภัยอะไรก่อนเลือกเขา"]},"ID.IM-01":{"r":["CISO","IA"],"q":["How are improvements identified from audits, assessments, and reviews, and tracked to completion?","ระบุการปรับปรุงจากการตรวจสอบ การประเมิน และการทบทวน และติดตามจนเสร็จสิ้นอย่างไร"],"p":[["Is there one tracker for all audit and assessment findings?","มีทะเบียนเดียวที่ติดตามข้อตรวจพบจากการตรวจสอบและการประเมินทั้งหมดหรือไม่"],["How many findings from the last audit are still open?","ข้อตรวจพบจากการตรวจสอบครั้งล่าสุดยังเปิดอยู่กี่รายการ"]],"e":["Findings tracker, corrective action plan","ทะเบียนติดตามข้อตรวจพบ แผนปฏิบัติการแก้ไข"],"f":["Audits and assessments only help if their findings are fixed. Open findings that repeat each year are a warning sign.","การตรวจสอบและการประเมินจะมีประโยชน์ก็ต่อเมื่อข้อตรวจพบได้รับการแก้ไข ข้อตรวจพบที่ค้างและซ้ำทุกปีเป็นสัญญาณเตือน"],"x":["Are there audit findings that appeared both last year and this year? Why were they not closed?","มีข้อตรวจพบที่ปรากฏทั้งปีที่แล้วและปีนี้หรือไม่ และทำไมยังไม่ถูกปิด"]},"ID.IM-02":{"r":["CISO","SOC","BCM"],"q":["Are lessons from security tests and exercises turned into improvements?","บทเรียนจากการทดสอบและการฝึกซ้อมด้านความมั่นคงปลอดภัยถูกนำไปปรับปรุงหรือไม่"],"p":[["What changed after the last tabletop exercise or penetration test?","หลังการฝึกซ้อมบนโต๊ะหรือการทดสอบเจาะระบบครั้งล่าสุดมีอะไรเปลี่ยนแปลง"],["Is there an after-action report?","มีรายงานสรุปหลังการฝึกซ้อมหรือไม่"]],"e":["Exercise reports, after-action reports, action tracker","รายงานการฝึกซ้อม รายงานสรุปหลังการฝึกซ้อม ทะเบียนติดตามการดำเนินการ"],"f":["Tests and drills show weaknesses safely. The value comes from what you change afterwards.","การทดสอบและการฝึกซ้อมช่วยแสดงจุดอ่อนอย่างปลอดภัย คุณค่าอยู่ที่สิ่งที่เปลี่ยนแปลงหลังจากนั้น"],"x":["After your last fire drill or IT drill, what did you change because of what you learned?","หลังการซ้อมอพยพหรือซ้อมด้าน IT ครั้งล่าสุด ท่านเปลี่ยนอะไรบ้างจากสิ่งที่ได้เรียนรู้"]},"ID.IM-03":{"r":["CISO","ITM","SOC"],"q":["Are improvements identified from day-to-day operations and incidents?","มีการระบุการปรับปรุงจากการปฏิบัติงานประจำวันและเหตุการณ์ที่เกิดขึ้นหรือไม่"],"p":[["Are lessons-learned meetings held after significant incidents?","มีการประชุมถอดบทเรียนหลังเหตุการณ์สำคัญหรือไม่"],["Are operational metrics reviewed to find recurring problems?","มีการทบทวนตัวชี้วัดการปฏิบัติงานเพื่อหาปัญหาที่เกิดซ้ำหรือไ
