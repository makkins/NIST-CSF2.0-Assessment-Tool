ม่"]],"e":["Lessons-learned records, problem management records","บันทึกการถอดบทเรียน บันทึกการบริหารปัญหา"],"f":["Daily operations and small incidents reveal recurring problems. Fixing root causes prevents the next big incident.","การทำงานประจำวันและเหตุการณ์เล็ก ๆ แสดงให้เห็นปัญหาที่เกิดซ้ำ การแก้ที่ต้นเหตุช่วยป้องกันเหตุการณ์ใหญ่ครั้งถัดไป"],"x":["Is there an IT problem that keeps coming back every few months? Has anyone looked for the root cause?","มีปัญหา IT ที่กลับมาเกิดซ้ำทุกไม่กี่เดือนหรือไม่ และมีใครหาสาเหตุที่แท้จริงหรือไม่"]},"ID.IM-04":{"r":["CISO","BCM","SOC"],"q":["Are the incident response plan and other cybersecurity plans established, communicated, maintained, and improved?","แผนรับมือเหตุการณ์และแผนด้านไซเบอร์อื่นได้รับการจัดทำ สื่อสาร ดูแล และปรับปรุงหรือไม่"],"p":[["When were the plans last updated, and do staff know where to find them during an outage?","แผนปรับปรุงครั้งล่าสุดเมื่อใด และพนักงานทราบหรือไม่ว่าจะหาแผนได้ที่ไหนเมื่อระบบล่ม"],["Are plans tested at least annually?","มีการทดสอบแผนอย่างน้อยปีละครั้งหรือไม่"]],"e":["Incident response plan, BCP, DRP, revision history","แผนรับมือเหตุการณ์ BCP DRP ประวัติการแก้ไข"],"f":["Plans for incidents and outages must be current and known to staff. An old plan in a drawer will not help at 3 a.m.","แผนรับมือเหตุการณ์และเหตุขัดข้องต้องเป็นปัจจุบันและพนักงานรู้จัก แผนเก่าที่เก็บไว้ในลิ้นชักช่วยอะไรไม่ได้ตอนตีสาม"],"x":["If the network went down right now, where would staff find the incident plan, given the plan itself may be on the network?","หากเครือข่ายล่มตอนนี้ พนักงานจะหาแผนรับมือเหตุการณ์ได้ที่ไหน ในเมื่อตัวแผนเองอาจอยู่บนเครือข่าย"]},"PR.AA-01":{"r":["ITM","HR"],"q":["How are user, service, and device identities and credentials created, changed, and removed?","สร้าง เปลี่ยนแปลง และลบตัวตนและข้อมูลยืนยันตัวตนของผู้ใช้ บริการ และอุปกรณ์อย่างไร"],"p":[["How long after resignation is an account disabled? Can you show evidence for a recent leaver?","หลังพนักงานลาออกนานเท่าใดบัญชีจึงถูกระงับ และแสดงหลักฐานของผู้ลาออกล่าสุดได้หรือไม่"],["Are shared and service accounts inventoried with owners?","บัญชีที่ใช้ร่วมกันและบัญชีบริการมีทะเบียนพร้อมเจ้าของหรือไม่"]],"e":["Joiner-mover-leaver procedure, account request records, service account list","ขั้นตอนการรับเข้า เปลี่ยนตำแหน่ง และพ้นสภาพ บันทึกคำขอบัญชี รายการบัญชีบริการ"],"f":["Every person, system, and device that logs in needs its own account, created and removed through a controlled process.","ทุกคน ทุกระบบ และทุกอุปกรณ์ที่เข้าสู่ระบบต้องมีบัญชีของตนเอง และสร้างหรือลบผ่านกระบวนการที่ควบคุมได้"],"x":["If someone resigned last Friday, would their email and system accounts still work today?","หากมีพนักงานลาออกเมื่อวันศุกร์ที่แล้ว วันนี้อีเมลและบัญชีระบบของเขายังใช้ได้อยู่หรือไม่"]},"PR.AA-02":{"r":["ITM","HR"],"q":["How is a person's identity verified before an account or credential is issued or reset?","ยืนยันตัวตนของบุคคลก่อนออกหรือรีเซ็ตบัญชีหรือข้อมูลยืนยันตัวตนอย่างไร"],"p":[["How does the service desk verify a caller who asks for a password reset?","เจ้าหน้าที่ Service Desk ยืนยันตัวตนผู้โทรมาขอรีเซ็ตรหัสผ่านอย่างไร"],["Are contractor identities verified the same way as employees?","ยืนยันตัวตนผู้รับจ้างด้วยวิธีเดียวกับพนักงานหรือไม่"]],"e":["Identity proofing procedure, service desk script","ขั้นตอนการพิสูจน์ตัวตน แนวปฏิบัติของ Service Desk"],"f":["Attackers often call the help desk pretending to be staff. Checking identity before issuing or resetting access stops this.","ผู้โจมตีมักโทรหา Help Desk โดยแอบอ้างเป็นพนักงาน การยืนยันตัวตนก่อนออกหรือรีเซ็ตสิทธิ์ช่วยป้องกันได้"],"x":["If someone phoned the help desk claiming to be you and asked for a password reset, what would the help desk ask before doing it?","หากมีคนโทรหา Help Desk อ้างว่าเป็นท่านและขอรีเซ็ตรหัสผ่าน Help Desk จะถามอะไรก่อนดำเนินการ"]},"PR.AA-03":{"r":["ITM","CISO"],"q":["How are users, services, and devices authenticated, and where is multi-factor authentication (MFA) used?","ยืนยันตัวตนของผู้ใช้ บริการ และอุปกรณ์อย่างไร และใช้การยืนยันตัวตนหลายปัจจัย (MFA) ที่ใดบ้าง"],"p":[["Is MFA enforced for email, remote access, cloud admin, and privileged accounts?","บังคับใช้ MFA กับอีเมล การเข้าถึงระยะไกล ผู้ดูแลคลาวด์ และบัญชีสิทธิ์สูงหรือไม่"],["What is the password standard, and is it technically enforced?","มาตรฐานรหัสผ่านคืออะไร และบังคับใช้ด้วยระบบหรือไม่"]],"e":["MFA coverage report, authentication policy settings","รายงานความครอบคลุม MFA การตั้งค่านโยบายการยืนยันตัวตน"],"f":["Passwords are stolen every day. A second step, such as a code on your phone, blocks most account takeovers.","รหัสผ่านถูกขโมยทุกวัน การยืนยันขั้นที่สอง เช่น รหัสในโทรศัพท์ ช่วยหยุดการยึดบัญชีได้เกือบทั้งหมด"],"x":["If your email password appeared on a hacker forum tonight, what would stop someone from logging in as you?","หากคืนนี้รหัสผ่านอีเมลของท่านไปปรากฏในฟอรัมแฮกเกอร์ อะไรจะหยุดไม่ให้คนอื่นเข้าสู่ระบบในนามท่านได้"]},"PR.AA-04":{"r":["ITM","DEV"],"q":["How are identity assertions, such as single sign-on (SSO) tokens and federation, protected and verified?","ปกป้องและตรวจสอบข้อมูลยืนยันตัวตน เช่น โทเคนการลงชื่อเข้าใช้ครั้งเดียว (SSO) และการเชื่อมโยงตัวตน อย่างไร"],"p":[["Which applications use SSO, and which still use local accounts?","ระบบงานใดใช้ SSO และระบบใดยังใช้บัญชีภายในระบบ"],["Are token lifetimes and signing keys managed?","มีการบริหารอายุโทเคนและกุญแจลงนามหรือไม่"]],"e":["SSO configuration, application integration list","การตั้งค่า SSO รายการระบบที่เชื่อมต่อ"],"f":["Single sign-on lets staff log in once for many systems. The tokens behind it must be protected, or one theft opens every door.","การลงชื่อเข้าใช้ครั้งเดียว (SSO) ช่วยให้พนักงานเข้าสู่ระบบครั้งเดียวแล้วใช้ได้หลายระบบ โทเคนเบื้องหลังต้องได้รับการปกป้อง มิฉะนั้นการขโมยครั้งเดียวจะเปิดได้ทุกประตู"],"x":["How many separate passwords does a typical employee need each day? Which systems still have their own login?","พนักงานทั่วไปต้องใช้รหัสผ่านแยกกันกี่ชุดต่อวัน และระบบใดยังมีการเข้าสู่ระบบแยกของตัวเอง"]},"PR.AA-05":{"r":["ITM","SYSOWN","CISO"],"q":["How are access rights defined, approved, and reviewed, including privileged access?","กำหนด อนุมัติ และทบทวนสิทธิ์การเข้าถึงอย่างไร รวมถึงสิทธิ์สูง"],"p":[["When was the last user access review for a critical system, and what was removed?","ทบทวนสิทธิ์ผู้ใช้ของระบบสำคัญครั้งล่าสุดเมื่อใด และถอนสิทธิ์อะไรไปบ้าง"],["How many domain administrators are there, and is privileged access controlled by a tool?","มีผู้ดูแลโดเมนกี่ราย และควบคุมสิทธิ์สูงด้วยเครื่องมือหรือไม่"]],"e":["Access control standard, access review records, privileged account list","มาตรฐานการควบคุมการเข้าถึง บันทึกการทบทวนสิทธิ์ รายการบัญชีสิทธิ์สูง"],"f":["People should have only the access their job needs. Access grows over time as people change roles, so it must be reviewed.","บุคลากรควรมีสิทธิ์เท่าที่งานต้องใช้ สิทธิ์มักเพิ่มขึ้นเรื่อย ๆ เมื่อคนย้ายตำแหน่ง จึงต้องทบทวนอยู่เสมอ"],"x":["If a nurse or clerk moved to a new department, would they keep access to the old department's data?","หากพยาบาลหรือเจ้าหน้าที่ย้ายไปแผนกใหม่ เขายังเข้าถึงข้อมูลของแผนกเดิมได้อยู่หรือไม่"]},"PR.AA-06":{"r":["FAC","ITM"],"q":["How is physical access to offices, data centers, and equipment rooms controlled and monitored?","ควบคุมและเฝ้าระวังการเข้าถึงทางกายภาพของสำนักงาน ศูนย์ข้อมูล และห้องอุปกรณ์อย่างไร"],"p":[["Who has access to the server room, and is the list reviewed?","ใครมีสิทธิ์เข้าห้องเซิร์ฟเวอร์ และรายชื่อได้รับการทบทวนหรือไม่"],["Are visitors logged and escorted?","ผู้มาติดต่อได้รับการบันทึกและมีผู้นำพาหรือไม่"]],"e":["Access card logs, visitor log, server room access list","บันทึกบัตรผ่าน สมุดผู้มาติดต่อ รายชื่อผู้มีสิทธิ์เข้าห้องเซิร์ฟเวอร์"],"f":["Physical access is the easiest way around technical controls. Anyone who reaches a server can bypass many protections.","การเข้าถึงทางกายภาพเป็นวิธีที่ง่ายที่สุดในการเลี่ยงการควบคุมทางเทคนิค ใครเข้าถึงเซิร์ฟเวอร์ได้ก็ข้ามการป้องกันได้หลายอย่าง"],"x":["Could a contractor in a uniform walk into your server room today without anyone stopping them?","วันนี้ผู้รับเหมาที่ใส่เครื่องแบบเดินเข้าห้องเซิร์ฟเวอร์ได้โดยไม่มีใครหยุดหรือไม่"]},"PR.AT-01":{"r":["HR","CISO"],"q":["What cybersecurity awareness training do all staff receive, and how is it measured?","พนักงานทุกคนได้รับการอบรมสร้างความตระหนักด้านไซเบอร์อะไรบ้าง และวัดผลอย่างไร"],"p":[["What share of staff completed training this year?","ปีนี้พนักงานผ่านการอบรมแล้วสัดส่วนเท่าใด"],["Are phishing simulations run, and what is the click rate trend?","มีการจำลองฟิชชิงหรือไม่ และแนวโน้มอัตราการคลิกเป็นอย่างไร"]],"e":["Training plan, completion records, phishing simulation results","แผนการอบรม บันทึกการผ่านการอบรม ผลการจำลองฟิชชิง"],"f":["Most attacks start with a staff member clicking a link or opening a file. Training turns staff into the first line of defense.","การโจมตีส่วนใหญ่เริ่มจากพนักงานคลิกลิงก์หรือเปิดไฟล์ การอบรมช่วยให้พนักงานเป็นด่านแรกของการป้องกัน"],"x":["If an employee received a fake email from 'the CEO' asking for an urgent transfer, would they know what to do and whom to tell?","หากพนักงานได้รับอีเมลปลอมจาก 'CEO' ขอให้โอนเงินด่วน เขาจะรู้หรือไม่ว่าต้องทำอย่างไรและแจ้งใคร"]},"PR.AT-02":{"r":["CISO","HR","ITM"],"q":["Do people in specialized roles, such as administrators, developers, and executives, receive role-based training?","บุคลากรในบทบาทเฉพาะ เช่น ผู้ดูแลระบบ นักพัฒนา และผู้บริหาร ได้รับการอบรมตามบทบาทหรือไม่"],"p":[["What security training did the IT team receive last year?","ปีที่ผ่านมาทีม IT ได้รับการอบรมด้านความมั่นคงปลอดภัยอะไรบ้าง"],["Is there a skills matrix for security-related roles?","มีตารางทักษะสำหรับบทบาทที่เกี่ยวข้องกับความมั่นคงปลอดภัยหรือไม่"]],"e":["Role-based training records, skills matrix","บันทึกการอบรมตามบทบาท ตารางทักษะ"],"f":["Administrators, developers, and executives face targeted attacks and hold more power, so they need training for their role.","ผู้ดูแลระบบ นักพัฒนา และผู้บริหาร เผชิญการโจมตีแบบเจาะจงและมีอำนาจมากกว่า จึงต้องได้รับการอบรมตามบทบาท"],"x":["When did your IT administrators last receive security training specific to their work, not the general staff course?","ผู้ดูแลระบบ IT ได้รับการอบรมด้านความมั่นคงปลอดภัยเฉพาะงานของตน ไม่ใช่หลักสูตรพนักงานทั่วไป ครั้งล่าสุดเมื่อใด"]},"PR.DS-01":{"r":["ITM","DPO"],"q":["How is stored data protected, for example with encryption, access control, and integrity checks?","ปกป้องข้อมูลที่จัดเก็บอย่างไร เช่น การเข้ารหัส การควบคุมการเข้าถึง และการตรวจสอบความถูกต้อง"],"p":[["Are laptops, mobile devices, and databases with sensitive data encrypted?","โน้ตบุ๊ก อุปกรณ์เคลื่อนที่ และฐานข้อมูลที่มีข้อมูลสำคัญได้รับการเข้ารหัสหรือไม่"],["Is there data loss prevention (DLP) or control over USB storage?","มีระบบป้องกันข้อมูลรั่วไหล (DLP) หรือการควบคุมอุปกรณ์ USB หรือไม่"]],"e":["Encryption standard, encryption status report, DLP policy","มาตรฐานการเข้ารหัส รายงานสถานะการเข้ารหัส นโยบาย DLP"],"f":["Stored data, on laptops, servers, or USB drives, should be unreadable to anyone who steals the device.","ข้อมูลที่จัดเก็บ ไม่ว่าในโน้ตบุ๊ก เซิร์ฟเวอร์ หรือ USB ควรอ่านไม่ได้สำหรับผู้ที่ขโมยอุปกรณ์ไป"],"x":["If a manager's laptop were stolen from a car tonight, could the thief read the files on it?","หากโน้ตบุ๊กของผู้จัดการถูกขโมยจากรถคืนนี้ ผู้ขโมยจะอ่านไฟล์ในเครื่องได้หรือไม่"]},"PR.DS-02":{"r":["ITM"],"q":["How is data protected while it moves across networks, including email and file transfers?","ปกป้องข้อมูลระหว่างการส่งผ่านเครือข่ายอย่างไร รวมถึงอีเมลและการโอนไฟล์"],"p":[["Is TLS enforced on websites, APIs, and email?","บังคับใช้ TLS กับเว็บไซต์ API และอีเมลหรือไม่"],["How do staff send sensitive files to external parties?","พนักงานส่งไฟล์สำคัญให้บุคคลภายนอกอย่างไร"]],"e":["Cryptography standard, TLS configuration, secure file transfer tool","มาตรฐานการเข้ารหัสลับ การตั้งค่า TLS เครื่องมือโอนไฟล์อย่างปลอดภัย"],"f":["Data sent over networks or email can be intercepted. Encryption keeps it private on the way.","ข้อมูลที่ส่งผ่านเครือข่ายหรืออีเมลอาจถูกดักได้ การเข้ารหัสช่วยรักษาความลับระหว่างทาง"],"x":["When staff send a file of patient or customer records to an outside partner, how do they send it today?","เมื่อพนักงานส่งไฟล์ข้อมูลผู้รับบริการหรือลูกค้าให้คู่ค้าภายนอก ปัจจุบันส่งด้วยวิธีใด"]},"PR.DS-10":{"r":["ITM","DEV"],"q":["How is data protected while in use, for example on screens, in memory, and in shared sessions?","ปกป้องข้อมูลขณะใช้งานอย่างไร เช่น บนหน้าจอ ในหน่วยความจำ และในเซสชันที่ใช้ร่วมกัน"],"p":[["Are screen locks and session timeouts enforced?","บังคับใช้การล็อกหน้าจอและการหมดเวลาเซสชันหรือไม่"],["Is sensitive data masked in applications and reports?","มีการปิดบังข้อมูลสำคัญในระบบงานและรายงานหรือไม่"]],"e":["Endpoint configuration baseline, application masking rules","ค่ามาตรฐานการตั้งค่าเครื่องลูกข่าย กฎการปิดบังข้อมูลในระบบงาน"],"f":["Data on screen or in use can be seen or copied. Screen locks and masking reduce casual exposure.","ข้อมูลบนหน้าจอหรือที่กำลังใช้งานอาจถูกมองเห็นหรือคัดลอก การล็อกหน้าจอและการปิดบังข้อมูลช่วยลดการเปิดเผยโดยไม่ตั้งใจ"],"x":["If a staff member left their desk with a patient or customer record open, how long until the screen locks?","หากพนักงานลุกจากโต๊ะโดยเปิดข้อมูลผู้รับบริการหรือลูกค้าทิ้งไว้ หน้าจอจะล็อกภายในเวลาเท่าใด"]},"PR.DS-11":{"r":["ITM","BCM"],"q":["How are backups created, protected from tampering or ransomware, and tested by restoring?","สร้าง ปกป้องจากการดัดแปลงหรือแรนซัมแวร์ และทดสอบการกู้คืนข้อมูลสำรองอย่างไร"],"p":[["Is there an offline or immutable backup copy?","มีสำเนาข้อมูลสำรองแบบออฟไลน์หรือแก้ไขไม่ได้หรือไม่"],["When was the last full restore test of a critical system, and did it meet the RTO?","ทดสอบกู้คืนระบบสำคัญเต็มรูปแบบครั้งล่าสุดเมื่อใด และเป็นไปตาม RTO หรือไม่"]],"e":["Backup standard, backup job reports, restore test records","มาตรฐานการสำรองข้อมูล รายงานงานสำรองข้อมูล บันทึกการทดสอบกู้คืน"],"f":["Backups are the last line of defense against ransomware. Attackers now try to delete backups first, so backups must be protected and tested.","ข้อมูลสำรองเป็นด่านสุดท้ายในการรับมือแรนซัมแวร์ ปัจจุบันผู้โจมตีพยายามลบข้อมูลสำรองก่อน จึงต้องปกป้องและทดสอบข้อมูลสำรอง"],"x":["If ransomware encrypted every server tonight, including the backup server, how many days of data would you lose, and how long would it take to be back?","หากคืนนี้แรนซัมแวร์เข้ารหัสทุกเซิร์ฟเวอร์ รวมถึงเซิร์ฟเวอร์สำรองข้อมูล องค์กรจะสูญเสียข้อมูลกี่วัน และต้องใช้เวลานานเท่าใดจึงกลับมาใช้งานได้"]},"PR.PS-01":{"r":["ITM"],"q":["Are secure configuration baselines defined and applied to servers, endpoints, network devices, and cloud?","มีการกำหนดและใช้ค่ามาตรฐานการตั้งค่าที่ปลอดภัยกับเซิร์ฟเวอร์ เครื่องลูกข่าย อุปกรณ์เครือข่าย และคลาวด์หรือไม่"],"p":[["Which benchmark is used, such as CIS Benchmarks?","ใช้เกณฑ์อ้างอิงใด เช่น CIS Benchmarks"],["How is configuration drift detected?","ตรวจพบการตั้งค่าที่เบี่ยงเบนไปจากมาตรฐานอย่างไร"]],"e":["Hardening standard, configuration compliance report","มาตรฐานการตั้งค่าความปลอดภัย รายงานการปฏิบัติตามการตั้งค่า"],"f":["Systems come with insecure default settings. A standard secure setup, applied everywhere, closes many easy doors.","ระบบมักมาพร้อมการตั้งค่าเริ่มต้นที่ไม่ปลอดภัย การตั้งค่ามาตรฐานที่ปลอดภัยและใช้ทุกเครื่องช่วยปิดช่องทางง่าย ๆ ได้มาก"],"x":["If IT set up a new server today, would it follow a written secure checklist, or depend on who installs it?","หากวันนี้ IT ติดตั้งเซิร์ฟเวอร์ใหม่ จะทำตามรายการตรวจสอบที่ปลอดภัยเป็นลายลักษณ์อักษร หรือขึ้นกับว่าใครเป็นผู้ติดตั้ง"]},"PR.PS-02":{"r":["ITM","SYSOWN"],"q":["How is software patched, upgraded, and removed based on risk?","แพตช์ อัปเกรด และถอนการติดตั้งซอฟต์แวร์ตามระดับความเสี่ยงอย่างไร"],"p":[["What is the patch timeline for critical vulnerabilities, and what is the current compliance rate?","กำหนดเวลาแพตช์ช่องโหว่ระดับวิกฤตคือเท่าใด และอัตราการปฏิบัติตามปัจจุบันเป็นเท่าใด"],["Which unsupported operating systems or applications are still in use?","ยังใช้ระบบปฏิบัติการหรือระบบงานที่หมดการสนับสนุนใดอยู่บ้าง"]],"e":["Patch management procedure, patch compliance report, end-of-support list","ขั้นตอนบริหารแพตช์ รายงานการแพตช์ รายการซอฟต์แวร์หมดการสนับสนุน"],"f":["Most attacks use weaknesses that already have a fix available. Timely updates close them.","การโจมตีส่วนใหญ่ใช้จุดอ่อนที่มีแพตช์แก้ไขแล้ว การอัปเดตตามเวลาช่วยปิดจุดอ่อนเหล่านั้น"],"x":["If Microsoft released an urgent security fix today, how many days until all your servers had it?","หากวันนี้ Microsoft ออกแพตช์ด่วนด้านความมั่นคงปลอดภัย ต้องใช้กี่วันจึงจะติดตั้งครบทุกเซิร์ฟเวอร์"]},"PR.PS-03":{"r":["ITM","FAC"],"q":["How is hardware maintained, replaced, and removed based on risk?","บำรุงรักษา เปลี่ยน และปลดระวางฮาร์ดแวร์ตามระดับความเสี่ยงอย่างไร"],"p":[["Is firmware updated on network devices and servers?","มีการปรับปรุงเฟิร์มแวร์ของอุปกรณ์เครือข่ายและเซิร์ฟเวอร์หรือไม่"],["Is there a hardware refresh plan for devices past vendor support?","มีแผนทดแทนฮาร์ดแวร์ที่หมดการสนับสนุนจากผู้ขายหรือไม่"]],"e":["Maintenance contracts, firmware records, refresh plan","สัญญาบำรุงรักษา บันทึกเฟิร์มแวร์ แผนทดแทนอุปกรณ์"],"f":["Old hardware fails more often and may no longer get security fixes.","ฮาร์ดแวร์เก่าเสียบ่อยกว่าและอาจไม่ได้รับแพตช์ด้านความมั่นคงปลอดภัยแล้ว"],"x":["Which of your key network devices or servers are past their vendor support date?","อุปกรณ์เครือข่ายหรือเซิร์ฟเวอร์หลักตัวใดที่หมดระยะการสนับสนุนจากผู้ขายแล้ว"]},"PR.PS-04":{"r":["ITM","SOC"],"q":["Which systems generate security logs, and are the logs centralized and retained?","ระบบใดสร้างบันทึกด้านความมั่นคงปลอดภัย และบันทึกถูกรวมศูนย์และเก็บรักษาไว้หรือไม่"],"p":[["Are logs kept at least 90 days as required by the Computer Crime Act s.26 where it applies?","เก็บบันทึกอย่างน้อย 90 วันตาม พ.ร.บ.คอมพิวเตอร์ฯ มาตรา 26 ในกรณีที่ใช้บังคับหรือไม่"],["Are logs protected from change or deletion?","บันทึกได้รับการปกป้องจากการแก้ไขหรือลบหรือไม่"]],"e":["Logging standard, log source list, SIEM retention settings","มาตรฐานการบันทึก รายการแหล่งบันทึก การตั้งค่าการเก็บรักษาใน SIEM"],"f":["Logs are the security camera footage of IT. Without them, you cannot tell what happened during an incident.","บันทึก (Log) เปรียบเหมือนภาพจากกล้องวงจรปิดของ IT หากไม่มี จะไม่รู้ว่าเกิดอะไรขึ้นระหว่างเหตุการณ์"],"x":["If you discovered that someone accessed payroll data last month, could IT tell you who it was and from where?","หากพบว่ามีคนเข้าถึงข้อมูลเงินเดือนเมื่อเดือนที่แล้ว IT บอกได้หรือไม่ว่าเป็นใครและเข้าจากที่ใด"]},"PR.PS-05":{"r":["ITM"],"q":["How is installation and execution of unauthorized software prevented?","ป้องกันการติดตั้งและเรียกใช้ซอฟต์แวร์ที่ไม่ได้รับอนุญาตอย่างไร"],"p":[["Do standard users have local administrator rights?","ผู้ใช้ทั่วไปมีสิทธิ์ผู้ดูแลเครื่องหรือไม่"],["Is application allowlisting or endpoint detection and response (EDR) used?","ใช้การอนุญาตเฉพาะโปรแกรมที่กำหนดหรือระบบตรวจจับและตอบสนองที่เครื่องลูกข่าย (EDR) หรือไม่"]],"e":["Endpoint policy, local admin report, EDR coverage","นโยบายเครื่องลูกข่าย รายงานสิทธิ์ผู้ดูแลเครื่อง ความครอบคลุม EDR"],"f":["Unapproved software is a common way malware gets in. Limiting who can install software blocks much of it.","ซอฟต์แวร์ที่ไม่ได้รับอนุญาตเป็นช่องทางที่มัลแวร์เข้ามาบ่อย การจำกัดผู้ที่ติดตั้งซอฟต์แวร์ได้ช่วยป้องกันได้มาก"],"x":["If an employee downloaded a free PDF converter from the internet, could they install it on their work computer?","หากพนักงานดาวน์โหลดโปรแกรมแปลงไฟล์ PDF ฟรีจากอินเทอร์เน็ต เขาติดตั้งบนคอมพิวเตอร์ที่ทำงานได้หรือไม่"]},"PR.PS-06":{"r":["DEV","CISO"],"q":["Are secure software development practices built into in-house and outsourced development?","มีการนำแนวปฏิบัติการพัฒนาซอฟต์แวร์อย่างปลอดภัยมาใช้กับการพัฒนาภายในและการจ้างพัฒนาหรือไม่"],"p":[["Is code reviewed or scanned for security issues before release?","มีการทบทวนหรือสแกนโค้ดหาปัญหาความมั่นคงปลอดภัยก่อนเผยแพร่หรือไม่"],["Are development, test, and production environments separated?","แยกสภาพแวดล้อมการพัฒนา ทดสอบ และใช้งานจริงหรือไม่"]],"e":["Secure development standard, code scan reports, release checklist","มาตรฐานการพัฒนาอย่างปลอดภัย รายงานการสแกนโค้ด รายการตรวจสอบก่อนเผยแพร่"],"f":["Software built in-house or by contractors can carry security flaws. Checking early is cheaper than fixing after launch.","ซอฟต์แวร์ที่พัฒนาเองหรือจ้างพัฒนาอาจมีจุดอ่อนด้านความมั่นคงปลอดภัย การตรวจตั้งแต่แรกถูกกว่าการแก้หลังเปิดใช้"],"x":["Before your last application went live, did anyone test it for security, or only check that it worked?","ก่อนเปิดใช้ระบบงานครั้งล่าสุด มีใครทดสอบด้านความมั่นคงปลอดภัยหรือไม่ หรือตรวจเพียงว่าใช้งานได้"]},"PR.IR-01":{"r":["ITM"],"q":["How is the network protected from unauthorized access, for example with segmentation, firewalls, and remote access controls?","ปกป้องเครือข่ายจากการเข้าถึงโดยไม่ได้รับอนุญาตอย่างไร เช่น การแบ่งส่วนเครือข่าย ไฟร์วอลล์ และการควบคุมการเข้าถึงระยะไกล"],"p":[["Are critical systems, medical devices, or OT separated from the user network?","ระบบสำคัญ อุปกรณ์การแพทย์ หรือ OT ถูกแยกจากเครือข่ายผู้ใช้หรือไม่"],["When were firewall rules last reviewed?","ทบทวนกฎไฟร์วอลล์ครั้งล่าสุดเมื่อใด"]],"e":["Network security standard, segmentation design, firewall rule review","มาตรฐานความมั่นคงปลอดภัยเครือข่าย การออกแบบการแบ่งส่วน ผลการทบทวนกฎไฟร์วอลล์"],"f":["A flat network lets an attacker move from one infected computer to every system. Separating the network contains the damage.","เครือข่ายที่ไม่แบ่งส่วนทำให้ผู้โจมตีเคลื่อนจากเครื่องที่ติดมัลแวร์หนึ่งเครื่องไปถึงทุกระบบได้ การแบ่งส่วนเครือข่ายช่วยจำกัดความเสียหาย"],"x":["If a guest Wi-Fi user or a medical device were infected, could it reach your main database servers?","หากผู้ใช้ Wi-Fi สำหรับผู้มาติดต่อหรืออุปกรณ์การแพทย์ติดมัลแวร์ จะเข้าถึงเซิร์ฟเวอร์ฐานข้อมูลหลักได้หรือไม่"]},"PR.IR-02":{"r":["FAC","ITM"],"q":["How are data centers and equipment rooms protected from fire, flood, power loss, and heat?","ปกป้องศูนย์ข้อมูลและห้องอุปกรณ์จากไฟไหม้ น้ำท่วม ไฟฟ้าดับ และความร้อนอย่างไร"],"p":[["Are UPS, generator, cooling, and fire suppression tested?","มีการทดสอบ UPS เครื่องกำเนิดไฟฟ้า ระบบทำความเย็น และระบบดับเพลิงหรือไม่"],["Is the server room monitored for temperature and water?","ห้องเซิร์ฟเวอร์มีการเฝ้าระวังอุณหภูมิและน้ำรั่วหรือไม่"]],"e":["Facility maintenance and test records","บันทึกการบำรุงรักษาและทดสอบอาคารสถานที่"],"f":["Fire, flood, heat, and power loss can take down IT as surely as hackers.","ไฟไหม้ น้ำท่วม ความร้อน และไฟฟ้าดับ ทำให้ระบบ IT ล่มได้ไม่ต่างจากแฮกเกอร์"],"x":["If the air conditioning in the server room failed on a Saturday night, who would know, and how fast?","หากเครื่องปรับอากาศในห้องเซิร์ฟเวอร์เสียคืนวันเสาร์ ใครจะรู้ และรู้เร็วเพียงใด"]},"PR.IR-03":{"r":["ITM","BCM"],"q":["What redundancy and failover exist for critical systems to meet resilience requirements?","มีระบบสำรองและการสลับการทำงานใดสำหรับระบบสำคัญเพื่อให้เป็นไปตามข้อกำหนดด้านความยืดหยุ่น"],"p":[["Is there a disaster recovery site, and has failover been tested?","มีศูนย์สำรองหรือไม่ และเคยทดสอบการสลับการทำงานหรือไม่"],["Which single points of failure are known?","ทราบจุดล้มเหลวเดี่ยวใดบ้าง"]],"e":["DR architecture, failover test reports","สถาปัตยกรรมการกู้คืน รายงานการทดสอบการสลับการทำงาน"],"f":["Critical services need a backup path: a second server, a second site, or a manual workaround, so one failure does not stop the business.","บริการสำคัญต้องมีทางสำรอง เช่น เซิร์ฟเวอร์ที่สอง ศูนย์สำรอง หรือวิธีทำงานด้วยมือ เพื่อไม่ให้ความล้มเหลวจุดเดียวหยุดธุรกิจ"],"x":["If your main data center were unusable for three days, where would your critical systems run?","หากศูนย์ข้อมูลหลักใช้งานไม่ได้ 3 วัน ระบบสำคัญจะทำงานที่ใด"]},"PR.IR-04":{"r":["ITM"],"q":["How is capacity monitored and planned so systems stay available?","เฝ้าระวังและวางแผนขีดความสามารถอย่างไรเพื่อให้ระบบพร้อมใช้งาน"],"p":[["Do you get alerts before storage, CPU, or bandwidth run out?","ได้รับการแจ้งเตือนก่อนพื้นที่จัดเก็บ CPU หรือแบนด์วิดท์เต็มหรือไม่"],["Is there protection against denial-of-service (DoS) attacks for internet services?","มีการป้องกันการโจมตีแบบปฏิเสธการให้บริการ (DoS) สำหรับบริการบนอินเทอร์เน็ตหรือไม่"]],"e":["Capacity reports, monitoring dashboards","รายงานขีดความสามารถ แดชบอร์ดการเฝ้าระวัง"],"f":["Systems slow down or stop when storage, processing, or bandwidth runs out. Monitoring capacity prevents surprise outages.","ระบบจะช้าหรือหยุดเมื่อพื้นที่จัดเก็บ การประมวลผล หรือแบนด์วิดท์ไม่พอ การเฝ้าระวังขีดความสามารถช่วยป้องกันระบบล่มแบบไม่คาดคิด"],"x":["Have you had a system slow down or stop because a disk was full or the internet link was overloaded?","เคยมีระบบช้าหรือหยุดเพราะดิสก์เต็มหรืออินเทอร์เน็ตเกินกำลังหรือไม่"]},"DE.CM-01":{"r":["SOC","ITM"],"q":["How are networks and network services monitored for suspicious activity?","เฝ้าระวังเครือข่ายและบริการเครือข่ายเพื่อหากิจกรรมที่น่าสงสัยอย่างไร"],"p":[["Who watches the alerts outside office hours?","ใครเฝ้าดูการแจ้งเตือนนอกเวลาทำการ"],["Are firewall, VPN, and DNS logs monitored?","มีการเฝ้าระวังบันทึกของไฟร์วอลล์ VPN และ DNS หรือไม่"]],"e":["Monitoring procedure, SIEM or MSSP reports, alert samples","ขั้นตอนการเฝ้าระวัง รายงานจาก SIEM หรือ MSSP ตัวอย่างการแจ้งเตือน"],"f":["Attackers often stay inside a network for weeks before striking. Watching network activity is how you catch them early.","ผู้โจมตีมักแฝงอยู่ในเครือข่ายหลายสัปดาห์ก่อนลงมือ การเฝ้าดูกิจกรรมบนเครือข่ายช่วยจับได้ตั้งแต่เนิ่น ๆ"],"x":["If an attacker were copying data out of your network at 2 a.m. tonight, who would notice, and when?","หากคืนนี้ตีสองผู้โจมตีกำลังคัดลอกข้อมูลออกจากเครือข่าย ใครจะสังเกตเห็น และเมื่อใด"]},"DE.CM-02":{"r":["FAC"],"q":["Is the physical environment monitored, for example with CCTV, door alarms, and access logs?","มีการเฝ้าระวังสภาพแวดล้อมทางกายภาพหรือไม่ เช่น กล้องวงจรปิด สัญญาณเตือนประตู และบันทึกการเข้าออก"],"p":[["Are alerts from restricted areas reviewed?","มีการตรวจสอบการแจ้งเตือนจากพื้นที่หวงห้ามหรือไม่"],["How long is CCTV footage kept?","เก็บภาพกล้องวงจรปิดไว้นานเท่าใด"]],"e":["CCTV coverage plan, alarm logs","แผนการติดตั้งกล้องวงจรปิด บันทึกสัญญาณเตือน"],"f":["Cameras, door alarms, and access logs detect physical intrusion, which can lead to IT compromise.","กล้องวงจรปิด สัญญาณเตือนประตู และบันทึกการเข้าออก ช่วยตรวจจับการบุกรุกทางกายภาพซึ่งอาจนำไปสู่การบุกรุกระบบ IT"],"x":["If someone entered a restricted room at night, would anyone be alerted, or would you only see it on video later?","หากมีคนเข้าห้องหวงห้ามตอนกลางคืน จะมีการแจ้งเตือนใครหรือไม่ หรือจะเห็นจากวิดีโอภายหลังเท่านั้น"]},"DE.CM-03":{"r":["SOC","ITM","HR"],"q":["Is user activity monitored to detect misuse, such as unusual logins or mass downloads?","มีการเฝ้าระวังกิจกรรมของผู้ใช้เพื่อตรวจจับการใช้งานผิดวัตถุประสงค์หรือไม่ เช่น การเข้าสู่ระบบผิดปกติหรือการดาวน์โหลดจำนวนมาก"],"p":[["Are privileged account activities reviewed?","มีการทบทวนกิจกรรมของบัญชีสิทธิ์สูงหรือไม่"],["Are staff informed that activity is monitored?","พนักงานได้รับแจ้งว่ามีการเฝ้าระวังกิจกรรมหรือไม่"]],"e":["User activity monitoring rules, privileged activity reviews","กฎการเฝ้าระวังกิจกรรมผู้ใช้ ผลการทบทวนกิจกรรมสิทธิ์สูง"],"f":["Unusual user behavior, such as logins at odd hours or large downloads, can signal a stolen account or an insider.","พฤติกรรมผู้ใช้ที่ผิดปกติ เช่น เข้าสู่ระบบในเวลาแปลก ๆ หรือดาวน์โหลดจำนวนมาก อาจเป็นสัญญาณของบัญชีที่ถูกขโมยหรือบุคคลภายใน"],"x":["If an employee downloaded thousands of customer records the week before resigning, would anyone notice?","หากพนักงานดาวน์โหลดข้อมูลลูกค้าหลายพันรายการในสัปดาห์ก่อนลาออก จะมีใครสังเกตเห็นหรือไม่"]},"DE.CM-06":{"r":["SOC","PROC","ITM"],"q":["Are supplier and service provider activities on your systems monitored?","มีการเฝ้าระวังกิจกรรมของผู้ให้บริการบนระบบขององค์กรหรือไม่"],"p":[["Is vendor remote access recorded and approved per session?","การเข้าถึงระยะไกลของผู้ขายได้รับการบันทึกและอนุมัติเป็นรายครั้งหรือไม่"],["Do you review cloud provider security alerts?","มีการตรวจสอบการแจ้งเตือนด้านความมั่นคงปลอดภัยจากผู้ให้บริการคลาวด์หรือไม่"]],"e":["Vendor access logs, session recordings, cloud security alerts","บันทึกการเข้าถึงของผู้ขาย การบันทึกเซสชัน การแจ้งเตือนจากคลาวด์"],"f":["Suppliers with access to your systems should be watched like your own staff, because their accounts are attractive targets.","ผู้ให้บริการที่เข้าถึงระบบขององค์กรควรถูกเฝ้าระวังเหมือนพนักงานขององค์กรเอง เพราะบัญชีของเขาเป็นเป้าหมายที่น่าสนใจ"],"x":["If a vendor logged in remotely on a Sunday without being asked, would you know?","หากผู้ขายเข้าสู่ระบบจากระยะไกลในวันอาทิตย์โดยไม่มีใครเรียก องค์กรจะรู้หรือไม่"]},"DE.CM-09":{"r":["SOC","ITM"],"q":["Are endpoints, servers, applications, and cloud workloads monitored for malicious activity?","มีการเฝ้าระวังเครื่องลูกข่าย เซิร์ฟเวอร์ ระบบงาน และคลาวด์เพื่อหากิจกรรมที่เป็นอันตรายหรือไม่"],"p":[["What share of endpoints and servers run antimalware or EDR?","เครื่องลูกข่ายและเซิร์ฟเวอร์ติดตั้ง Antimalware หรือ EDR แล้วสัดส่วนเท่าใด"],["Are email and web traffic filtered?","มีการกรองอีเมลและการใช้งานเว็บหรือไม่"]],"e":["EDR coverage report, email security reports","รายงานความครอบคลุม EDR รายงานความมั่นคงปลอดภัยอีเมล"],"f":["Antivirus and endpoint tools detect malware on computers and servers. They only help if they cover every device and someone reads the alerts.","Antivirus และเครื่องมือป้องกันเครื่องลูกข่ายช่วยตรวจจับมัลแวร์บนคอมพิวเตอร์และเซิร์ฟเวอร์ แต่จะได้ผลก็ต่อเมื่อครอบคลุมทุกเครื่องและมีคนอ่านการแจ้งเตือน"],"x":["If antivirus flagged malware on a computer in accounting right now, who would receive that alert?","หาก Antivirus แจ้งเตือนมัลแวร์บนคอมพิวเตอร์ฝ่ายบัญชีตอนนี้ ใครจะได้รับการแจ้งเตือนนั้น"]},"DE.AE-02":{"r":["SOC"],"q":["How are alerts analyzed to understand what is happening?","วิเคราะห์การแจ้งเตือนอย่างไรเพื่อทำความเข้าใจสิ่งที่เกิดขึ้น"],"p":[["Walk me through how the last alert was investigated.","อธิบายขั้นตอนการตรวจสอบการแจ้งเตือนครั้งล่าสุด"],["Are there written triage steps or use cases?","มีขั้นตอนการคัดกรองหรือกรณีการใช้งานที่เป็นลายลักษณ์อักษรหรือไม่"]],"e":["Alert triage procedure, SIEM use case list, ticket samples","ขั้นตอนการคัดกรองการแจ้งเตือน รายการกรณีการใช้งานใน SIEM ตัวอย่างตั๋วงาน"],"f":["An alert is only a clue. Someone must investigate to decide whether it is harmless or the start of an attack.","การแจ้งเตือนเป็นเพียงเบาะแส ต้องมีคนตรวจสอบเพื่อตัดสินว่าไม่มีอันตรายหรือเป็นจุดเริ่มต้นของการโจมตี"],"x":["Tell me about the last security alert your team investigated. What did they check, and how did they decide?","เล่าถึงการแจ้งเตือนด้านความมั่นคงปลอดภัยครั้งล่าสุดที่ทีมตรวจสอบ ทีมตรวจอะไร และตัดสินอย่างไร"]},"DE.AE-03":{"r":["SOC"],"q":["Is information from multiple sources correlated, for example in a security information and event management (SIEM) system?","มีการเชื่อมโยงข้อมูลจากหลายแหล่งหรือไม่ เช่น ในระบบบริหารจัดการข้อมูลและเหตุการณ์ด้านความมั่นคงปลอดภัย (SIEM)"],"p":[["Which log sources feed the SIEM?","แหล่งบันทึกใดส่งข้อมูลเข้า SIEM"],["Are correlation rules tuned and reviewed?","มีการปรับและทบทวนกฎการเชื่อมโยงหรือไม่"]],"e":["SIEM source list, correlation rules","รายการแหล่งข้อมูล SIEM กฎการเชื่อมโยง"],"f":["One alert alone may look harmless. Combining logs from many systems shows the full story of an attack.","การแจ้งเตือนเดียวอาจดูไม่มีอะไร การนำบันทึกจากหลายระบบมารวมกันช่วยให้เห็นเรื่องราวทั้งหมดของการโจมตี"],"x":["If a failed login on the VPN and a strange file on a server happened together, would anyone connect the two?","หากมีการเข้าสู่ VPN ไม่สำเร็จและพบไฟล์แปลกบนเซิร์ฟเวอร์ในเวลาเดียวกัน จะมีใครเชื่อมโยงสองเรื่องนี้หรือไม่"]},"DE.AE-04":{"r":["SOC","CISO"],"q":["How does the team estimate the impact and scope of a security event?","ทีมประเมินผลกระทบและขอบเขตของเหตุการณ์ด้านความมั่นคงปลอดภัยอย่างไร"],"p":[["Does the analyst know which assets are critical when assessing impact?","ผู้วิเคราะห์ทราบหรือไม่ว่าทรัพย์สินใดสำคัญเมื่อประเมินผลกระทบ"],["Are business owners consulted?","มีการปรึกษาเจ้าของกระบวนการธุรกิจหรือไม่"]],"e":["Impact assessment criteria, incident tickets","เกณฑ์การประเมินผลกระทบ ตั๋วงานเหตุการณ์"],"f":["Knowing how big an event is decides how hard to respond: one infected laptop is different from a compromised server.","การรู้ขนาดของเหตุการณ์เป็นตัวกำหนดระดับการรับมือ โน้ตบุ๊กติดมัลแวร์เครื่องเดียวต่างจากเซิร์ฟเวอร์ที่ถูกยึด"],"x":["If malware were found on one computer, how would the team check whether it had spread elsewhere?","หากพบมัลแวร์บนคอมพิวเตอร์เครื่องหนึ่ง ทีมจะตรวจอย่างไรว่าแพร่ไปเครื่องอื่นแล้วหรือไม่"]},"DE.AE-06":{"r":["SOC","CISO"],"q":["How is information about security events passed to the right people and tools?","ส่งข้อมูลเกี่ยวกับเหตุการณ์ด้านความมั่นคงปลอดภัยไปยังบุคคลและเครื่องมือที่เหมาะสมอย่างไร"],"p":[["How does the MSSP or monitoring team notify you, and how fast?","MSSP หรือทีมเฝ้าระวังแจ้งองค์กรอย่างไร และเร็วเพียงใด"],["Is there an on-call list?","มีรายชื่อผู้รับผิดชอบตามเวรหรือไม่"]],"e":["Notification matrix, on-call roster, MSSP SLA","ตารางการแจ้ง ตารางเวร SLA ของ MSSP"],"f":["Alerts must reach the right person quickly, including outside office hours.","การแจ้งเตือนต้องไปถึงคนที่ใช่อย่างรวดเร็ว รวมถึงนอกเวลาทำการ"],"x":["If your monitoring provider detected an attack at midnight, whose phone would ring?","หากผู้ให้บริการเฝ้าระวังตรวจพบการโจมตีตอนเที่ยงคืน โทรศัพท์ของใครจะดัง"]},"DE.AE-07":{"r":["SOC"],"q":["Is threat intelligence and business context used when analyzing alerts?","มีการใช้ข้อมูลข่าวกรองภัยคุกคามและบริบททางธุรกิจในการวิเคราะห์การแจ้งเตือนหรือไม่"],"p":[["Are indicators of compromise (IOC) loaded into security tools?","มีการนำตัวบ่งชี้การถูกบุกรุก (IOC) เข้าเครื่องมือด้านความมั่นคงปลอดภัยหรือไม่"],["Does the analyst see asset owner and criticality in the alert?","ผู้วิเคราะห์เห็นเจ้าของและระดับความสำคัญของทรัพย์สินในการแจ้งเตือนหรือไม่"]],"e":["Threat intelligence integration, enriched alert samples","การเชื่อมต่อข้อมูลข่าวกรอง ตัวอย่างการแจ้งเตือนที่เพิ่มบริบท"],"f":["Knowing what attackers are doing elsewhere, and which systems matter most here, helps analysts judge alerts correctly.","การรู้ว่าผู้โจมตีกำลังทำอะไรที่อื่น และระบบใดสำคัญที่สุดในองค์กร ช่วยให้ผู้วิเคราะห์ตัดสินการแจ้งเตือนได้ถูกต้อง"],"x":["When an alert comes in, does the analyst know whether the affected server is critical to the business?","เมื่อมีการแจ้งเตือนเข้ามา ผู้วิเคราะห์รู้หรือไม่ว่าเซิร์ฟเวอร์ที่ได้รับผลกระทบสำคัญต่อธุรกิจเพียงใด"]},"DE.AE-08":{"r":["SOC","CISO"],"q":["What criteria decide when an event becomes a declared incident, and who declares it?","ใช้เกณฑ์ใดตัดสินว่าเหตุการณ์ใดเป็นเหตุการณ์ด้านความมั่นคงปลอดภัยที่ต้องประกาศ และใครเป็นผู้ประกาศ"],"p":[["Are severity levels defined?","มีการกำหนดระดับความรุนแรงหรือไม่"],["How many incidents were declared last year?","ปีที่ผ่านมาประกาศเหตุการณ์กี่ครั้ง"]],"e":["Incident classification criteria, incident log","เกณฑ์การจัดประเภทเหตุการณ์ ทะเบียนเหตุการณ์"],"f":["Someone must decide when an event becomes an incident, because that starts the response plan, management escalation, and possibly legal reporting.","ต้องมีคนตัดสินว่าเมื่อใดเหตุการณ์ทั่วไปกลายเป็นเหตุการณ์ด้านความมั่นคงปลอดภัย เพราะจะเริ่มแผนรับมือ การยกระดับถึงผู้บริหาร และอาจต้องรายงานตามกฎหมาย"],"x":["Who decides that 'we have an incident', and what makes them decide?","ใครเป็นผู้ตัดสินว่า 'เรากำลังเผชิญเหตุการณ์' และอะไรทำให้เขาตัดสินเช่นนั้น"]},"RS.MA-01":{"r":["CISO","SOC","PROC"],"q":["When an incident is declared, how is the incident response plan executed with third parties such as the MSSP, suppliers, and forensic firms?","เมื่อประกาศเหตุการณ์ ดำเนินการตามแผนรับมือเหตุการณ์ร่วมกับบุคคลภายนอก เช่น MSSP ผู้ให้บริการ และบริษัทนิติวิทยาศาสตร์ดิจิทัล อย่างไร"],"p":[["Is there a retainer with an incident response or forensic provider?","มีสัญญาจ้างล่วงหน้ากับผู้ให้บริการรับมือเหตุการณ์หรือนิติวิทยาศาสตร์ดิจิทัลหรือไม่"],["Was the plan used in a real incident or exercise last year?","ปีที่ผ่านมาได้ใช้แผนในเหตุการณ์จริงหรือการฝึกซ้อมหรือไม่"]],"e":["Incident response plan, retainer contract, incident reports","แผนรับมือเหตุการณ์ สัญญาจ้างล่วงหน้า รายงานเหตุการณ์"],"f":["In a serious incident you will need outside help: IT vendors, a forensic firm, lawyers, insurers. That help is fastest when agreed in advance.","ในเหตุการณ์ร้ายแรง องค์กรจะต้องการความช่วยเหลือจากภายนอก เช่น ผู้ขาย IT บริษัทนิติวิทยาศาสตร์ดิจิทัล ทนายความ และบริษัทประกันภัย ความช่วยเหลือจะเร็วที่สุดเมื่อตกลงไว้ล่วงหน้า"],"x":["If you confirmed a ransomware attack this morning, who outside the organization would you call first, and do you already have a contract with them?","หากเช้านี้ยืนยันได้ว่าโดนแรนซัมแวร์ ท่านจะโทรหาใครนอกองค์กรเป็นคนแรก และมีสัญญากับเขาไว้แล้วหรือไม่"]},"RS.MA-02":{"r":["SOC"],"q":["How are incident reports triaged and validated?","คัดกรองและยืนยันรายงานเหตุการณ์อย่างไร"],"p":[["How do staff report a suspicious email or event?","พนักงานรายงานอีเมลหรือเหตุการณ์ที่น่าสงสัยอย่างไร"],["How quickly are reports reviewed?","รายงานได้รับการตรวจสอบเร็วเพียงใด"]],"e":["Incident reporting channel, triage records","ช่องทางการรายงานเหตุการณ์ บันทึกการคัดกรอง"],"f":["Not every report is a real incident. Quick checking separates false alarms from real attacks.","ไม่ใช่ทุกรายงานที่เป็นเหตุการณ์จริง การตรวจสอบอย่างรวดเร็วช่วยแยกสัญญาณผิดพลาดออกจากการโจมตีจริง"],"x":["If a staff member reported a strange pop-up on their screen, what would happen next, step by step?","หากพนักงานแจ้งว่ามีหน้าต่างแปลก ๆ ขึ้นบนหน้าจอ ขั้นตอนต่อไปจะเป็นอย่างไรทีละขั้น"]},"RS.MA-03":{"r":["SOC","CISO"],"q":["How are incidents categorized and prioritized?","จัดประเภทและจัดลำดับความสำคัญของเหตุการณ์อย่างไร"],"p":[["Does priority consider data type, such as health or personal data?","การจัดลำดับพิจารณาประเภทข้อมูล เช่น ข้อมูลสุขภาพหรือข้อมูลส่วนบุคคล หรือไม่"],["Are categories consistent with regulatory reporting categories?","ประเภทเหตุการณ์สอดคล้องกับประเภทที่ต้องรายงานหน่วยงานกำกับหรือไม่"]],"e":["Severity matrix, incident register","ตารางระดับความรุนแรง ทะเบียนเหตุการณ์"],"f":["Incidents differ in seriousness. Clear categories ensure the worst ones get attention first.","เหตุการณ์มีความรุนแรงต่างกัน การจัดประเภทที่ชัดเจนช่วยให้เหตุการณ์ร้ายแรงที่สุดได้รับความสนใจก่อน"],"x":["If one virus on a laptop and one suspected patient data leak were reported at the same time, which would the team handle first?","หากมีรายงานไวรัสในโน้ตบุ๊กหนึ่งเครื่อง และสงสัยว่าข้อมูลผู้รับบริการรั่วไหลในเวลาเดียวกัน ทีมจะจัดการเรื่องใดก่อน"]},"RS.MA-04":{"r":["CISO","SOC","CEO"],"q":["How and when are incidents escalated to management, the crisis team, or regulators?","ยกระดับเหตุการณ์ไปยังผู้บริหาร ทีมบริหารวิกฤต หรือหน่วยงานกำกับอย่างไรและเมื่อใด"],"p":[["Who has authority to shut down a system or disconnect the internet?","ใครมีอำนาจปิดระบบหรือตัดการเชื่อมต่ออินเทอร์เน็ต"],["Is the escalation contact list current?","รายชื่อผู้ติดต่อเพื่อยกระดับเป็นปัจจุบันหรือไม่"]],"e":["Escalation matrix, crisis management plan","ตารางการยกระดับ แผนบริหารวิกฤต"],"f":["Some decisions during an incident belong to management: shutting down systems, informing customers, or calling the police.","การตัดสินใจบางอย่างระหว่างเหตุการณ์เป็นของผู้บริหาร เช่น การปิดระบบ การแจ้งลูกค้า หรือการแจ้งตำรวจ"],"x":["If shutting down the internet would stop an attack but halt operations, who has authority to make that call at night?","หากการตัดอินเทอร์เน็ตจะหยุดการโจมตีได้แต่ทำให้การดำเนินงานหยุด ใครมีอำนาจตัดสินใจเรื่องนี้ตอนกลางคืน"]},"RS.MA-05":{"r":["CISO","BCM"],"q":["What criteria decide when to move from incident response to recovery?","ใช้เกณฑ์ใดตัดสินว่าจะเปลี่ยนจากการรับมือเหตุการณ์ไปสู่การกู้คืน"],"p":[["Who decides that containment is complete?","ใครตัดสินว่าการควบคุมเหตุการณ์เสร็จสมบูรณ์"],["Are recovery criteria written in the plan?","มีเกณฑ์การเริ่มกู้คืนระบุไว้ในแผนหรือไม่"]],"e":["Incident response plan recovery criteria","เกณฑ์การเริ่มกู้คืนในแผนรับมือเหตุการณ์"],"f":["Restoring systems too early can bring the attacker back. Recovery should start only when clear conditions are met.","การกู้คืนระบบเร็วเกินไปอาจทำให้ผู้โจมตีกลับมา การกู้คืนควรเริ่มเมื่อเป็นไปตามเงื่อนไขที่ชัดเจนเท่านั้น"],"x":["During an incident, how would you decide it is safe to start bringing systems back?","ระหว่างเกิดเหตุ ท่านจะตัดสินอย่างไรว่าปลอดภัยพอที่จะเริ่มนำระบบกลับมาใช้"]},"RS.AN-03":{"r":["SOC"],"q":["How is root cause analysis performed after an incident?","วิเคราะห์หาสาเหตุที่แท้จริงหลังเกิดเหตุการณ์อย่างไร"],"p":[["Can you show a root cause analysis from a past incident?","แสดงผลการวิเคราะห์สาเหตุจากเหตุการณ์ที่ผ่านมาได้หรือไม่"],["Who does the analysis: internal staff, MSSP, or external experts?","ใครเป็นผู้วิเคราะห์ เจ้าหน้าที่ภายใน MSSP หรือผู้เชี่ยวชาญภายนอก"]],"e":["Incident reports with root cause, post-incident review","รายงานเหตุการณ์ที่ระบุสาเหตุ ผลการทบทวนหลังเหตุการณ์"],"f":["Without finding the root cause, the same attack can happen again next month.","หากไม่หาสาเหตุที่แท้จริง การโจมตีแบบเดิมอาจเกิดซ้ำได้ในเดือนหน้า"],"x":["After your last significant incident, could anyone explain exactly how the attacker got in?","หลังเหตุการณ์สำคัญครั้งล่าสุด มีใครอธิบายได้ชัดเจนหรือไม่ว่าผู้โจมตีเข้ามาได้อย่างไร"]},"RS.AN-06":{"r":["SOC","LEGAL"],"q":["Are investigation actions recorded in a way that preserves their integrity?","มีการบันทึกการดำเนินการระหว่างการสืบสวนในรูปแบบที่รักษาความถูกต้องหรือไม่"],"p":[["Is there an incident log or ticket with timestamps for each action?","มีบันทึกหรือตั๋วงานที่ระบุเวลาของแต่ละการดำเนินการหรือไม่"],["Could the records be used as evidence in court?","บันทึกเหล่านี้ใช้เป็นพยานหลักฐานในชั้นศาลได้หรือไม่"]],"e":["Incident timeline, investigation log","ลำดับเหตุการณ์ บันทึกการสืบสวน"],"f":["Records of what responders did protect the organization later, in front of regulators, insurers, or a court.","บันทึกการดำเนินการของผู้รับมือเหตุการณ์ช่วยปกป้ององค์กรในภายหลัง ต่อหน้าหน่วยงานกำกับ บริษัทประกันภัย หรือศาล"],"x":["If your insurer asked for a timeline of every action taken during an incident, could you produce one?","หากบริษัทประกันภัยขอลำดับเวลาของทุกการดำเนินการระหว่างเหตุการณ์ องค์กรจัดทำให้ได้หรือไม่"]},"RS.AN-07":{"r":["SOC","LEGAL"],"q":["How is incident evidence collected and preserved, including chain of custody?","เก็บรวบรวมและรักษาพยานหลักฐานของเหตุการณ์อย่างไร รวมถึงห่วงโซ่การครอบครองพยานหลักฐาน"],"p":[["Does the team know how to capture memory and disk images before rebuilding?","ทีมทราบวิธีเก็บภาพหน่วยความจำและดิสก์ก่อนติดตั้งระบบใหม่หรือไม่"],["Is there a chain of custody form?","มีแบบฟอร์มห่วงโซ่การครอบครองพยานหลักฐานหรือไม่"]],"e":["Evidence handling procedure, chain of custody forms","ขั้นตอนการจัดการพยานหลักฐาน แบบฟอร์มห่วงโซ่การครอบครอง"],"f":["Evidence such as logs and disk images disappears quickly. Collecting it properly matters if you want to claim insurance or take legal action.","พยานหลักฐาน เช่น บันทึกและภาพดิสก์ หายไปได้เร็ว การเก็บอย่างถูกวิธีสำคัญหากต้องการเคลมประกันหรือดำเนินคดี"],"x":["If IT reinstalled an infected server immediately to restore service, what evidence would be lost?","หาก IT ติดตั้งเซิร์ฟเวอร์ที่ติดมัลแวร์ใหม่ทันทีเพื่อให้บริการได้ หลักฐานใดจะหายไป"]},"RS.AN-08":{"r":["SOC","CISO"],"q":["How is the magnitude of an incident estimated and confirmed, for example the number of records or systems affected?","ประเมินและยืนยันขนาดของเหตุการณ์อย่างไร เช่น จำนวนระเบียนหรือระบบที่ได้รับผลกระทบ"],"p":[["How would you determine how many patients or customers were affected in a data breach?","หากข้อมูลรั่วไหล จะหาจำนวนผู้รับบริการหรือลูกค้าที่ได้รับผลกระทบอย่างไร"],["Is the estimate updated as the investigation progresses?","มีการปรับปรุงการประเมินระหว่างการสืบสวนหรือไม่"]],"e":["Incident reports, breach assessment worksheet","รายงานเหตุการณ์ แบบประเมินการละเมิดข้อมูล"],"f":["How many records, people, or systems are affected decides legal reporting duties and the cost of the incident.","จำนวนข้อมูล คน หรือระบบที่ได้รับผลกระทบ เป็นตัวกำหนดหน้าที่การรายงานตามกฎหมายและความเสียหายของเหตุการณ์"],"x":["If a database were leaked, how would you work out how many people's data was in it?","หากฐานข้อมูลรั่วไหล ท่านจะหาจำนวนคนที่มีข้อมูลอยู่ในนั้นได้อย่างไร"]},"RS.CO-02":{"r":["CISO","DPO","LEGAL"],"q":["How are internal and external stakeholders, including regulators, notified of incidents within the required timelines?","แจ้งผู้มีส่วนได้ส่วนเสียภายในและภายนอก รวมถึงหน่วยงานกำกับ เกี่ยวกับเหตุการณ์ภายในกำหนดเวลาอย่างไร"],"p":[["Who reports a personal data breach to the PDPC within 72 hours under PDPA s.37(4)?","ใครเป็นผู้แจ้งเหตุละเมิดข้อมูลส่วนบุคคลต่อ สคส. ภายใน 72 ชั่วโมงตาม PDPA มาตรา 37(4)"],["For CII, who reports to the NCSA and the sector regulator, and within what time? [VERIFY]","สำหรับ CII ใครเป็นผู้รายงานต่อ สกมช. และหน่วยงานกำกับ และภายในเวลาเท่าใด [VERIFY]"]],"e":["Notification procedure, regulator contact list, past notifications","ขั้นตอนการแจ้งเหตุ รายชื่อผู้ติดต่อหน่วยงานกำกับ การแจ้งเหตุที่ผ่านมา"],"f":["Thai law sets deadlines for reporting some incidents, for example 72 hours to the PDPC for personal data breaches. Missing them adds penalties to the damage.","กฎหมายไทยกำหนดเวลาการรายงานเหตุการณ์บางประเภท เช่น แจ้ง สคส. ภายใน 72 ชั่วโมงเมื่อข้อมูลส่วนบุคคลรั่วไหล หากพลาดกำหนดจะมีโทษเพิ่มจากความเสียหาย"],"x":["If patient or customer data leaked on a Friday evening, who would decide whether to notify the PDPC, and could it be done by Monday evening?","หากข้อมูลผู้รับบริการหรือลูกค้ารั่วไหลเย็นวันศุกร์ ใครเป็นผู้ตัดสินว่าจะแจ้ง สคส. หรือไม่ และจะแจ้งได้ทันภายในเย็นวันจันทร์หรือไม่"]},"RS.CO-03":{"r":["CISO","COMMS"],"q":["How is incident information shared with designated stakeholders, such as partners, CERTs, and insurers?","แบ่งปันข้อมูลเหตุการณ์กับผู้มีส่วนได้ส่วนเสียที่กำหนด เช่น คู่ค้า ศูนย์ CERT และบริษัทประกันภัย อย่างไร"],"p":[["Who approves what is shared outside the organization?","ใครอนุมัติข้อมูลที่จะเปิดเผยภายนอกองค์กร"],["Is there a communication template?","มีแม่แบบการสื่อสารหรือไม่"]],"e":["Communication plan, message templates","แผนการสื่อสาร แม่แบบข้อความ"],"f":["Sharing the right information with partners, CERTs, and insurers helps the response. Sharing the wrong information can create legal risk.","การแบ่งปันข้อมูลที่ถูกต้องกับคู่ค้า ศูนย์ CERT และบริษัทประกันภัยช่วยการรับมือ แต่การแบ่งปันข้อมูลผิดอาจสร้างความเสี่ยงทางกฎหมาย"],"x":["During an incident, who decides what to tell a business partner who asks 'are we affected?'","ระหว่างเกิดเหตุ ใครเป็นผู้ตัดสินว่าจะบอกอะไรกับคู่ค้าที่ถามว่า 'เราได้รับผลกระทบหรือไม่'"]},"RS.MI-01":{"r":["SOC","ITM"],"q":["How are incidents contained, for example by isolating hosts or disabling accounts?","ควบคุมเหตุการณ์อย่างไร เช่น การแยกเครื่องหรือการระงับบัญชี"],"p":[["Can the team isolate an infected endpoint remotely within minutes?","ทีมแยกเครื่องที่ติดมัลแวร์จากระยะไกลได้ภายในไม่กี่นาทีหรือไม่"],["Are there playbooks for ransomware and account compromise?","มีคู่มือปฏิบัติสำหรับแรนซัมแวร์และบัญชีถูกยึดหรือไม่"]],"e":["Incident playbooks, containment records","คู่มือปฏิบัติการรับมือเหตุการณ์ บันทึกการควบคุมเหตุการณ์"],"f":["Containment means stopping the spread, for example isolating an infected computer or disabling a stolen account, within minutes.","การควบคุมเหตุการณ์คือการหยุดการแพร่กระจาย เช่น แยกเครื่องที่ติดมัลแวร์หรือระงับบัญชีที่ถูกขโมย ภายในไม่กี่นาที"],"x":["If ransomware started spreading in one department, how quickly could IT cut that department off from the rest of the network?","หากแรนซัมแวร์เริ่มแพร่ในแผนกหนึ่ง IT ตัดแผนกนั้นออกจากเครือข่ายส่วนอื่นได้เร็วเพียงใด"]},"RS.MI-02":{"r":["SOC","ITM"],"q":["How is the threat fully removed before systems return to service?","กำจัดภัยคุกคามให้หมดก่อนนำระบบกลับมาให้บริการอย่างไร"],"p":[["Are compromised systems rebuilt rather than cleaned?","ระบบที่ถูกบุกรุกได้รับการติดตั้งใหม่แทนการทำความสะอาดหรือไม่"],["Are all credentials reset after a compromise?","หลังถูกบุกรุก มีการรีเซ็ตข้อมูลยืนยันตัวตนทั้งหมดหรือไม่"]],"e":["Eradication checklist, incident closure records","รายการตรวจสอบการกำจัดภัยคุกคาม บันทึกการปิดเหตุการณ์"],"f":["Removing the attacker completely, including hidden accounts and back doors, prevents a second attack.","การกำจัดผู้โจมตีให้หมด รวมถึงบัญชีที่ซ่อนไว้และประตูหลัง ช่วยป้องกันการโจมตีซ้ำ"],"x":["After an attack, how would you be sure the attacker did not leave a hidden way back in?","หลังการโจมตี ท่านจะมั่นใจได้อย่างไรว่าผู้โจมตีไม่ได้ทิ้งช่องทางลับไว้กลับเข้ามา"]},"RC.RP-01":{"r":["BCM","ITM","CISO"],"q":["Once recovery starts, how is the recovery part of the incident response plan or disaster recovery plan executed?","เมื่อเริ่มการกู้คืน ดำเนินการตามส่วนการกู้คืนของแผนรับมือเหตุการณ์หรือแผนกู้คืนระบบอย่างไร"],"p":[["Who leads recovery, and is that written in the plan?","ใครเป็นผู้นำการกู้คืน และระบุไว้ในแผนหรือไม่"],["Was the plan used in the last real outage?","ได้ใช้แผนในเหตุระบบล่มจริงครั้งล่าสุดหรือไม่"]],"e":["Disaster recovery plan, recovery records","แผนกู้คืนระบบ บันทึกการกู้คืน"],"f":["Recovery under pressure goes better when a plan says who leads and what happens in which order.","การกู้คืนภายใต้ความกดดันจะดีกว่าเมื่อมีแผนบอกว่าใครเป็นผู้นำและทำอะไรตามลำดับใด"],"x":["During your last big outage, did people follow a written plan, or work it out as they went?","ระหว่างระบบล่มครั้งใหญ่ล่าสุด ทุกคนทำตามแผนที่เป็นลายลักษณ์อักษร หรือแก้ไขกันไปตามสถานการณ์"]},"RC.RP-02":{"r":["BCM","ITM","SYSOWN"],"q":["How are recovery actions selected and prioritized, for example by system criticality and RTO?","เลือกและจัดลำดับการกู้คืนอย่างไร เช่น ตามความสำคัญของระบบและ RTO"],"p":[["Is there an agreed recovery order for systems?","มีลำดับการกู้คืนระบบที่ตกลงร่วมกันหรือไม่"],["Do business owners agree with that order?","เจ้าของกระบวนการธุรกิจเห็นด้วยกับลำดับนั้นหรือไม่"]],"e":["System recovery priority list, BIA","ลำดับความสำคัญในการกู้คืนระบบ BIA"],"f":["You cannot restore everything at once. The order should follow business priority, agreed before the crisis.","การกู้คืนทุกอย่างพร้อมกันทำไม่ได้ ลำดับควรเป็นไปตามความสำคัญทางธุรกิจที่ตกลงไว้ก่อนเกิดวิกฤต"],"x":["If 30 systems were down, which would be restored first, and has the business agreed to that order?","หากระบบ 30 ระบบล่มพร้อมกัน ระบบใดจะกู้คืนก่อน และฝ่ายธุรกิจเห็นชอบลำดับนั้นแล้วหรือไม่"]},"RC.RP-03":{"r":["ITM","SOC"],"q":["How is the integrity of backups verified before using them to restore?","ตรวจสอบความถูกต้องของข้อมูลสำรองก่อนนำมากู้คืนอย่างไร"],"p":[["How would you make sure a backup is not already infected with ransomware?","จะมั่นใจได้อย่างไรว่าข้อมูลสำรองไม่ได้ติดแรนซัมแวร์อยู่แล้ว"],["Are backups scanned or checked before restore?","มีการสแกนหรือตรวจสอบข้อมูลสำรองก่อนกู้คืนหรือไม่"]],"e":["Restore procedure, backup integrity checks","ขั้นตอนการกู้คืน การตรวจสอบความถูกต้องของข้อมูลสำรอง"],"f":["Restoring from an infected backup brings the attack back. Backups must be checked before use.","การกู้คืนจากข้อมูลสำรองที่ติดมัลแวร์ทำให้การโจมตีกลับมา ต้องตรวจข้อมูลสำรองก่อนใช้"],"x":["If the attacker had been inside for three weeks, how would you know which backup is clean?","หากผู้โจมตีแฝงอยู่ในระบบมา 3 สัปดาห์ ท่านจะรู้ได้อย่างไรว่าข้อมูลสำรองชุดใดสะอาด"]},"RC.RP-04":{"r":["BCM","CISO","SYSOWN"],"q":["How are critical business functions and security considered when deciding post-incident operating norms?","พิจารณาหน้าที่ทางธุรกิจที่สำคัญและความมั่นคงปลอดภัยอย่างไรในการกำหนดการดำเนินงานหลังเหตุการณ์"],"p":[["Are manual workarounds defined for critical services during recovery?","มีการกำหนดวิธีทำงานด้วยมือสำหรับบริการสำคัญระหว่างกู้คืนหรือไม่"],["Are extra controls applied after restoring, such as heightened monitoring?","มีการเพิ่มการควบคุมหลังกู้คืน เช่น การเฝ้าระวังเข้มข้นขึ้น หรือไม่"]],"e":["Business continuity plan, manual procedures","แผนความต่อเนื่องทางธุรกิจ ขั้นตอนการทำงานด้วยมือ"],"f":["After a major incident, the business may run differently for a while, with manual work and extra controls.","หลังเหตุการณ์ใหญ่ ธุรกิจอาจต้องทำงานต่างไปจากเดิมระยะหนึ่ง เช่น ทำงานด้วยมือและเพิ่มการควบคุม"],"x":["If your core system were unavailable for a week, how would critical work continue, on paper or another system?","หากระบบหลักใช้งานไม่ได้หนึ่งสัปดาห์ งานสำคัญจะดำเนินต่ออย่างไร ใช้กระดาษหรือระบบอื่น"]},"RC.RP-05":{"r":["ITM","SYSOWN"],"q":["How is the integrity of restored systems verified and normal operation confirmed?","ตรวจสอบความถูกต้องของระบบที่กู้คืนและยืนยันการกลับสู่การดำเนินงานปกติอย่างไร"],"p":[["Do system owners sign off that a restored system works correctly?","เจ้าของระบบลงนามยืนยันว่าระบบที่กู้คืนทำงานถูกต้องหรือไม่"],["Are restored systems checked for remaining malicious activity?","มีการตรวจสอบระบบที่กู้คืนว่ายังมีกิจกรรมอันตรายหลงเหลือหรือไม่"]],"e":["Recovery verification checklist, sign-off records","รายการตรวจสอบการกู้คืน บันทึกการลงนามรับรอง"],"f":["A system that starts up is not necessarily working correctly. Owners should confirm data and functions are right before full use.","ระบบที่เปิดขึ้นได้ไม่ได้แปลว่าทำงานถูกต้อง เจ้าของระบบควรยืนยันความถูกต้องของข้อมูลและการทำงานก่อนใช้งานเต็มรูปแบบ"],"x":["After IT restores a system, who checks that the data is complete and correct before staff use it again?","หลัง IT กู้คืนระบบ ใครตรวจว่าข้อมูลครบถ้วนและถูกต้องก่อนให้พนักงานกลับมาใช้"]},"RC.RP-06":{"r":["CISO","BCM"],"q":["What criteria declare the end of recovery, and what documentation is completed?","ใช้เกณฑ์ใดประกาศสิ้นสุดการกู้คืน และจัดทำเอกสารใดให้ครบถ้วน"],"p":[["Is a final incident report produced and approved?","มีการจัดทำและอนุมัติรายงานเหตุการณ์ฉบับสมบูรณ์หรือไม่"],["Is the lessons-learned meeting held within a set time?","มีการประชุมถอดบทเรียนภายในเวลาที่กำหนดหรือไม่"]],"e":["Final incident report, recovery closure record","รายงานเหตุการณ์ฉบับสมบูรณ์ บันทึกการปิดการกู้คืน"],"f":["Formally closing an incident ensures reports are finished and lessons are captured, instead of everyone moving on.","การปิดเหตุการณ์อย่างเป็นทางการช่วยให้รายงานเสร็จสมบูรณ์และได้บทเรียน แทนที่ทุกคนจะผ่านเลยไป"],"x":["For your last incident, was there a final report and a meeting on what to do differently?","สำหรับเหตุการณ์ครั้งล่าสุด มีรายงานฉบับสมบูรณ์และการประชุมว่าจะทำอะไรต่างออกไปหรือไม่"]},"RC.CO-03":{"r":["CISO","COMMS","BCM"],"q":["How are recovery progress and status communicated to management and affected stakeholders?","สื่อสารความคืบหน้าและสถานะการกู้คืนไปยังผู้บริหารและผู้มีส่วนได้ส่วนเสียที่ได้รับผลกระทบอย่างไร"],"p":[["How often are status updates sent during an outage?","ระหว่างระบบล่มมีการส่งข้อมูลสถานะบ่อยเพียงใด"],["Is there an alternate channel if email is down?","มีช่องทางสำรองหรือไม่หากอีเมลใช้งานไม่ได้"]],"e":["Communication plan, status update records","แผนการสื่อสาร บันทึกการแจ้งสถานะ"],"f":["During a long outage, staff, management, and customers want regular updates. Silence creates rumors.","ระหว่างระบบล่มเป็นเวลานาน พนักงาน ผู้บริหาร และลูกค้าต้องการข้อมูลความคืบหน้าสม่ำเสมอ ความเงียบทำให้เกิดข่าวลือ"],"x":["If email and LINE were both unavailable during an outage, how would you send updates to all department heads?","หากอีเมลและ LINE ใช้งานไม่ได้ทั้งคู่ระหว่างระบบล่ม ท่านจะส่งข้อมูลความคืบหน้าถึงหัวหน้าทุกฝ่ายอย่างไร"]},"RC.CO-04":{"r":["COMMS","CEO","LEGAL"],"q":["How are public updates about an incident and recovery approved and released?","อนุมัติและเผยแพร่ข้อมูลต่อสาธารณะเกี่ยวกับเหตุการณ์และการกู้คืนอย่างไร"],"p":[["Who is the authorized spokesperson?","ใครเป็นโฆษกที่ได้รับมอบหมาย"],["Are holding statements prepared in advance?","มีการเตรียมแถลงการณ์เบื้องต้นไว้ล่วงหน้าหรือไม่"]],"e":["Crisis communication plan, approved holding statements","แผนการสื่อสารในภาวะวิกฤต แถลงการณ์เบื้องต้นที่อนุมัติแล้ว"],"f":["What the organization says in public during an incident affects trust, legal exposure, and the regulator's view.","สิ่งที่องค์กรสื่อสารต่อสาธารณะระหว่างเหตุการณ์มีผลต่อความเชื่อมั่น ความเสี่ยงทางกฎหมาย และมุมมองของหน่วยงานกำกับ"],"x":["If a news reporter called during an incident, who would speak, and is a prepared statement ready?","หากนักข่าวโทรมาระหว่างเกิดเหตุ ใครเป็นผู้ให้ข้อมูล และมีแถลงการณ์ที่เตรียมไว้แล้วหรือไม่"]}},"tc":[{"id":"AST-01","d":"AST","s":["ID.AM-01"],"ref":"CIS 1.1, 1.3","q":["Is there a hardware inventory that covers servers, endpoints, network devices, and mobile devices, fed by an automated discovery tool?","มีทะเบียนฮาร์ดแวร์ที่ครอบคลุมเซิร์ฟเวอร์ เครื่องลูกข่าย อุปกรณ์เครือข่าย และอุปกรณ์เคลื่อนที่ และได้ข้อมูลจากเครื่องมือสำรวจอัตโนมัติหรือไม่"],"g":["One inventory with owner, location, and criticality for every asset; discovery runs at least weekly; reconciled with procurement records at least every six months.","มีทะเบียนเดียวที่ระบุเจ้าของ ที่ตั้ง และระดับความสำคัญของทุกทรัพย์สิน เครื่องมือสำรวจทำงานอย่างน้อยสัปดาห์ละครั้ง และกระทบยอดกับข้อมูลจัดซื้ออย่างน้อยทุก 6 เดือน"]},{"id":"AST-02","d":"AST","s":["ID.AM-01","PR.IR-01"],"ref":"CIS 1.2","q":["What happens when an unknown device connects to the network?","เมื่อมีอุปกรณ์ที่ไม่รู้จักเชื่อมต่อเครือข่ายจะเกิดอะไรขึ้น"],"g":["Unknown devices are detected and removed, quarantined, or added to the inventory within one week; network access control (NAC) or port security blocks unmanaged devices on sensitive segments.","ตรวจพบอุปกรณ์ที่ไม่รู้จักและนำออก กักแยก หรือเพิ่มเข้าทะเบียนภายในหนึ่งสัปดาห์ และใช้การควบคุมการเข้าถึงเครือข่าย (NAC) หรือ Port Security กันอุปกรณ์ที่ไม่ได้บริหารจัดการออกจากเครือข่ายส่วนที่อ่อนไหว"]},{"id":"AST-03","d":"AST","s":["ID.AM-02","PR.PS-02"],"ref":"CIS 2.1, 2.2","q":["Is there a software inventory with version and vendor support status, and is unsupported software flagged?","มีทะเบียนซอฟต์แวร์ที่ระบุเวอร์ชันและสถานะการสนับสนุนจากผู้ขาย และมีการระบุซอฟต์แวร์ที่หมดการสนับสนุนหรือไม่"],"g":["Inventory reviewed at least every six months; unsupported software has a documented exception with compensating controls and a replacement date.","ทบทวนทะเบียนอย่างน้อยทุก 6 เดือน ซอฟต์แวร์ที่หมดการสนับสนุนมีการยกเว้นเป็นลายลักษณ์อักษรพร้อมมาตรการชดเชยและวันที่ทดแทน"]},{"id":"AST-04","d":"AST","s":["ID.AM-02","ID.AM-04"],"ref":"CIS 2.1, 15.1","q":["Are cloud and software as a service (SaaS) applications in use known, including those bought by departments?","ทราบหรือไม่ว่ามีการใช้แอปพลิเคชันคลาวด์และซอฟต์แวร์แบบบริการ (SaaS) ใดบ้าง รวมถึงที่หน่วยงานซื้อเอง"],"g":["SaaS discovery through firewall, proxy, or cloud access security broker (CASB) logs; each service has a business owner and is linked to the supplier inventory.","สำรวจ SaaS จากบันทึกของไฟร์วอลล์ พร็อกซี หรือ Cloud Access Security Broker (CASB) ทุกบริการมีเจ้าของฝั่งธุรกิจและเชื่อมกับทะเบียนผู้ให้บริการ"]},{"id":"AST-05","d":"AST","s":["ID.AM-03"],"ref":"CIS 12.4, 3.8","q":["Are network architecture and data flow diagrams current, and do they show internet, supplier, and cloud connections?","แผนผังสถาปัตยกรรมเครือข่ายและการไหลของข้อมูลเป็นปัจจุบัน และแสดงการเชื่อมต่ออินเทอร์เน็ต ผู้ให้บริการ และคลาวด์หรือไม่"],"g":["Diagrams updated after every significant change and reviewed at least annually; they show segments, firewalls, and where sensitive data flows.","ปรับปรุงแผนผังทุกครั้งที่มีการเปลี่ยนแปลงสำคัญและทบทวนอย่างน้อยปีละครั้ง แสดงส่วนของเครือข่าย ไฟร์วอลล์ และเส้นทางของข้อมูลอ่อนไหว"]},{"id":"IAM-01","d":"IAM","s":["PR.AA-03"],"ref":"CIS 6.3, 6.4, 6.5","q":["Is multi-factor authentication (MFA) enforced for email, remote access (VPN), cloud administration, and all administrator accounts?","บังคับใช้การยืนยันตัวตนหลายปัจจัย (MFA) กับอีเมล การเข้าถึงระยะไกล (VPN) การดูแลคลาวด์ และบัญชีผู้ดูแลระบบทั้งหมดหรือไม่"],"g":["MFA on 100% of externally exposed applications, remote access, and administrative access; phishing-resistant methods (FIDO2 or number matching) for administrators; no SMS for privileged accounts.","ใช้ MFA ครบทุกระบบที่เข้าถึงจากภายนอก การเข้าถึงระยะไกล และการเข้าถึงสิทธิ์ผู้ดูแล ใช้วิธีที่ทนต่อฟิชชิง (FIDO2 หรือ Number Matching) สำหรับผู้ดูแลระบบ และไม่ใช้ SMS กับบัญชีสิทธิ์สูง"]},{"id":"IAM-02","d":"IAM","s":["PR.AA-01","GV.RR-04"],"ref":"CIS 6.1, 6.2, 5.3","q":["How quickly are accounts disabled when staff leave, and are dormant accounts disabled automatically?","บัญชีถูกระงับเร็วเพียงใดเมื่อพนักงานลาออก และบัญชีที่ไม่ได้ใช้งานถูกระงับอัตโนมัติหรือไม่"],"g":["Leaver accounts disabled on the last working day, triggered by HR; accounts unused for 45 days disabled automatically; monthly reconciliation of HR list against active accounts.","ระงับบัญชีของผู้ลาออกในวันทำงานสุดท้ายโดยมี HR เป็นผู้แจ้ง ระงับบัญชีที่ไม่ใช้งาน 45 วันโดยอัตโนมัติ และกระทบยอดรายชื่อจาก HR กับบัญชีที่ใช้งานอยู่ทุกเดือน"]},{"id":"IAM-03","d":"IAM","s":["PR.AA-05"],"ref":"CIS 5.4, 12.8","q":["Do administrators use separate accounts for admin work, and how many domain or global administrators exist?","ผู้ดูแลระบบใช้บัญชีแยกสำหรับงานดูแลระบบหรือไม่ และมีผู้ดูแลโดเมนหรือ Global Administrator กี่ราย"],"g":["Dedicated admin accounts without email or internet browsing; domain or global administrators kept to a small named group (typically 2 to 4); admin work from hardened admin workstations.","ใช้บัญชีผู้ดูแลแยกที่ไม่มีอีเมลและไม่ใช้ท่องเว็บ จำกัดผู้ดูแลโดเมนหรือ Global Administrator ไว้กลุ่มเล็กที่ระบุชื่อ (โดยทั่วไป 2 ถึง 4 ราย) และทำงานดูแลระบบจากเครื่องที่ตั้งค่าความปลอดภัยเฉพาะ"]},{"id":"IAM-04","d":"IAM","s":["PR.AA-05"],"ref":"CIS 5.4, 6.8","q":["Is privileged access managed with a privileged access management (PAM) tool or password vault, with session logging?","มีการบริหารสิทธิ์สูงด้วยเครื่องมือบริหารสิทธิ์สูง (PAM) หรือที่เก็บรหัสผ่าน พร้อมการบันทึกเซสชันหรือไม่"],"g":["Privileged passwords vaulted and rotated; just-in-time elevation where possible; privileged sessions recorded for critical systems; local administrator passwords unique per machine (for example Windows LAPS).","เก็บรหัสผ่านสิทธิ์สูงในที่เก็บรหัสผ่านและหมุนเวียนเปลี่ยน ยกระดับสิทธิ์เฉพาะเมื่อจำเป็น บันทึกเซสชันสิทธิ์สูงในระบบสำคัญ และรหัสผ่านผู้ดูแลเครื่องไม่ซ้ำกันในแต่ละเครื่อง (เช่น Windows LAPS)"]},{"id":"IAM-05","d":"IAM","s":["PR.AA-05"],"ref":"CIS 6.1, 6.8","q":["Are user access reviews performed for critical systems, and is access granted by role?","มีการทบทวนสิทธิ์ผู้ใช้ของระบบสำคัญ และให้สิทธิ์ตามบทบาทหรือไม่"],"g":["Role-based access defined with system owners; access reviews at least every six months for critical systems (quarterly for privileged access); removals completed and evidenced.","กำหนดสิทธิ์ตามบทบาทร่วมกับเจ้าของระบบ ทบทวนสิทธิ์ระบบสำคัญอย่างน้อยทุก 6 เดือน (สิทธิ์สูงทุกไตรมาส) และถอนสิทธิ์ครบถ้วนพร้อมหลักฐาน"]},{"id":"IAM-06","d":"IAM","s":["PR.AA-01"],"ref":"CIS 5.5, 5.2","q":["Are service accounts and shared accounts inventoried, owned, and protected with strong unique passwords?","บัญชีบริการและบัญชีที่ใช้ร่วมกันมีทะเบียน มีเจ้าของ และใช้รหัสผ่านที่แข็งแรงไม่ซ้ำกันหรือไม่"],"g":["Service account inventory reviewed quarterly; no interactive logon for service accounts; managed service accounts or vaulted passwords; shared accounts removed or tied to named users.","ทบทวนทะเบียนบัญชีบริการทุกไตรมาส บัญชีบริการเข้าสู่ระบบแบบโต้ตอบไม่ได้ ใช้ Managed Service Account หรือเก็บรหัสในที่เก็บรหัสผ่าน และยกเลิกบัญชีใช้ร่วมหรือผูกกับผู้ใช้ที่ระบุชื่อ"]},{"id":"IAM-07","d":"IAM","s":["PR.AA-03","PR.AA-04"],"ref":"CIS 5.2, 6.7; NIST SP 800-63B","q":["What is the password standard, and is single sign-on (SSO) used for business applications?","มาตรฐานรหัสผ่านคืออะไร และใช้การลงชื่อเข้าใช้ครั้งเดียว (SSO) กับระบบงานหรือไม่"],"g":["Minimum 8 characters with MFA or 14 without, checked against breached-password lists, no forced periodic change without cause (NIST SP 800-63B); SSO through a central identity provider for business applications.","ความยาวอย่างน้อย 8 ตัวอักษรเมื่อใช้ MFA หรือ 14 ตัวอักษรเมื่อไม่ใช้ ตรวจกับรายการรหัสผ่านที่รั่วไหล ไม่บังคับเปลี่ยนตามรอบโดยไม่มีเหตุ (NIST SP 800-63B) และใช้ SSO ผ่านผู้ให้บริการตัวตนส่วนกลางกับระบบงาน"]},{"id":"IAM-08","d":"IAM","s":["PR.AA-02"],"ref":"ISO/IEC 27002:2022 5.16, 5.17","q":["How does the service desk verify identity before a password or MFA reset?","Service Desk ยืนยันตัวตนอย่างไรก่อนรีเซ็ตรหัสผ่านหรือ MFA"],"g":["Documented verification (call-back to a registered number, manager approval, or video check); MFA resets for administrators need a second approver; reset requests logged.","มีขั้นตอนยืนยันตัวตนเป็นลายลักษณ์อักษร (โทรกลับเบอร์ที่ลงทะเบียน การอนุมัติจากหัวหน้า หรือตรวจผ่านวิดีโอ) การรีเซ็ต MFA ของผู้ดูแลต้องมีผู้อนุมัติคนที่สอง และบันทึกทุกคำขอ"]},{"id":"EP-01","d":"EP","s":["DE.CM-09","PR.PS-05"],"ref":"CIS 10.1, 10.6, 10.7","q":["Is endpoint detection and response (EDR) or antimalware installed on all endpoints and servers, centrally managed?","ติดตั้งระบบตรวจจับและตอบสนองที่เครื่องลูกข่าย (EDR) หรือ Antimalware ครบทุกเครื่องลูกข่ายและเซิร์ฟเวอร์ และบริหารจากส่วนกลางหรือไม่"],"g":["EDR with behavior-based detection on at least 98% of endpoints and servers; coverage gaps reported weekly; tamper protection on; alerts monitored 24/7 in-house or by a managed service.","ติดตั้ง EDR ที่ตรวจจับจากพฤติกรรมอย่างน้อยร้อยละ 98 ของเครื่องลูกข่ายและเซิร์ฟเวอร์ รายงานเครื่องที่ยังไม่ครอบคลุมทุกสัปดาห์ เปิดการป้องกันการปิดระบบ และเฝ้าดูการแจ้งเตือนตลอด 24 ชั่วโมงโดยทีมภายในหรือผู้ให้บริการ"]},{"id":"EP-02","d":"EP","s":["PR.PS-05","PR.AA-05"],"ref":"CIS 5.4, 2.5","q":["Do standard users have local administrator rights, and is unapproved software blocked?","ผู้ใช้ทั่วไปมีสิทธิ์ผู้ดูแลเครื่องหรือไม่ และมีการบล็อกซอฟต์แวร์ที่ไม่ได้รับอนุญาตหรือไม่"],"g":["No local admin rights for standard users; software installed through a managed catalog; application allowlisting on servers and high-risk endpoints.","ผู้ใช้ทั่วไปไม่มีสิทธิ์ผู้ดูแลเครื่อง ติดตั้งซอฟต์แวร์ผ่านแคตตาล็อกที่บริหารจัดการ และใช้การอนุญาตเฉพาะโปรแกรมที่กำหนดบนเซิร์ฟเวอร์และเครื่องที่มีความเสี่ยงสูง"]},{"id":"EP-03","d":"EP","s":["PR.PS-01"],"ref":"CIS 4.1, 4.8","q":["Are secure configuration baselines (for example CIS Benchmarks) applied to Windows, servers, and network devices, and is drift checked?","มีการใช้ค่ามาตรฐานการตั้งค่าที่ปลอดภัย (เช่น CIS Benchmarks) กับ Windows เซิร์ฟเวอร์ และอุปกรณ์เครือข่าย และตรวจการเบี่ยงเบนหรือไม่"],"g":["Baselines documented and deployed through group policy or endpoint management; unnecessary services disabled; compliance scanned at least quarterly.","มีค่ามาตรฐานเป็นลายลักษณ์อักษรและนำไปใช้ผ่าน Group Policy หรือระบบบริหารเครื่องลูกข่าย ปิดบริการที่ไม่จำเป็น และสแกนความสอดคล้องอย่างน้อยทุกไตรมาส"]},{"id":"EP-04","d":"EP","s":["PR.DS-10"],"ref":"CIS 4.3, 4.10","q":["Are screen lock and session timeout enforced on all endpoints?","บังคับใช้การล็อกหน้าจอและการหมดเวลาเซสชันกับเครื่องลูกข่ายทุกเครื่องหรือไม่"],"g":["Automatic lock after 15 minutes or less on workstations and 2 minutes on mobile devices; shared clinical or kiosk devices use fast user switching or tap-and-go.","ล็อกอัตโนมัติภายใน 15 นาทีบนเครื่องลูกข่าย และ 2 นาทีบนอุปกรณ์เคลื่อนที่ เครื่องที่ใช้ร่วมกันใช้การสลับผู้ใช้อย่างรวดเร็วหรือแตะบัตรเข้าใช้"]},{"id":"EP-05","d":"EP","s":["PR.DS-01"],"ref":"CIS 3.6, 3.9","q":["Is full-disk encryption enabled on laptops, and is removable media controlled?","เปิดการเข้ารหัสทั้งดิสก์บนโน้ตบุ๊ก และควบคุมสื่อบันทึกข้อมูลแบบถอดได้หรือไม่"],"g":["BitLocker or FileVault on 100% of laptops with recovery keys escrowed; USB storage blocked or encrypted by policy; autorun disabled (CIS 10.3).","เปิด BitLocker หรือ FileVault ครบทุกโน้ตบุ๊กและเก็บกุญแจกู้คืนไว้ส่วนกลาง บล็อกหรือบังคับเข้ารหัส USB ตามนโยบาย และปิด Autorun (CIS 10.3)"]},{"id":"EP-06","d":"EP","s":["PR.IR-01"],"ref":"CIS 4.4, 4.5","q":["Are host firewalls enabled on servers and endpoints with default-deny inbound rules?","เปิดไฟร์วอลล์ประจำเครื่องบนเซิร์ฟเวอร์และเครื่องลูกข่าย โดยปฏิเสธการเชื่อมต่อขาเข้าเป็นค่าเริ่มต้นหรือไม่"],"g":["Host firewall on for all profiles; inbound blocked except required services; workstation-to-workstation SMB and RDP blocked to slow ransomware spread.","เปิดไฟร์วอลล์ประจำเครื่องทุกโปรไฟล์ บล็อกขาเข้ายกเว้นบริการที่จำเป็น และบล็อก SMB และ RDP ระหว่างเครื่องลูกข่ายเพื่อชะลอการแพร่ของแรนซัมแวร์"]},{"id":"NET-01","d":"NET","s":["PR.IR-01"],"ref":"CIS 12.2, 13.4","q":["Is the network segmented, with servers, users, guests, management, and OT or medical devices in separate zones with filtered traffic between them?","มีการแบ่งส่วนเครือข่าย โดยแยกเซิร์ฟเวอร์ ผู้ใช้ ผู้มาติดต่อ ระบบบริหารจัดการ และ OT หรืออุปกรณ์การแพทย์ ออกเป็นโซน และกรองการรับส่งข้อมูลระหว่างโซนหรือไม่"],"g":["Zones defined by function and sensitivity; firewall rules between zones on a least-privilege basis; guest Wi-Fi isolated from internal networks.","กำหนดโซนตามหน้าที่และความอ่อนไหว กำหนดกฎไฟร์วอลล์ระหว่างโซนตามหลักสิทธิ์น้อยที่สุด และแยก Wi-Fi ผู้มาติดต่อออกจากเครือข่ายภายใน"]},{"id":"NET-02","d":"NET","s":["PR.IR-01","ID.RA-07"],"ref":"CIS 4.2, 12.3","q":["Are firewall rules reviewed regularly, and are any-any or temporary rules removed?","มีการทบทวนกฎไฟร์วอลล์สม่ำเสมอ และนำกฎ Any-Any หรือกฎชั่วคราวออกหรือไม่"],"g":["Rule review at least every six months; each rule has an owner, business reason, and expiry if temporary; changes go through change management.","ทบทวนกฎอย่างน้อยทุก 6 เดือน ทุกกฎมีเจ้าของ เหตุผลทางธุรกิจ และวันหมดอายุหากเป็นกฎชั่วคราว และการเปลี่ยนแปลงผ่านกระบวนการบริหารการเปลี่ยนแปลง"]},{"id":"NET-03","d":"NET","s":["PR.AA-03","PR.IR-01"],"ref":"CIS 12.7, 6.4, 13.5","q":["How is remote access provided (VPN, remote desktop tools), and is remote desktop protocol (RDP) exposed to the internet?","ให้การเข้าถึงระยะไกลอย่างไร (VPN หรือเครื่องมือควบคุมระยะไกล) และมี Remote Desktop Protocol (RDP) เปิดสู่อินเทอร์เน็ตหรือไม่"],"g":["Remote access only through VPN or zero trust access with MFA; no RDP, SMB, or admin interfaces exposed to the internet; VPN appliances patched within days of critical advisories.","เข้าถึงระยะไกลผ่าน VPN หรือ Zero Trust Access ที่มี MFA เท่านั้น ไม่เปิด RDP SMB หรือหน้าจอผู้ดูแลสู่อินเทอร์เน็ต และแพตช์อุปกรณ์ VPN ภายในไม่กี่วันหลังมีประกาศช่องโหว่วิกฤต"]},{"id":"NET-04","d":"NET","s":["PR.IR-01","PR.PS-01"],"ref":"CIS 12.3, 12.6, 4.7","q":["Are network devices managed through a separate management network with secure protocols, and are default passwords changed?","อุปกรณ์เครือข่ายถูกบริหารผ่านเครือข่ายบริหารจัดการที่แยกต่างหากด้วยโปรโตคอลที่ปลอดภัย และเปลี่ยนรหัสผ่านเริ่มต้นแล้วหรือไม่"],"g":["Management interfaces only on a management VLAN; SSH and HTTPS only (no Telnet or HTTP); default accounts disabled or renamed; configurations backed up.","หน้าจอผู้ดูแลอยู่ใน VLAN บริหารจัดการเท่านั้น ใช้ SSH และ HTTPS เท่านั้น (ไม่ใช้ Telnet หรือ HTTP) ปิดหรือเปลี่ยนชื่อบัญชีเริ่มต้น และสำรองค่าการตั้งค่า"]},{"id":"NET-05","d":"NET","s":["DE.CM-01"],"ref":"CIS 13.3, 13.6","q":["Is network traffic monitored, for example with intrusion detection or prevention (IDS/IPS) and flow logs?","มีการเฝ้าระวังการรับส่งข้อมูลบนเครือข่ายหรือไม่ เช่น ระบบตรวจจับหรือป้องกันการบุกรุก (IDS/IPS) และบันทึก Flow"],"g":["IDS/IPS at the internet edge and between critical zones; NetFlow or firewall logs sent to the security information and event management (SIEM) system; alerts reviewed daily.","มี IDS/IPS ที่ขอบอินเทอร์เน็ตและระหว่างโซนสำคัญ ส่ง NetFlow หรือบันทึกไฟร์วอลล์เข้าระบบ SIEM และทบทวนการแจ้งเตือนทุกวัน"]},{"id":"NET-06","d":"NET","s":["PR.IR-04"],"ref":"ISO/IEC 27002:2022 8.6, 8.20","q":["Are internet-facing services protected against denial-of-service (DoS) attacks and capacity problems?","บริการที่เปิดสู่อินเทอร์เน็ตได้รับการป้องกันการโจมตีแบบปฏิเสธการให้บริการ (DoS) และปัญหาขีดความสามารถหรือไม่"],"g":["DDoS protection from the internet provider or a cloud service for critical public services; bandwidth and resource alerts set at about 80%; redundant internet links for critical sites.","ใช้การป้องกัน DDoS จากผู้ให้บริการอินเทอร์เน็ตหรือบริการคลาวด์กับบริการสาธารณะที่สำคัญ ตั้งการแจ้งเตือนแบนด์วิดท์และทรัพยากรที่ประมาณร้อยละ 80 และมีลิงก์อินเทอร์เน็ตสำรองสำหรับไซต์สำคัญ"]},{"id":"EML-01","d":"EML","s":["PR.DS-02","DE.CM-09"],"ref":"CIS 9.5","q":["Are SPF, DKIM, and DMARC configured for your email domains, and is DMARC set to quarantine or reject?","ตั้งค่า SPF, DKIM และ DMARC ให้โดเมนอีเมลแล้ว และ DMARC ตั้งเป็น Quarantine หรือ Reject หรือไม่"],"g":["SPF and DKIM on all sending domains; DMARC at p=quarantine or p=reject with reports monitored; parked domains set to reject.","ตั้ง SPF และ DKIM ทุกโดเมนที่ส่งอีเมล DMARC อยู่ที่ p=quarantine หรือ p=reject และติดตามรายงาน โดเมนที่ไม่ใช้งานตั้งเป็น Reject"]},{"id":"EML-02","d":"EML","s":["DE.CM-09","PR.PS-05"],"ref":"CIS 9.6, 9.7","q":["Does the email gateway scan attachments and links, block dangerous file types, and sandbox suspicious files?","Email Gateway สแกนไฟล์แนบและลิงก์ บล็อกไฟล์ประเภทอันตราย และทดสอบไฟล์ต้องสงสัยใน Sandbox หรือไม่"],"g":["Executable and macro-enabled attachments blocked by default; links rewritten and checked at click time; attachment sandboxing; external email banner.","บล็อกไฟล์แนบที่เรียกใช้ได้และไฟล์ที่มีมาโครเป็นค่าเริ่มต้น ตรวจลิงก์ ณ เวลาที่คลิก ทดสอบไฟล์แนบใน Sandbox และแสดงป้ายเตือนอีเมลจากภายนอก"]},{"id":"EML-03","d":"EML","s":["DE.CM-09","PR.IR-01"],"ref":"CIS 9.2, 9.3","q":["Is DNS filtering or a web proxy used to block malicious and uncategorized websites?","ใช้ DNS Filtering หรือ Web Proxy บล็อกเว็บไซต์อันตรายและเว็บไซต์ที่ไม่มีการจัดหมวดหรือไม่"],"g":["DNS filtering for all devices, including off-network laptops; URL category filtering blocks malware, phishing, and newly registered domains.","ใช้ DNS Filtering กับทุกอุปกรณ์ รวมถึงโน้ตบุ๊กที่อยู่นอกเครือข่าย และกรองตามหมวด URL เพื่อบล็อกมัลแวร์ ฟิชชิง และโดเมนที่เพิ่งจดทะเบียน"]},{"id":"EML-04","d":"EML","s":["PR.AT-01","RS.MA-02"],"ref":"CIS 14.2, 14.6","q":["Can users report suspicious email with one click, and are phishing simulations run?","ผู้ใช้แจ้งอีเมลต้องสงสัยได้ด้วยการคลิกครั้งเดียว และมีการจำลองฟิชชิงหรือไม่"],"g":["Report-phish button in the mail client feeding the security team; simulations at least quarterly; click and report rates tracked and trending better.","มีปุ่มแจ้งฟิชชิงในโปรแกรมอีเมลส่งถึงทีมความมั่นคงปลอดภัย จำลองฟิชชิงอย่างน้อยทุกไตรมาส และติดตามอัตราการคลิกและการแจ้งให้มีแนวโน้มดีขึ้น"]},{"id":"DATA-01","d":"DATA","s":["PR.DS-01","ID.AM-07"],"ref":"CIS 3.11, 3.12","q":["Is sensitive data encrypted at rest in databases, file shares, and backups, and stored in restricted locations?","ข้อมูลอ่อนไหวได้รับการเข้ารหัสขณะจัดเก็บในฐานข้อมูล ที่เก็บไฟล์ส่วนกลาง และข้อมูลสำรอง และเก็บในตำแหน่งที่จำกัดสิทธิ์หรือไม่"],"g":["Database or storage encryption for systems holding health, ID card, or financial data; sensitive data kept in designated systems, not on local drives or open shares.","เข้ารหัสฐานข้อมูลหรือที่จัดเก็บสำหรับระบบที่มีข้อมูลสุขภาพ บัตรประชาชน หรือการเงิน และเก็บข้อมูลอ่อนไหวในระบบที่กำหนด ไม่เก็บในเครื่องหรือโฟลเดอร์ที่เปิดกว้าง"]},{"id":"DATA-02","d":"DATA","s":["PR.DS-02"],"ref":"CIS 3.10","q":["Is data in transit encrypted (TLS 1.2 or higher), including internal applications and file transfers?","ข้อมูลระหว่างการส่งได้รับการเข้ารหัส (TLS 1.2 ขึ้นไป) รวมถึงระบบงานภายในและการโอนไฟล์หรือไม่"],"g":["TLS 1.2 or 1.3 on all web applications and APIs; legacy protocols (SSL, TLS 1.0 and 1.1, FTP) disabled; secure file transfer (SFTP or a managed sharing tool) for external exchange.","ใช้ TLS 1.2 หรือ 1.3 กับเว็บแอปพลิเคชันและ API ทั้งหมด ปิดโปรโตคอลเก่า (SSL, TLS 1.0 และ 1.1, FTP) และใช้การโอนไฟล์ที่ปลอดภัย (SFTP หรือเครื่องมือแชร์ที่บริหารจัดการ) กับภายนอก"]},{"id":"DATA-03","d":"DATA","s":["PR.DS-01","PR.AA-05"],"ref":"CIS 3.3","q":["Are file shares and SharePoint or OneDrive permissions reviewed, and is 'Everyone' or anonymous link sharing restricted?","มีการทบทวนสิทธิ์ของโฟลเดอร์ส่วนกลางและ SharePoint หรือ OneDrive และจำกัดการแชร์แบบ 'Everyone' หรือลิงก์ไม่ระบุตัวตนหรือไม่"],"g":["No sensitive folders shared with Everyone or anonymous links; external sharing limited to approved domains; permission reports reviewed at least every six months.","ไม่มีโฟลเดอร์ข้อมูลอ่อนไหวแชร์กับ Everyone หรือลิงก์ไม่ระบุตัวตน จำกัดการแชร์ภายนอกเฉพาะโดเมนที่อนุมัติ และทบทวนรายงานสิทธิ์อย่างน้อยทุก 6 เดือน"]},{"id":"DATA-04","d":"DATA","s":["PR.DS-01","PR.DS-02"],"ref":"CIS 3.13","q":["Is data loss prevention (DLP) used to detect or block sensitive data leaving by email, web, or USB?","ใช้ระบบป้องกันข้อมูลรั่วไหล (DLP) ตรวจจับหรือบล็อกข้อมูลอ่อนไหวที่ออกทางอีเมล เว็บ หรือ USB หรือไม่"],"g":["DLP rules for Thai ID card numbers, health records, and financial data on email and cloud storage; start in monitor mode, then block high-confidence matches.","มีกฎ DLP สำหรับเลขบัตรประชาชน ข้อมูลสุขภาพ และข้อมูลการเงิน บนอีเมลและคลาวด์ เริ่มจากโหมดเฝ้าดู แล้วบล็อกเมื่อการตรวจพบมีความแม่นยำสูง"]},{"id":"DATA-05","d":"DATA","s":["ID.AM-08","PR.PS-03"],"ref":"CIS 3.5; ISO/IEC 27002:2022 7.14","q":["How are disks and devices sanitized or destroyed before disposal or return to a vendor?","ล้างหรือทำลายดิสก์และอุปกรณ์อย่างไรก่อนจำหน่ายหรือส่งคืนผู้ขาย"],"g":["Sanitization following NIST SP 800-88 or physical destruction; certificate of destruction from vendors; disposal record kept per device.","ล้างข้อมูลตาม NIST SP 800-88 หรือทำลายทางกายภาพ ได้รับหนังสือรับรองการทำลายจากผู้ขาย และเก็บบันทึกการจำหน่ายรายอุปกรณ์"]},{"id":"DATA-06","d":"DATA","s":["PR.DS-01"],"ref":"CIS 3.4; PDPA s.37(3)","q":["Are retention periods applied, and is old personal data deleted when no longer needed?","มีการใช้ระยะเวลาการเก็บรักษา และลบข้อมูลส่วนบุคคลเก่าเมื่อไม่จำเป็นแล้วหรือไม่"],"g":["Retention schedule per data type agreed with legal and the DPO; automated deletion or archive where systems allow; deletion evidenced.","มีตารางระยะเวลาการเก็บรักษาตามประเภทข้อมูลที่ตกลงกับฝ่ายกฎหมายและ DPO ลบหรือย้ายเก็บอัตโนมัติเมื่อระบบรองรับ และมีหลักฐานการลบ"]},{"id":"BKP-01","d":"BKP","s":["PR.DS-11"],"ref":"CIS 11.2, 11.4","q":["Do backups follow the 3-2-1 rule, with at least one offline or immutable copy that administrators cannot delete?","การสำรองข้อมูลเป็นไปตามหลัก 3-2-1 และมีสำเนาอย่างน้อยหนึ่งชุดแบบออฟไลน์หรือแก้ไขไม่ได้ที่ผู้ดูแลระบบลบไม่ได้หรือไม่"],"g":["Three copies, two media, one off-site; one copy immutable or air-gapped; backup frequency matches the recovery point objective (RPO) of each critical system.","มี 3 สำเนา บนสื่อ 2 ประเภท และ 1 ชุดนอกสถานที่ มีสำเนาหนึ่งชุดที่แก้ไขไม่ได้หรือแยกขาดจากเครือข่าย และความถี่การสำรองสอดคล้องกับจุดเป้าหมายในการกู้คืนข้อมูล (RPO) ของแต่ละระบบสำคัญ"]},{"id":"BKP-02","d":"BKP","s":["PR.DS-11"],"ref":"CIS 11.3","q":["Is the backup system isolated from the main domain, with separate credentials and MFA?","ระบบสำรองข้อมูลแยกจากโดเมนหลัก ใช้บัญชีแยกและมี MFA หรือไม่"],"g":["Backup servers not joined to the production domain; separate admin accounts with MFA; backup console not reachable from user networks; backup data encrypted.","เซิร์ฟเวอร์สำรองข้อมูลไม่อยู่ในโดเมนใช้งานจริง ใช้บัญชีผู้ดูแลแยกพร้อม MFA หน้าจอระบบสำรองเข้าจากเครือข่ายผู้ใช้ไม่ได้ และเข้ารหัสข้อมูลสำรอง"]},{"id":"BKP-03","d":"BKP","s":["PR.DS-11","RC.RP-03"],"ref":"CIS 11.5","q":["Are restore tests performed for critical systems, and do they measure actual recovery time against the RTO?","มีการทดสอบกู้คืนระบบสำคัญ และวัดเวลากู้คืนจริงเทียบกับ RTO หรือไม่"],"g":["Full restore test of each critical system at least annually and sample file restores quarterly; results recorded with actual time versus RTO; gaps fed into the improvement plan.","ทดสอบกู้คืนเต็มระบบของแต่ละระบบสำคัญอย่างน้อยปีละครั้ง และสุ่มกู้คืนไฟล์ทุกไตรมาส บันทึกผลพร้อมเวลาจริงเทียบ RTO และนำช่องว่างเข้าแผนปรับปรุง"]},{"id":"BKP-04","d":"BKP","s":["PR.DS-11"],"ref":"CIS 11.2","q":["Are backup jobs monitored daily, and are failures followed up?","มีการเฝ้าดูงานสำรองข้อมูลทุกวัน และติดตามงานที่ล้มเหลวหรือไม่"],"g":["Daily backup report reviewed; failed jobs re-run within 24 hours; coverage checked against the critical system list, including SaaS such as Microsoft 365.","ทบทวนรายงานการสำรองทุกวัน รันงานที่ล้มเหลวใหม่ภายใน 24 ชั่วโมง และตรวจความครอบคลุมเทียบรายการระบบสำคัญ รวมถึง SaaS เช่น Microsoft 365"]},{"id":"BKP-05","d":"BKP","s":["PR.IR-03","RC.RP-02"],"ref":"ISO/IEC 27002:2022 8.14, 5.30","q":["Is there a disaster recovery site or cloud recovery option for critical systems, and has failover been tested?","มีศูนย์สำรองหรือทางเลือกกู้คืนบนคลาวด์สำหรับระบบสำคัญ และเคยทดสอบการสลับการทำงานหรือไม่"],"g":["Recovery capability sized to RTO; documented runbooks; failover test at least annually; recovery order agreed with the business.","ขีดความสามารถในการกู้คืนสอดคล้องกับ RTO มีคู่มือขั้นตอนเป็นลายลักษณ์อักษร ทดสอบการสลับการทำงานอย่างน้อยปีละครั้ง และตกลงลำดับการกู้คืนกับฝ่ายธุรกิจ"]},{"id":"VUL-01","d":"VUL","s":["ID.RA-01"],"ref":"CIS 7.5, 7.6","q":["Are authenticated vulnerability scans run on internal systems, and external scans on interne
