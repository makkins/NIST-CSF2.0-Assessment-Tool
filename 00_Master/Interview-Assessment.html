t-facing assets?","มีการสแกนช่องโหว่แบบยืนยันตัวตนกับระบบภายใน และสแกนจากภายนอกกับทรัพย์สินที่เปิดสู่อินเทอร์เน็ตหรือไม่"],"g":["Internal authenticated scans at least monthly; external scans at least monthly and after changes; scan coverage compared against the asset inventory.","สแกนภายในแบบยืนยันตัวตนอย่างน้อยเดือนละครั้ง สแกนจากภายนอกอย่างน้อยเดือนละครั้งและหลังมีการเปลี่ยนแปลง และเทียบความครอบคลุมกับทะเบียนทรัพย์สิน"]},{"id":"VUL-02","d":"VUL","s":["PR.PS-02","ID.RA-06"],"ref":"CIS 7.3, 7.4, 7.7","q":["What are the patch timelines by severity, and what share of systems meet them?","กำหนดเวลาแพตช์ตามระดับความรุนแรงคือเท่าใด และระบบที่ทำได้ตามกำหนดคิดเป็นสัดส่วนเท่าใด"],"g":["Critical internet-facing within 7 days (actively exploited within 72 hours), critical internal within 14 days, high within 30 days; OS and application patching automated; compliance reported monthly.","ช่องโหว่วิกฤตบนระบบที่เปิดสู่อินเทอร์เน็ตภายใน 7 วัน (ที่ถูกใช้โจมตีจริงภายใน 72 ชั่วโมง) วิกฤตภายในภายใน 14 วัน ระดับสูงภายใน 30 วัน แพตช์ระบบปฏิบัติการและแอปพลิเคชันแบบอัตโนมัติ และรายงานผลทุกเดือน"]},{"id":"VUL-03","d":"VUL","s":["ID.RA-01","ID.IM-02"],"ref":"CIS 18.1, 18.2, 18.3","q":["Is penetration testing performed on critical and internet-facing systems, and are findings fixed and retested?","มีการทดสอบเจาะระบบกับระบบสำคัญและระบบที่เปิดสู่อินเทอร์เน็ต และแก้ไขพร้อมทดสอบซ้ำหรือไม่"],"g":["External penetration test at least annually and after major changes; internal test for critical environments; high findings retested and closed.","ทดสอบเจาะระบบจากภายนอกอย่างน้อยปีละครั้งและหลังการเปลี่ยนแปลงใหญ่ ทดสอบภายในสำหรับสภาพแวดล้อมสำคัญ และทดสอบซ้ำจนปิดข้อตรวจพบระดับสูง"]},{"id":"VUL-04","d":"VUL","s":["ID.RA-02","ID.RA-08"],"ref":"CIS 7.1, 7.2","q":["How are vendor advisories and known exploited vulnerability alerts tracked and acted on?","ติดตามและดำเนินการกับประกาศของผู้ขายและรายการช่องโหว่ที่ถูกใช้โจมตีจริงอย่างไร"],"g":["Subscriptions to vendor advisories, ThaiCERT, and the CISA Known Exploited Vulnerabilities (KEV) catalog; each relevant advisory has a ticket, owner, and due date.","สมัครรับประกาศจากผู้ขาย ThaiCERT และรายการ Known Exploited Vulnerabilities (KEV) ของ CISA ทุกประกาศที่เกี่ยวข้องมีตั๋วงาน เจ้าของ และวันครบกำหนด"]},{"id":"VUL-05","d":"VUL","s":["PR.PS-02","PR.PS-03"],"ref":"CIS 2.2, 12.1","q":["Which operating systems, applications, or network devices are past end of support, and what compensating controls exist?","มีระบบปฏิบัติการ ระบบงาน หรืออุปกรณ์เครือข่ายใดที่หมดการสนับสนุนแล้ว และมีมาตรการชดเชยอะไร"],"g":["End-of-support list maintained; each item isolated, monitored, and approved as a time-bound exception with a replacement plan.","มีรายการระบบหมดการสนับสนุน แต่ละรายการถูกแยกเครือข่าย เฝ้าระวัง และอนุมัติเป็นข้อยกเว้นที่มีกำหนดเวลาพร้อมแผนทดแทน"]},{"id":"LOG-01","d":"LOG","s":["PR.PS-04"],"ref":"CIS 8.2, 8.5, 8.9","q":["Which log sources are collected centrally: domain controllers, firewalls, VPN, email, cloud, EDR, critical applications?","เก็บบันทึกจากแหล่งใดไว้ส่วนกลางบ้าง เช่น Domain Controller ไฟร์วอลล์ VPN อีเมล คลาวด์ EDR และระบบงานสำคัญ"],"g":["All of these sources forward to a central log platform or SIEM; a log source register shows coverage and alerts when a source stops sending.","ทุกแหล่งดังกล่าวส่งบันทึกเข้าแพลตฟอร์มส่วนกลางหรือ SIEM มีทะเบียนแหล่งบันทึกที่แสดงความครอบคลุม และแจ้งเตือนเมื่อแหล่งใดหยุดส่ง"]},{"id":"LOG-02","d":"LOG","s":["PR.PS-04"],"ref":"CIS 8.3, 8.10; Computer Crime Act s.26","q":["How long are logs retained, and are they protected from modification?","เก็บรักษาบันทึกนานเท่าใด และได้รับการปกป้องจากการแก้ไขหรือไม่"],"g":["At least 90 days searchable (Computer Crime Act s.26 where it applies) and 12 months archived for investigations; write-once or access-restricted storage.","ค้นหาได้อย่างน้อย 90 วัน (พ.ร.บ.คอมพิวเตอร์ฯ มาตรา 26 ในกรณีที่ใช้บังคับ) และเก็บถาวร 12 เดือนเพื่อการสืบสวน ใช้ที่จัดเก็บแบบเขียนครั้งเดียวหรือจำกัดสิทธิ์การเข้าถึง"]},{"id":"LOG-03","d":"LOG","s":["PR.PS-04","RS.AN-06"],"ref":"CIS 8.4","q":["Are all systems synchronized to a trusted time source?","ทุกระบบตั้งเวลาให้ตรงกับแหล่งเวลาที่เชื่อถือได้หรือไม่"],"g":["At least two internal NTP servers synced to a trusted source; all servers, network devices, and cloud logs use the same time zone or UTC.","มี NTP Server ภายในอย่างน้อย 2 ตัวที่ซิงก์กับแหล่งที่เชื่อถือได้ และเซิร์ฟเวอร์ อุปกรณ์เครือข่าย และบันทึกคลาวด์ใช้เขตเวลาเดียวกันหรือ UTC"]},{"id":"LOG-04","d":"LOG","s":["DE.CM-01","DE.AE-02","DE.AE-06"],"ref":"CIS 8.11, 13.1","q":["Who monitors security alerts, during which hours, and what is the response time?","ใครเฝ้าดูการแจ้งเตือนด้านความมั่นคงปลอดภัย ในช่วงเวลาใด และเวลาตอบสนองเท่าใด"],"g":["24/7 monitoring in-house or by a managed security service provider (MSSP); critical alerts acknowledged within 15 to 30 minutes; escalation contacts tested.","เฝ้าระวังตลอด 24 ชั่วโมงโดยทีมภายในหรือผู้ให้บริการด้านความมั่นคงปลอดภัย (MSSP) ตอบรับการแจ้งเตือนวิกฤตภายใน 15 ถึง 30 นาที และทดสอบรายชื่อผู้ติดต่อเพื่อยกระดับแล้ว"]},{"id":"LOG-05","d":"LOG","s":["DE.AE-03","DE.CM-03"],"ref":"CIS 8.11; MITRE ATT&CK","q":["Which detection use cases are in place, for example impossible travel, brute force, new admin accounts, mass file changes?","มีกรณีการตรวจจับใดบ้าง เช่น การเข้าสู่ระบบจากสถานที่ที่เป็นไปไม่ได้ การเดารหัสผ่าน การสร้างบัญชีผู้ดูแลใหม่ และการเปลี่ยนแปลงไฟล์จำนวนมาก"],"g":["A documented use case catalog mapped to MITRE ATT&CK, covering at least identity misuse, privilege changes, ransomware behavior, and data exfiltration; rules reviewed quarterly.","มีรายการกรณีการตรวจจับเป็นลายลักษณ์อักษรที่จับคู่กับ MITRE ATT&CK ครอบคลุมอย่างน้อยการใช้ตัวตนผิดปกติ การเปลี่ยนสิทธิ์ พฤติกรรมแรนซัมแวร์ และการนำข้อมูลออก และทบทวนกฎทุกไตรมาส"]},{"id":"LOG-06","d":"LOG","s":["DE.CM-03","PR.AA-05"],"ref":"CIS 8.5, 3.14","q":["Is access to sensitive data and privileged activity logged and reviewed?","มีการบันทึกและทบทวนการเข้าถึงข้อมูลอ่อนไหวและกิจกรรมสิทธิ์สูงหรือไม่"],"g":["Audit logging on in critical applications for read and export of sensitive records; privileged activity reports reviewed at least monthly.","เปิดบันทึกการตรวจสอบในระบบงานสำคัญสำหรับการอ่านและส่งออกข้อมูลอ่อนไหว และทบทวนรายงานกิจกรรมสิทธิ์สูงอย่างน้อยเดือนละครั้ง"]},{"id":"CLD-01","d":"CLD","s":["PR.AA-03","PR.AA-05"],"ref":"CIS 6.3, 6.5; CIS Microsoft 365 Foundations Benchmark","q":["Are legacy authentication protocols blocked and conditional access policies applied in Microsoft 365 or the identity provider?","บล็อกโปรโตคอลการยืนยันตัวตนแบบเก่าและใช้นโยบาย Conditional Access ใน Microsoft 365 หรือผู้ให้บริการตัวตนแล้วหรือไม่"],"g":["Legacy authentication blocked; conditional access requires MFA for all users and compliant devices for admins; risky sign-in policies enabled where licensed.","บล็อกการยืนยันตัวตนแบบเก่า Conditional Access บังคับ MFA กับผู้ใช้ทุกคนและบังคับอุปกรณ์ที่ผ่านเกณฑ์สำหรับผู้ดูแล และเปิดนโยบายการเข้าสู่ระบบที่มีความเสี่ยงเมื่อมีไลเซนส์"]},{"id":"CLD-02","d":"CLD","s":["PR.PS-01","DE.CM-09"],"ref":"CIS Microsoft 365 Foundations Benchmark","q":["Is the cloud tenant configuration reviewed against a benchmark, for example Microsoft Secure Score or the CIS Microsoft 365 Benchmark?","มีการทบทวนการตั้งค่า Cloud Tenant เทียบกับเกณฑ์อ้างอิงหรือไม่ เช่น Microsoft Secure Score หรือ CIS Microsoft 365 Benchmark"],"g":["Secure Score or a configuration assessment tool reviewed monthly with a target; high-impact recommendations tracked to closure; audit logging enabled tenant-wide.","ทบทวน Secure Score หรือเครื่องมือประเมินการตั้งค่าทุกเดือนพร้อมเป้าหมาย ติดตามข้อแนะนำที่มีผลกระทบสูงจนปิด และเปิดบันทึกการตรวจสอบทั้ง Tenant"]},{"id":"CLD-03","d":"CLD","s":["GV.SC-02","PR.DS-11"],"ref":"ISO/IEC 27002:2022 5.23","q":["Is the shared responsibility model documented for each critical cloud service, including who backs up the data?","มีการบันทึกการแบ่งความรับผิดชอบร่วมสำหรับบริการคลาวด์สำคัญแต่ละบริการ รวมถึงผู้รับผิดชอบสำรองข้อมูลหรือไม่"],"g":["Responsibility matrix per service; third-party backup for SaaS data such as Microsoft 365 mail and OneDrive; exit plan for each critical cloud service.","มีตารางความรับผิดชอบรายบริการ ใช้การสำรองข้อมูลจากภายนอกสำหรับข้อมูล SaaS เช่น อีเมลและ OneDrive ของ Microsoft 365 และมีแผนการย้ายออกสำหรับบริการคลาวด์สำคัญ"]},{"id":"CLD-04","d":"CLD","s":["PR.AA-05","DE.CM-06"],"ref":"CIS 6.8","q":["How many global or subscription owner administrators exist in each cloud platform, and are their activities monitored?","แต่ละแพลตฟอร์มคลาวด์มีผู้ดูแลระดับ Global หรือ Subscription Owner กี่ราย และมีการเฝ้าระวังกิจกรรมของเขาหรือไม่"],"g":["Two to four global administrators with phishing-resistant MFA; just-in-time role activation (for example Privileged Identity Management); alerts on role assignment changes.","มีผู้ดูแลระดับ Global 2 ถึง 4 ราย ใช้ MFA ที่ทนต่อฟิชชิง เปิดบทบาทเฉพาะเมื่อจำเป็น (เช่น Privileged Identity Management) และแจ้งเตือนเมื่อมีการเปลี่ยนบทบาท"]},{"id":"APP-01","d":"APP","s":["PR.PS-06"],"ref":"CIS 16.1, 16.9","q":["Is there a secure development process, and are developers trained in secure coding (for example OWASP Top 10)?","มีกระบวนการพัฒนาอย่างปลอดภัย และนักพัฒนาได้รับการอบรมการเขียนโค้ดอย่างปลอดภัย (เช่น OWASP Top 10) หรือไม่"],"g":["Security requirements defined at design; developers trained at least annually; outsourced developers bound to the same standard by contract.","กำหนดข้อกำหนดด้านความมั่นคงปลอดภัยตั้งแต่การออกแบบ อบรมนักพัฒนาอย่างน้อยปีละครั้ง และผูกผู้รับจ้างพัฒนาให้ใช้มาตรฐานเดียวกันผ่านสัญญา"]},{"id":"APP-02","d":"APP","s":["PR.PS-06","ID.RA-01"],"ref":"CIS 16.12, 16.13","q":["Is code scanned (static and dependency analysis) and are applications tested for security before go-live?","มีการสแกนโค้ด (การวิเคราะห์แบบสถิตและไลบรารีที่ใช้) และทดสอบความมั่นคงปลอดภัยของระบบงานก่อนเปิดใช้หรือไม่"],"g":["Static application security testing (SAST) and software composition analysis (SCA) in the build pipeline; application penetration test before go-live for internet-facing systems; high findings fixed before release.","ใช้การทดสอบความมั่นคงปลอดภัยแบบสถิต (SAST) และการวิเคราะห์ส่วนประกอบซอฟต์แวร์ (SCA) ในขั้นตอน Build ทดสอบเจาะระบบงานก่อนเปิดใช้สำหรับระบบที่เปิดสู่อินเทอร์เน็ต และแก้ข้อตรวจพบระดับสูงก่อนเผยแพร่"]},{"id":"APP-03","d":"APP","s":["PR.PS-06","PR.IR-01"],"ref":"CIS 16.8","q":["Are development, test, and production environments separated, and is production data masked in test?","แยกสภาพแวดล้อมการพัฒนา ทดสอบ และใช้งานจริง และปิดบังข้อมูลจริงในสภาพแวดล้อมทดสอบหรือไม่"],"g":["Separate environments and accounts; developers have no standing production access; real personal data masked or synthetic in non-production.","แยกสภาพแวดล้อมและบัญชี นักพัฒนาไม่มีสิทธิ์เข้าระบบจริงแบบถาวร และใช้ข้อมูลที่ปิดบังหรือข้อมูลสังเคราะห์แทนข้อมูลส่วนบุคคลจริงนอกระบบใช้งานจริง"]},{"id":"APP-04","d":"APP","s":["PR.PS-06","GV.SC-09"],"ref":"CIS 16.4, 16.2","q":["Are third-party libraries and components tracked, and is there a process to fix reported vulnerabilities in your applications?","มีการติดตามไลบรารีและส่วนประกอบจากภายนอก และมีกระบวนการแก้ช่องโหว่ที่ได้รับแจ้งในระบบงานหรือไม่"],"g":["Component inventory or software bill of materials (SBOM) per application; vulnerable components updated within defined timelines; intake channel for vulnerability reports.","มีทะเบียนส่วนประกอบหรือรายการส่วนประกอบซอฟต์แวร์ (SBOM) ของแต่ละระบบ อัปเดตส่วนประกอบที่มีช่องโหว่ภายในเวลาที่กำหนด และมีช่องทางรับแจ้งช่องโหว่"]},{"id":"APP-05","d":"APP","s":["PR.IR-01","DE.CM-09"],"ref":"CIS 13.10","q":["Are internet-facing web applications protected by a web application firewall (WAF)?","เว็บแอปพลิเคชันที่เปิดสู่อินเทอร์เน็ตได้รับการป้องกันด้วย Web Application Firewall (WAF) หรือไม่"],"g":["WAF in blocking mode for critical internet-facing applications with the OWASP core rule set; WAF logs sent to the SIEM.","ใช้ WAF ในโหมดบล็อกกับระบบงานสำคัญที่เปิดสู่อินเทอร์เน็ตด้วยชุดกฎหลักของ OWASP และส่งบันทึก WAF เข้า SIEM"]},{"id":"SUP-01","d":"SUP","s":["GV.SC-04","DE.CM-06"],"ref":"CIS 15.1, 6.1","q":["Is there a list of suppliers with remote or privileged access, and is their access approved per session or time-limited?","มีรายชื่อผู้ให้บริการที่มีสิทธิ์เข้าถึงระยะไกลหรือสิทธิ์สูง และการเข้าถึงได้รับอนุมัติเป็นรายครั้งหรือจำกัดเวลาหรือไม่"],"g":["Named accounts for each vendor engineer; access enabled on request and disabled after use; MFA required; sessions logged or recorded.","บัญชีระบุชื่อสำหรับวิศวกรของผู้ขายแต่ละคน เปิดสิทธิ์เมื่อขอและปิดหลังใช้งาน บังคับ MFA และบันทึกหรืออัดเซสชัน"]},{"id":"SUP-02","d":"SUP","s":["DE.CM-06"],"ref":"CIS 15.6","q":["Are vendor remote access tools (for example TeamViewer or AnyDesk) controlled, or can vendors install them freely?","เครื่องมือควบคุมระยะไกลของผู้ขาย (เช่น TeamViewer หรือ AnyDesk) ได้รับการควบคุม หรือผู้ขายติดตั้งได้อย่างอิสระ"],"g":["One approved remote access method; unapproved remote tools blocked by application control and detected by EDR.","มีวิธีเข้าถึงระยะไกลที่อนุมัติวิธีเดียว และบล็อกเครื่องมือที่ไม่ได้อนุมัติด้วยการควบคุมแอปพลิเคชัน และตรวจจับด้วย EDR"]},{"id":"SUP-03","d":"SUP","s":["GV.SC-10"],"ref":"CIS 15.7","q":["When a supplier contract ends, are accounts, VPN profiles, and firewall rules removed?","เมื่อสัญญาผู้ให้บริการสิ้นสุด มีการลบบัญชี โปรไฟล์ VPN และกฎไฟร์วอลล์หรือไม่"],"g":["Supplier offboarding checklist covers accounts, keys, certificates, VPN, firewall rules, and data return or destruction; completion signed off.","รายการตรวจสอบการยุติผู้ให้บริการครอบคลุมบัญชี กุญแจ ใบรับรอง VPN กฎไฟร์วอลล์ และการคืนหรือทำลายข้อมูล และลงนามรับรองเมื่อเสร็จ"]},{"id":"OT-01","d":"OT","s":["ID.AM-01","ID.AM-05"],"ref":"NIST SP 800-82 Rev. 3; IEC 62443-2-1","q":["Is there an inventory of OT and medical devices with operating system version, network location, and vendor support status?","มีทะเบียนระบบ OT และอุปกรณ์การแพทย์ ที่ระบุเวอร์ชันระบบปฏิบัติการ ตำแหน่งบนเครือข่าย และสถานะการสนับสนุนจากผู้ขายหรือไม่"],"g":["Complete inventory built with passive discovery where possible; each device has a clinical or production owner, criticality, and patch support status.","มีทะเบียนครบถ้วนที่สร้างจากการสำรวจแบบ Passive เมื่อทำได้ ทุกอุปกรณ์มีเจ้าของฝั่งคลินิกหรือฝั่งผลิต ระดับความสำคัญ และสถานะการรองรับแพตช์"]},{"id":"OT-02","d":"OT","s":["PR.IR-01"],"ref":"NIST SP 800-82 Rev. 3; IEC 62443-3-3","q":["Are OT and medical devices on separate network zones with only required traffic allowed?","ระบบ OT และอุปกรณ์การแพทย์อยู่ในโซนเครือข่ายแยก และอนุญาตเฉพาะการรับส่งข้อมูลที่จำเป็นหรือไม่"],"g":["Dedicated VLANs or zones per device class; firewall allowlists to the systems they must reach (for example PACS or HIS); no direct internet access.","มี VLAN หรือโซนแยกตามประเภทอุปกรณ์ ไฟร์วอลล์อนุญาตเฉพาะระบบที่ต้องเชื่อมต่อ (เช่น PACS หรือ HIS) และไม่เชื่อมต่ออินเทอร์เน็ตโดยตรง"]},{"id":"OT-03","d":"OT","s":["PR.PS-02","GV.SC-05"],"ref":"NIST SP 800-82 Rev. 3","q":["How are unpatchable or legacy devices protected, and do vendor contracts cover patching and remote support security?","ป้องกันอุปกรณ์รุ่นเก่าหรือที่แพตช์ไม่ได้อย่างไร และสัญญากับผู้ขายครอบคลุมการแพตช์และความมั่นคงปลอดภัยของการสนับสนุนระยะไกลหรือไม่"],"g":["Compensating controls (isolation, allowlisting, monitoring) for each unpatchable device; contracts require security updates and controlled remote access.","มีมาตรการชดเชย (แยกเครือข่าย อนุญาตเฉพาะโปรแกรม และเฝ้าระวัง) สำหรับอุปกรณ์ที่แพตช์ไม่ได้ และสัญญากำหนดให้ผู้ขายให้อัปเดตด้านความมั่นคงปลอดภัยและควบคุมการเข้าถึงระยะไกล"]},{"id":"PHY-01","d":"PHY","s":["PR.AA-06"],"ref":"ISO/IEC 27002:2022 7.2, 7.3","q":["Is access to the server room and network closets restricted by card or key, with the access list reviewed?","การเข้าห้องเซิร์ฟเวอร์และตู้เครือข่ายจำกัดด้วยบัตรหรือกุญแจ และทบทวนรายชื่อผู้มีสิทธิ์หรือไม่"],"g":["Electronic access control with logs; access list reviewed at least quarterly; visitors signed in and escorted; network closets locked.","ใช้ระบบควบคุมการเข้าออกแบบอิเล็กทรอนิกส์ที่มีบันทึก ทบทวนรายชื่ออย่างน้อยทุกไตรมาส ผู้มาติดต่อลงชื่อและมีผู้นำพา และล็อกตู้เครือข่าย"]},{"id":"PHY-02","d":"PHY","s":["DE.CM-02"],"ref":"ISO/IEC 27002:2022 7.4","q":["Are CCTV and door alarms in place for restricted areas, and are alerts monitored?","มีกล้องวงจรปิดและสัญญาณเตือนประตูในพื้นที่หวงห้าม และมีการเฝ้าดูการแจ้งเตือนหรือไม่"],"g":["CCTV covers entrances to restricted areas with footage kept at least 30 days; door-forced and door-held alarms go to security staff.","กล้องครอบคลุมทางเข้าพื้นที่หวงห้ามและเก็บภาพอย่างน้อย 30 วัน และสัญญาณเตือนประตูถูกงัดหรือเปิดค้างส่งถึงเจ้าหน้าที่รักษาความปลอดภัย"]},{"id":"PHY-03","d":"PHY","s":["PR.IR-02"],"ref":"ISO/IEC 27002:2022 7.5, 7.11","q":["Is the server room protected with UPS, generator, cooling, fire suppression, and temperature and water sensors, and are they tested?","ห้องเซิร์ฟเวอร์มี UPS เครื่องกำเนิดไฟฟ้า ระบบทำความเย็น ระบบดับเพลิง และเซนเซอร์อุณหภูมิและน้ำรั่ว และมีการทดสอบหรือไม่"],"g":["UPS sized for orderly shutdown or generator start; generator tested monthly under load; redundant cooling; gas-based suppression; sensor alerts sent 24/7.","UPS รองรับการปิดระบบอย่างเป็นลำดับหรือจนเครื่องกำเนิดไฟฟ้าทำงาน ทดสอบเครื่องกำเนิดไฟฟ้าแบบมีโหลดทุกเดือน ระบบทำความเย็นสำรอง ระบบดับเพลิงแบบก๊าซ และส่งการแจ้งเตือนจากเซนเซอร์ตลอด 24 ชั่วโมง"]},{"id":"IR-01","d":"IR","s":["RS.MA-01","RS.MI-01"],"ref":"CIS 17.4, 17.5","q":["Are incident response playbooks in place for ransomware, phishing or business email compromise, and compromised accounts?","มีคู่มือปฏิบัติการรับมือเหตุการณ์สำหรับแรนซัมแวร์ ฟิชชิงหรือการแอบอ้างอีเมลธุรกิจ และบัญชีถูกยึดหรือไม่"],"g":["Playbooks with technical steps, decision points, and contacts; stored offline as well as online; reviewed annually and after incidents.","คู่มือมีขั้นตอนทางเทคนิค จุดตัดสินใจ และผู้ติดต่อ เก็บทั้งแบบออฟไลน์และออนไลน์ และทบทวนทุกปีและหลังเกิดเหตุ"]},{"id":"IR-02","d":"IR","s":["RS.MI-01"],"ref":"CIS 17.4; EDR capability","q":["Can the team isolate a host, disable an account, and block an indicator across the environment within minutes?","ทีมแยกเครื่อง ระงับบัญชี และบล็อกตัวบ่งชี้ทั่วทั้งระบบได้ภายในไม่กี่นาทีหรือไม่"],"g":["EDR network isolation available to on-call staff; documented steps to disable accounts and revoke sessions in on-premises and cloud identity; tested in exercises.","เจ้าหน้าที่ตามเวรใช้ฟังก์ชันแยกเครื่องของ EDR ได้ มีขั้นตอนระงับบัญชีและยกเลิกเซสชันทั้งในระบบภายในและคลาวด์ และทดสอบในการฝึกซ้อม"]},{"id":"IR-03","d":"IR","s":["RS.AN-07","RS.AN-06"],"ref":"CIS 17.4; NIST SP 800-86","q":["Is there forensic capability, either in-house tools or a retainer, to collect memory, disk, and log evidence?","มีขีดความสามารถด้านนิติวิทยาศาสตร์ดิจิทัลหรือไม่ ไม่ว่าเครื่องมือภายในหรือสัญญาจ้างล่วงหน้า เพื่อเก็บหลักฐานจากหน่วยความจำ ดิสก์ และบันทึก"],"g":["Incident response retainer with agreed response time, or trained staff with tools; evidence handling and chain of custody procedure; evidence storage location defined.","มีสัญญาจ้างล่วงหน้าด้านรับมือเหตุการณ์ที่กำหนดเวลาตอบสนอง หรือมีเจ้าหน้าที่ที่ผ่านการอบรมพร้อมเครื่องมือ มีขั้นตอนจัดการหลักฐานและห่วงโซ่การครอบครอง และกำหนดที่เก็บหลักฐาน"]},{"id":"IR-04","d":"IR","s":["ID.IM-02","ID.IM-04"],"ref":"CIS 17.7, 17.8","q":["Are technical incident response exercises or tabletop exercises run, and are post-incident reviews held?","มีการฝึกซ้อมการรับมือเหตุการณ์ทางเทคนิคหรือการฝึกซ้อมบนโต๊ะ และจัดการทบทวนหลังเหตุการณ์หรือไม่"],"g":["At least one tabletop per year with management and one technical drill; lessons-learned review within two weeks of significant incidents; actions tracked.","ฝึกซ้อมบนโต๊ะร่วมกับผู้บริหารอย่างน้อยปีละครั้งและซ้อมทางเทคนิคหนึ่งครั้ง ทบทวนบทเรียนภายใน 2 สัปดาห์หลังเหตุการณ์สำคัญ และติดตามการดำเนินการ"]},{"id":"IR-05","d":"IR","s":["RS.CO-02","RS.MA-04"],"ref":"CIS 17.2, 17.6","q":["Is there an out-of-band communication channel and a current contact list for incidents?","มีช่องทางสื่อสารสำรองที่แยกจากระบบปกติ และรายชื่อผู้ติดต่อที่เป็นปัจจุบันสำหรับเหตุการณ์หรือไม่"],"g":["Contact list for internal, supplier, regulator, and insurer contacts reviewed quarter :"X","n":["B Important","B สำคัญ"]},{"c":"C","r":"X","n":["C Supporting","C สนับสนุน"]}],"samp":null,"ex":[]}],"devOrigins":["cotsc","inh","out"],"rubric":{"GV.OC":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Cybersecurity is discussed without reference to the mission, stakeholders, or legal duties. No record of requirements.","พูดถึงความมั่นคงปลอดภัยโดยไม่เชื่อมกับพันธกิจ ผู้มีส่วนได้เสีย หรือหน้าที่ตามกฎหมาย ไม่มีการบันทึกข้อกำหนด"],"2":["Leadership knows key services, stakeholders, and legal duties (for example CII, PDPA). Some are written down but not maintained or used in decisions.","ผู้บริหารรู้บริการหลัก ผู้มีส่วนได้เสีย และหน้าที่ตามกฎหมาย (เช่น CII, PDPA) มีบันทึกบางส่วนแต่ไม่ปรับปรุงและไม่ใช้ประกอบการตัดสินใจ"],"3":["Approved scope statement, legal and regulatory requirements register, and critical service and dependency list. Reviewed at least annually and on major change. Used to set priorities.","มีขอบเขต ทะเบียนข้อกำหนดตามกฎหมายและหน่วยงานกำกับ และรายการบริการสำคัญกับการพึ่งพา ที่อนุมัติแล้ว ทบทวนอย่างน้อยปีละครั้งและเมื่อมีการเปลี่ยนแปลงสำคัญ และใช้กำหนดลำดับความสำคัญ"],"4":["Context is updated as business, threat, and regulatory changes occur. Stakeholder expectations are tracked and drive program changes.","ปรับบริบทตามการเปลี่ยนแปลงของธุรกิจ ภัยคุกคาม และกฎหมาย ติดตามความคาดหวังของผู้มีส่วนได้เสียและใช้ปรับแผนงาน"]},"GV.RM":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["No risk appetite or risk method. Risks are handled case by case.","ไม่มีระดับความเสี่ยงที่ยอมรับได้และไม่มีวิธีบริหารความเสี่ยง จัดการเป็นรายกรณี"],"2":["Management accepts cybersecurity as a business risk. A risk method or appetite exists in draft or for IT only.","ผู้บริหารยอมรับว่าความมั่นคงปลอดภัยเป็นความเสี่ยงทางธุรกิจ มีวิธีหรือระดับความเสี่ยงที่ยอมรับได้ในรูปแบบร่าง หรือใช้เฉพาะ IT"],"3":["Approved risk appetite and tolerance, one standard risk method, and cybersecurity risk in enterprise risk reporting. Applied consistently and reviewed annually.","มีระดับความเสี่ยงที่ยอมรับได้ที่อนุมัติแล้ว วิธีประเมินความเสี่ยงมาตรฐานเดียว และรายงานความเสี่ยงไซเบอร์ในระดับองค์กร ใช้สม่ำเสมอและทบทวนทุกปี"],"4":["Appetite and method are adjusted from performance data and threat changes. Cyber risk is expressed in financial terms and used in investment decisions.","ปรับระดับความเสี่ยงและวิธีการจากข้อมูลผลการดำเนินงานและภัยคุกคาม แสดงความเสี่ยงไซเบอร์เป็นตัวเงินและใช้ตัดสินใจลงทุน"]},"GV.RR":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Security duties fall on IT staff informally. No accountable executive.","งานความมั่นคงปลอดภัยตกอยู่กับเจ้าหน้าที่ IT อย่างไม่เป็นทางการ ไม่มีผู้บริหารที่รับผิดชอบ"],"2":["A person holds security duties with management support, but authority, resources, and roles across departments are unclear.","มีผู้รับผิดชอบงานความมั่นคงปลอดภัยและผู้บริหารสนับสนุน แต่อำนาจ ทรัพยากร และบทบาทข้ามหน่วยงานยังไม่ชัด"],"3":["Approved roles and RACI matrix, a named accountable executive, a defined reporting line, and a planned budget. HR practices include security. Reviewed annually.","มีบทบาทและ RACI ที่อนุมัติแล้ว ผู้บริหารที่รับผิดชอบ สายการรายงาน และงบประมาณที่วางแผนไว้ งานบุคคลครอบคลุมเรื่องความมั่นคงปลอดภัย ทบทวนทุกปี"],"4":["Roles, staffing, and skills are adjusted from performance and workload data. Security accountability is part of leaders' performance goals.","ปรับบทบาท กำลังคน และทักษะจากข้อมูลผลงานและภาระงาน ความรับผิดชอบด้านความมั่นคงปลอดภัยเป็นส่วนหนึ่งของเป้าหมายผลงานผู้บริหาร"]},"GV.PO":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["No approved policy, or an outdated draft not communicated.","ไม่มีนโยบายที่อนุมัติ หรือมีเพียงร่างเก่าที่ไม่ได้สื่อสาร"],"2":["A policy is approved but outdated, incomplete, or not communicated to all staff.","มีนโยบายที่อนุมัติแล้ว แต่ล้าสมัย ไม่ครบ หรือไม่ได้สื่อสารให้พนักงานทุกคน"],"3":["An approved policy set aligned with the risk strategy, communicated, acknowledged, enforced, and reviewed at least annually. Exceptions are recorded.","มีชุดนโยบายที่อนุมัติและสอดคล้องกับกลยุทธ์ความเสี่ยง สื่อสาร รับทราบ บังคับใช้ และทบทวนอย่างน้อยปีละครั้ง บันทึกการยกเว้น"],"4":["Policies change promptly after incidents, audit results, and threat changes. Policy compliance is measured.","ปรับนโยบายทันทีหลังเกิดเหตุ ผลการตรวจสอบ และภัยคุกคามที่เปลี่ยนไป และวัดการปฏิบัติตามนโยบาย"]},"GV.OV":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Leadership receives no regular cybersecurity reporting.","ผู้บริหารไม่ได้รับรายงานด้านความมั่นคงปลอดภัยเป็นประจำ"],"2":["Leadership receives occasional updates, usually after events. No review of strategy results.","ผู้บริหารได้รับข้อมูลเป็นครั้งคราว มักหลังเกิดเหตุ ไม่มีการทบทวนผลของกลยุทธ์"],"3":["Scheduled reporting to a steering committee or board with defined metrics. Strategy and performance are reviewed at least annually and decisions are recorded.","รายงานต่อคณะกรรมการตามรอบด้วยตัวชี้วัดที่กำหนด ทบทวนกลยุทธ์และผลการดำเนินงานอย่างน้อยปีละครั้งและบันทึกการตัดสินใจ"],"4":["Oversight uses trend metrics and independent assurance. Strategy changes based on results.","การกำกับใช้แนวโน้มตัวชี้วัดและการตรวจสอบอิสระ และปรับกลยุทธ์ตามผลลัพธ์"]},"GV.SC":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Suppliers are selected and managed without security criteria.","คัดเลือกและบริหารผู้ให้บริการโดยไม่มีเกณฑ์ด้านความมั่นคงปลอดภัย"],"2":["Security clauses or questionnaires are used for some suppliers, mostly at onboarding. No supplier criticality.","ใช้ข้อสัญญาหรือแบบสอบถามด้านความมั่นคงปลอดภัยกับผู้ให้บริการบางราย ส่วนใหญ่ตอนเริ่มใช้ ไม่มีการจัดระดับความสำคัญ"],"3":["Supplier inventory with criticality. Security requirements in contracts with critical suppliers. Due diligence, monitoring, and offboarding run consistently. Supplier risk is in the risk register.","มีทะเบียนผู้ให้บริการพร้อมระดับความสำคัญ มีข้อกำหนดในสัญญากับผู้ให้บริการสำคัญ ตรวจสอบก่อนใช้ ติดตาม และยุติบริการอย่างสม่ำเสมอ ความเสี่ยงอยู่ในทะเบียนความเสี่ยง"],"4":["Supplier risk is monitored continuously. Incident plans are coordinated with critical suppliers. The program changes based on supplier performance and incidents.","ติดตามความเสี่ยงผู้ให้บริการต่อเนื่อง ประสานแผนรับมือเหตุการณ์กับผู้ให้บริการสำคัญ และปรับแผนงานตามผลงานและเหตุการณ์"]},"ID.AM":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["No reliable inventory. Knowledge sits with individuals.","ไม่มีทะเบียนที่เชื่อถือได้ ความรู้อยู่กับตัวบุคคล"],"2":["Inventories exist for some asset types or sites but are incomplete, unowned, or out of date.","มีทะเบียนสำหรับบางประเภทหรือบางสถานที่ แต่ไม่ครบ ไม่มีเจ้าของ หรือไม่เป็นปัจจุบัน"],"3":["Inventories of hardware, software, services, data, and network flows with owners and criticality, covering all in-scope sites. Updated through change management and reconciled at least every six months.","มีทะเบียนฮาร์ดแวร์ ซอฟต์แวร์ บริการ ข้อมูล และการไหลของเครือข่าย พร้อมเจ้าของและระดับความสำคัญ ครบทุกสถานที่ในขอบเขต ปรับผ่านการควบคุมการเปลี่ยนแปลงและกระทบยอดอย่างน้อยทุกหกเดือน"],"4":["Inventories update automatically in near real time. Discrepancies are detected and resolved. Criticality drives control selection.","ทะเบียนปรับอัตโนมัติแบบเกือบทันที ตรวจพบและแก้ความคลาดเคลื่อน ระดับความสำคัญใช้กำหนดการควบคุม"]},"ID.RA":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Risks and vulnerabilities are found only after events or by vendors.","พบความเสี่ยงและช่องโหว่หลังเกิดเหตุหรือเมื่อผู้ขายแจ้งเท่านั้น"],"2":["Vulnerability scans or risk assessments happen occasionally or for some systems. Results are not tracked to closure.","สแกนช่องโหว่หรือประเมินความเสี่ยงเป็นครั้งคราวหรือบางระบบ ไม่ได้ติดตามผลจนปิด"],"3":["Scheduled risk assessments using the approved method. Vulnerability scanning of in-scope assets with remediation timelines. Threat information is used. The risk register is maintained and reviewed.","ประเมินความเสี่ยงตามรอบด้วยวิธีที่อนุมัติ สแกนช่องโหว่ทรัพย์สินในขอบเขตพร้อมกำหนดเวลาแก้ไข ใช้ข้อมูลภัยคุกคาม ดูแลและทบทวนทะเบียนความเสี่ยง"],"4":["Threat and exposure data update risk scenarios continuously. The effectiveness of risk responses is measured.","ใช้ข้อมูลภัยคุกคามและการเปิดเผยปรับสถานการณ์ความเสี่ยงต่อเนื่อง และวัดประสิทธิผลของการจัดการความเสี่ยง"]},"ID.IM":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Improvements are not recorded. Lessons from events are not captured.","ไม่บันทึกการปรับปรุง ไม่เก็บบทเรียนจากเหตุการณ์"],"2":["Lessons learned or audit findings are recorded for some events, but follow-up is not tracked.","บันทึกบทเรียนหรือข้อตรวจพบบางเหตุการณ์ แต่ไม่ติดตามผล"],"3":["An improvement register fed by assessments, audits, exercises, and incidents. Corrective actions are owned and tracked to closure. Exercises are planned annually.","มีทะเบียนการปรับปรุงจากการประเมิน การตรวจสอบ การซ้อม และเหตุการณ์ มีเจ้าของและติดตามจนปิด วางแผนการซ้อมทุกปี"],"4":["Improvement is continuous and data-driven. The effect of each change is verified.","ปรับปรุงต่อเนื่องด้วยข้อมูล และตรวจสอบผลของทุกการเปลี่ยนแปลง"]},"PR.AA":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Accounts are created and removed on request. Shared accounts are common and multi-factor authentication (MFA) is absent.","สร้างและลบบัญชีตามคำขอ ใช้บัญชีร่วมกันทั่วไป และไม่มี MFA"],"2":["Identity and access practices are approved and applied to some systems. MFA or access reviews are partial.","แนวปฏิบัติด้านตัวตนและสิทธิ์ได้รับอนุมัติและใช้กับบางระบบ MFA หรือการทบทวนสิทธิ์ยังไม่ครบ"],"3":["An identity and authentication standard is enforced across in-scope systems. MFA covers remote, privileged, and critical access. Joiner, mover, and leaver steps are linked to HR. Privileged accounts are limited and logged. Access is reviewed at defined intervals.","บังคับใช้มาตรฐานตัวตนและการยืนยันตัวตนทุกระบบในขอบเขต MFA ครอบคลุมการเข้าถึงระยะไกล สิทธิ์สูง และระบบสำคัญ การเข้า ย้าย ออกเชื่อมกับ HR จำกัดและบันทึกบัญชีสิทธิ์สูง และทบทวนสิทธิ์ตามรอบ"],"4":["Access decisions are risk-based (conditional access, just-in-time privilege). Access anomalies are detected automatically. Review results drive role redesign.","ตัดสินใจให้สิทธิ์ตามความเสี่ยง (Conditional access, Just-in-time privilege) ตรวจจับความผิดปกติอัตโนมัติ และใช้ผลทบทวนออกแบบบทบาทใหม่"]},"PR.AT":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["No structured awareness training.","ไม่มีการอบรมสร้างความตระหนักอย่างเป็นระบบ"],"2":["Training happens at onboarding or occasionally. No role-based content or completion tracking.","อบรมตอนเริ่มงานหรือเป็นครั้งคราว ไม่มีเนื้อหาตามบทบาทและไม่ติดตามการเข้าอบรม"],"3":["An annual awareness program for all staff with completion tracking. Role-based training for privileged users, developers, and executives. Phishing exercises.","มีโปรแกรมสร้างความตระหนักประจำปีสำหรับทุกคนพร้อมติดตามผล อบรมตามบทบาทสำหรับผู้มีสิทธิ์สูง นักพัฒนา และผู้บริหาร และมีการทดสอบฟิชชิง"],"4":["Training changes based on phishing results, incidents, and behavior metrics. Behavior change is measured.","ปรับการอบรมตามผลฟิชชิง เหตุการณ์ และตัวชี้วัดพฤติกรรม และวัดการเปลี่ยนพฤติกรรม"]},"PR.DS":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Data protection depends on individual practice. Backups are irregular.","การปกป้องข้อมูลขึ้นกับแต่ละบุคคล สำรองข้อมูลไม่สม่ำเสมอ"],"2":["Encryption and backups cover some systems. Data classification is not defined or not applied.","การเข้ารหัสและสำรองข้อมูลครอบคลุมบางระบบ ไม่มีหรือไม่ได้ใช้การจัดชั้นข้อมูล"],"3":["Data classification is applied. Sensitive data is encrypted at rest and in transit. Backups have an offline or immutable copy and restores are tested at defined intervals across in-scope systems.","ใช้การจัดชั้นข้อมูล เข้ารหัสข้อมูลอ่อนไหวขณะจัดเก็บและส่งผ่าน มีสำเนาสำรองแบบ Offline หรือ Immutable และทดสอบกู้คืนตามรอบทุกระบบในขอบเขต"],"4":["Data protection controls are monitored and tuned, for example data loss prevention (DLP). Backup and restore performance is measured against recovery objectives.","เฝ้าระวังและปรับการควบคุมการปกป้องข้อมูล เช่น DLP และวัดผลการสำรองและกู้คืนเทียบกับเป้าหมายการกู้คืน"]},"PR.PS":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Systems are configured and patched case by case. Unsupported software is common.","ตั้งค่าและแพตช์ระบบเป็นรายกรณี มีซอฟต์แวร์ที่หมดการสนับสนุนจำนวนมาก"],"2":["Baselines or patching exist for some platforms. Logging and software control are partial.","มี Baseline หรือการแพตช์บางแพลตฟอร์ม การบันทึกและการควบคุมซอฟต์แวร์ยังไม่ครบ"],"3":["Secure configuration baselines, patching within defined timelines, end-of-life management, log generation, and software control apply to in-scope platforms. In-house software follows secure development. Compliance is checked.","ใช้ Secure configuration baseline แพตช์ตามกำหนดเวลา จัดการระบบหมดอายุ สร้างบันทึก และควบคุมซอฟต์แวร์ทุกแพลตฟอร์มในขอบเขต ซอฟต์แวร์ที่พัฒนาเองใช้การพัฒนาที่ปลอดภัย และตรวจการปฏิบัติตาม"],"4":["Configuration drift and patch compliance are monitored automatically. Exceptions are risk-assessed and time-bound.","เฝ้าระวังการเบี่ยงเบนของการตั้งค่าและการแพตช์อัตโนมัติ ข้อยกเว้นมีการประเมินความเสี่ยงและมีกำหนดเวลา"]},"PR.IR":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["The network is largely flat. No resilience planning for capacity or environmental threats.","เครือข่ายส่วนใหญ่ไม่แบ่งส่วน ไม่มีแผนรองรับด้านความจุหรือภัยด้านสิ่งแวดล้อม"],"2":["Some segmentation and resilience measures exist but are not based on risk or not documented.","มีการแบ่งส่วนเครือข่ายและมาตรการรองรับบางส่วน แต่ไม่ได้อิงความเสี่ยงหรือไม่มีเอกสาร"],"3":["The network is segmented by risk with filtered access. Resilience mechanisms meet agreed recovery needs for critical services. Capacity and environmental protection are reviewed.","แบ่งส่วนเครือข่ายตามความเสี่ยงและกรองการเข้าถึง กลไกรองรับตอบสนองความต้องการกู้คืนของบริการสำคัญ ทบทวนความจุและการป้องกันด้านสิ่งแวดล้อม"],"4":["Architecture changes based on threat and performance data. Resilience is tested regularly under realistic conditions.","ปรับสถาปัตยกรรมจากข้อมูลภัยคุกคามและผลการทำงาน ทดสอบความทนทานสม่ำเสมอในสภาพใกล้เคียงจริง"]},"DE.CM":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Monitoring happens only when users report problems.","เฝ้าระวังเฉพาะเมื่อผู้ใช้แจ้งปัญหา"],"2":["Some logs or antimalware alerts are collected. Review is irregular or limited to some systems.","เก็บบันทึกหรือการแจ้งเตือนจาก Antimalware บางส่วน ตรวจดูไม่สม่ำเสมอหรือบางระบบ"],"3":["Networks, endpoints, user activity, and service providers are monitored for in-scope assets through central logging or a security operations function, with defined review and escalation.","เฝ้าระวังเครือข่าย เครื่องลูกข่าย กิจกรรมผู้ใช้ และผู้ให้บริการของทรัพย์สินในขอบเขต ผ่านระบบบันทึกส่วนกลางหรือหน่วยปฏิบัติการด้านความมั่นคงปลอดภัย พร้อมขั้นตอนตรวจดูและยกระดับ"],"4":["Monitoring is tuned continuously from threat information and incidents. Monitoring coverage is measured.","ปรับการเฝ้าระวังต่อเนื่องจากข้อมูลภัยคุกคามและเหตุการณ์ และวัดความครอบคลุม"]},"DE.AE":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Alerts are not analyzed. Users notice events first.","ไม่วิเคราะห์การแจ้งเตือน ผู้ใช้พบเหตุการณ์ก่อน"],"2":["IT staff analyze some alerts when time allows. No criteria to declare an incident.","เจ้าหน้าที่ IT วิเคราะห์การแจ้งเตือนบางรายการเมื่อมีเวลา ไม่มีเกณฑ์ประกาศเหตุการณ์"],"3":["A defined triage and correlation process with detection use cases. Incident declaration criteria exist. Events are analyzed within defined times.","มีกระบวนการคัดกรองและเชื่อมโยงพร้อม Use case การตรวจจับ มีเกณฑ์ประกาศเหตุการณ์ และวิเคราะห์ภายในเวลาที่กำหนด"],"4":["Analysis is automated and enriched with threat information. Use cases improve from lessons learned.","วิเคราะห์อัตโนมัติและเสริมด้วยข้อมูลภัยคุกคาม ปรับ Use case จากบทเรียน"]},"RS.MA":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Incidents are handled ad hoc by whoever is available.","จัดการเหตุการณ์เฉพาะหน้าโดยใครก็ได้ที่ว่าง"],"2":["An incident response plan exists but is untested or unknown to some responders. Contacts are partly defined.","มีแผนรับมือเหตุการณ์ แต่ยังไม่ทดสอบหรือผู้รับมือบางคนไม่รู้จัก รายชื่อผู้ติดต่อยังไม่ครบ"],"3":["An approved incident response plan and playbooks for priority scenarios. Roles and contacts are current. The plan is exercised at least annually. Incidents are recorded.","มีแผนรับมือเหตุการณ์ที่อนุมัติและ Playbook สำหรับสถานการณ์สำคัญ บทบาทและผู้ติดต่อเป็นปัจจุบัน ซ้อมอย่างน้อยปีละครั้ง และบันทึกเหตุการณ์"],"4":["The plan changes based on exercises and incidents. Response performance is measured. Coordination with external parties is practiced.","ปรับแผนจากการซ้อมและเหตุการณ์ วัดผลการรับมือ และฝึกประสานกับหน่วยงานภายนอก"]},"RS.AN":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["No investigation beyond restoring service.","ไม่มีการสืบสวนนอกจากกู้บริการ"],"2":["Basic investigation for some incidents. Evidence is not preserved consistently.","สืบสวนเบื้องต้นบางเหตุการณ์ เก็บรักษาหลักฐานไม่สม่ำเสมอ"],"3":["Investigations establish root cause and scope. Evidence is collected and preserved. Incidents are categorized and prioritized by defined criteria.","สืบสวนหาสาเหตุและขอบเขต เก็บและรักษาหลักฐาน จัดประเภทและลำดับความสำคัญตามเกณฑ์"],"4":["Forensic capability (in-house or retained) is used routinely. Findings feed detection and prevention.","ใช้ขีดความสามารถด้านนิติวิทยาศาสตร์ดิจิทัล (ภายในหรือจ้างไว้) เป็นปกติ และนำผลไปปรับการตรวจจับและป้องกัน"]},"RS.CO":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Notification is decided case by case. Regulatory duties are unclear.","ตัดสินใจแจ้งเหตุเป็นรายกรณี หน้าที่ตามกฎหมายไม่ชัด"],"2":["Some notification steps are known. Regulatory timelines (CII, PDPA) are not built into procedures.","รู้ขั้นตอนแจ้งเหตุบางส่วน กรอบเวลาตามกฎหมาย (CII, PDPA) ยังไม่อยู่ในขั้นตอน"],"3":["Internal and external notification procedures include regulatory timelines and templates. Communication roles are defined and followed in exercises and incidents.","ขั้นตอนแจ้งเหตุภายในและภายนอกมีกรอบเวลาตามกฎหมายและแบบฟอร์ม กำหนดบทบาทการสื่อสารและปฏิบัติจริงในการซ้อมและเหตุการณ์"],"4":["Communication is tested with stakeholders and regulators. Messages and timelines improve from experience.","ทดสอบการสื่อสารกับผู้มีส่วนได้เสียและหน่วยงานกำกับ ปรับข้อความและกรอบเวลาจากประสบการณ์"]},"RS.MI":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Containment is improvised.","ควบคุมเหตุการณ์แบบเฉพาะหน้า"],"2":["Containment steps are known for common cases but not documented or rehearsed.","รู้ขั้นตอนควบคุมสำหรับกรณีทั่วไป แต่ไม่มีเอกสารหรือไม่ได้ซ้อม"],"3":["Playbooks document containment and eradication steps. Authority to isolate systems is defined. Newly found vulnerabilities are mitigated or recorded as accepted risk.","Playbook ระบุขั้นตอนควบคุมและกำจัด กำหนดอำนาจตัดระบบ ช่องโหว่ใหม่ได้รับการแก้ไขหรือบันทึกเป็นความเสี่ยงที่ยอมรับ"],"4":["Containment is partly automated. Its effectiveness is measured.","การควบคุมเป็นอัตโนมัติบางส่วน และวัดประสิทธิผล"]},"RC.RP":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Recovery depends on individual knowledge. No recovery plan.","การกู้คืนขึ้นกับความรู้ของบุคคล ไม่มีแผนกู้คืน"],"2":["Recovery plans exist for some systems. Recovery objectives are not agreed or not tested.","มีแผนกู้คืนบางระบบ เป้าหมายการกู้คืนยังไม่ตกลงหรือไม่ได้ทดสอบ"],"3":["The recovery plan follows Business Impact Analysis (BIA) recovery objectives. Restore order is defined. Backup integrity is checked before restore. Recovery is tested at least annually.","แผนกู้คืนเป็นไปตามเป้าหมายจาก BIA กำหนดลำดับการกู้คืน ตรวจความถูกต้องของข้อมูลสำรองก่อนกู้คืน และทดสอบอย่างน้อยปีละครั้ง"],"4":["Recovery capability is measured against objectives. Plans improve from tests and incidents.","วัดขีดความสามารถการกู้คืนเทียบกับเป้าหมาย และปรับแผนจากการทดสอบและเหตุการณ์"]},"RC.CO":{"0":["No practice exists, or nobody can describe one.","ไม่มีการปฏิบัติ หรือไม่มีใครอธิบายได้"],"1":["Recovery status is communicated informally.","สื่อสารสถานะการกู้คืนอย่างไม่เป็นทางการ"],"2":["Some stakeholders are informed during recovery. No defined process.","แจ้งผู้มีส่วนได้เสียบางส่วนระหว่างกู้คืน ไม่มีกระบวนการกำหนดไว้"],"3":["Recovery communication to internal and external stakeholders follows a defined process, including public statements through approved channels. Tested in exercises.","สื่อสารการกู้คืนกับผู้มีส่วนได้เสียภายในและภายนอกตามกระบวนการ รวมถึงแถลงต่อสาธารณะผ่านช่องทางที่อนุมัติ และทดสอบในการซ้อม"],"4":["Communication improves from exercises, incidents, and stakeholder feedback.","ปรับการสื่อสารจากการซ้อม เหตุการณ์ และความเห็นของผู้มีส่วนได้เสีย"]}},"rubricVersion":"1.2","coverage":["ID.AM-01","ID.AM-02","ID.AM-03","ID.RA-01","PR.AA-01","PR.AA-03","PR.AA-05","PR.DS-01","PR.DS-02","PR.DS-11","PR.PS-01","PR.PS-02","PR.PS-03","PR.PS-04","PR.PS-05","PR.IR-01","DE.CM-01","DE.CM-03","DE.CM-06","DE.CM-09","RC.RP-03"],"schema":"csf-interview/3","envFields":[{"id":"E2","k":"dc","sess":"S3","type":"text","n":["Primary data center","ศูนย์ข้อมูลหลัก"],"ask":["Where do the main servers run?","เซิร์ฟเวอร์หลักตั้งอยู่ที่ใด"],"block":["B4"],"s":["ID.AM-01"],"o":[]},{"id":"E2","k":"dr","sess":"S3","type":"sel","n":["Disaster recovery (DR) site","ศูนย์สำรองกรณีฉุกเฉิน (DR site)"],"ask":["Is there a second site to run critical systems, and was failover tested?","มีสถานที่สำรองสำหรับเปิดระบบสำคัญหรือไม่ และเคยทดสอบสลับไปใช้หรือไม่"],"block":["B4"],"s":["PR.IR-03","RC.RP-02"],"o":[{"c":"tested","n":["Yes, failover tested within 12 months","มี ทดสอบสลับภายใน 12 เดือน"]},{"c":"untested","n":["Yes, not tested","มี แต่ยังไม่ทดสอบ"]},{"c":"none","n":["None","ไม่มี"]},{"c":"unk","n":["Unknown","ไม่ทราบ"]}]},{"id":"E3","k":"seg","sess":"S6","type":"sel","n":["Network segmentation","การแบ่งส่วนเครือข่าย"],"ask":["Is the network split into zones with filtering between them?","เครือข่ายแบ่งเป็นโซนและมีการกรองระหว่างโซนหรือไม่"],"block":["B4"],"s":["PR.IR-01"],"o":[{"c":"zone","n":["Segmented by zone with filtering","แบ่งโซนและกรองการเข้าถึง"]},{"c":"part","n":["Partly segmented","แบ่งบางส่วน"]},{"c":"flat","n":["Flat","ไม่แบ่งส่วน"]},{"c":"unk","n":["Unknown","ไม่ทราบ"]}]},{"id":"E4","k":"rem","sess":"S3","type":"sel","n":["Remote access for staff","การเข้าถึงระยะไกลของพนักงาน"],"ask":["How do staff connect from outside?","พนักงานเชื่อมต่อจากภายนอกอย่างไร"],"block":["B4","B5"],"s":["PR.AA-03","PR.IR-01"],"o":[{"c":"vpnm","n":["VPN with MFA","VPN พร้อม MFA"]},{"c":"vpn","n":["VPN without MFA","VPN ไม่มี MFA"]},{"c":"rdp","n":["Remote desktop exposed to the internet","Remote desktop เปิดสู่อินเทอร์เน็ต"]},{"c":"tool","n":["Remote access tools, for example AnyDesk","โปรแกรมรีโมต เช่น AnyDesk"]},{"c":"none","n":["No remote access","ไม่มีการเข้าถึงระยะไกล"]},{"c":"unk","n":["Unknown","ไม่ทราบ"]}]},{"id":"E5","k":"ws","sess":"S3","type":"num","n":["Workstations","จำนวนเครื่องลูกข่าย"],"ask":["About how many desktops and laptops are in use?","มีเครื่องคอมพิวเตอร์และโน้ตบุ๊กใช้งานประมาณกี่เครื่อง"],"block":["B4"],"s":["ID.AM-01"],"o":[]},{"id":"E5","k":"eol","sess":"S3","type":"sel","n":["Workstations on end-of-life operating systems","  helpHtml:`<h2>How to use the interview assessment</h2>
<p>Use this file to assess how a client actually operates when documents are missing or incomplete. It covers all 106 NIST CSF 2.0 Subcategories with an interview question, follow-up prompts, and the evidence to request for each.</p>
<h3>Steps</h3><ol>
<li><b>Setup.</b> Enter the engagement details, add interviewees with their roles, and confirm the scoring rules. Optionally link the Document Audit Tracker save file.</li>
<li><b>Interview plan.</b> See which questions belong to each role. Start a session for a role, or print the question sheet before the meeting.</li>
<li><b>Interview.</b> For each Subcategory, ask the main question and the prompts, record who answered, the observed tier, the evidence basis, notes, and the gap. Flag evidence to request.</li>
<li><b>Category tiers.</b> Review the suggested Current Tier per Category, override with a reason where needed, and confirm the Target Tier.</li>
<li><b>Dashboard and Evidence requests.</b> Review Current against Target, the practice and document cross-check, and send the evidence request list to the client.</li></ol>
<h3>Tier scale</h3><p>Tiers 1 to 4 follow the NIST CSF 2.0 Tier names (Partial, Risk Informed, Repeatable, Adaptive), applied here to each Subcategory practice. Tier 0 (Not in place) is a convention of this tool to separate "no practice" from "ad hoc practice"; it is not a CSF Tier.</p>
<h3>Tier Rubric</h3><p>Each Subcategory is rated against the Tier descriptors of its Category from the Tier Rubric, the same rubric the Target Profile Workshop and the Gap Analysis use. Three rules apply. R2: Tier 2 and above need documented or demonstrated evidence. R3: on a Coverage-applicable Subcategory, Tier 3 and above also need coverage of Largely or Full on sampled Criticality A systems; otherwise the counted tier stays at 2 and the outcome is flagged Next-tier ready. R4: the suggested Category tier is the highest Tier that at least half of the rated Subcategories reach.</p>
<h3>System profile</h3><p>Most clients have few documents, so collect facts per system with drop-down answers. In S2 Part A, ask business users which systems they use. In S2 Part B, ask IT to answer the Core profile for every system (about one to two minutes each). In S6, fill the Full profile for Criticality A and sampled systems, and the Development profile for systems that are customized, built in-house, or built by a contractor. Every answer has a rating (Good, Weak, Poor, Unknown). The ratings fill the System Sampling grid and the coverage calculation, so you never enter the same fact twice. The Population view shows how far a gap extends across all systems.</p>
<h3>Departments</h3><p>In S2C, interview frontline users department by department, for example Food and Beverage, Marketing and PR, and Finance. Questions U1 to U8 are standard; add engagement-specific questions as U9. The tool lists systems that IT did not name, and conflicts between what users do and what IT stated. Cite them in the Gap Analysis as DEPT:&lt;department&gt; or &lt;field&gt;:&lt;department&gt;, for example U2:Finance.</p>
<h3>Environment</h3><p>In S1, S3, and S6, record facts about the whole organization: sites, data center and disaster recovery site, network segmentation, staff remote access, workstations, medical devices and operational technology (OT), backup architecture, IT organization, security tools, incident history, changes in flight, and prior assessments. These answers have no rating. The Gap Analysis uses them for the Current IT Landscape section, checks every Improvement Action against the changes in flight and the tools already bought, and flags findings that repeat a prior assessment. Each repeating row gets an ID (for example TOOL-01) that the Gap Analysis cites as evidence.</p>
<h3>Vendors</h3><p>In S5, list every vendor that can reach systems or data, with access type, data access, contract clauses, data processing agreement, and due diligence. Link each vendor to its systems.</p>
<h3>Observations</h3><p>Record vulnerabilities and incident indicators seen during the assessment on the Observations tab. Observe only; do not test or exploit anything unless the Statement of Work authorizes testing. An incident indicator means stopping that work and notifying the client contact at once. Vulnerabilities are evidence for gaps and appear under the related Subcategories.</p>
<h3>Read-back</h3><p>Use the last five minutes of each session to read back the key facts and tick Read-back confirmed on the Interview plan tab. This replaces a separate review round with process owners.</p>
<h3>Interview sequence</h3><p>The Interview plan tab orders the work into ten sessions. Business context comes first (S1), then a Quick BIA that names the critical systems (S2). Governance, legal, and supplier sessions (S3 to S5) need only S1 and can run in parallel. Technical, detection, and response sessions (S6 to S8) use the critical systems from S2. S10 confirms the document request list.</p>
<h3>Systems and Quick BIA</h3><p>When the client has no asset inventory, build a working system list in S2, score impact and tolerable downtime, and confirm criticality with the client. Sample 3 to 5 critical systems in S6. State in the report that this is a preliminary assessment, not a full BIA, and that systems not named in interviews may exist.</p>
<h3>Document requests during interviews</h3><p>Clients often answer "none" to a written document request list, then mention the document in the interview. Tick the related document in each question, or type other documents named. The Requests tab builds one deduplicated list to confirm in S10.</p>
<h3>Scene and scenario</h3><p>Each Subcategory starts with a short scene-setting line and a scenario question. Use them with executives and business owners who are not security specialists: explain why the topic matters, ask them to picture a concrete situation, then confirm with the main question and prompts.</p>
<h3>Technical review</h3><p>The Technical review tab holds control checks for IT and security staff, grouped by technology area (identity, endpoint, network, email, data, backup, vulnerability, logging, cloud, application, third-party access, OT and medical devices, physical, incident response). Each check shows the good practice and its reference (CIS Controls v8.1 Safeguard, ISO/IEC 27002:2022, or NIST guidance). Mark Yes, Partial, No, or N/A and note what you saw. The good practice is a practitioner benchmark, not a legal requirement; scale it to the client's size and risk.</p>
<h3>Evidence rule</h3><p>With the default rule, a rating of Tier 2 or higher based only on what the interviewee said is counted as Tier 1 until evidence arrives. The stated rating stays on record, and an evidence request is created automatically.</p>
<h3>Working with the Document Audit Tracker</h3><p>Both tools read and write the same engagement file. Open an audit save file here to link it; the interview tool then shows document status and the practice and document cross-check. Save file stores both parts. Open the same file in the audit tracker to see interview tiers next to each document.</p>
<h3>Where data is stored</h3><p>Entries autosave in this browser for this file only. Clearing browser data erases them. Press <b>Save file</b> after each session and keep the file with the engagement records. Use a separate copy of this HTML file for each client.</p>
<h3>Sources</h3><p>Subcategory outcomes come from NIST CSF 2.0. Questions, prompts, evidence lists, and role mapping are practitioner guidance written for this framework. Items marked VERIFY must be checked against current Thai notifications.</p>`},

 helpHtml:`<h2>วิธีใช้แบบประเมินด้วยการสัมภาษณ์</h2>
<p>ใช้ไฟล์นี้ประเมินการปฏิบัติงานจริงของลูกค้าเมื่อเอกสารไม่มีหรือไม่ครบ ครอบคลุม Subcategory ทั้ง 106 ข้อของ NIST CSF 2.0 พร้อมคำถามหลัก คำถามเจาะลึก และหลักฐานที่ควรขอในแต่ละข้อ</p>
<h3>ขั้นตอน</h3><ol>
<li><b>ตั้งค่า</b> กรอกข้อมูลงาน เพิ่มผู้ให้สัมภาษณ์พร้อมบทบาท และยืนยันหลักเกณฑ์การให้คะแนน เชื่อมไฟล์ Document Audit Tracker ได้หากมี</li>
<li><b>แผนการสัมภาษณ์</b> ดูว่าคำถามใดเป็นของบทบาทใด กดเริ่มสัมภาษณ์ตามบทบาท หรือพิมพ์แบบคำถามก่อนประชุม</li>
<li><b>สัมภาษณ์</b> ในแต่ละ Subcategory ถามคำถามหลักและคำถามเจาะลึก บันทึกผู้ตอบ Tier ที่พบ ฐานของหลักฐาน บันทึก และช่องว่าง และระบุหลักฐานที่จะขอ</li>
<li><b>Tier ราย Category</b> ทบทวน Current Tier ที่แนะนำ ปรับพร้อมเหตุผลเมื่อจำเป็น และยืนยัน Target Tier</li>
<li><b>แดชบอร์ดและรายการขอหลักฐาน</b> ดู Current เทียบ Target การเปรียบเทียบการปฏิบัติกับเอกสาร และส่งรายการขอหลักฐานให้ลูกค้า</li></ol>
<h3>ระดับ Tier</h3><p>Tier 1 ถึง 4 ใช้ชื่อตาม NIST CSF 2.0 (Partial, Risk Informed, Repeatable, Adaptive) โดยนำมาใช้กับการปฏิบัติของแต่ละ Subcategory ส่วน Tier 0 (ไม่มีการปฏิบัติ) เป็นข้อกำหนดของเครื่องมือนี้เพื่อแยก "ไม่มีการปฏิบัติ" ออกจาก "ปฏิบัติเฉพาะกิจ" ไม่ใช่ Tier ของ CSF</p>
<h3>Tier Rubric</h3><p>ให้คะแนนแต่ละ Subcategory เทียบกับคำอธิบาย Tier ของ Category นั้นใน Tier Rubric ซึ่งเป็นชุดเดียวกับที่ใช้ใน Target Profile Workshop และ Gap Analysis มีกติกา 3 ข้อ R2: Tier 2 ขึ้นไปต้องมีหลักฐานเป็นเอกสารหรือการสาธิต R3: Subcategory ที่วัดความครอบคลุมได้ จะได้ Tier 3 ขึ้นไปเมื่อความครอบคลุมบนระบบ Criticality A ที่สุ่มตรวจอยู่ระดับ Largely หรือ Full หากไม่ถึงจะนับเป็น Tier 2 และติดสถานะใกล้ถึง Tier ถัดไป R4: Tier ที่แนะนำของ Category คือ Tier สูงสุดที่ Subcategory ที่ให้คะแนนแล้วอย่างน้อยครึ่งหนึ่งทำได้ถึง</p>
<h3>System profile</h3><p>ลูกค้าส่วนใหญ่มีเอกสารน้อย จึงเก็บข้อเท็จจริงรายระบบด้วยคำตอบแบบเลือก ใน S2 ส่วน A ถามผู้ใช้งานธุรกิจว่าใช้ระบบใด ใน S2 ส่วน B ให้ IT ตอบ Core profile ของทุกระบบ (ประมาณ 1 ถึง 2 นาทีต่อระบบ) ใน S6 กรอก Full profile ของระบบ Criticality A และระบบที่สุ่มตรวจ และ Development profile ของระบบที่ปรับแต่ง พัฒนาเอง หรือจ้างพัฒนา ทุกคำตอบมีระดับ (ดี อ่อน แย่ ไม่ทราบ) ซึ่งใช้เติมตารางสุ่มตรวจและคำนวณความครอบคลุม จึงไม่ต้องกรอกข้อมูลเดียวกันซ้ำ ภาพรวมทุกระบบแสดงว่าช่องว่างกระจายไปกว้างแค่ไหน</p>
<h3>แผนก</h3><p>ใน S2C สัมภาษณ์ผู้ใช้งานหน้างานทีละแผนก เช่น Food and Beverage, Marketing and PR และ Finance คำถาม U1 ถึง U8 เป็นคำถามมาตรฐาน เพิ่มคำถามเฉพาะงานเป็น U9 เครื่องมือจะแสดงระบบที่ IT ไม่ได้ระบุ และจุดที่การปฏิบัติจริงขัดกับคำตอบของ IT อ้างอิงใน Gap Analysis เป็น DEPT:&lt;แผนก&gt; หรือ &lt;หัวข้อ&gt;:&lt;แผนก&gt; เช่น U2:Finance</p>
<h3>สภาพแวดล้อม</h3><p>ใน S1, S3 และ S6 บันทึกข้อเท็จจริงระดับองค์กร ได้แก่ สถานที่ ศูนย์ข้อมูลและศูนย์สำรอง การแบ่งส่วนเครือข่าย การเข้าถึงระยะไกลของพนักงาน เครื่องลูกข่าย อุปกรณ์การแพทย์และ OT สถาปัตยกรรมการสำรองข้อมูล โครงสร้างทีม IT เครื่องมือด้านความมั่นคงปลอดภัย ประวัติเหตุการณ์ การเปลี่ยนแปลงที่กำลังดำเนินการ และการประเมินครั้งก่อน คำตอบเหล่านี้ไม่มีระดับ Gap Analysis ใช้ข้อมูลนี้ในส่วน Current IT Landscape ตรวจ Improvement Action ทุกรายการกับการเปลี่ยนแปลงที่กำลังดำเนินการและเครื่องมือที่ซื้อแล้ว และระบุข้อตรวจพบที่ซ้ำกับการประเมินครั้งก่อน แถวข้อมูลแต่ละแถวมีรหัส (เช่น TOOL-01) เพื่อใช้อ้างอิงเป็นหลักฐาน</p>
<h3>ผู้ขาย</h3><p>ใน S5 ระบุผู้ขายทุกรายที่เข้าถึงระบบหรือข้อมูลได้ พร้อมประเภทการเข้าถึง การเข้าถึงข้อมูล ข้อสัญญา ข้อตกลงการประมวลผลข้อมูล และการตรวจสอบ แล้วเชื่อมผู้ขายกับระบบที่เกี่ยวข้อง</p>
<h3>ข้อสังเกต</h3><p>บันทึกช่องโหว่และร่องรอยเหตุการณ์ที่พบระหว่างการประเมินในแท็บข้อสังเกต สังเกตเท่านั้น ห้ามทดสอบหรือเจาะระบบ เว้นแต่ SoW อนุญาต หากพบร่องรอยเหตุการณ์ให้หยุดงานส่วนนั้นและแจ้งผู้ติดต่อของลูกค้าทันที ช่องโหว่เป็นหลักฐานของช่องว่างและแสดงใต้ Subcategory ที่เกี่ยวข้อง</p>
<h3>การทวนข้อมูล</h3><p>ใช้ 5 นาทีสุดท้ายของแต่ละรอบทวนข้อเท็จจริงสำคัญ แล้วติ๊กทวนข้อมูลแล้วในแท็บแผนการสัมภาษณ์ แทนการทบทวนกับเจ้าของกระบวนการอีกรอบ</p>
<h3>ลำดับการสัมภาษณ์</h3><p>แท็บแผนการสัมภาษณ์จัดงานเป็น 10 รอบ เริ่มจากบริบทธุรกิจ (S1) ต่อด้วย Quick BIA เพื่อระบุระบบสำคัญ (S2) รอบการกำกับดูแล กฎหมาย และผู้ให้บริการ (S3 ถึง S5) ขึ้นกับ S1 เท่านั้นจึงทำคู่ขนานได้ รอบเทคนิค การตรวจจับ และการรับมือ (S6 ถึง S8) ใช้ระบบสำคัญจาก S2 และ S10 ใช้ยืนยันรายการขอเอกสาร</p>
<h3>ระบบและ Quick BIA</h3><p>เมื่อลูกค้าไม่มีทะเบียนทรัพย์สิน ให้จัดทำรายชื่อระบบเบื้องต้นใน S2 ให้คะแนนผลกระทบและเวลาหยุดที่รับได้ และยืนยันระดับความสำคัญกับลูกค้า แล้วสุ่มตรวจระบบสำคัญ 3 ถึง 5 ระบบใน S6 ระบุในรายงานว่าเป็นการประเมินเบื้องต้น ไม่ใช่ BIA เต็มรูปแบบ และอาจมีระบบที่ไม่ได้ถูกกล่าวถึงในการสัมภาษณ์</p>
<h3>การขอเอกสารระหว่างสัมภาษณ์</h3><p>ลูกค้ามักตอบรายการขอเอกสารว่า "ไม่มี" แล้วพูดถึงเอกสารนั้นระหว่างสัมภาษณ์ ให้ติ๊กเอกสารที่เกี่ยวข้องในแต่ละคำถาม หรือพิมพ์ชื่อเอกสารอื่นที่ได้ยิน แท็บรายการขอเอกสารจะรวมเป็นรายการเดียวไม่ซ้ำกัน เพื่อยืนยันใน S10</p>
<h3>การปูพื้นและคำถามเชิงสถานการณ์</h3><p>แต่ละ Subcategory เริ่มด้วยประโยคปูพื้นสั้น ๆ และคำถามเชิงสถานการณ์ ใช้กับผู้บริหารและเจ้าของกระบวนการธุรกิจที่ไม่ใช่ผู้เชี่ยวชาญด้านความมั่นคงปลอดภัย โดยอธิบายว่าทำไมหัวข้อนี้สำคัญ ให้เขานึกภาพสถานการณ์จริง แล้วยืนยันด้วยคำถามหลักและคำถามเจาะลึก</p>
<h3>ตรวจ Technical Control</h3><p>แท็บตรวจ Technical Control มีรายการตรวจสำหรับเจ้าหน้าที่ IT และความมั่นคงปลอดภัย จัดกลุ่มตามด้านเทคโนโลยี (ตัวตน เครื่องลูกข่าย เครือข่าย อีเมล ข้อมูล การสำรองข้อมูล ช่องโหว่ การบันทึก คลาวด์ ระบบงาน การเข้าถึงของผู้ให้บริการ OT และอุปกรณ์การแพทย์ กายภาพ และการรับมือเหตุการณ์) แต่ละข้อแสดงแนวปฏิบัติที่ดีและแหล่งอ้างอิง (CIS Controls v8.1 Safeguard, ISO/IEC 27002:2022 หรือแนวทางของ NIST) บันทึกผล มี บางส่วน ไม่มี หรือ N/A พร้อมสิ่งที่เห็น แนวปฏิบัติที่ดีเป็นเกณฑ์อ้างอิงจากผู้ปฏิบัติงาน ไม่ใช่ข้อกำหนดทางกฎหมาย ให้ปรับตามขนาดและความเสี่ยงของลูกค้า</p>
<h3>หลักเกณฑ์หลักฐาน</h3><p>ตามค่าตั้งต้น Tier 2 ขึ้นไปที่อ้างอิงคำบอกเล่าเท่านั้นจะนับเป็น Tier 1 จนกว่าจะได้รับหลักฐาน ระดับที่บอกเล่ายังถูกบันทึกไว้ และระบบสร้างรายการขอหลักฐานให้อัตโนมัติ</p>
<h3>การทำงานร่วมกับ Document Audit Tracker</h3><p>ทั้งสองเครื่องมืออ่านและเขียนไฟล์งานรูปแบบเดียวกัน เปิดไฟล์ที่บันทึกจาก Audit ที่นี่เพื่อเชื่อมข้อมูล แล้วเครื่องมือนี้จะแสดงสถานะเอกสารและการเปรียบเทียบการปฏิบัติกับเอกสาร การบันทึกไฟล์จะเก็บข้อมูลทั้งสองส่วน และเมื่อเปิดไฟล์เดียวกันใน Audit จะเห็น Tier จากการสัมภาษณ์คู่กับแต่ละเอกสาร</p>
<h3>ข้อมูลถูกเก็บที่ไหน</h3><p>ข้อมูลบันทึกอัตโนมัติในเบราว์เซอร์นี้สำหรับไฟล์นี้เท่านั้น หากล้างข้อมูลเบราว์เซอร์ ข้อมูลจะหายไป กด <b>บันทึกไฟล์</b> หลังสัมภาษณ์ทุกครั้ง และเก็บไฟล์ไว้กับเอกสารของงาน ลูกค้าแต่ละรายควรใช้สำเนาไฟล์ HTML นี้แยกกัน</p>
<h3>แหล่งที่มา</h3><p>ผลลัพธ์ของ Subcategory มาจาก NIST CSF 2.0 คำถาม คำถามเจาะลึก รายการหลักฐาน และการจับคู่บทบาท เป็นแนวทางจากผู้ปฏิบัติงานที่เขียนสำหรับกรอบนี้ รายการที่ระบุ VERIFY ต้องตรวจสอบกับประกาศของไทยฉบับปัจจุบัน</p>`}
