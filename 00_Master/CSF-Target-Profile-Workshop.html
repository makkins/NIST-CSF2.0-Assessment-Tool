<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>CSF Target Profile Workshop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: same system as the CSF 2.0 Document Map. Header, stats row, step tabs (NIST Profile steps), one view per step, detail drawer on the right, Help dialog. */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --ink:#1b2333; --muted:#5b6578; --line:#d7dce6; --accent:#2f4f8f; --accent-soft:#e4eaf6; --chip:#eef1f6;
  --gv:#6b4fa0; --id:#2f6fb0; --pr:#2e8a6a; --de:#b7791f; --rs:#b2453c; --rc:#3d7f8c;
  --hi:#b42318; --hi-soft:#fbe9e7; --md:#1d4ed8; --md-soft:#e6edfd; --lo:#8a93a3; --lo-soft:#f3f4f6;
  --ok:#2e7d4f; --ok-soft:#e3f2e8; --warn:#b26a00; --warn-soft:#fbf0dc;
  --t1:#d3d8e2; --t1-ink:#1b2333; --t2:#93a0ba; --t2-ink:#ffffff; --t3:#4c5d84; --t3-ink:#ffffff; --t4:#1b2333; --t4-ink:#ffffff;
  --f-body:"IBM Plex Sans Thai",system-ui,"Segoe UI",Tahoma,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151d; --surface:#19202b; --ink:#e6eaf1; --muted:#9aa4b5; --line:#2c3545; --accent:#8fb0ec; --accent-soft:#223050; --chip:#222a38;
  --gv:#a68ad8; --id:#6fa8e0; --pr:#5fc29d; --de:#e0a84f; --rs:#e47f75; --rc:#6fbcc9;
  --hi:#e5534b; --hi-soft:#3a1f1f; --md:#5b8def; --md-soft:#1d2a45; --lo:#7d8696; --lo-soft:#232a35;
  --ok:#4fbf82; --ok-soft:#1b3326; --warn:#e2a23b; --warn-soft:#3a2c14;
  --t1:#323b4b; --t1-ink:#e6eaf1; --t2:#56647f; --t2-ink:#ffffff; --t3:#8fa6d4; --t3-ink:#11151d; --t4:#e6eaf1; --t4-ink:#11151d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151d; --surface:#19202b; --ink:#e6eaf1; --muted:#9aa4b5; --line:#2c3545; --accent:#8fb0ec; --accent-soft:#223050; --chip:#222a38;
  --gv:#a68ad8; --id:#6fa8e0; --pr:#5fc29d; --de:#e0a84f; --rs:#e47f75; --rc:#6fbcc9;
  --hi:#e5534b; --hi-soft:#3a1f1f; --md:#5b8def; --md-soft:#1d2a45; --lo:#7d8696; --lo-soft:#232a35;
  --ok:#4fbf82; --ok-soft:#1b3326; --warn:#e2a23b; --warn-soft:#3a2c14;
  --t1:#323b4b; --t1-ink:#e6eaf1; --t2:#56647f; --t2-ink:#ffffff; --t3:#8fa6d4; --t3-ink:#11151d; --t4:#e6eaf1; --t4-ink:#11151d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px}
h1{font-size:clamp(22px,3vw,30px);line-height:1.2;margin:0;text-wrap:balance;font-weight:700}
.sub{color:var(--muted);margin:4px 0 0;max-width:80ch}
.hbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:600 13px var(--f-body);padding:6px 12px;border:1px solid var(--ink);border-radius:4px;background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sm{font-size:12px;padding:3px 9px;border-color:var(--line)}
.btn.warnb{border-color:var(--hi);color:var(--hi)}
.btn.armed{background:var(--hi);color:#fff;border-color:var(--hi)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lang{display:flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.lang button{font:600 13px var(--f-body);padding:6px 14px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin:16px 0;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:22px;font-weight:700}
.stats span{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.tabs{display:flex;gap:4px;margin:6px 0 10px;flex-wrap:wrap}
.tabs button{font:600 14px var(--f-body);padding:7px 13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:4px;cursor:pointer;text-align:left}
.tabs button small{display:block;font:500 10px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;opacity:.8}
.tabs button[aria-selected="true"]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px;max-width:110ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted);margin:10px 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.box{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.pad{padding:14px}
.scroll{overflow-x:auto}
.howto{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin:0 0 12px;font-size:13px}
.howto>summary{cursor:pointer;font-weight:600;padding:6px 10px;color:var(--accent)}
.howto dl{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:0;padding:4px 12px 12px}
.howto dt{color:var(--muted);font-weight:600}
.howto dd{margin:0;max-width:95ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.grid2>*,.grid3>*{min-width:0}
h2.sec{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h3{font-size:15px;margin:0 0 6px}
label.fl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 3px}
label.fl:first-child{margin-top:0}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;font:14px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:0}
textarea{min-height:80px;font:12px var(--f-mono)}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 0}
.ck input{margin-top:3px;accent-color:var(--accent)}
.ckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 12px}
.floor{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line)}
.floor:first-of-type{border-top:0}
.floor input{margin-top:4px;width:16px;height:16px;accent-color:var(--accent)}
.floor b{font-size:14px}
.floor .src{font-size:12px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.idc{font:500 11px var(--f-mono);border:1px solid var(--line);background:var(--chip);border-radius:3px;padding:0 5px;white-space:nowrap}
.idc.p{background:var(--accent-soft);border-color:transparent;color:var(--ink);font-weight:600}
.pill{font:600 11px var(--f-body);padding:1px 8px;border-radius:10px;border:1px solid currentColor;display:inline-block;white-space:nowrap}
.pill.hi{color:var(--hi)} .pill.md{color:var(--md)} .pill.lo{color:var(--lo)} .pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)}
.callout{font-size:13px;background:var(--accent-soft);border-radius:4px;padding:8px 10px;margin:8px 0}
.callout.warn{background:var(--warn-soft)}
.mini{font-size:12px;color:var(--muted)}
.mono{font-family:var(--f-mono)}
/* chips (category) */
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);border-radius:3px;padding:2px 6px 2px 2px;font-size:12px;cursor:pointer;color:var(--ink);text-align:left;width:100%;font-family:var(--f-body);line-height:1.35;min-width:0}
.chip[data-p="H"]{background:var(--hi-soft);border-color:color-mix(in srgb,var(--hi) 35%,var(--line))}
.chip[data-p="M"]{background:var(--md-soft);border-color:color-mix(in srgb,var(--md) 30%,var(--line))}
.chip[data-p="L"]{background:var(--lo-soft);border-style:dashed}
.chip .id{font-family:var(--f-mono);font-weight:500;white-space:nowrap}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.chip.sel{outline:2px solid var(--accent);outline-offset:1px}
.tb{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:2px;font:700 12px var(--f-mono)}
.tb.lg{width:28px;height:28px;font-size:15px}
.t1{background:var(--t1);color:var(--t1-ink)} .t2{background:var(--t2);color:var(--t2-ink)} .t3{background:var(--t3);color:var(--t3-ink)} .t4{background:var(--t4);color:var(--t4-ink)}
.pt{flex:none;font:600 10px var(--f-mono);padding:0 4px;border-radius:2px;border:1px solid currentColor;line-height:15px}
.pt.H{color:var(--hi)} .pt.M{color:var(--md)} .pt.L{color:var(--lo)}
.cur{flex:none;font:500 10px var(--f-mono);color:var(--muted)}
.flag{flex:none;font:600 10px var(--f-mono);color:var(--warn)}
/* profile map */
table.map{border-collapse:collapse;width:100%;min-width:1100px;table-layout:fixed}
table.map th,table.map td{border-bottom:1px solid var(--line);vertical-align:top;padding:8px}
table.map thead th{font-size:13px;text-align:left;background:var(--surface)}
table.map thead th .bar{display:block;height:4px;border-radius:2px;margin-bottom:6px}
table.map thead th small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.cell{display:flex;flex-direction:column;gap:4px}
/* generic table */
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top;text-align:left}
table.tbl th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--surface);white-space:nowrap}
table.tbl td select{width:auto;padding:3px 5px;font-size:13px}
table.tbl td input[type=text]{min-width:150px;font-size:13px;padding:4px 6px}
table.tbl td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.dbar{width:80px;height:5px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:4px}
.dbar i{display:block;height:100%;background:var(--accent)}
/* priorities */
.people{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.person{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:hidden}
.person button{border:0;background:transparent;color:var(--ink);font:600 13px var(--f-body);padding:5px 10px;cursor:pointer}
.person.on{background:var(--ink);border-color:var(--ink)}
.person.on button{color:var(--bg)}
.person .x{padding:5px 8px 5px 0;opacity:.6}
.budget{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:10px 0}
.meter{flex:1 1 220px;height:8px;background:var(--chip);border-radius:2px;overflow:hidden;min-width:140px}
.meter i{display:block;height:100%;background:var(--ink)}
.meter.over i{background:var(--hi)}
.budget .num{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums}
.themes{display:flex;flex-direction:column;gap:6px}
.theme{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px;padding:10px 12px}
.theme .tid{font:600 11px var(--f-mono);color:var(--muted)}
.theme b.tt{display:block;font-size:15px}
.theme .q{font-size:13px;color:var(--muted)}
.theme details{grid-column:1/-1;font-size:13px}
.theme summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:12px}
.theme .bar{grid-column:1/-1;height:3px;background:var(--chip);border-radius:2px;overflow:hidden}
.theme .bar i{display:block;height:100%;background:var(--accent)}
.stepper{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.stepper button{width:30px;height:30px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;font:700 15px var(--f-mono);cursor:pointer}
.stepper input{width:58px;text-align:center;font:600 15px var(--f-mono)}
.stepper .ro{min-width:58px;text-align:center;font:700 17px var(--f-mono)}
.rng{font:500 11px var(--f-mono);color:var(--muted);text-align:right}
/* tier select */
.tiercards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.tc{text-align:left;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:10px;cursor:pointer;font-family:var(--f-body);display:flex;flex-direction:column;gap:6px}
.tc .hd{display:flex;gap:8px;align-items:center}
.tc b{font-size:14px}
.tc span.d{font-size:12.5px;color:var(--muted)}
.tc.on{border:2px solid var(--ink);padding:9px}
.tc .rec{font:600 10px var(--f-mono);color:var(--ok);text-transform:uppercase;letter-spacing:.05em}
.consid td:first-child{font-weight:600;white-space:nowrap}
/* steps strip */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px;margin:6px 0 4px}
.steps .s{border:1px solid var(--line);border-radius:4px;padding:8px;background:var(--bg)}
.steps .s i{display:block;font:600 11px var(--f-mono);color:var(--muted);font-style:normal}
.steps .s b{font-size:13px;display:block}
.steps .s span{font-size:12px;color:var(--muted)}
/* drawer */
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.14);padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto;z-index:10}
.drawer h2{font-size:19px;margin:6px 0 4px;text-wrap:balance}
.drawer h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;border-top:1px solid var(--line);padding-top:12px}
.drawer .idl{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.drawer dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px;margin:10px 0}
.drawer dt{color:var(--muted)}
.drawer dd{margin:0;min-width:0;overflow-wrap:anywhere}
.drawer ol{margin:4px 0;padding-left:20px;font-size:13px}
.close{float:right}
@media (min-width:1100px){body.has-drawer .wrap{margin-right:490px;max-width:none}}
/* help */
.modal{position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:20;display:flex;justify-content:center;align-items:flex-start;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal .panel{background:var(--surface);color:var(--ink);border-radius:8px;max-width:880px;width:100%;padding:22px 24px;border:1px solid var(--line)}
.modal h2{margin:0 0 4px;font-size:22px}
.modal h3{margin:20px 0 6px;font-size:15px}
.modal p,.modal li{font-size:14px;max-width:80ch}
.modal table{border-collapse:collapse;width:100%;font-size:13px}
.modal td,.modal th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.formula{font:12.5px var(--f-mono);background:var(--chip);border-radius:4px;padding:8px 10px;overflow-x:auto}
.note{font-size:12px;color:var(--muted);margin-top:24px;max-width:110ch}
body.exec .csf{display:none!important}
/* presenter mode */
body.exec{font-size:16.5px}
body.exec .howto,body.exec .note,body.exec .cons-only{display:none!important}
body.exec .wrap{padding-bottom:110px}
body.exec .sub,body.exec #view>.hint{display:none}
body.exec h1{font-size:24px}

body.exec .stats{display:none}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:2px solid var(--ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.navbar .where{display:flex;flex-direction:column;gap:4px;min-width:0}
.navbar .where span{font:600 11px var(--f-mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.navbar .where b{font-size:16px}
.dots{display:flex;gap:4px}.dots i{width:24px;height:4px;border-radius:2px;background:var(--line)}.dots i.on{background:var(--ink)}.dots i.done{background:var(--muted)}
.navbar .btn{font-size:14px;padding:8px 16px}
/* tier strip */
.tstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 12px}
.tstrip>div{border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:6px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tstrip>div>span{display:flex;gap:6px;align-items:center;font-size:13px}
.tstrip small{font-size:12px;color:var(--muted)}
/* intro */
.hero{padding:10px 0 4px}
.hero h2{font-size:clamp(24px,3.4vw,36px);line-height:1.2;margin:0 0 8px;text-wrap:balance;max-width:30ch}
.hero p{color:var(--muted);max-width:72ch;margin:0}
.isec{margin-top:24px}
.isec>h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.csfpic{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.csfpic .gvrow{grid-column:1/-1}
.fcard{border-radius:6px;padding:12px;border:1px solid var(--line);background:var(--surface);border-top:4px solid var(--c);display:flex;flex-direction:column;gap:2px;min-width:0}
.fcard .code{font:600 11px var(--f-mono);color:var(--c)}
.fcard b{font-size:16px}
.fcard span{font-size:13px;color:var(--muted)}
.flow3{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:stretch}
.flow3 .dk{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:4px}
.flow3 .dk i{font:700 13px var(--f-mono);font-style:normal;color:var(--accent)}
.flow3 .dk b{font-size:17px}
.flow3 .dk span{font-size:13px;color:var(--muted)}
.flow3 .dk.res{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.flow3 .dk.res span,.flow3 .dk.res i{color:var(--bg);opacity:.85}
.flow3 .ar{align-self:center;font:700 20px var(--f-mono);color:var(--muted)}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.rung{border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rung.t1{min-height:170px}.rung.t2{min-height:200px}.rung.t3{min-height:230px}.rung.t4{min-height:260px}
.rung .n{font:700 28px var(--f-mono);line-height:1}
.rung b{font-size:16px}
.rung .ex{font-size:13px;opacity:.95}
.rung .lbl{font:600 10px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;opacity:.75}
.agenda{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.agenda div{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--surface)}
.agenda i{display:block;font:600 11px var(--f-mono);font-style:normal;color:var(--muted)}
.agenda b{font-size:14px}
@media (max-width:760px){.csfpic{grid-template-columns:1fr 1fr}.ladder,.tstrip{grid-template-columns:1fr 1fr}.flow3{grid-template-columns:1fr}.flow3 .ar{transform:rotate(90deg);justify-self:center}}
/* priority board */
.presets{display:flex;flex-wrap:wrap;gap:6px}
.preset{text-align:left;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);padding:6px 10px;cursor:pointer;font-family:var(--f-body);display:flex;align-items:center;gap:10px;min-width:0}
.preset b{font-size:14px}
.preset span{font-size:12px;color:var(--muted)}
.preset.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.preset.on .spark i{background:var(--bg)}
.preset:disabled{cursor:not-allowed;opacity:.55}
.spark{display:flex;gap:1px;align-items:flex-end;height:18px;width:60px;flex:none}
.spark i{flex:1;background:var(--accent);border-radius:1px;min-height:1px}
.pwrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px;align-items:start;margin-top:10px}
@media (max-width:1050px){.pwrap{grid-template-columns:1fr}}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.top{border-top-color:var(--hi)}
.card .row1{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:20px}
.card .tid{font:600 11px var(--f-mono);color:var(--muted)}
.card .rank{font:700 11px var(--f-mono);color:var(--hi)}
.card b.tt{font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .q{font-size:12.5px;line-height:1.4;max-height:2.8em;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;gap:6px;align-items:center;font:500 11px var(--f-mono);color:var(--muted)}
.card .ctl{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:4px}
.card .ctl button{min-width:34px;height:32px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;font:700 13px var(--f-mono);cursor:pointer}
.card .big{font:700 28px var(--f-mono);min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.card .bar{height:4px;background:var(--chip);border-radius:2px;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--accent)}
.card details{font-size:12.5px}
.card summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:12px}
.live{position:sticky;top:64px}
.live h4{font-size:13px;margin:0 0 2px}
.mheat{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;margin:8px 0}
.mheat .col{display:flex;flex-direction:column;gap:3px;min-width:0}
.mheat .h{font:600 10px var(--f-mono);text-align:center;border-top:3px solid var(--c);padding-top:2px;color:var(--muted)}
.mh{font:600 10px var(--f-mono);text-align:center;padding:4px 0;border-radius:2px}
.mh.H{background:var(--hi);color:#fff}.mh.M{background:var(--md-soft);color:var(--ink)}.mh.L{background:var(--lo-soft);color:var(--muted)}
.focus{margin:0;padding-left:18px;font-size:13px}
.focus li{margin-bottom:6px}
.focus li span{display:block;font-size:12px;color:var(--muted)}
.distbar{display:flex;height:8px;border-radius:2px;overflow:hidden;margin-top:4px;background:var(--chip)}
.distbar i{display:block;height:100%}
/* help tooltip */
.qm{position:relative;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--muted);font:600 11px var(--f-mono);color:var(--muted);cursor:help;margin-left:6px;vertical-align:1px;background:var(--surface)}
.qm:hover,.qm:focus{border-color:var(--accent);color:var(--accent)}
.qm .tip{display:none;position:absolute;left:-12px;top:calc(100% + 6px);width:min(360px,78vw);background:var(--ink);color:var(--bg);border-radius:6px;padding:10px 12px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.2);font:400 12.5px/1.5 var(--f-body);text-align:left;cursor:default}
.qm .tip b{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;opacity:.75;margin-top:6px}
.qm .tip b:first-child{margin-top:0}
.qm .tip span{display:block}
.qm .tip .cats{font:500 11px var(--f-mono);opacity:.8;margin-top:8px}
.qm:hover .tip,.qm:focus .tip,.qm:focus-within .tip{display:block}
/* phases */
.phases{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.ph{border:1px solid var(--line);border-radius:4px;padding:8px;background:var(--bg);display:flex;flex-direction:column;gap:2px;min-width:0}
.ph i{font:600 11px var(--f-mono);font-style:normal;color:var(--muted)}.ph b{font-size:13px}.ph span{font-size:11.5px;color:var(--muted)}
.ph.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.ph.on i,.ph.on span{color:var(--bg);opacity:.85}
@media (max-width:760px){.phases{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* quick add */
.card.addc{border:1px dashed var(--muted);border-top:1px dashed var(--muted);background:transparent;cursor:pointer;text-align:left;font-family:var(--f-body);color:var(--ink);justify-content:center}
.card.addc:hover{border-color:var(--accent);background:var(--accent-soft)}
.card .plus{font:700 30px/1 var(--f-mono);color:var(--accent)}
.card.addf{grid-column:span 2;border-top-color:var(--accent)}
.dimck{display:flex;flex-wrap:wrap;gap:4px}
.chipck{font-size:12px;border:1px solid var(--line);border-radius:3px;padding:2px 6px;display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.chipck input{accent-color:var(--accent);margin:0}
.card .row1{flex-wrap:wrap}
.card .tid{white-space:nowrap}
.x2{border:0;background:none;color:var(--muted);cursor:pointer;font:600 13px var(--f-mono);padding:0 2px}
.x2:hover{color:var(--hi)}
@media (max-width:420px){.card.addf{grid-column:auto}}
/* pre-fill */
.pfc{display:inline-block;font:600 10px var(--f-body);letter-spacing:.03em;text-transform:none;color:var(--warn);background:var(--warn-soft);border:1px dashed var(--warn);border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:1px;cursor:help}
/* risk criteria */
.band{display:inline-block;font:600 11px var(--f-body);padding:2px 9px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.band.C{background:var(--hi);color:#fff;border-color:var(--hi)}.band.H{color:var(--hi);background:var(--hi-soft)}.band.M{color:var(--warn);background:var(--warn-soft)}.band.L{color:var(--ok);background:var(--ok-soft)}
.rmx{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));gap:3px;align-items:center;max-width:420px;position:relative;padding-left:18px}
.rmx .lab{font:600 11px var(--f-mono);color:var(--muted);text-align:center}
.rmx .mc{font:600 12px var(--f-mono);text-align:center;padding:9px 0;border-radius:3px}
.rmx .mc.C{background:var(--hi);color:#fff}.rmx .mc.H{background:var(--hi-soft);color:var(--hi)}.rmx .mc.M{background:var(--warn-soft);color:var(--warn)}.rmx .mc.L{background:var(--ok-soft);color:var(--ok)}
.rmx .mc.hit{outline:3px solid var(--ink);outline-offset:-1px}
.rmx .ax{font:600 10px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rmx .ay{position:absolute;left:-10px;top:50%;transform:rotate(-90deg) translateX(50%);transform-origin:left top;white-space:nowrap}
.rmx .ax2{grid-column:2/-1;text-align:center}
.calcout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:13px}
.calcout>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.calcout span:first-child{font:600 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.calcout b{font-size:18px}
.calcout .band,.calcout .pill{align-self:flex-start}
/* summary */
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.sumgrid section{min-width:0}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
.sign{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sign div{border-bottom:1px solid var(--ink);padding-top:28px;font-size:12px;color:var(--muted)}
@media (max-width:560px){.howto dl,.drawer dl{grid-template-columns:1fr}.stats b{font-size:18px}.theme{grid-template-columns:1fr}.stepper,.rng{justify-content:flex-start;text-align:left}}
@media (prefers-reduced-motion:no-preference){.chip,.tc{transition:background .15s}}

/* View mode: Presentation / Editor */
#b-vm{white-space:nowrap}
body.vm-pres #b-open,body.vm-pres #b-save,body.vm-pres #b-xlsx,body.vm-pres #savebar{display:none!important}
#audseg{display:none!important}

['GV.OC','Organizational Context','Leaders understand the mission, stakeholders, and legal requirements that shape cyber risk decisions.','ผู้บริหารเข้าใจพันธกิจ ผู้มีส่วนได้ส่วนเสีย และข้อกฎหมายที่กำหนดการตัดสินใจด้านความเสี่ยงไซเบอร์'],
['GV.RM','Risk Management Strategy','Risk appetite, priorities, and methods for cyber risk are set and used in decisions.','กำหนดระดับความเสี่ยงที่ยอมรับได้ ลำดับความสำคัญ และวิธีบริหารความเสี่ยงไซเบอร์ แล้วใช้ในการตัดสินใจจริง'],
['GV.RR','Roles, Responsibilities, and Authorities','Accountability for cyber risk is clear from the board to staff, with resources to match.','มีผู้รับผิดชอบความเสี่ยงไซเบอร์ชัดเจนตั้งแต่ Board ถึงพนักงาน พร้อมทรัพยากรที่เพียงพอ'],

['PR.AT','Awareness and Training','Staff and privileged users have the knowledge to do their part.','พนักงานและผู้มีสิทธิ์สูงมีความรู้พอจะทำหน้าที่ของตน'],
['PR.DS','Data Security','Data, including backups, is protected from theft, tampering, and loss.','ปกป้องข้อมูลรวมถึง Backup จากการขโมย การแก้ไข และการสูญหาย'],

['PR.IR','Technology Infrastructure Resilience','Networks and infrastructure are segmented and built to withstand failure.','แบ่งโซนเครือข่ายและออกแบบโครงสร้างพื้นฐานให้ทนต่อความล้มเหลว'],

const FLOORTIP={
 cii:{en:[['What it means','The National Cyber Security Committee has designated the organization as Critical Information Infrastructure. Section 49 lists the CII sectors: national security, material public services, banking and finance, IT and telecommunications, transportation and logistics, energy and public utilities, and public health.'],['Why Tier 3','CII organizations must keep a code of practice and standards framework (Section 44), complete a risk assessment and an audit at least once a year and report results to the NCSA by 31 January (Section 54 and the 2024 notification), and report significant incidents to the NCSA and their regulator, within 24 hours under the 2024 notification (Section 57). That needs approved practice applied the same way every time.'],['Verify','The designation letter from the regulator and the current NCSA reporting forms.']],
  th:[['หมายความว่า','คณะกรรมการการรักษาความมั่นคงปลอดภัยไซเบอร์แห่งชาติกำหนดให้องค์กรเป็น CII มาตรา 49 กำหนดภาค CII ได้แก่ ความมั่นคงของรัฐ บริการภาครัฐที่สำคัญ การเงินการธนาคาร เทคโนโลยีสารสนเทศและโทรคมนาคม การขนส่งและโลจิสติกส์ พลังงานและสาธารณูปโภค และสาธารณสุข'],['ทำไม Tier 3','CII ต้องมีประมวลแนวทางปฏิบัติและกรอบมาตรฐาน (มาตรา 44) ประเมินความเสี่ยงและตรวจสอบอย่างน้อยปีละครั้ง และส่งผลให้ สกมช. ภายใน 31 มกราคม (มาตรา 54 และประกาศปี 2567) และรายงานภัยคุกคามที่มีนัยสำคัญต่อ สกมช. และหน่วยงานกำกับภายใน 24 ชั่วโมงตามประกาศปี 2567 (มาตรา 57) จึงต้องมีแนวปฏิบัติที่อนุมัติและทำแบบเดียวกันทุกครั้ง'],['ต้องตรวจสอบ','หนังสือแจ้งการกำหนดจากหน่วยงานกำกับ และแบบรายงานฉบับปัจจุบันของ สกมช.']]},
 state:{en:[['What it means','The organization is a state agency, such as a government department, state enterprise, or public university.'],['Why Tier 3','Since 18 January 2025, state agencies must classify each data or information system as low, medium, or high for confidentiality, integrity, and availability, review the category at least every three years, and apply the matching minimum security measures.'],['Verify','The measures table for each security category in the NCSC notification, and any parent ministry rules.']],
  th:[['หมายความว่า','องค์กรเป็นหน่วยงานของรัฐ เช่น ส่วนราชการ รัฐวิสาหกิจ หรือมหาวิทยาลัยของรัฐ'],['ทำไม Tier 3','ตั้งแต่ 18 มกราคม 2568 หน่วยงานของรัฐต้องจัดระดับข้อมูลและระบบสารสนเทศเป็นต่ำ กลาง หรือสูง ตามความลับ ความถูกต้อง และความพร้อมใช้ ทบทวนอย่างน้อยทุก 3 ปี และใช้มาตรการขั้นต่ำตามระดับนั้น'],['ต้องตรวจสอบ','ตารางมาตรการตามระดับในประกาศ กมช. และเกณฑ์ของกระทรวงต้นสังกัด']]},
 sensitive:{en:[['What it means','The organization collects or uses sensitive personal data under PDPA Section 26, such as health, biometric, or criminal record data.'],['Why Tier 3','PDPA Section 37 requires appropriate security measures and notification of a personal data breach to the PDPC Office without delay and within 72 hours, unless the breach is unlikely to affect individuals. High-risk breaches must also be notified to data subjects. Both depend on consistent access control, data protection, and a tested notification process.'],['Verify','The PDPC notifications on security measures and on breach notification, and any later updates.']],
  th:[['หมายความว่า','องค์กรเก็บหรือใช้ข้อมูลส่วนบุคคลอ่อนไหวตาม PDPA มาตรา 26 เช่น ข้อมูลสุขภาพ ข้อมูลชีวภาพ หรือประวัติอาชญากรรม'],['ทำไม Tier 3','PDPA มาตรา 37 กำหนดให้มีมาตรการรักษาความปลอดภัยที่เหมาะสม และแจ้งเหตุละเมิดต่อสคส. โดยไม่ชักช้าภายใน 72 ชั่วโมง เว้นแต่ไม่มีความเสี่ยงที่จะกระทบสิทธิของบุคคล หากมีความเสี่ยงสูงต้องแจ้งเจ้าของข้อมูลด้วย ทั้งหมดต้องอาศัยการควบคุมสิทธิ์ การปกป้องข้อมูล และขั้นตอนแจ้งเหตุที่ทดสอบแล้ว'],['ต้องตรวจสอบ','ประกาศคณะกรรมการคุ้มครองข้อมูลส่วนบุคคลเรื่องมาตรการรักษาความปลอดภัยและการแจ้งเหตุละเมิด และฉบับแก้ไขภายหลัง']]},
 sector:{en:[['What it means','A financial regulator issues binding IT risk rules for the license: the Bank of Thailand (banks and payment service providers), the SEC (securities and asset management), or the OIC (insurers).'],['Why Tier 3','These rules expect board oversight of IT risk, regular risk assessment, control of outsourced providers, and incident reporting to the regulator under documented policy. For example, OIC rules require insurers to report critical cyber attacks within 72 hours.'],['Verify','The notification that applies to the specific license type and its effective date.']],
  th:[['หมายความว่า','หน่วยงานกำกับภาคการเงินออกเกณฑ์ IT risk ที่บังคับใช้กับใบอนุญาต ได้แก่ ธปท. (ธนาคารและผู้ให้บริการชำระเงิน) ก.ล.ต. (หลักทรัพย์และจัดการลงทุน) หรือ คปภ. (บริษัทประกัน)'],['ทำไม Tier 3','เกณฑ์เหล่านี้คาดหวังการกำกับ IT risk โดย Board การประเมินความเสี่ยงสม่ำเสมอ การควบคุมผู้ให้บริการภายนอก และการรายงานเหตุต่อหน่วยงานกำกับภายใต้นโยบายที่เป็นลายลักษณ์อักษร เช่น เกณฑ์ คปภ. กำหนดให้รายงานการโจมตีที่กระทบโครงสร้างพื้นฐานสำคัญภายใน 72 ชั่วโมง'],['ต้องตรวจสอบ','ประกาศที่ใช้กับใบอนุญาตประเภทนั้น และวันที่มีผลบังคับใช้']]},
 card:{en:[['What it means','The organization stores, processes, or transmits payment card data, or its systems can affect the security of card data.'],['Why Tier 3','PCI DSS requires documented, consistently applied controls for access, data protection, secure configuration, and monitoring, validated every year.'],['Verify','The merchant or service provider level and the validation type agreed with the acquiring bank.']],
  th:[['หมายความว่า','องค์กรจัดเก็บ ประมวลผล หรือส่งต่อข้อมูลบัตรชำระเงิน หรือมีระบบที่กระทบความปลอดภัยของข้อมูลบัตร'],['ทำไม Tier 3','PCI DSS กำหนดมาตรการที่เป็นลายลักษณ์อักษรและใช้สม่ำเสมอ ด้านการควบคุมสิทธิ์ การปกป้องข้อมูล การตั้งค่าที่ปลอดภัย และการเฝ้าระวัง โดยต้องตรวจรับรองทุกปี'],['ต้องตรวจสอบ','ระดับของร้านค้าหรือผู้ให้บริการ และประเภทการตรวจรับรองที่ตกลงกับธนาคารผู้รับบัตร']]},
 ot:{en:[['What it means','Industrial control systems or other operational technology run production, utilities, or safety functions.'],['Why Tier 3','An OT outage can stop production or harm people, so asset inventory, network segmentation, secure configuration, and tested recovery must be consistent.'],['Note','Usually a customer, insurer, or practitioner expectation rather than a legal requirement.'],['Verify','Customer contracts, insurer requirements, and any sector rules for OT.']],
  th:[['หมายความว่า','มีระบบควบคุมอุตสาหกรรมหรือ OT อื่นที่ควบคุมการผลิต สาธารณูปโภค หรือระบบความปลอดภัย'],['ทำไม Tier 3','หาก OT หยุดอาจทำให้การผลิตหยุดหรือมีผู้ได้รับอันตราย จึงต้องมีทะเบียนทรัพย์สิน การแบ่งโซนเครือข่าย การตั้งค่าที่ปลอดภัย และการกู้คืนที่ทดสอบแล้วอย่างสม่ำเสมอ'],['หมายเหตุ','ส่วนใหญ่เป็นความคาดหวังของลูกค้า บริษัทประกัน หรือแนวปฏิบัติทั่วไป ไม่ใช่ข้อกำหนดทางกฎหมาย'],['ต้องตรวจสอบ','สัญญากับลูกค้า ข้อกำหนดของบริษัทประกัน และเกณฑ์เฉพาะภาคธุรกิจด้าน OT']]}};

function compute(src=cons){
  const th=allThemes(),dem={},drv={};CATS.forEach(c=>{dem[c.id]=0;drv[c.id]=[]});
  th.forEach(t=>{const p=src(t.id);for(const cid in t.map){const w=t.map[cid]==='P'?1:.5;dem[cid]+=p*w;if(p>0)drv[cid].push([t,p*w])}});
  const max=Math.max(1e-9,...Object.values(dem)),R={};
  CATS.forEach(c=>{
    const rel=dem[c.id]/max,pr=rel>=.66?'H':rel>=.33?'M':'L',ft=fnTier(c.fn);
    const adj=pr==='H'?1:pr==='L'?-1:0,prioTier=adj>0?Math.min(ft+1,Math.max(ft,3)):Math.max(1,ft+adj),capped=adj>0&&prioTier===ft;
    const reasons=Object.keys(FLOORS).filter(k=>S.toggles[k]&&FLOORS[k].cats.includes(c.id));
    const floor=Math.max(+S.baseline,reasons.length?3:0),draft=Math.max(prioTier,floor);
    const ov=S.overrides[c.id]||{},final=ov.tier?+ov.tier:draft,cur=null;
    drv[c.id].sort((a,b)=>b[1]-a[1]);
    R[c.id]={demand:dem[c.id],rel,pr,ft,adj,prioTier,capped,reasons,floor,draft,final,cur,gap:cur?final-cur:null,below:final<floor,ov,drivers:drv[c.id].slice(0,3).map(d=>d[0])};
  });return R;
}

  case 'reset':if(!armed){armed=true;b.classList.add('armed');b.textContent=X().f.resetarm;setTimeout(()=>{armed=false;const r=document.getElementById('resetbtn');if(r){r.classList.remove('armed');r.textContent=X().f.reset}},4000)}else{armed=false;S=blankState(S.lang);selCat=null;render()}break;
  case 'copycsv':copy(csv(),'msg2',X().msg.csv);break;
  case 'addcustom':{const t=document.getElementById('ct').value.trim();if(!t)return;addCustomTheme(t,document.getElementById('cq').value.trim(),'cd-');render();break}

  case 'qclose':S.addOpen=false;render();break;
  case 'qadd':{const f=document.getElementById('qa-t'),t=f?f.value.trim():'';if(!t){if(f)f.focus();return}addCustomTheme(t,document.getElementById('qa-q').value.trim(),'qa-d-');S.addOpen=false;render();break}
  case 'rmcustom':{const id=b.dataset.t;S.custom=S.custom.filter(x=>x.id!==id);S.people.forEach(p=>delete p.pts[id]);render();break}
  case 'cdim':{const t=S.custom.find(x=>x.id===b.dataset.t);t.dims=t.dims||{};if(t.dims[b.dataset.d])delete t.dims[b.dataset.d];else t.dims[b.dataset.d]=1;render();break}
  case 'cmap':{const t=S.custom.find(x=>x.id===b.dataset.t),c=b.dataset.c,w=t.map[c];if(!w)t.map[c]='P';else if(w==='P')t.map[c]='S';else delete t.map[c];render();break}
 }});

 const keepFocus=()=>{};
 switch(a){

 }});

<script>
/* View mode: Presentation / Editor. Presentation shows only the tabs listed in CFG.pres. */
(function(){
var CFG={"kind": "ws", "pres": []}, KEY="csf-view-mode";
var T={EN:{pres:"Presentation view",edit:"Editor view",tp:"Switch to presentation view (presentation tabs only)",te:"Switch to editor view (all tabs and tools)"},
TH:{pres:"มุมมองนำเสนอ",edit:"มุมมองแก้ไข",tp:"สลับเป็นมุมมองนำเสนอ (แสดงเฉพาะแท็บนำเสนอ)",te:"สลับเป็นมุมมองแก้ไข (แสดงทุกแท็บและเครื่องมือ)"}};
var ws=CFG.kind==="ws", stored=null, mode="edit";
try{stored=localStorage.getItem(KEY)}catch(e){}
if(stored==="pres")mode="pres";
function isTH(){try{return ws?S.lang==="th":lang==="TH"}catch(e){return false}}
function cur(){return ws?(S.aud==="exec"?"pres":"edit"):mode}
function paint(){
  var b=document.getElementById("b-vm");if(!b)return;
  var m=cur(),L=T[isTH()?"TH":"EN"];
  b.textContent=m==="pres"?L.edit:L.pres;
  b.title=m==="pres"?L.te:L.tp;
  b.setAttribute("aria-pressed",m==="pres"?"true":"false");
  b.classList.toggle("pri",m==="pres");
  document.body.classList.toggle("vm-pres",m==="pres");
}
if(ws){
  if(stored==="pres"||stored==="edit")S.aud=stored==="pres"?"exec":"cons";
  var r0=render;render=function(){r0.apply(this,arguments);paint();};
}else{
  var ok=function(v){return mode!=="pres"||CFG.pres.indexOf(v)>-1};
  var ensure=function(){if(!ok(view))view=CFG.pres[0];};
  var rs=renderStatic;
  renderStatic=function(){ensure();rs.apply(this,arguments);
    if(mode==="pres"){var tb=document.getElementById("tabs");
      if(tb)tb.querySelectorAll("[data-tab]").forEach(function(b){if(CFG.pres.indexOf(b.dataset.tab)<0)b.remove();});}
    paint();};
  var rv=renderView;renderView=function(){ensure();return rv.apply(this,arguments);};
  var sv=setView;setView=function(v){if(!ok(v))return;return sv.apply(this,arguments);};
  if(typeof goDoc==="function"){var gd=goDoc;goDoc=function(){if(!ok("assess"))return;return gd.apply(this,arguments);};}
  if(typeof goSub==="function"){var gs=goSub;goSub=function(){if(!ok("iv"))return;return gs.apply(this,arguments);};}
}
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("#b-vm");if(!b)return;
  var next=cur()==="pres"?"edit":"pres";
