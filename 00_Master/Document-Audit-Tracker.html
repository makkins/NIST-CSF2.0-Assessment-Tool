<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}
/* View mode: Presentation / Editor */
#b-vm{white-space:nowrap}
body.vm-pres #b-open,body.vm-pres #b-save,body.vm-pres #b-xlsx,body.vm-pres #savebar{display:none!important}
#audseg{display:none!important}
</style>
</head>
<body>
<title>CSF Document Audit Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: engagement header, tab bar (Setup, Dashboard, Assess, Gap roadmap, Activities); Assess is a list-detail workspace */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212f; --muted:#5a6577; --line:#d6dce5; --accent:#245a7a; --accent-soft:#e2eef5; --chip:#eef1f5;
  --ok:#1e7a46; --ok-soft:#e3f3ea; --warn:#a96300; --warn-soft:#fcf0dc; --bad:#b42318; --bad-soft:#fbe7e5; --na:#7b8494; --na-soft:#f0f1f4;
  --req:#b42318; --exp:#1d4ed8; --opt:#8a93a3; --on-block:#ffffff;
  --cap-it:#2e7d4f; --cap-g:#b26a00; --cap-s:#8a2f8f;
  --f-body:"IBM Plex Sans Thai",system-ui,"Segoe UI",Tahoma,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#18202a; --ink:#e5e9f0; --muted:#9aa4b4; --line:#2c3644; --accent:#7fb6d6; --accent-soft:#1d3342; --chip:#222b37;
  --ok:#4cc27e; --ok-soft:#173326; --warn:#e3a33f; --warn-soft:#3a2c15; --bad:#ef6b61; --bad-soft:#3a1d1c; --na:#8a93a3; --na-soft:#232a35;
  --req:#e5534b; --exp:#5b8def; --opt:#7d8696; --on-block:#ffffff; --cap-it:#4fbf82; --cap-g:#e2a23b; --cap-s:#d07ad6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#18202a; --ink:#e5e9f0; --muted:#9aa4b4; --line:#2c3644; --accent:#7fb6d6; --accent-soft:#1d3342; --chip:#222b37;
  --ok:#4cc27e; --ok-soft:#173326; --warn:#e3a33f; --warn-soft:#3a2c15; --bad:#ef6b61; --bad-soft:#3a1d1c; --na:#8a93a3; --na-soft:#232a35;
  --req:#e5534b; --exp:#5b8def; --opt:#7d8696; --on-block:#ffffff; --cap-it:#4fbf82; --cap-g:#e2a23b; --cap-s:#d07ad6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
.wrap{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
header.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font-size:clamp(20px,2.6vw,27px);margin:0;line-height:1.2;text-wrap:balance}
.eng{color:var(--muted);font-size:13px;margin-top:2px}
.eng b{color:var(--ink)}
.hbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{font:600 13px var(--f-body);padding:6px 11px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{font-size:12px;padding:3px 8px}
.btn.mono{font-family:var(--f-mono);white-space:nowrap}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.lang{display:flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.lang button{font:600 13px var(--f-body);padding:6px 12px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.savebar{font-size:12px;color:var(--muted);margin:8px 0 0}
.tabs{display:flex;gap:4px;margin:14px 0 12px;flex-wrap:wrap}
.tabs button{font:600 14px var(--f-body);padding:7px 14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:4px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=search],input[type=date],select,textarea{font:13px var(--f-body);padding:5px 7px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:54px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
.box{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.pad{padding:14px}
.scroll{overflow-x:auto}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px;max-width:110ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.form{display:grid;grid-template-columns:200px 1fr;gap:8px 12px;align-items:center}
.form label{font-size:13px;color:var(--muted)}
.form .help{grid-column:2;font-size:12px;color:var(--muted);margin-top:-4px}
@media (max-width:640px){.form{grid-template-columns:1fr}.form .help{grid-column:1}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
.seg button{font:600 12px var(--f-body);padding:3px 9px;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"][data-v="P"],.seg button[aria-pressed="true"][data-v="Exists"],.seg button[aria-pressed="true"][data-v="Y"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="F"],.seg button[aria-pressed="true"][data-v="Missing"],.seg button[aria-pressed="true"][data-v="N"]{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"][data-v="Partial"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="NA"]{background:var(--na);color:#fff}
.lv{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:2px;font:600 11px var(--f-mono);color:var(--on-block);flex:none}
.lv.Required{background:var(--req)} .lv.Expected{background:var(--exp)} .lv.Optional{background:var(--opt)}
.cap{flex:none;font:600 10px var(--f-mono);padding:0 4px;border-radius:2px;border:1px solid currentColor;line-height:15px;display:inline-block}
.cap.IT{color:var(--cap-it)} .cap.GUIDED{color:var(--cap-g)} .cap.SPEC{color:var(--cap-s)}
.st{display:inline-block;font:600 11px var(--f-body);padding:1px 8px;border-radius:10px;white-space:nowrap}
.st.Exists{background:var(--ok-soft);color:var(--ok)} .st.Partial{background:var(--warn-soft);color:var(--warn)} .st.Missing{background:var(--bad-soft);color:var(--bad)} .st.NA{background:var(--na-soft);color:var(--na)} .st.none{background:var(--chip);color:var(--muted)} .st.out{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.mono{font-family:var(--f-mono)}
.mini{font-size:12px;color:var(--muted)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{padding:10px 12px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--warn)} .kpi.bad b{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.bar .tr{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--chip)}
.bar .tr i{display:block;height:100%}
.bar .num{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:12px}
@media (max-width:560px){.bar{grid-template-columns:90px 1fr 54px}}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.heat>div{border-radius:4px;padding:8px;font-size:12px;border:1px solid var(--line)}
.heat b{display:block;font-family:var(--f-mono);font-size:13px}
.callout{border-left:4px solid var(--cap-s);background:var(--chip);padding:10px 12px;border-radius:4px;font-size:13px;margin:8px 0}
.callout.ok{border-left-color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:4px}
/* tables */
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface);position:sticky;top:0}
table.t tr.out td{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
/* assess workspace */
.ws{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:12px;align-items:start}
@media (max-width:900px){.ws{grid-template-columns:1fr}}
.list{max-height:78vh;overflow:auto}
.lfil{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.lfil input[type=search]{flex:1 1 100%}
.li{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 10px;cursor:pointer;font:13px var(--f-body)}
.li:hover{background:var(--chip)} .li.sel{background:var(--accent-soft)}
.li .id{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .pct{font:600 11px var(--f-mono);color:var(--muted);min-width:34px;text-align:right}
.li.out{opacity:.5}
.detail{min-width:0}
.dh{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dh h2{flex:1 1 300px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin:6px 0 10px}
.meta b{color:var(--ink);font-weight:600}
.ck{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.ck .q{font-weight:600;font-size:13px}
.ck .r{font-size:12px;color:var(--muted);grid-column:1}
.ck .seg{grid-row:1/span 2;grid-column:2;align-self:start}
.ck input{grid-column:1/-1;width:100%}
.ck.F .q{color:var(--bad)}
.actrow{border:1px solid var(--line);border-radius:4px;padding:8px;margin:6px 0}
.actrow .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actrow .top b{flex:1;min-width:0}
.actrow details{font-size:12px;margin-top:4px}
.actrow ol{margin:4px 0;padding-left:18px}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:20;display:flex;justify-content:center;align-items:flex-start;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal .panel{background:var(--surface);color:var(--ink);border-radius:8px;max-width:860px;width:100%;padding:22px 24px;border:1px solid var(--line)}
.modal p,.modal li{font-size:14px;max-width:80ch}
.modal h3{text-transform:none;letter-spacing:0;color:var(--ink);font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:13px;z-index:30}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1 id="t-title">CSF Document Audit Tracker</h1>
      <div class="eng" id="eng"></div>
    </div>
    <div class="hbtns">
      <button class="btn" id="b-help"></button>
      <button class="btn" id="b-open"></button><input type="file" id="file" accept=".json,application/json" hidden>
      <button class="btn" id="b-save"></button>
      <button class="btn pri" id="b-xlsx"></button>
      <button class="btn" id="b-vm" type="button" aria-pressed="false">Presentation view</button>
      <div class="lang" role="group" aria-label="Language"><button id="b-th" aria-pressed="false">ไทย</button><button id="b-en" aria-pressed="true">EN</button></div>
    </div>
  </header>
  <p class="savebar" id="savebar"></p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <section id="v-setup"></section>
  <section id="v-dash" hidden></section>
  <section id="v-assess" hidden></section>
  <section id="v-gaps" hidden></section>
  <section id="v-acts" hidden></section>
</div>
<div class="modal" id="help" hidden role="dialog" aria-modal="true"><div class="panel" id="help-body"></div></div>
<div class="modal" id="confirm" hidden role="alertdialog" aria-modal="true" aria-labelledby="cf-title"><div class="panel" id="confirm-body" style="max-width:560px"></div></div>
<div class="toast" id="toast" hidden></div>

<script>

ternal and external stakeholders and their cybersecurity expectations are understood","GV.OC-03":"Legal, regulatory, and contractual cybersecurity requirements are understood and managed","GV.OC-04":"Critical objectives, capabilities, and services that external stakeholders depend on are understood","GV.OC-05":"Outcomes, capabilities, and services that the organization depends on are understood","GV.RM-01":"Risk management objectives are established and agreed to by stakeholders","GV.RM-02":"Risk appetite and risk tolerance statements are established, communicated, and maintained","GV.RM-03":"Cybersecurity risk management is included in enterprise risk management processes","GV.RM-04":"Strategic direction for appropriate risk response options is established and communicated","GV.RM-05":"Lines of communication for cybersecurity risks, including supplier risks, are established","GV.RM-06":"A standardized method for calculating, documenting, categorizing, and prioritizing risks is established","GV.RM-07":"Strategic opportunities (positive risks) are characterized and included in discussions","GV.RR-01":"Leadership is responsible and accountable for cybersecurity risk and fosters a risk-aware culture","GV.RR-02":"Cybersecurity roles, responsibilities, and authorities are established, communicated, and enforced","GV.RR-03":"Adequate resources are allocated commensurate with risk strategy, roles, and policies","GV.RR-04":"Cybersecurity is included in human resources practices","GV.PO-01":"Cybersecurity policy is established, communicated, and enforced based on context, strategy, and priorities","GV.PO-02":"Cybersecurity policy is reviewed, updated, communicated, and enforced to reflect changes","GV.OV-01":"Risk management strategy outcomes are reviewed to inform and adjust strategy and direction","GV.OV-02":"Risk management strategy is reviewed and adjusted to ensure coverage of requirements and risks","GV.OV-03":"Risk management performance is evaluated and reviewed for tion are identified and recorded","ID.RA-04":"Potential impacts and likelihoods of threats exploiting vulnerabilities are identified and recorded","ID.RA-05":"Threats, vulnerabilities, likelihoods, and impacts are used to understand inherent risk and inform prioritization","ID.RA-06":"Risk responses are chosen, prioritized, planned, tracked, and communicated","ID.RA-07":"Changes and exceptions are managed, assessed for risk impact, recorded, and tracked","ID.RA-08":"Processes for receiving, analyzing, and responding to vulnerability disclosures are established","ID.RA-09":"The authenticity and integrity of hardware and software are assessed prior to acquisition and use","ID.RA-10":"Critical suppliers are assessed prior to acquisition","ID.IM-01":"Improvements are identified from evaluations","ID.IM-02":"Improvements are identified from security tests and exercises","ID.IM-03":"Improvements are identified from execution of operational processes, procedures, and activities","ID.IM-04":"Incident response plans and other cybersecurity plans that affect operations are established, communicated, maintained, and improved","PR.AA-01":"Identities and credentials for authorized users, services, and hardware are managed","PR.AA-02":"Identities are proofed and bound to credentials based on the context of interactions","PR.AA-03":"Users, services, and hardware are authenticated","PR.AA-04":"Identity assertions are protected, conveyed, and verified","PR.AA-05":"Access permissions, entitlements, and authorizations are defined, managed, enforced, and reviewed","PR.AA-06":"Physical access to assets is managed, monitored, and enforced commensurate with risk","PR.AT-01":"Personnel are provided with awareness and training for general tasks with cybersecurity risks in mind","PR.AT-02":"Individuals in specialized roles are provided with awareness and training for those roles","PR.DS-01":"The confidentiality, integrity, and availability of data-at-rest are protected","PR.DS-02":"The confi xecutive sponsorship, agree why the organization is formalizing cybersecurity, and confirm who owns the program.","ได้รับการสนับสนุนจากผู้บริหาร ตกลงเหตุผลที่องค์กรต้องจัดระบบความมั่นคงปลอดภัยไซเบอร์ และยืนยันผู้รับผิดชอบแผนงาน"],"agenda":[["Trigger and business case: incidents in the sector, legal duties (CII, PDPA), customer demands","Program objectives for the first 12 months","Who sponsors, who owns, and who runs the program","Reporting line of the security lead and escalation route to the Board","Decisions needed: approve charter drafting, name the program owner, set the next meeting"],["เหตุผลและกรณีทางธุรกิจ: เหตุการณ์ในอุตสาหกรรม หน้าที่ตามกฎหมาย (CII, PDPA) และข้อกำหนดของลูกค้า","เป้าหมายของแผนงานใน 12 เดือนแรก","ผู้สนับสนุน เจ้าของ และผู้ดำเนินแผนงาน","สายการรายงานของผู้นำด้านความมั่นคงปลอดภัยและช่องทางยกระดับถึงคณะกรรมการ","เรื่องที่ต้องตัดสินใจ: อนุมัติการร่างกฎบัตร แต่งตั้งเจ้าของแผนงาน และกำหนดการประชุมครั้งถัดไป"]],"roles":["CEO","CIO","CFO","CISO","CRO","LEGAL"],"inputs":["Sector incident news, legal applicability notes","ข่าวเหตุการณ์ในอุตสาหกรรม บันทึกการประเมินกฎหมายที่เกี่ยวข้อง"],"duration":["90 minutes","90 นาที"],"cap":"GUIDED","freq":["One time","ครั้งเดียว"],"first":["Keep it short and decision focused. Bring one page with three decisions only. Without a named sponsor, every later document will stall at approval.","จัดให้สั้นและเน้นการตัดสินใจ เตรียมเอกสาร 1 หน้าที่มีเรื่องให้ตัดสินใจเพียง 3 เรื่อง หากไม่มีผู้สนับสนุนที่ระบุชื่อชัดเจน เอกสารทุกฉบับต่อจากนี้จะติดที่ขั้นอนุมัติ"],"outputs":["GV-CHR-001"]},"ACT-02":{"en":"Governance Structure and RACI Workshop","th":"Workshop โครงสร้างการกำกับดูแลและ RACI","purpose":["Design the steering committee, define roles across IT, security, privacy, risk, and audit, and agree a Responsible, Accountable, Consulted, Informed (RACI) matrix.","ออกแบบคณะกรรมการกำกับดูแล กำหนดบทบาทระหว่าง IT ความมั่นคงปลอดภัย ความเป็นส่วนตัว ความเสี่ยง และตรวจสอบ และตกลง RACI matrix"],"agenda":[["Current state: who does security work today, formally or informally","Steering committee membership, chair, quorum, and meeting frequency","Separation of duties: security versus IT operations versus internal audit","RACI for the top 15 security activities","Gaps that need a new role, a part-time assignment, or an external provider"],["สภาพปัจจุบัน: ใครทำงานด้านความมั่นคงปลอดภัยอยู่บ้าง ทั้งที่เป็นทางการและไม่เป็นทางการ","องค์ประกอบคณะกรรมการกำกับดูแล ประธาน องค์ประชุม และความถี่การประชุม","การแบ่งแยกหน้าที่: ความมั่นคงปลอดภัย กับงานปฏิบัติการ IT และตรวจสอบภายใน","RACI สำหรับกิจกรรมด้านความมั่นคงปลอดภัยหลัก 15 กิจกรรม","ช่องว่างที่ต้องตั้งตำแหน่งใหม่ มอบหมายแบบบางเวลา หรือจ้างผู้ให้บริการภายนอก"]],"roles":["CIO","CISO","HR","DPO","CRO","IA"],"inputs":["Organization chart, current job descriptions","ผังองค์กร คำบรรยายลักษณะงานปัจจุบัน"],"duration":["Half day","ครึ่งวัน"],"cap":"GUIDED","freq":["One time, then annual review","ครั้งเดียว และทบทวนรายปี"],"first":["Map real work before drawing boxes. A common trap is naming the IT Manager as both the person who operates systems and the person who checks them.","ทำแผนผังงานที่เกิดขึ้นจริงก่อนวาดผังองค์กร กับดักที่พบบ่อยคือกำหนดให้ผู้จัดการ IT เป็นทั้งผู้ดูแลระบบและผู้ตรวจสอบระบบในคนเดียวกัน"],"outputs":["GV-CHR-001","GV-CHR-002","GV-REG-003"]},"ACT-03":{"en":"Legal and Regulatory Applicability Review","th":"การทบทวนกฎหมายและกฎระเบียบที่บังคับใช้","purpose":["Confirm which laws, regulator notifications, and contracts apply, and translate each into concrete obligations and owners.","ยืนยันกฎหมาย ประกาศของหน่วยงานกำกับ และสัญญาที่บังคับใช้ และแปลงแต่ละข้อเป็นหน้าที่ที่ชัดเจนพร้อมผู้รับผิดชอบ"],"agenda":[["Is the organization a Critical Information Infrastructure (CII) operator under the Cybersecurity Act B.E. 2562","Personal data processed and whether sensitive data under PDPA s.26 is involved","Computer Crime Act duties if the organization provides network access to others","Sector regulator rules and key customer or partner contract clauses","Obligation list with owner, evidence, and deadline"],["องค์กรเป็นหน่วยงานโครงสร้างพื้นฐานสำคัญทางสารสนเทศ (CII) ตาม พ.ร.บ.การรักษาความมั่นคงปลอดภัยไซเบอร์ พ.ศ. 2562 หรือไม่","ข้อมูลส่วนบุคคลที่ประมวลผล และมีข้อมูลอ่อนไหวตาม PDPA มาตรา 26 หรือไม่","หน้าที่ตาม พ.ร.บ.คอมพิวเตอร์ฯ หากองค์กรให้บริการเครือข่ายแก่ผู้อื่น","กฎของหน่วยงานกำกับดูแลรายอุตสาหกรรม และเงื่อนไขในสัญญากับลูกค้าหรือคู่ค้าสำคัญ","รายการหน้าที่พร้อมผู้รับผิดชอบ หลักฐาน และกำหนดเวลา"]],"roles":["LEGAL","CISO","DPO","CIO"],"inputs":["Laws and notifications, key contracts, regulator letters","กฎหมายและประกาศ สัญญาสำคัญ หนังสือจากหน่วยงานกำกับ"],"duration":["2 to 3 working sessions","2 ถึง 3 รอบการทำงาน"],"cap":"SPEC","freq":["One time, then semiannual update","ครั้งเดียว และปรับปรุงทุก 6 เดือน"],"first":["Thai cybersecurity notifications change often. Have legal counsel or a specialist consultant confirm current CII and PDPC requirements before writing obligations into policy.","ประกาศด้านไซเบอร์ของไทยเปลี่ยนแปลงบ่อย ควรให้ที่ปรึกษากฎหมายหรือผู้เชี่ยวชาญยืนยันข้อกำหนด CII และ PDPC ฉบับปัจจุบันก่อนนำไปเขียนเป็นนโยบาย"],"outputs":["GV-REG-001","GV-POL-001","GV-REG-006","GV-POL-004","RS-PRC-003"]},"ACT-04":{"en":"Scope and Organizational Context Workshop","th":"Workshop ขอบเขตและบริบทองค์กร","purpose":["Agree what the security program covers: sites, services, systems, interfaces, and stakeholders.","ตกลงขอบเขตของแผนงาน: สถานที่ บริการ ระบบ จุดเชื่อมต่อ และผู้มีส่วนได้ส่วนเสีย"],"agenda":[["Critical services and the systems behind them","Sites, cloud services, and outsourced functions in and out of scope","Internal and external stakeholders and their expectations","Interfaces and dependencies with third parties","Draft scope statement and exclusions with justification"],["บริการสำคัญและระบบที่รองรับ","สถานที่ บริการคลาวด์ และงานที่จ้างภายนอก ทั้งที่อยู่ในและนอกขอบเขต","ผู้มีส่วนได้ส่วนเสียภายในและภายนอก และความคาดหวัง","จุดเชื่อมต่อและการพึ่งพาบุคคลภายนอก","ร่างเอกสารขอบเขตและข้อยกเว้นพร้อมเหตุผล"]],"roles":["CISO","CIO","CRO","SYSOWN"],"inputs":["Service catalog, system list, legal obligation list","รายการบริการ รายการระบบ รายการหน้าที่ตามกฎหมาย"],"duration":["Half day","ครึ่งวัน"],"cap":"GUIDED","freq":["One time, then annual review","ครั้งเดียว และทบทวนรายปี"],"first":["Start narrow if resources are thin, such as the critical services only, and widen the scope each year.","หากทรัพยากรจำกัด ให้เริ่มจากขอบเขตแคบ เช่น เฉพาะบริการสำคัญ แล้วขยายขอบเขตทุกปี"],"outputs":["GV-RPT-001","GV-REG-002"]},"ACT-05":{"en":"Asset Discovery and Inventory Reconciliation","th":"การสำรวจและกระทบยอดทะเบียนทรัพย์สิน","purpose":["Build a trusted inventory of hardware, software, cloud services, and data by comparing several sources.","จัดทำทะเบียนทรัพย์สินที่เชื่อถือได้ ทั้งฮาร์ดแวร์ ซอฟต์แวร์ บริการคลาวด์ และข้อมูล โดยเปรียบเทียบจากหลายแหล่ง"],"agenda":[["Collect sources: network scan, endpoint agent, directory service, finance asset register, purchase records","Reconcile differences and identify unknown or unmanaged devices","Assign an owner and criticality to each asset","Agree the system of record and the update trigger (purchase, change, disposal)"],["รวบรวมแหล่งข้อมูล: การสแกนเครือข่าย endpoint agent directory service ทะเบียนทรัพย์สินฝ่ายการเงิน และบันทึกการจัดซื้อ","กระทบยอดความแตกต่าง และระบุอุปกรณ์ที่ไม่รู้จักหรือไม่มีผู้ดูแล","กำหนดเจ้าของและระดับความสำคัญของทรัพย์สินแต่ละรายการ","ตกลงระบบหลักที่ใช้บันทึกและเหตุการณ์ที่ต้องปรับปรุงทะเบียน (จัดซื้อ เปลี่ยนแปลง จำหน่าย)"]],"roles":["ITM","SYSOWN","CFO","FAC"],"inputs":["Scan results, directory export, finance register","ผลการสแกน ข้อมูลจาก directory ทะเบียนทรัพย์สินฝ่ายการเงิน"],"duration":["2 to 6 weeks","2 ถึง 6 สัปดาห์"],"cap":"IT","freq":["Initial build, then continuous","จัดทำครั้งแรก แล้วปรับปรุงต่อเนื่อง"],"first":["IT can run this alone. Do not wait for a perfect list; 90 percent coverage with owners is enough to start risk assessment.","ทีม IT ดำเนินการเองได้ ไม่ต้องรอให้ทะเบียนสมบูรณ์ ความครอบคลุมราว 90 เปอร์เซ็นต์ที่มีเจ้าของชัดเจนก็เพียงพอสำหรับเริ่มประเมินความเสี่ยง"],"outputs":["ID-REG-001","ID-REG-002","ID-RPT-001","ID-REG-004"]},"ACT-06":{"en":"Data Mapping Interviews","th":"การสัมภาษณ์เพื่อจัดทำแผนผังข้อมูล","purpose":["Find out what personal and sensitive data each department collects, why, where it is stored, and who receives it.","ค้นหาว่าแต่ละหน่วยงานเก็บข้อมูลส่วนบุคคลและข้อมูลอ่อนไหวอะไร เพื่ออะไร เก็บที่ไหน และส่งต่อให้ใคร"],"agenda":[["Processing activities per department and their purpose","Lawful basis for each activity under PDPA","Systems, storage locations, and retention period","Transfers to processors and cross-border transfers","Follow-up items: missing consent, missing contract, excessive retention"],["กิจกรรมการประมวลผลของแต่ละหน่วยงานและวัตถุประสงค์","ฐานทางกฎหมายของแต่ละกิจกรรมตาม PDPA","ระบบ ที่จัดเก็บ และระยะเวลาการเก็บรักษา","การส่งต่อให้ผู้ประมวลผลและการโอนข้อมูลไปต่างประเทศ","รายการติดตาม: ขาดความยินยอม ขาดสัญญา เก็บข้อมูลนานเกินจำเป็น"]],"roles":["DPO","SYSOWN","LEGAL","ITM"],"inputs":["Department list, forms and systems used to collect data","รายชื่อหน่วยงาน แบบฟอร์มและระบบที่ใช้เก็บข้อมูล"],"duration":["45 to 60 minutes per department","45 ถึง 60 นาทีต่อหน่วยงาน"],"cap":"GUIDED","freq":["Initial, then annual refresh","ครั้งแรก และทบทวนรายปี"],"first":["Use a short questionnaire before each interview. Lawful basis decisions need privacy counsel or a DPO service if no one in-house has PDPA experience.","ส่งแบบสอบถามสั้นก่อนการสัมภาษณ์ทุกครั้ง การกำหนดฐานทางกฎหมายต้องอาศัยที่ปรึกษาด้านความเป็นส่วนตัวหรือบริการ DPO หากภายในองค์กรไม่มีผู้มีประสบการณ์ด้าน PDPA"],"outputs":["GV-REG-007","GV-TPL-002","ID-REG-003"]},"ACT-07":{"en":"Business Impact Analysis (BIA) Interviews and Validation Workshop","th":"การสัมภาษณ์และ Workshop ยืนยันผลการวิเคราะห์ผลกระทบทางธุรกิจ (BIA)","purpose":["Determine how long each critical service can be down, how much data it can lose, and which systems and suppliers it depends on.","กำหนดว่าบริการสำคัญแต่ละบริการหยุดได้นานเท่าใด สูญเสียข้อมูลได้มากเท่าใด และพึ่งพาระบบและผู้ให้บริการรายใด"],"agenda":[["Impact over time: 1 hour, 4 hours, 1 day, 3 days (safety, financial, legal, reputation)","Maximum tolerable downtime, Recovery Time Objective (RTO), and Recovery Point Objective (RPO) per service","Dependencies: systems, people, suppliers, facilities","Manual workarounds and how long they can run","Validation workshop: management confirms RTO and RPO and accepts the cost implications"],["ผลกระทบตามช่วงเวลา: 1 ชั่วโมง 4 ชั่วโมง 1 วัน 3 วัน (ความปลอดภัย การเงิน กฎหมาย ชื่อเสียง)","ระยะเวลาหยุดชะงักสูงสุดที่ยอมรับได้ Recovery Time Objective (RTO) และ Recovery Point Objective (RPO) ของแต่ละบริการ","การพึ่งพา: ระบบ บุคลากร ผู้ให้บริการ และสถานที่","วิธีปฏิบัติงานด้วยมือทดแทน และระยะเวลาที่ทำได้","Workshop ยืนยันผล: ผู้บริหารยืนยัน RTO และ RPO และยอมรับผลกระทบด้านค่าใช้จ่าย"]],"roles":["BCM","SYSOWN","CIO","CFO","RISK"],"inputs":["Service list, asset inventory, incident history","รายการบริการ ทะเบียนทรัพย์สิน ประวัติเหตุการณ์"],"duration":["1 to 2 hours per service, plus a 2 hour validation workshop","1 ถึง 2 ชั่วโมงต่อบริการ และ Workshop ยืนยันผล 2 ชั่วโมง"],"cap":"SPEC","freq":["Annual","รายปี"],"first":["Business owners tend to say every service needs zero downtime. A facilitator experienced in ISO 22301 must challenge the numbers and show the cost of each RTO.","เจ้าของธุรกิจมักตอบว่าทุกบริการหยุดไม่ได้เลย ผู้ดำเนินการที่มีประสบการณ์ ISO 22301 ต้องตั้งคำถามกับตัวเลขและแสดงต้นทุนของ RTO แต่ละระดับ"],"outputs":["ID-RPT-002","RC-PLN-001"]},"ACT-08":{"en":"Risk Appetite Workshop","th":"Workshop ระดับความเสี่ยงที่ยอมรับได้","purpose":["Have executives state how much cybersecurity risk the organization will accept, in measurable terms.","ให้ผู้บริหารกำหนดระดับความเสี่ยงด้านไซเบอร์ที่องค์กรยอมรับได้ในรูปแบบที่วัดผลได้"],"agenda":[["Recap of top business objectives and recent sector incidents","Appetite by risk area: service disruption, data breach, regulatory breach, fraud","Tolerance thresholds and Key Risk Indicators (KRI) that trigger escalation","Who may accept which level of risk","Approval route to the Board or its committee"],["สรุปเป้าหมายธุรกิจหลักและเหตุการณ์ล่าสุดในอุตสาหกรรม","ระดับความเสี่ยงที่ยอมรับได้รายด้าน: การหยุดชะงักของบริการ ข้อมูลรั่วไหล การไม่ปฏิบัติตามกฎหมาย การทุจริต","เกณฑ์ความเสี่ยงที่ยอมรับได้และ Key Risk Indicators (KRI) ที่ต้องยกระดับ","ผู้มีอำนาจยอมรับความเสี่ยงแต่ละระดับ","เส้นทางการอนุมัติไปยังคณะกรรมการหรือคณะกรรมการชุดย่อย"]],"roles":["CEO","CFO","CIO","CRO","CISO","BOARD"],"inputs":["Enterprise risk framework, BIA results","กรอบการบริหารความเสี่ยงองค์กร ผล BIA"],"duration":["2 hours","2 ชั่วโมง"],"cap":"SPEC","freq":["Annual","รายปี"],"first":["Executives rarely state appetite unprompted. Prepare scenario cards with impact in baht and hours of downtime, then ask which ones they would accept.","ผู้บริหารมักไม่กำหนดระดับความเสี่ยงที่ยอมรับได้เอง ควรเตรียมการ์ดสถานการณ์ที่ระบุผลกระทบเป็นจำนวนเงินบาทและชั่วโมงที่หยุดชะงัก แล้วถามว่ายอมรับสถานการณ์ใดได้"],"outputs":["GV-STM-001"]},"ACT-09":{"en":"Risk Methodology Design and Calibration Session","th":"การออกแบบและปรับเทียบวิธีการประเมินความเสี่ยง","purpose":["Define the likelihood and impact scales, risk matrix, and treatment rules, aligned with enterprise risk management and NIST SP 800-30.","กำหนดเกณฑ์โอกาสและผลกระทบ ตารางความเสี่ยง และกฎการจัดการความเสี่ยง ให้สอดคล้องกับการบริหารความเสี่ยงองค์กรและ NIST SP 800-30"],"agenda":[["Align scales with the enterprise risk framework","Impact criteria: patient or customer safety, financial, legal, operational, reputation","Likelihood criteria tied to threat and control evidence","Treatment options and acceptance authority per risk level","Trial run on three known risks to calibrate scoring"],["ปรับเกณฑ์ให้สอดคล้องกับกรอบการบริหารความเสี่ยงองค์กร","เกณฑ์ผลกระทบ: ความปลอดภัยของผู้ป่วยหรือลูกค้า การเงิน กฎหมาย การปฏิบัติงาน ชื่อเสียง","เกณฑ์โอกาสที่อ้างอิงหลักฐานภัยคุกคามและมาตรการควบคุม","ทางเลือกในการจัดการและผู้มีอำนาจยอมรับในแต่ละระดับความเสี่ยง","ทดลองประเมินความเสี่ยงที่ทราบแล้ว 3 รายการเพื่อปรับเทียบคะแนน"]],"roles":["CISO","CRO","IA"],"inputs":["Enterprise risk framework, risk appetite statement","กรอบการบริหารความเสี่ยงองค์กร เอกสารระดับความเสี่ยงที่ยอมรับได้"],"duration":["Two 2 hour sessions","2 ครั้ง ครั้งละ 2 ชั่วโมง"],"cap":"SPEC","freq":["One time, then annual review","ครั้งเดียว และทบทวนรายปี"],"first":["This is the most common place where IT-only teams go wrong: scales that do not match enterprise risk, or every risk scored High. Engage a specialist for the first cycle.","จุดนี้เป็นจุดที่ทีมที่มีแต่ IT ทำผิดบ่อยที่สุด เช่น เกณฑ์ไม่ตรงกับการบริหารความเสี่ยงองค์กร หรือทุกความเสี่ยงได้คะแนนสูง ควรใช้ผู้เชี่ยวชาญในรอบแรก"],"outputs":["GV-PRC-001"]},"ACT-10":{"en":"Risk Assessment Workshops","th":"Workshop ประเมินความเสี่ยง","purpose":["Identify, analyze, and evaluate cybersecurity risks per critical service or system using the agreed methodology.","ระบุ วิเคราะห์ และประเมินความเสี่ยงด้านไซเบอร์ของแต่ละบริการหรือระบบสำคัญตามวิธีการที่ตกลงไว้"],"agenda":[["Threat scenarios relevant to the service (ransomware, data theft, vendor compromise, insider)","Existing controls and their evidence","Likelihood and impact scoring with justification","Risk owner confirmation","Initial treatment direction"],["สถานการณ์ภัยคุกคามที่เกี่ยวข้องกับบริการ (ransomware การขโมยข้อมูล ผู้ให้บริการถูกโจมตี บุคคลภายใน)","มาตรการควบคุมที่มีและหลักฐาน","การให้คะแนนโอกาสและผลกระทบพร้อมเหตุผล","ยืนยันเจ้าของความเสี่ยง","แนวทางการจัดการเบื้องต้น"]],"roles":["CISO","RISK","SYSOWN","ITM"],"inputs":["Asset inventory, BIA, vulnerability results, threat intelligence","ทะเบียนทรัพย์สิน BIA ผลช่องโหว่ ข้อมูลข่าวกรองภัยคุกคาม"],"duration":["2 hours per service or system group","2 ชั่วโมงต่อบริการหรือกลุ่มระบบ"],"cap":"SPEC","freq":["Annual and on major change","รายปี และเมื่อมีการเปลี่ยนแปลงสำคัญ"],"first":["Threat scenarios and control effectiveness need security judgment. IT can supply facts, but a specialist should lead scoring in the first year.","สถานการณ์ภัยคุกคามและประสิทธิผลของมาตรการต้องใช้วิจารณญาณด้านความมั่นคงปลอดภัย ทีม IT ให้ข้อเท็จจริงได้ แต่ควรให้ผู้เชี่ยวชาญนำการให้คะแนนในปีแรก"],"outputs":["ID-REG-005","ID-PLN-001","ID-RPT-003"]},"ACT-11":{"en":"Current State Assessment and CSF Profile Gap Analysis","th":"การประเมินสภาพปัจจุบันและวิเคราะห์ช่องว่างตาม CSF Profile","purpose":["Measure current practice against NIST CSF 2.0, set a Target Profile, and list the gaps that drive the roadmap.","วัดการปฏิบัติปัจจุบันเทียบกับ NIST CSF 2.0 กำหนด Target Profile และระบุช่องว่างที่เป็นตัวกำหนดแผนงาน"],"agenda":[["Interviews and evidence review per CSF Category","Current Profile and Tier rating","Target Profile agreed with management, informed by risk appetite and legal duties","Gap list with priority and effort","Read-out to the steering committee"],["สัมภาษณ์และตรวจหลักฐานราย CSF Category","Current Profile และระดับ Tier","Target Profile ที่ตกลงกับผู้บริหาร โดยพิจารณาระดับความเสี่ยงที่ยอมรับได้และหน้าที่ตามกฎหมาย","รายการช่องว่างพร้อมลำดับความสำคัญและปริมาณงาน","นำเสนอผลต่อคณะกรรมการกำกับดูแล"]],"roles":["CISO","CIO","SYSOWN","IA"],"inputs":["Existing policies, technical evidence, prior audit findings","นโยบายที่มีอยู่ หลักฐานทางเทคนิค ข้อตรวจพบจากการตรวจสอบครั้งก่อน"],"duration":["3 to 6 weeks","3 ถึง 6 สัปดาห์"],"cap":"SPEC","freq":["Annual","รายปี"],"first":["An independent assessor gives a more credible baseline than self-assessment, and the result is easier to defend in a budget request.","ผู้ประเมินอิสระให้ผลตั้งต้นที่น่าเชื่อถือกว่าการประเมินตนเอง และนำไปใช้ประกอบคำของบประมาณได้ง่ายกว่า"],"outputs":["GV-STR-001","GV-REG-005","GV-REG-006","ID-RPT-003"]},"ACT-12":{"en":"Strategy, Roadmap, and Budget Planning Session","th":"การประชุมวางยุทธศาสตร์ แผนงาน และงบประมาณ","purpose":["Turn the gap analysis and risk register into a funded multi-year roadmap.","แปลงผลวิเคราะห์ช่องว่างและทะเบียนความเสี่ยงเป็นแผนงานหลายปีที่ได้รับงบประมาณ"],"agenda":[["Top risks and gaps that the roadmap must close","Initiatives, sequence, and dependencies","People, technology, and service costs; build versus buy versus outsource","Metrics that show progress","CFO review and approval route"],["ความเสี่ยงและช่องว่างหลักที่แผนงานต้องปิด","โครงการ ลำดับ และความเชื่อมโยง","ค่าใช้จ่ายด้านบุคลากร เทคโนโลยี และบริการ การพัฒนาเอง ซื้อ หรือจ้างภายนอก","ตัวชี้วัดที่แสดงความคืบหน้า","การพิจารณาโดย CFO และเส้นทางการอนุมัติ"]],"roles":["CISO","CIO","CFO","CEO"],"inputs":["Gap analysis, risk register, current spend","ผลวิเคราะห์ช่องว่าง ทะเบียนความเสี่ยง ค่าใช้จ่ายปัจจุบัน"],"duration":["Two half-day sessions","2 ครั้ง ครั้งละครึ่งวัน"],"cap":"GUIDED","freq":["Annual budget cycle","ตามรอบงบประมาณประจำปี"],"first":["Tie every budget line to a named risk or legal duty. Requests framed as tools are cut first.","ผูกงบประมาณทุกรายการเข้ากับความเสี่ยงหรือหน้าที่ตามกฎหมายที่ระบุชื่อ คำขอที่นำเสนอในรูปของการซื้อเครื่องมือมักถูกตัดก่อน"],"outputs":["GV-STR-001","GV-PLN-001","GV-REG-008"]},"ACT-13":{"en":"Policy Drafting and Stakeholder Review Cycle","th":"รอบการร่างนโยบายและการทบทวนกับผู้มีส่วนได้ส่วนเสีย","purpose":["Draft policies and standards, test them with the people who must follow them, and resolve objections before approval.","ร่างนโยบายและมาตรฐาน ทดสอบกับผู้ที่ต้องปฏิบัติตาม และแก้ไขข้อโต้แย้งก่อนอนุมัติ"],"agenda":[["Walk-through of the draft with affected departments","Feasibility check: can operations comply with current tools and staff","Conflicts with HR rules, labor law, or clinical or production workflows","Exceptions that will be needed and their owners","Final draft for approval"],["นำเสนอร่างต่อหน่วยงานที่ได้รับผลกระทบ","ตรวจความเป็นไปได้: หน่วยปฏิบัติปฏิบัติตามได้ด้วยเครื่องมือและบุคลากรปัจจุบันหรือไม่","ความขัดแย้งกับระเบียบ HR กฎหมายแรงงาน หรือขั้นตอนงานบริการหรือการผลิต","ข้อยกเว้นที่จะต้องมีและผู้รับผิดชอบ","ร่างสุดท้ายเพื่อเสนออนุมัติ"]],"roles":["CISO","ITM","HR","LEGAL","SYSOWN"],"inputs":["Template, legal obligation list, risk register","แม่แบบ รายการหน้าที่ตามกฎหมาย ทะเบียนความเสี่ยง"],"duration":["1 to 2 weeks per document","1 ถึง 2 สัปดาห์ต่อฉบับ"],"cap":"GUIDED","freq":["Per document","ทุกฉบับ"],"first":["A policy copied from a template without a feasibility check creates instant noncompliance. Review with operations before approval, not after.","นโยบายที่คัดลอกจากแม่แบบโดยไม่ตรวจความเป็นไปได้จะทำให้เกิดการไม่ปฏิบัติตามทันที ควรทบทวนกับหน่วยปฏิบัติก่อนอนุมัติ ไม่ใช่หลังอนุมัติ"],"outputs":["GV-POL-002","GV-STD-001","GV-POL-001","GV-POL-003","GV-POL-005","GV-POL-004","GV-PRC-004","GV-PRC-005","GV-POL-006","ID-STD-001","PR-POL-001","PR-POL-002","PR-POL-003","PR-STD-004","PR-STD-005","PR-STD-007","PR-STD-009","PR-STD-013","RC-POL-001"]},"ACT-14":{"en":"Policy Approval and Communication","th":"การอนุมัติและสื่อสารนโยบาย","purpose":["Obtain formal approval, publish the document, and record that staff have read and accepted it.","ได้รับการอนุมัติอย่างเป็นทางการ เผยแพร่เอกสาร และบันทึกว่าพนักงานได้อ่านและยอมรับแล้ว"],"agenda":[["Present the document and the summary of changes to the approver","Approval decision and effective date","Publication channel and version control","Staff acknowledgment and briefing plan"],["นำเสนอเอกสารและสรุปการเปลี่ยนแปลงต่อผู้อนุมัติ","การตัดสินอนุมัติและวันที่มีผลบังคับใช้","ช่องทางเผยแพร่และการควบคุมเวอร์ชัน","การรับทราบของพนักงานและแผนการชี้แจง"]],"roles":["CISO","ISSC","HR","COMMS"],"inputs":["Final draft, document control procedure","ร่างสุดท้าย ระเบียบปฏิบัติการควบคุมเอกสาร"],"duration":["30 minutes at the approval meeting, 2 to 4 weeks for rollout","30 นาทีในที่ประชุมอนุมัติ และ 2 ถึง 4 สัปดาห์สำหรับการเผยแพร่"],"cap":"IT","freq":["Per document","ทุกฉบับ"],"first":["Keep evidence of approval and acknowledgment. Auditors ask for it before they read the content.","เก็บหลักฐานการอนุมัติและการรับทราบไว้ ผู้ตรวจสอบจะขอดูหลักฐานเหล่านี้ก่อนอ่านเนื้อหา"],"outputs":["GV-POL-002","GV-POL-001","GV-PRC-002","GV-POL-003","GV-POL-005","GV-POL-004","GV-POL-006","PR-POL-001","PR-POL-002","PR-POL-003","RC-POL-001"]},"ACT-15":{"en":"Technical Baseline Review","th":"การทบทวน Baseline ทางเทคนิค","purpose":["Compare current system configuration with a recognized benchmark and decide the minimum settings for each platform.","เปรียบเทียบการตั้งค่าระบบปัจจุบันกับเกณฑ์อ้างอิงที่ยอมรับ และกำหนดค่าขั้นต่ำของแต่ละแพลตฟอร์ม"],"agenda":[["Select benchmarks such as CIS Benchmarks and vendor guidance","Scan or sample current configuration","Agree mandatory settings and documented deviations","Plan to apply and monitor the baseline"],["เลือกเกณฑ์อ้างอิง เช่น CIS Benchmarks และคำแนะนำของผู้ผลิต","สแกนหรือสุ่มตรวจการตั้งค่าปัจจุบัน","ตกลงค่าที่บังคับและข้อยกเว้นที่มีเอกสารรองรับ","วางแผนการนำ Baseline ไปใช้และการติดตาม"]],"roles":["ITM","CISO","SYSOWN"],"inputs":["Asset inventory, scan tools","ทะเบียนทรัพย์สิน เครื่องมือสแกน"],"duration":["1 to 2 weeks per platform group","1 ถึง 2 สัปดาห์ต่อกลุ่มแพลตฟอร์ม"],"cap":"GUIDED","freq":["Annual and on new platforms","รายปี และเมื่อมีแพลตฟอร์มใหม่"],"first":["IT can apply benchmarks, but deciding which settings matter for the threat profile needs security review.","ทีม IT นำเกณฑ์อ้างอิงไปใช้ได้ แต่การตัดสินว่าค่าใดสำคัญต่อภัยคุกคามขององค์กรต้องมีการทบทวนจากผู้เชี่ยวชาญ"],"outputs":["PR-STD-010","PR-STD-014","PR-STD-015","PR-STD-016"]},"ACT-16":{"en":"Supplier Tiering Workshop","th":"Workshop จัดระดับผู้ให้บริการ","purpose":["Rank suppliers by the access and data they hold and decide the assessment depth for each tier.","จัดลำดับผู้ให้บริการตามสิทธิ์การเข้าถึงและข้อมูลที่ถือครอง และกำหนดความเข้มข้นของการประเมินในแต่ละระดับ"],"agenda":[["Supplier list from procurement and accounts payable","Criteria: data access, system access, service criticality, replaceability","Tier assignment and assessment method per tier","Contract clauses required per tier"],["รายชื่อผู้ให้บริการจากฝ่ายจัดซื้อและฝ่ายบัญชีเจ้าหนี้","เกณฑ์: การเข้าถึงข้อมูล การเข้าถึงระบบ ความสำคัญของบริการ ความสามารถในการทดแทน","การกำหนดระดับและวิธีการประเมินของแต่ละระดับ","เงื่อนไขในสัญญาที่ต้องมีในแต่ละระดับ"]],"roles":["PROC","CISO","LEGAL","DPO","ITM"],"inputs":["Supplier list, contracts, remote access list","รายชื่อผู้ให้บริการ สัญญา รายการการเข้าถึงระยะไกล"],"duration":["Half day","ครึ่งวัน"],"cap":"GUIDED","freq":["Annual","รายปี"],"first":["Start with suppliers that have remote access or hold personal data. These cause most supply chain incidents.","เริ่มจากผู้ให้บริการที่เข้าถึงระบบจากระยะไกลหรือถือครองข้อมูลส่วนบุคคล กลุ่มนี้เป็นต้นเหตุของเหตุการณ์ด้านห่วงโซ่อุปทานส่วนใหญ่"],"outputs":["GV-PRC-008","GV-REG-009","GV-FRM-006","GV-STD-002"]},"ACT-17":{"en":"Incident Response Readiness Workshop","th":"Workshop เตรียมความพร้อมรับมือเหตุการณ์","purpose":["Agree who does what in an incident, how it is escalated, and how regulators and data subjects are notified.","ตกลงว่าใครทำอะไรเมื่อเกิดเหตุการณ์ การยกระดับ และการแจ้งหน่วยงานกำกับและเจ้าของข้อมูล"],"agenda":[["Incident team roles and backups, including out-of-hours contacts","Severity levels and escalation triggers","Regulatory notification duties and time limits (CII, PDPA) [VERIFY current notifications]","External support: incident response retainer, forensics, legal, insurer","Decision rights: shutting down systems, paying for recovery, public statements"],["บทบาทของทีมรับมือเหตุการณ์และผู้ปฏิบัติหน้าที่แทน รวมถึงผู้ติดต่อนอกเวลาทำการ","ระดับความรุนแรงและเงื่อนไขการยกระดับ","หน้าที่การแจ้งหน่วยงานกำกับและกำหนดเวลา (CII, PDPA) [VERIFY ประกาศฉบับปัจจุบัน]","ความช่วยเหลือจากภายนอก: บริการรับมือเหตุการณ์แบบ retainer นิติวิทยาศาสตร์ดิจิทัล กฎหมาย และบริษัทประกัน","อำนาจตัดสินใจ: การปิดระบบ การจ่ายค่ากู้คืน และการออกแถลงการณ์"]],"roles":["CISO","CIO","DPO","LEGAL","COMMS","CEO"],"inputs":["Contact list, legal obligation list, insurance policy","รายชื่อผู้ติดต่อ รายการหน้าที่ตามกฎหมาย กรมธรรม์ประกันภัย"],"duration":["Half day","ครึ่งวัน"],"cap":"SPEC","freq":["One time, then annual","ครั้งเดียว และทบทวนรายปี"],"first":["Without in-house incident experience, sign an incident response retainer first. The plan must name who you will call.","หากไม่มีประสบการณ์รับมือเหตุการณ์ภายในองค์กร ให้ทำสัญญาบริการรับมือเหตุการณ์แบบ retainer ก่อน แผนต้องระบุว่าจะติดต่อใคร"],"outputs":["DE-STD-002","RS-PLN-001","RS-PRC-001","RS-PLB-001","RS-PLB-002","RS-PLB-003","RS-PLB-004","RS-PRC-002","RS-PRC-003"]},"ACT-18":{"en":"Backup and Restore Validation Test","th":"การทดสอบการสำรองและกู้คืนข้อมูล","purpose":["Prove that critical systems can be restored from backup within the agreed RTO and RPO, including from an offline copy.","พิสูจน์ว่าระบบสำคัญกู้คืนจากข้อมูลสำรองได้ภายใน RTO และ RPO ที่ตกลงไว้ รวมถึงจากสำเนาแบบ offline"],"agenda":[["Select systems and the backup set to restore","Restore into an isolated environment","Measure time to restore and data loss","Confirm the offline or immutable copy is usable","Record result and fix gaps"],["เลือกระบบและชุดข้อมูลสำรองที่จะกู้คืน","กู้คืนในสภาพแวดล้อมที่แยกออกมา","วัดเวลาในการกู้คืนและปริมาณข้อมูลที่สูญเสีย","ยืนยันว่าสำเนาแบบ offline หรือ immutable ใช้งานได้","บันทึกผลและแก้ไขช่องว่าง"]],"roles":["ITM","SYSOWN","CISO"],"inputs":["Backup schedule, BIA results","ตารางการสำรองข้อมูล ผล BIA"],"duration":["1 to 3 days per system","1 ถึง 3 วันต่อระบบ"],"cap":"IT","freq":["Quarterly for critical systems","รายไตรมาสสำหรับระบบสำคัญ"],"first":["Many organizations discover in the first test that backups are incomplete or encrypted together with production. Run the test before writing the procedure.","หลายองค์กรพบในการทดสอบครั้งแรกว่าข้อมูลสำรองไม่ครบ หรือถูกเข้ารหัสไปพร้อมกับระบบจริง ควรทดสอบก่อนเขียนระเบียบปฏิบัติ"],"outputs":["PR-STD-006","PR-PRC-005","PR-REC-003","RC-PLN-002","RC-PRC-001"]},"ACT-19":{"en":"Identity and Privileged Access Review","th":"การทบทวนตัวตนและสิทธิ์ระดับสูง","purpose":["Find all administrator and service accounts, check Multi-Factor Authentication (MFA) coverage, and remove unneeded privilege.","ค้นหาบัญชีผู้ดูแลระบบและบัญชีบริการทั้งหมด ตรวจความครอบคลุมของ Multi-Factor Authentication (MFA) และถอดสิทธิ์ที่ไม่จำเป็น"],"agenda":[["Export privileged groups from directory, cloud, network, and key applications","Confirm owner and business need for each account","MFA coverage for remote access, email, and administrators","Shared and vendor accounts","Clean-up actions and owners"],["ดึงรายชื่อกลุ่มสิทธิ์ระดับสูงจาก directory คลาวด์ อุปกรณ์เครือข่าย และแอปพลิเคชันสำคัญ","ยืนยันเจ้าของและความจำเป็นทางธุรกิจของแต่ละบัญชี","ความครอบคลุมของ MFA สำหรับการเข้าถึงระยะไกล อีเมล และผู้ดูแลระบบ","บัญชีที่ใช้ร่วมกันและบัญชีของผู้ให้บริการ","รายการแก้ไขและผู้รับผิดชอบ"]],"roles":["ITM","CISO","SYSOWN"],"inputs":["Directory export, cloud admin roles, vendor access list","ข้อมูลจาก directory บทบาทผู้ดูแลบนคลาวด์ รายการการเข้าถึงของผู้ให้บริการ"],"duration":["1 to 2 weeks","1 ถึง 2 สัปดาห์"],"cap":"IT","freq":["Quarterly","รายไตรมาส"],"first":["IT can run the review. Expect to find accounts of former staff and vendors with permanent domain admin rights.","ทีม IT ดำเนินการทบทวนเองได้ คาดว่าจะพบบัญชีของอดีตพนักงานและผู้ให้บริการที่มีสิทธิ์ domain admin ถาวร"],"outputs":["PR-STD-001","PR-STD-002","PR-STD-003","PR-REC-001","PR-REG-001"]},"ACT-20":{"en":"Tabletop Exercise","th":"การฝึกซ้อมแบบ Tabletop","purpose":["Walk executives and responders through a realistic scenario to test the plan, decisions, and communication.","พาผู้บริหารและทีมรับมือผ่านสถานการณ์สมจริงเพื่อทดสอบแผน การตัดสินใจ และการสื่อสาร"],"agenda":[["Scenario briefing, for example ransomware on the core system at night","Injects every 15 to 20 minutes: spread, media call, regulator deadline, ransom note","Decisions and who made them","Hot debrief: what worked, what failed","Action list with owners and dates"],["ชี้แจงสถานการณ์ เช่น ransomware โจมตีระบบหลักในเวลากลางคืน","เพิ่มเหตุการณ์ทุก 15 ถึง 20 นาที: การแพร่กระจาย สื่อโทรมา กำหนดเวลาแจ้งหน่วยงานกำกับ และจดหมายเรียกค่าไถ่","การตัดสินใจและผู้ตัดสินใจ","สรุปผลทันที: สิ่งที่ได้ผล สิ่งที่ล้มเหลว","รายการปรับปรุงพร้อมผู้รับผิดชอบและกำหนดเวลา"]],"roles":["CEO","CIO","CISO","DPO","LEGAL","COMMS","BCM"],"inputs":["Incident response plan, playbooks, contact list","แผนรับมือเหตุการณ์ Playbook รายชื่อผู้ติดต่อ"],"duration":["2 to 3 hours","2 ถึง 3 ชั่วโมง"],"cap":"SPEC","freq":["At least annually","อย่างน้อยปีละครั้ง"],"first":["A realistic scenario needs an experienced facilitator who has handled real incidents. Internal facilitators tend to make it too easy.","สถานการณ์ที่สมจริงต้องอาศัยผู้ดำเนินการที่เคยรับมือเหตุการณ์จริง ผู้ดำเนินการภายในมักออกแบบสถานการณ์ง่ายเกินไป"],"outputs":["ID-PLN-002","RS-PLB-001","RC-PLN-003"]},"ACT-21":{"en":"Business Continuity and Disaster Recovery Exercise","th":"การฝึกซ้อมความต่อเนื่องทางธุรกิจและการกู้คืนระบบ","purpose":["Test failover, manual workarounds, and recovery sequence against RTO and RPO.","ทดสอบการสลับระบบ วิธีปฏิบัติงานด้วยมือ และลำดับการกู้คืนเทียบกับ RTO และ RPO"],"agenda":[["Exercise objectives and success criteria","Execution: failover or restore, manual workaround activation","Timing against RTO and RPO","Issues log and recovery sign-off","Report and improvement actions"],["วัตถุประสงค์และเกณฑ์ความสำเร็จของการฝึกซ้อม","การปฏิบัติ: สลับระบบหรือกู้คืน และเปิดใช้วิธีปฏิบัติงานด้วยมือ","การจับเวลาเทียบกับ RTO และ RPO","บันทึกปัญหาและการลงนามยืนยันการกู้คืน","รายงานและรายการปรับปรุง"]],"roles":["BCM","ITM","SYSOWN","CIO"],"inputs":["BCP, DRP, runbooks","BCP DRP และ Runbook"],"duration":["Half day to 2 days","ครึ่งวันถึง 2 วัน"],"cap":"GUIDED","freq":["Annual","รายปี"],"first":["Start with a walkthrough test before a live failover. A failed live test on a production system causes the outage it was meant to prevent.","เริ่มจากการทดสอบแบบ walkthrough ก่อนสลับระบบจริง การทดสอบจริงที่ล้มเหลวบนระบบที่ให้บริการอยู่จะทำให้เกิดการหยุดชะงักที่ต้องการป้องกัน"],"outputs":["ID-PLN-002","RC-REC-001"]},"ACT-22":{"en":"Security Monitoring Design Session","th":"การประชุมออกแบบการเฝ้าระวังความมั่นคงปลอดภัย","purpose":["Decide which logs to collect, which threats to detect first, and whether monitoring runs in-house or through an MSSP.","ตัดสินใจว่าจะเก็บ log ใด ตรวจจับภัยคุกคามใดก่อน และเฝ้าระวังเองหรือผ่าน MSSP"],"agenda":[["Log sources by criticality and legal retention duty","Priority detection use cases based on top risks","Operating model: in-house, hybrid, or MSSP; 24 by 7 coverage","Escalation from monitoring to incident response","Metrics: coverage, mean time to detect, false positive rate"],["แหล่ง log ตามความสำคัญและหน้าที่การเก็บรักษาตามกฎหมาย","Use case การตรวจจับที่มีลำดับความสำคัญตามความเสี่ยงหลัก","รูปแบบการดำเนินงาน: ทำเอง แบบผสม หรือ MSSP และการเฝ้าระวังตลอด 24 ชั่วโมง","การยกระดับจากการเฝ้าระวังไปสู่การรับมือเหตุการณ์","ตัวชี้วัด: ความครอบคลุม เวลาเฉลี่ยในการตรวจพบ อัตราการแจ้งเตือนผิดพลาด"]],"roles":["CISO","ITM","SOC","CIO"],"inputs":["Asset inventory, risk register, logging standard","ทะเบียนทรัพย์สิน ทะเบียนความเสี่ยง มาตรฐานการบันทึก log"],"duration":["Two half-day sessions","2 ครั้ง ครั้งละครึ่งวัน"],"cap":"SPEC","freq":["One time, then annual review","ครั้งเดียว และทบทวนรายปี"],"first":["Detection engineering is a specialist skill. Most organizations without a security team should buy monitoring as a service and keep oversight in-house.","การออกแบบการตรวจจับเป็นทักษะเฉพาะทาง องค์กรส่วนใหญ่ที่ไม่มีทีมความมั่นคงปลอดภัยควรซื้อบริการเฝ้าระวัง และคงการกำกับดูแลไว้ภายในองค์กร"],"outputs":["PR-STD-011","DE-STD-001","DE-PRC-001","DE-REG-001","DE-GDL-001","DE-PRC-002","DE-REG-002"]},"ACT-23":{"en":"Training Needs Analysis and Awareness Planning","th":"การวิเคราะห์ความต้องการฝึกอบรมและการวางแผนสร้างความตระหนักรู้","purpose":["Identify required knowledge per role and plan awareness and technical training for the year.","ระบุความรู้ที่จำเป็นของแต่ละบทบาท และวางแผนการสร้างความตระหนักรู้และการฝึกอบรมทางเทคนิคประจำปี"],"agenda":[["Role groups and required topics","Delivery channels and frequency","Phishing simulation approach and consequence policy","Completion targets and reporting"],["กลุ่มบทบาทและหัวข้อที่จำเป็น","ช่องทางและความถี่ในการอบรม","แนวทางการทดสอบ phishing และนโยบายผลที่ตามมา","เป้าหมายการอบรมให้ครบและการรายงาน"]],"roles":["CISO","HR","ITM"],"inputs":["RACI, incident history, phishing results","RACI ประวัติเหตุการณ์ ผลการทดสอบ phishing"],"duration":["2 hours","2 ชั่วโมง"],"cap":"IT","freq":["Annual","รายปี"],"first":["Short, frequent, role-specific content works better than one long annual session.","เนื้อหาสั้น บ่อย และเฉพาะบทบาท ได้ผลดีกว่าการอบรมยาวปีละครั้ง"],"outputs":["PR-PLN-001","PR-REG-002","PR-REC-002","PR-PRC-004"]},"ACT-24":{"en":"Management Review Meeting","th":"การประชุมทบทวนของฝ่ายบริหาร","purpose":["Have top management review program performance and decide on changes, as required by ISO/IEC 27001:2022 Clause 9.3.","ให้ผู้บริหารระดับสูงทบทวนผลการดำเนินงานของแผนงานและตัดสินใจปรับปรุง ตาม ISO/IEC 27001:2022 Clause 9.3"],"agenda":[["Status of actions from previous reviews","Changes in context, risks, and legal duties","Metrics, audit results, incidents, and nonconformities","Risk treatment status and resource needs","Decisions and improvement actions"],["สถานะการดำเนินการจากการทบทวนครั้งก่อน","การเปลี่ยนแปลงของบริบท ความเสี่ยง และหน้าที่ตามกฎหมาย","ตัวชี้วัด ผลการตรวจสอบ เหตุการณ์ และข้อบกพร่อง","สถานะการจัดการความเสี่ยงและความต้องการทรัพยากร","การตัดสินใจและรายการปรับปรุง"]],"roles":["ISSC","CEO","CIO","CISO","IA"],"inputs":["Metrics catalog, audit reports, risk register","ทะเบียนตัวชี้วัด รายงานการตรวจสอบ ทะเบียนความเสี่ยง"],"duration":["2 hours","2 ชั่วโมง"],"cap":"GUIDED","freq":["At planned intervals (ISO/IEC 27001:2022 Clause 9.3); common practice is at least annually, quarterly in the first year","ตามรอบที่วางแผนไว้ (ISO/IEC 27001:2022 ข้อ 9.3) แนวปฏิบัติทั่วไปคืออย่างน้อยปีละครั้ง และรายไตรมาสในปีแรก"],"first":["Use the agenda above as the minutes structure so every required input is covered and recorded.","ใช้หัวข้อการประชุมข้างต้นเป็นโครงสร้างรายงานการประชุม เพื่อให้ครอบคลุมและบันทึกทุกหัวข้อที่กำหนด"],"outputs":["GV-PRC-006","GV-REC-001"]},"ACT-25":{"en":"Internal Audit Planning and Fieldwork","th":"การวางแผนและการปฏิบัติงา  helpHtml:`<h2>How to use the audit tracker</h2>
<p>Use this file to assess a client's cybersecurity documents against the 142-document NIST CSF 2.0 framework, record evidence and findings, and produce a gap roadmap.</p>
<h3>Steps</h3><ol>
<li><b>Setup.</b> Enter the engagement details and answer the profile questions. The tool applies the rules in order: a Required document whose trigger applies is always in scope; then Essential documents are in scope for everyone, Core documents for mid-sized and larger organizations, and Extended or Optional documents only when the profile calls for them. Override any line with a reason.</li>
<li><b>Assess.</b> Pick a document. Set its status, record the evidence reference, then mark each document control check and each required content item Pass, Fail, or N/A with an observation. Record whether the prerequisite activities took place.</li>
<li><b>Dashboard.</b> See coverage by Function, by build wave, and by CSF Category, the Required documents that are missing, and how many gaps need a specialist.</li>
<li><b>Gap roadmap.</b> Missing and partial documents in the recommended build order, with capability, sourcing, and prerequisites.</li>
<li><b>Export.</b> Export Excel for the report. Save file keeps a complete copy you can open again on any computer.</li></ol>
<h3>Statuses</h3><ul><li><b>Exists:</b> approved, current, and covers the required content.</li><li><b>Partial:</b> exists but is draft, outdated, or missing required content.</li><li><b>Missing:</b> no document or equivalent.</li><li><b>N/A:</b> found not applicable during fieldwork; give the reason in the comment.</li></ul>
<h3>Working with the Interview Assessment</h3><p>Both tools read and write the same engagement file. Open an interview save file here to link it; each document then shows the interview tiers for its CSF Subcategories, which separates "practice without document" from "document without practice". Save file stores both parts.</p><h3>Where your data is kept</h3><p>Entries are autosaved in this browser for this file only. Clearing browser data erases them. Use <b>Save file</b> after each session and keep the file with the engagement records. Each client should have its own copy of this HTML file.</p>
<h3>Placeholders</h3><p>Fields marked [PLACEHOLDER] show what to write. Replace them with client-specific content.</p>
<h3>Sources</h3><p>Document list, required content, and levels come from the framework register. Build order, capability flags, and activities are practitioner guidance. Items marked VERIFY need confirmation against current Thai notifications.</p>`},

 helpHtml:`<h2>วิธีใช้เครื่องมือตรวจประเมิน</h2>
<p>ใช้ไฟล์นี้ประเมินเอกสารด้านไซเบอร์ของลูกค้าเทียบกับกรอบเอกสาร 142 ฉบับตาม NIST CSF 2.0 บันทึกหลักฐานและข้อตรวจพบ และจัดทำแผนปิดช่องว่าง</p>
<h3>ขั้นตอน</h3><ol>
<li><b>ตั้งค่า</b> กรอกข้อมูลงานและตอบคำถามข้อมูลองค์กร เครื่องมือใช้กฎตามลำดับ: เอกสาร Required ที่เข้าเงื่อนไข Trigger อยู่ในขอบเขตเสมอ จากนั้นชุด Essential อยู่ในขอบเขตของทุกองค์กร ชุด Core สำหรับองค์กรขนาดกลางขึ้นไป และชุด Extended หรือ Optional เฉพาะเมื่อข้อมูลองค์กรชี้ว่าจำเป็น ปรับแก้รายการใดก็ได้พร้อมเหตุผล</li>
<li><b>ประเมิน</b> เลือกเอกสาร กำหนดสถานะ บันทึกอ้างอิงหลักฐาน แล้วตรวจการควบคุมเอกสารและเนื้อหาที่ต้องมีทีละข้อว่าผ่าน ไม่ผ่าน หรือ N/A พร้อมข้อสังเกต และบันทึกว่ากิจกรรมที่ต้องทำก่อนได้ทำแล้วหรือไม่</li>
<li><b>แดชบอร์ด</b> ดูความครอบคลุมตาม Function ตามระลอกการจัดทำ และตาม CSF Category เอกสาร Required ที่ยังไม่มี และจำนวนช่องว่างที่ต้องใช้ผู้เชี่ยวชาญ</li>
<li><b>แผนปิดช่องว่าง</b> เอกสารที่ไม่มีหรือมีบางส่วนเรียงตามลำดับที่แนะนำ พร้อมขีดความสามารถ ผู้ที่จัดทำได้ และกิจกรรมที่ต้องทำก่อน</li>
<li><b>ส่งออก</b> ส่งออก Excel สำหรับรายงาน และกดบันทึกไฟล์เพื่อเก็บสำเนาครบถ้วนที่เปิดได้บนทุกเครื่อง</li></ol>
<h3>สถานะ</h3><ul><li><b>มีครบ:</b> ได้รับอนุมัติ เป็นปัจจุบัน และครอบคลุมเนื้อหาที่ต้องมี</li><li><b>มีบางส่วน:</b> มีแต่ยังเป็นร่าง ล้าสมัย หรือขาดเนื้อหาที่ต้องมี</li><li><b>ไม่มี:</b> ไม่มีเอกสารหรือเอกสารที่เทียบเท่า</li><li><b>ไม่เกี่ยวข้อง:</b> พบระหว่างตรวจว่าไม่เกี่ยวข้อง ให้ระบุเหตุผลในความเห็น</li></ul>
<h3>การทำงานร่วมกับ Interview Assessment</h3><p>ทั้งสองเครื่องมืออ่านและเขียนไฟล์งานรูปแบบเดียวกัน เปิดไฟล์ที่บันทึกจากการสัมภาษณ์ที่นี่เพื่อเชื่อมข้อมูล แล้วแต่ละเอกสารจะแสดง Tier จากการสัมภาษณ์ของ CSF Subcategory ที่เกี่ยวข้อง ช่วยแยก "ปฏิบัติแต่ไม่มีเอกสาร" ออกจาก "มีเอกสารแต่ไม่ปฏิบัติ" การบันทึกไฟล์จะเก็บข้อมูลทั้งสองส่วน</p><h3>ข้อมูลถูกเก็บที่ไหน</h3><p>ข้อมูลบันทึกอัตโนมัติในเบราว์เซอร์นี้สำหรับไฟล์นี้เท่านั้น หากล้างข้อมูลเบราว์เซอร์ ข้อมูลจะหายไป กด <b>บันทึกไฟล์</b> หลังทำงานทุกครั้ง และเก็บไฟล์ไว้กับเอกสารของงาน ลูกค้าแต่ละรายควรใช้สำเนาไฟล์ HTML นี้แยกกัน</p>

/* ---------- applicability ---------- */
const OPT_RULES={"ID-REG-004":p=>p.ot,"PR-STD-015":p=>p.ot,"GV-POL-005":p=>p.ai,"DE-GDL-001":p=>p.mssp,"PR-STD-008":p=>p.size==="large","PR-PRC-004":p=>p.size!=="small",
 "GV-TPL-001":p=>p.size==="large","ID-PRC-005":p=>p.size==="large"||p.dev,"DE-PRC-003":p=>p.size==="large"&&(p.spec==="fte"||p.mssp)};
const COND_RULES={"PR-STD-013":p=>p.dev,"PR-STD-014":p=>p.cloud,"GV-REG-006":p=>p.cii,"GV-REG-005":p=>p.iso};
function activeTriggers(p){const s=new Set(["All"]);if(p.pdpa)s.add("PDPA");if(p.cii)s.add("CII");if(p.cca)s.add("CCA");if(p.iso)s.add("ISO 27001");return s;}
const EXT_RULES={"GV-REG-002":p=>p.iso,"GV-STD-003":p=>p.size==="large"||p.cloud&&p.size!=="small","ID-PRC-004":p=>p.size==="large"||p.mssp,"RS-PLB-004":p=>p.size!=="small","RC-PLN-003":p=>p.cii||p.size==="large"};
function auto(d){const p=S.profile,trig=activeTriggers(p),hit=d.trigger.some(x=>trig.has(x));
  if(COND_RULES[d.id]&&!COND_RULES[d.id](p))return{inc:false,lvl:d.level,why:"cond"};
  if(d.trigger.length===1&&d.trigger[0]==="PDPA"&&!p.pdpa)return{inc:false,lvl:d.level,why:"notrig"};
  /* rule 1: Required and the trigger applies, whatever the package */
  if(d.level==="Required"&&hit)return{inc:true,lvl:"Required",why:"trig"};
  const lvl=d.level==="Optional"?"Optional":"Expected";
  /* rules 2 to 4: package */
  if(d.level==="Optional"){const on=OPT_RULES[d.id]?OPT_RULES[d.id](p):false;return{inc:on,lvl,why:on?"optOn":"opt"};}
  if(d.pkg==="Essential")return{inc:true,lvl,why:"pkgEss"};
  if(d.pkg==="Core")return p.size==="small"?{inc:false,lvl,why:"pkgCoreSmall"}:{inc:true,lvl,why:"pkgCore"};
  const on=EXT_RULES[d.id]?EXT_RULES[d.id](p):false;return{inc:on,lvl,why:on?"pkgExtOn":"pkgExt"};}
function inScope(d){const o=S.scope[d.id];if(o&&o.ov==="in")return true;if(o&&o.ov==="out")return false;return auto(d).inc;}
function effLvl(d){return auto(d).lvl;}
function rec(id){return S.docs[id]||(S.docs[id]={status:"",ev:"",finding:"",rec:"",comment:"",checks:{}});}
function status(d){if(!inScope(d))return"out";const r=S.docs[d.id];return r&&r.status?r.status:"none";}
function allChecks(d){return d.ctrl.concat(d.content);}
function score(d){const r=S.docs[d.id];if(!r)return null;let p=0,f=0;allChecks(d).forEach(c=>{const v=(r.checks[c.id]||{}).r;if(v==="P")p++;else if(v==="F")f++;});return p+f?{p,f,pct:Math.round(p/(p+f)*100)}:null;}
function suggestStatus(d){const r=S.docs[d.id];if(!r)return"";const n=allChecks(d).length;let p=0,f=0,na=0;allChecks(d).forEach(c=>{const v=(r.checks[c.id]||{}).r;if(v==="P")p++;else if(v==="F")f++;else if(v==="NA")na++;});
  if(p+f+na<n)return"";if(f===0&&p>0)return"Exists";if(p===0&&f>0)return"Missing";return"Partial";}
function stPill(s){return `<span class="st ${s}">${esc(t().sv[s])}</span>`;}
function lvBlock(l){return `<span class="lv ${l}" title="${l}">${LV[l]}</span>`;}
function capTag(c){return `<span class="cap ${c}" title="${esc(M.caps[c][Li()])}">${CAPL[c]}</span>`;}
function seg(name,vals,curv,labels){return `<span class="seg" role="group">${vals.map(v=>`<button data-seg="${name}" data-v="${v}" aria-pressed="${curv===v}">${esc(labels[v])}</button>`).join("")}</span>`;}

/* ---------- linked interview ---------- */
function ivEff(sid){if(!LI||!LI.subs)return{st:"none"};const r=LI.subs[sid];if(!r||r.tier===""||r.tier==null)return{st:"none"};if(r.tier==="NA")return{st:"NA"};
  const ru=Object.assign({cap:true,obs:true},LI.rules||{});const raw=+r.tier;const ok=r.ev==="D"||(r.ev==="O"&&ru.obs);const capped=ru.cap&&raw>=2&&!ok;return{st:"rated",raw,v:capped?1:raw,capped,ev:r.ev||"",notes:r.notes||""};}
function ivLowest(d){const v=d.csf.map(ivEff).filter(e=>e.st==="rated").map(e=>e.v);return v.length?Math.min(...v):null;}
function ivTierBox(v){const bg=v===null?"var(--chip)":v===0?"var(--bad)":v===1?"var(--warn)":v===2?"#4d7ea8":"var(--ok)";return `<span style="display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 4px;border-radius:3px;font:600 12px var(--f-mono);background:${bg};color:${v===null?"var(--muted)":"#fff"}">${v===null?"-":v}</span>`;}
function ivReqLine(d){if(!LI||!LI.subs)return"";const subs=Object.keys(LI.subs).filter(s=>((LI.subs[s]||{}).dr||{})[d.id]);if(!subs.length)return"";const o=(LI.dr||{})["d:"+d.id]||{};const x=t();return `<div class="callout${o.st==="recv"?" ok":""}">${esc(x.ivReq(subs.join(", "),x.ivReqSt[o.st||"req"]))}${o.recv?` · ${esc(o.recv)}`:""}</div>`;}
function ivPanel(d){if(!LI)return"";const x=t(),L=Li();const rows=d.csf.map(sid=>{const e=ivEff(sid);const nm=L?((M.subcats_th||{})[sid]||M.subcats[sid]):M.subcats[sid];
  return `<tr><td class="mono">${sid}</td><td>${esc(nm||"")}</td><td>${e.st==="rated"?ivTierBox(e.raw):e.st==="NA"?"N/A":`<span class="mini">${x.ivNone}</span>`}</td><td class="mini">${e.ev?esc(x.ivEv[e.ev]):""}</td><td>${e.st==="rated"?ivTierBox(e.v):""}</td><td class="mini">${esc((e.notes||"").slice(0,160))}</td></tr>`;}).join("");
  const raws=d.csf.map(ivEff).filter(e=>e.st==="rated");let read="";const st=status(d);
  if(raws.length&&["Exists","Partial","Missing"].includes(st)){const pr=raws.some(e=>e.raw>=2),dc=st==="Exists";const k=pr&&dc?"al":pr?"un":dc?"pa":"gp";read=`<div class="callout${k==="al"?" ok":""}">${esc(x.ivRead(x.ivRd[k][0],x.ivRd[k][1]))}</div>`;}
  return `<h3>${x.iv}</h3><p class="mini">${x.ivHint}</p><div class="scroll"><table class="t"><thead><tr><th>${x.ivCol.sub}</th><th></th><th>${x.ivCol.tier}</th><th>${x.ivCol.ev}</th><th>${x.ivCol.cnt}</th><th>${x.ivCol.notes}</th></tr></thead><tbody>${rows}</tbody></table></div>${read}${ivReqLine(d)}`;}

function agg(ds){const c={Exists:0,Partial:0,Missing:0,NA:0,none:0};ds.forEach(d=>{const s=status(d);if(s!=="out")c[s]++;});return c;}
function barRow(label,c){const tot=c.Exists+c.Partial+c.Missing+c.NA+c.none||1;const w=k=>c[k]/tot*100;const cov=c.Exists+c.Partial+c.Missing?Math.round((c.Exists+c.Partial/2)/(c.Exists+c.Partial+c.Missing)*100):null;
  return `<div class="bar"><span>${label}</span><span class="tr" title="${Object.entries(c).map(([k,v])=>t().sv[k]+" "+v).join(" / ")}"><i style="width:${w("Exists")}%;background:var(--ok)"></i><i style="width:${w("Partial")}%;background:var(--warn)"></i><i style="width:${w("Missing")}%;background:var(--bad)"></i><i style="width:${w("NA")}%;background:var(--na)"></i></span><span class="num">${cov===null?"-":cov+"%"}</span></div>`;}
function legend(){const x=t();return `<div class="legend"><span><i style="background:var(--ok)"></i>${x.sv.Exists}</span><span><i style="background:var(--warn)"></i>${x.sv.Partial}</span><span><i style="background:var(--bad)"></i>${x.sv.Missing}</span><span><i style="background:var(--na)"></i>${x.sv.NA}</span><span><i style="background:var(--chip);border:1px solid var(--line)"></i>${x.sv.none}</span></div>`;}
function renderDash(){const x=t(),L=Li();const sc=D.filter(inScope);const c=agg(sc);const assessed=c.Exists+c.Partial+c.Missing+c.NA;
  const cov=c.Exists+c.Partial+c.Missing?Math.round((c.Exists+c.Partial/2)/(c.Exists+c.Partial+c.Missing)*100):0;
  let P=0,F=0;sc.forEach(d=>{const s=score(d);if(s){P+=s.p;F+=s.f;}});
  const gaps=sc.filter(d=>["Missing","Partial"].includes(status(d)));const gS=gaps.filter(d=>d.cap==="SPEC").length,gG=gaps.filter(d=>d.cap==="GUIDED").length;
  const crit=sc.filter(d=>effLvl(d)==="Required"&&["Missing","Partial"].includes(status(d))).sort((a,b)=>a.seq-b.seq);
  const capMsg=S.profile.spec==="none"?x.capMsgNone(gS,gG):S.profile.spec==="part"?x.capMsgPart(gS,gG):x.capMsgFte(gS,gG);
  const src={};gaps.forEach(d=>{const k=d.src[0];src[k]=(src[k]||0)+1;});
  const cats=Object.keys(M.categories).map(k=>{const ds=sc.filter(d=>d.cat===k);const a=agg(ds);const den=a.Exists+a.Partial+a.Missing;return{k,n:ds.length,den,pct:den?Math.round((a.Exists+a.Partial/2)/den*100):null};});
  const heatBg=p=>p===null?"var(--chip)":p>=80?"var(--ok-soft)":p>=50?"var(--warn-soft)":"var(--bad-soft)";
  $("v-dash").innerHTML=`${assessed?"":`<div class="callout ok">${x.noData}</div>`}
  <div class="kpis"><div class="kpi box"><b>${sc.length}</b><span>${x.kpi.scope}</span></div><div class="kpi box"><b>${assessed}</b><span>${x.kpi.assessed}</span></div><div class="kpi box ok"><b>${c.Exists}</b><span>${x.kpi.exists}</span></div><div class="kpi box warn"><b>${c.Partial}</b><span>${x.kpi.partial}</span></div><div class="kpi box bad"><b>${c.Missing}</b><span>${x.kpi.missing}</span></div><div class="kpi box"><b>${c.none}</b><span>${x.kpi.none}</span></div><div class="kpi box"><b>${cov}%</b><span>${x.kpi.cov}</span></div><div class="kpi box"><b>${P+F?Math.round(P/(P+F)*100)+"%":"-"}</b><span>${x.kpi.checks}</span></div></div>
  <div class="grid2"><div class="box pad"><h2>${x.byFn}</h2>${legend()}<div class="bars">${FN.map(f=>barRow(`${f} ${esc(M.functions[f][L])}`,agg(sc.filter(d=>d.fn===f)))).join("")}</div></div>
  <div class="box pad"><h2>${x.byWave}</h2>${legend()}<div class="bars">${WAVES.map(w=>barRow(`${w} ${esc(M.waves[w][L])}`,agg(sc.filter(d=>d.wave===w)))).join("")}</div></div>
  <div class="box pad"><h2>${x.capGap}</h2><div class="callout${gS+gG?"":" ok"}">${esc(capMsg)}</div><h3>${x.bySrc}</h3><div class="bars">${Object.entries(src).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${esc(M.sourcing[k][L])}</span><span class="tr"><i style="width:${v/gaps.length*100}%;background:var(--accent)"></i></span><span class="num">${v}</span></div>`).join("")||`<span class="mini">-</span>`}</div>
   <div class="legend" style="margin-top:10px">${["IT","GUIDED","SPEC"].map(k=>`<span>${capTag(k)} ${esc(M.caps[k][L])}: ${gaps.filter(d=>d.cap===k).length}</span>`).join("")}</div></div>
  <div class="box pad"><h2>${x.critical} <span class="mini">${crit.length}</span></h2><div class="scroll" style="max-height:340px"><table class="t"><tbody>${crit.map(d=>`<tr><td class="mono"><button class="btn sm" data-go="${d.id}">${d.id}</button></td><td>${esc(nm(d))}</td><td>${stPill(status(d))}</td><td>${capTag(d.cap)}</td></tr>`).join("")||`<tr><td class="mini">-</td></tr>`}</tbody></table></div></div></div>
  <div class="box pad" style="margin-top:12px"><h2>${x.heat}</h2><p class="hint">${x.heatHint}</p><div class="heat">${cats.map(k=>`<div style="background:${heatBg(k.pct)}"><b>${k.k}</b>${esc(M.categories[k.k][L])}<div class="mini">${k.pct===null?"-":k.pct+"%"} · ${k.n}</div></div>`).join("")}</div></div>`;}

function listItems(){const q=($("l-q")||{}).value||"",fn=($("l-fn")||{}).value||"",st=($("l-st")||{}).value||"",lv=($("l-lv")||{}).value||"",wv=($("l-wv")||{}).value||"",only=($("l-only")||{checked:true}).checked;
  return D.filter(d=>{if(only&&!inScope(d))return false;const ql=q.toLowerCase();if(ql&&!(d.id.toLowerCase().includes(ql)||d.en.toLowerCase().includes(ql)||d.th.includes(q)))return false;

const CRC=(()=>{const tb=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;tb[n]=c>>>0;}return b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=tb[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};})();

<script>
/* View mode: Presentation / Editor. Presentation shows only the tabs listed in CFG.pres. */
(function(){
var CFG={"kind": "std", "pres": ["dash", "gaps"]}, KEY="csf-view-mode";
var T={EN:{pres:"Presentation view",edit:"Editor view",tp:"Switch to presentation view (presentation tabs only)",te:"Switch to editor view (all tabs and tools)"},
TH:{pres:"มุมมองนำเสนอ",edit:"มุมมองแก้ไข",tp:"สลับเป็นมุมมองนำเสนอ (แสดงเฉพาะแท็บนำเสนอ)",te:"สลับเป็นมุมมองแก้ไข (แสดงทุกแท็บและเครื่องมือ)"}};
var ws=CFG.kind==="ws", stored=null, mode="edit";
try{stored=localStorage.getItem(KEY)}catch(e){}
if(stored==="pres")mode="pres";
function isTH(){try{return ws?S.lang==="th":lang==="TH"}catch(e){return false}}
function cur(){return ws?(S.aud==="exec"?"pres":"edit"):mode}
function paint(){
  var b=document.getElementById("b-vm");if(!b)return;
  var m=cur(),L=T[isTH()?"TH":"EN"];
  b.textContent=m==="pres"?L.edit:L.pres;
  b.title=m==="pres"?L.te:L.tp;
  b.setAttribute("aria-pressed",m==="pres"?"true":"false");
  b.classList.toggle("pri",m==="pres");
  document.body.classList.toggle("vm-pres",m==="pres");
}
if(ws){
  if(stored==="pres"||stored==="edit")S.aud=stored==="pres"?"exec":"cons";
  var r0=render;render=function(){r0.apply(this,arguments);paint();};
}else{
  var ok=function(v){return mode!=="pres"||CFG.pres.indexOf(v)>-1};
  var ensure=function(){if(!ok(view))view=CFG.pres[0];};
  var rs=renderStatic;
  renderStatic=function(){ensure();rs.apply(this,arguments);
    if(mode==="pres"){var tb=document.getElementById("tabs");
      if(tb)tb.querySelectorAll("[data-tab]").forEach(function(b){if(CFG.pres.indexOf(b.dataset.tab)<0)b.remove();});}
    paint();};
  var rv=renderView;renderView=function(){ensure();return rv.apply(this,arguments);};
  var sv=setView;setView=function(v){if(!ok(v))return;return sv.apply(this,arguments);};
  if(typeof goDoc==="function"){var gd=goDoc;goDoc=function(){if(!ok("assess"))return;return gd.apply(this,arguments);};}
  if(typeof goSub==="function"){var gs=goSub;goSub=function(){if(!ok("iv"))return;return gs.apply(this,arguments);};}
}
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("#b-vm");if(!b)return;
  var next=cur()==="pres"?"edit":"pres";
  try{localStorage.setItem(KEY,next)}catch(x){}
  if(ws){S.aud=next==="pres"?"exec":"cons";save();render();}
  else{mode=next;renderAll();}
  window.scrollTo(0,0);
});
if(ws)render();else renderAll();
})();
</script>
