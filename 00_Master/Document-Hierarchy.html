<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}
/* View mode: Presentation / Editor */
#b-vm{white-space:nowrap}
body.vm-pres #b-open,body.vm-pres #b-save,body.vm-pres #b-xlsx,body.vm-pres #savebar{display:none!important}
#audseg{display:none!important}
</style>
</head>
<body>
<title>CSF 2.0 Document Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: header, sticky filter bar, view tabs; each view is a different cut of the same 142 documents; detail drawer on the right */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --ink:#1b2333; --muted:#5b6578; --line:#d7dce6; --accent:#2f4f8f; --accent-soft:#e4eaf6; --chip:#eef1f6;
  --gv:#6b4fa0; --id:#2f6fb0; --pr:#2e8a6a; --de:#b7791f; --rs:#b2453c; --rc:#3d7f8c;
  --req:#b42318; --req-soft:#fbe9e7; --exp:#1d4ed8; --exp-soft:#e6edfd; --opt:#8a93a3; --opt-soft:#f3f4f6; --on-block:#ffffff;
  --cap-it:#2e7d4f; --cap-g:#b26a00; --cap-s:#8a2f8f; --edge:#9aa4b5; --edge2:#b26a00; --dep:#8a2f8f;
  --f-body:"IBM Plex Sans Thai",system-ui,"Segoe UI",Tahoma,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151d; --surface:#19202b; --ink:#e6eaf1; --muted:#9aa4b5; --line:#2c3545; --accent:#8fb0ec; --accent-soft:#223050; --chip:#222a38;
  --gv:#a68ad8; --id:#6fa8e0; --pr:#5fc29d; --de:#e0a84f; --rs:#e47f75; --rc:#6fbcc9;
  --req:#e5534b; --req-soft:#3a1f1f; --exp:#5b8def; --exp-soft:#1d2a45; --opt:#7d8696; --opt-soft:#232a35; --on-block:#ffffff;
  --cap-it:#4fbf82; --cap-g:#e2a23b; --cap-s:#d07ad6; --edge:#5d6779; --edge2:#e2a23b; --dep:#d07ad6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151d; --surface:#19202b; --ink:#e6eaf1; --muted:#9aa4b5; --line:#2c3545; --accent:#8fb0ec; --accent-soft:#223050; --chip:#222a38;
  --gv:#a68ad8; --id:#6fa8e0; --pr:#5fc29d; --de:#e0a84f; --rs:#e47f75; --rc:#6fbcc9;
  --req:#e5534b; --req-soft:#3a1f1f; --exp:#5b8def; --exp-soft:#1d2a45; --opt:#7d8696; --opt-soft:#232a35; --on-block:#ffffff;
  --cap-it:#4fbf82; --cap-g:#e2a23b; --cap-s:#d07ad6; --edge:#5d6779; --edge2:#e2a23b; --dep:#d07ad6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px}
h1{font-size:clamp(22px,3vw,30px);line-height:1.2;margin:0;text-wrap:balance;font-weight:700}
.sub{color:var(--muted);margin:4px 0 0;max-width:75ch}
.hbtns{display:flex;gap:8px;align-items:center}
.btn{font:600 13px var(--f-body);padding:6px 12px;border:1px solid var(--ink);border-radius:4px;background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sm{font-size:12px;padding:3px 9px;border-color:var(--line)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lang{display:flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.lang button{font:600 13px var(--f-body);padding:6px 14px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin:16px 0;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:22px;font-weight:700}
.stats span{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.controls input[type=search],.controls select{font:13px var(--f-body);padding:5px 7px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);min-width:0;max-width:100%}
.controls input[type=search]{flex:1 1 200px}
.controls label.ck{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center}
.tabs{display:flex;gap:4px;margin:18px 0 10px;flex-wrap:wrap}
.tabs button{font:600 14px var(--f-body);padding:7px 13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:4px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px;max-width:110ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted);margin:10px 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.box{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.scroll{overflow-x:auto}
/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);border-radius:3px;padding:2px 6px 2px 2px;font-size:12px;cursor:pointer;color:var(--ink);text-align:left;max-width:100%;width:100%;font-family:var(--f-body);line-height:1.35}
.chip[data-level="Required"]{background:var(--req-soft);border-color:color-mix(in srgb,var(--req) 35%,var(--line))}
.chip[data-level="Expected"]{background:var(--exp-soft);border-color:color-mix(in srgb,var(--exp) 30%,var(--line))}
.chip[data-level="Optional"]{background:var(--opt-soft);border-style:dashed}
.lv{flex:none;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:2px;font:600 11px var(--f-mono);color:var(--on-block)}
.lv.Required{background:var(--req)} .lv.Expected{background:var(--exp)} .lv.Optional{background:var(--opt)}
.chip .id{font-family:var(--f-mono);font-weight:500;white-space:nowrap}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.cap{flex:none;font:600 10px var(--f-mono);padding:0 4px;border-radius:2px;border:1px solid currentColor;line-height:15px}
.cap.IT{color:var(--cap-it)} .cap.GUIDED{color:var(--cap-g)} .cap.SPEC{color:var(--cap-s);background:color-mix(in srgb,var(--cap-s) 14%,transparent)}
body.nocap .chip .cap{display:none}
.chip.dim{opacity:.22}
.hidefilter .chip.dim{display:none}
.chip.sel{outline:2px solid var(--accent);outline-offset:1px}
.inline .chip,.links .chip{width:auto}
.links{display:flex;flex-wrap:wrap;gap:4px}
.seq{font:600 11px var(--f-mono);color:var(--muted);min-width:26px;display:inline-block;text-align:right}
.pill{font:600 11px var(--f-body);padding:1px 8px;border-radius:10px;border:1px solid currentColor;display:inline-block;white-space:nowrap}
.tagp{font-size:11px;padding:1px 7px;border-radius:10px;background:var(--chip);border:1px solid var(--line);color:var(--muted);white-space:nowrap;cursor:pointer;font-family:var(--f-body)}
.tagp[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* tier map */
table.map{border-collapse:collapse;width:100%;min-width:1000px}
table.map th,table.map td{border-bottom:1px solid var(--line);vertical-align:top;padding:8px}
table.map thead th{font-size:13px;text-align:left;background:var(--surface)}
table.map thead th .bar{display:block;height:4px;border-radius:2px;margin-bottom:6px}
table.map tbody th{width:150px;text-align:left;font-size:13px;color:var(--muted);font-weight:600}
table.map tbody th b{display:block;color:var(--ink);font-family:var(--f-mono);font-size:14px}
.cell{display:flex;flex-direction:column;gap:4px}
/* tree diagram */
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.diag{position:relative;overflow:auto;max-height:78vh;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.diag svg{position:absolute;left:0;top:0;pointer-events:none}
.tn{position:absolute;display:flex;align-items:center;gap:4px}
.tn .chip{width:236px}
.tn .tog{font:600 12px var(--f-mono);border:1px solid var(--line);background:var(--bg);color:var(--ink);width:22px;height:22px;border-radius:3px;cursor:pointer;padding:0;flex:none}
.tn .mp{font:600 10px var(--f-mono);color:var(--edge2);border:1px dashed var(--edge2);border-radius:2px;padding:0 3px}
.tn.fade{opacity:.25}
.colhead{position:absolute;top:6px;font:600 11px var(--f-mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
/* order view */
.wavegrid{display:grid;grid-template-columns:150px repeat(6,minmax(240px,1fr));min-width:1600px}
.wavegrid>div{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px;min-width:0}
.wavegrid .wh{background:var(--surface);position:relative}
.wavegrid .wh b{display:block;font-size:14px}
.wavegrid .wh small{color:var(--muted);font-size:12px;display:block}
.wavegrid .th{font-weight:600;font-size:13px;color:var(--muted);background:var(--surface)}
.wavegrid .trB{background:color-mix(in srgb,var(--cap-g) 7%,var(--bg))}
.actlist{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.act{font:500 12px var(--f-body);text-align:left;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);color:var(--ink);border-radius:3px;padding:3px 6px;cursor:pointer}
.act .an{font-family:var(--f-mono);color:var(--muted);font-size:11px;margin-right:4px}
.ord{display:flex;flex-direction:column;gap:4px;min-width:0}
.ord .row{display:grid;grid-template-columns:26px minmax(0,1fr);gap:4px;align-items:center;min-width:0}
.ord .row .chip{width:100%;min-width:0}
.cellw{display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden}
.runfirst{border:1px solid var(--line);border-radius:4px;background:var(--surface);min-width:0}
.runfirst summary{cursor:pointer;font:600 12px var(--f-body);padding:4px 8px;color:var(--muted)}
.runfirst .cnt{font-family:var(--f-mono);background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:0 6px;margin-left:4px}
.runfirst .actlist{padding:0 6px 6px;margin:0}
.act{width:100%;overflow-wrap:anywhere}
.chip{min-width:0}
.pk{display:none;flex:none;font:600 10px var(--f-mono);padding:0 4px;border-radius:2px;line-height:15px;border:1px solid var(--ink);color:var(--ink)}
.pk.Essential{background:var(--ink);color:var(--bg)} .pk.Extended{border-style:dashed;color:var(--muted);border-color:var(--muted)}
body.showpkg .chip .pk,.modal .pk,.drawer .pk{display:inline-block}
.howto{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin:0 0 10px;font-size:13px}
.howto>summary{cursor:pointer;font-weight:600;padding:6px 10px;color:var(--accent)}
.howto dl{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:0;padding:4px 12px 12px}
.howto dt{color:var(--muted);font-weight:600}
.howto dd{margin:0;max-width:95ch}
@media (max-width:560px){.howto dl{grid-template-columns:1fr}}
.callout.need{background:var(--chip);border-left:3px solid var(--accent)}
.audseg button{font-size:12px;padding:6px 10px}
.audrow{color:var(--accent)!important}
.bseq{font:500 10px var(--f-mono);color:var(--muted);background:var(--chip);border-radius:8px;padding:0 6px;margin-left:6px;white-space:nowrap}
.svcbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:10px}
.svc{text-align:left;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:8px 10px;cursor:pointer;font-family:var(--f-body)}
.svc b{display:block;font-size:13px}.svc span{font-size:11px;color:var(--muted)}
.svc.on{border-color:var(--accent);background:var(--accent-soft)}
.svccard{border:1px dashed var(--accent);border-radius:4px;padding:6px 8px;font-size:12px;display:flex;flex-direction:column;gap:4px}
.svcgrp{display:flex;flex-direction:column;gap:4px;min-width:0}
.sg{font:600 11px var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.sg .cnt{font-family:var(--f-mono);background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:0 6px;margin-left:4px}
.fade2{opacity:.22}
.lane-top.th{border-left:4px solid var(--cap-s)} .lane-mid.th{border-left:4px solid var(--cap-g)} .lane-low.th{border-left:4px solid var(--cap-it)}
.capbars{display:flex;flex-direction:column;gap:4px;margin:4px 0 0}
.cb{display:flex;height:8px;border-radius:2px;overflow:hidden;background:var(--chip)}
.cb i{display:block;height:100%}
.steplist{display:flex;flex-direction:column;gap:14px}
.steplist h3{margin:6px 0 2px;font-size:16px}
.steplist table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
.steplist td,.steplist th{border-bottom:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
.steplist th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mini{font-size:12px;color:var(--muted)}
.idl2{font-family:var(--f-mono);font-size:12px}
/* flows */
.flow{padding:12px;margin-bottom:12px}
.flow h3{margin:0;font-size:16px}
.flow p{margin:2px 0 10px;color:var(--muted);font-size:13px}
.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.step{display:flex;flex-direction:column;gap:4px;width:200px;border:1px solid var(--line);border-radius:4px;padding:6px;background:var(--bg)}
.step .lb{font:600 12px var(--f-body)}
.step .lb i{font:600 11px var(--f-mono);color:var(--muted);font-style:normal;margin-right:4px}
.arrow{align-self:center;color:var(--muted);font:600 16px var(--f-mono)}
/* owners and themes */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.grid3>section{padding:12px;min-width:0}
.grid3 h3{margin:0 0 2px;font-size:15px}
.grid3 h4{margin:10px 0 4px;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
/* outline */
.tree{padding:12px;overflow-x:auto}
.tree ul{list-style:none;margin:0;padding-left:22px;border-left:1px dashed var(--line)}
.tree>ul{border-left:0;padding-left:0}
.tree li{margin:3px 0}
.node{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.tog2{font:600 12px var(--f-mono);border:1px solid var(--line);background:var(--bg);color:var(--ink);width:22px;height:20px;border-radius:3px;cursor:pointer;padding:0}
.tier{font:500 11px var(--f-mono);color:var(--muted)}
/* drawer */
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.14);padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto;z-index:10}
.drawer h2{font-size:19px;margin:6px 0 4px;text-wrap:balance}
.drawer h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;border-top:1px solid var(--line);padding-top:12px}
.drawer .idl{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.drawer dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px;margin:10px 0}
.drawer dt{color:var(--muted)}
.drawer dd{margin:0;min-width:0;overflow-wrap:anywhere}
.drawer ol,.drawer ul{margin:4px 0;padding-left:20px;font-size:13px}
.drawer details{border:1px solid var(--line);border-radius:4px;padding:6px 8px;margin:6px 0;font-size:13px}
.drawer summary{cursor:pointer;font-weight:600}
.close{float:right}
.callout{font-size:13px;background:var(--accent-soft);border-radius:4px;padding:8px 10px;margin:8px 0}
.capbox{border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:13px}
.note{font-size:12px;color:var(--muted);margin-top:24px;max-width:100ch}
@media (min-width:1100px){body.has-drawer .wrap{margin-right:490px;max-width:none}}
@media (max-width:560px){.drawer dl{grid-template-columns:1fr}.stats b{font-size:18px}}
/* help */
.modal{position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:20;display:flex;justify-content:center;align-items:flex-start;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal .panel{background:var(--surface);color:var(--ink);border-radius:8px;max-width:860px;width:100%;padding:22px 24px;border:1px solid var(--line)}
.modal h2{margin:0 0 4px;font-size:22px}
.modal h3{margin:20px 0 6px;font-size:15px}
.modal p,.modal li{font-size:14px;max-width:80ch}
.modal table{border-collapse:collapse;width:100%;font-size:13px}
.modal td,.modal th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.modal .lg{display:flex;gap:6px;align-items:center}
@media (prefers-reduced-motion:no-preference){.chip,.tn{transition:opacity .15s,background .15s}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1 id="t-title">CSF 2.0 Document Map</h1>
      <p class="sub" id="t-sub"></p>
    </div>
    <div class="hbtns">
      <div class="lang audseg" role="group" aria-label="Audience" id="audseg"><button data-aud="all" aria-pressed="true">All</button><button data-aud="inh" aria-pressed="false">In-house</button><button data-aud="con" aria-pressed="false">Consultant</button></div>
      <button class="btn pri" id="b-help" aria-haspopup="dialog">Help</button>
      <button class="btn" id="b-vm" type="button" aria-pressed="false">Presentation view</button>
      <div class="lang" role="group" aria-label="Language">
        <button id="b-th" aria-pressed="false">ไทย</button>
        <button id="b-en" aria-pressed="true">EN</button>
      </div>
    </div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <input id="q" type="search" aria-label="Search">
    <select id="f-fn" aria-label="Function"></select>
    <select id="f-theme" aria-label="Theme"></select>
    <select id="f-tag" aria-label="Tag"></select>
    <select id="f-lvl" aria-label="Level"></select>
    <select id="f-cap" aria-label="Capability"></select>
    <select id="f-wave" aria-label="Wave"></select>
    <select id="f-pkg" aria-label="Package"></select>
    <label class="ck"><input type="checkbox" id="o-cap" checked> <span id="l-ocap"></span></label>
    <label class="ck"><input type="checkbox" id="o-pkg"> <span id="l-opkg"></span></label>
    <label class="ck"><input type="checkbox" id="o-hide"> <span id="l-ohide"></span></label>
    <button class="btn sm" id="b-reset"></button>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="legend" id="legend"></div>

  <section id="v-map"><p class="hint" id="h-map"></p><details class="howto" id="hw-map"></details><div class="box scroll"><table class="map" id="map"></table></div></section>
  <section id="v-tree" hidden>
    <p class="hint" id="h-tree"></p><details class="howto" id="hw-tree"></details>
    <div class="tbar">
      <button class="btn sm" id="t-exp"></button><button class="btn sm" id="t-col"></button><button class="btn sm" id="t-pol"></button>
      <label class="ck mini"><input type="checkbox" id="t-deps" checked> <span id="l-tdeps"></span></label>
    </div>
    <div class="diag" id="diag"></div>
  </section>
  <section id="v-order" hidden>
    <p class="hint" id="h-order"></p><details class="howto" id="hw-order"></details>
    <div class="tbar"><button class="btn sm" id="o-board" aria-pressed="true"></button><button class="btn sm" id="o-list" aria-pressed="false"></button></div>
    <div id="order"></div>
  </section>

Incident Recovery Communication","การสื่อสารระหว่างการกู้คืน"]},"subcats":{"GV.OC-01":"Organizational mission is understood and informs cybersecurity risk management","GV.OC-02":"Internal and external stakeholders and their cybersecurity expectations are understood","GV.OC-03":"Legal, regulatory, and contractual cybersecurity requirements are understood and managed","GV.OC-04":"Critical objectives, capabilities, and services that external stakeholders depend on are understood","GV.OC-05":"Outcomes, capabilities, and services that the organization depends on are understood","GV.RM-01":"Risk management objectives are established and agreed to by stakeholders","GV.RM-02":"Risk appetite and risk tolerance statements are established, communicated, and maintained","GV.RM-03":"Cybersecurity risk management is included in enterprise risk management processes","GV.RM-04":"Strategic direction for appropriate risk response options is established and communicated","GV.RM-05":"Lines of communication for cybersecurity risks, including supplier risks, are established","GV.RM-06":"A standardized method for calculating, documenting, categorizing, and prioritizing risks is established","GV.RM-07":"Strategic opportunities (positive risks) are characterized and included in discussions","GV.RR-01":"Leadership is responsible and accountable for cybersecurity risk and fosters a risk-aware culture","GV.RR-02":"Cybersecurity roles, responsibilities, and authorities are established, communicated, and enforced","GV.RR-03":"Adequate resources are allocated commensurate with risk strategy, roles, and policies","GV.RR-04":"Cybersecurity is included in human resources practices","GV.PO-01":"Cybersecurity policy is established, communicated, and enforced based on context, strategy, and priorities","GV.PO-02":"Cybersecurity policy is reviewed, updated, communicated, and enforced to reflect changes","GV.OV-01":"Risk management strategy outcomes are reviewed to inform and adjust strategy and direction","GV.OV-02":"Risk management strategy is reviewed and adjusted to ensure coverage of requirements and risks","GV.OV-03":"Risk management performance is evaluated and reviewed for adjustments needed","GV.SC-01":"A cybersecurity supply chain risk management program, strategy, objectives, policies, and processes are established","GV.SC-02":"Cybersecurity roles for suppliers, customers, and partners are established and coordinated","GV.SC-03":"Supply chain risk management is integrated into cybersecurity and enterprise risk management","GV.SC-04":"Suppliers are known and prioritized by criticality","GV.SC-05":"Requirements to address supply chain risks are established, prioritized, and integrated into contracts","GV.SC-06":"Planning and due diligence are performed to reduce risks before entering supplier relationships","GV.SC-07":"Supplier risks are understood, recorded, prioritized, assessed, responded to, and monitored","GV.SC-08":"Relevant suppliers are included in incident planning, response, and recovery activities","GV.SC-09":"Supply chain security practices are integrated and monitored throughout the technology product and service life cycle","GV.SC-10":"Supply chain risk management plans include provisions for activities after a partnership or service ends","ID.AM-01":"Inventories of hardware managed by the organization are maintained","ID.AM-02":"Inventories of software, services, and systems managed by the organization are maintained","ID.AM-03":"Representations of authorized network communication and data flows are maintained","ID.AM-04":"Inventories of services provided by suppliers are maintained","ID.AM-05":"Assets are prioritized based on classification, criticality, resources, and impact on the mission","ID.AM-07":"Inventories of data and corresponding metadata for designated data types are maintained","ID.AM-08":"Systems, hardware, software, services, and data are managed throughout their life cycles","ID.RA-01":"Vulnerabilities in assets are identified, validated, and recorded","ID.RA-02":"Cyber threat intelligence is received from information sharing forums and sources","ID.RA-03":"Internal and external threats to the organization are identified and recorded","ID.RA-04":"Potential impacts and likelihoods of threats exploiting vulnerabilities are identified and recorded","ID.RA-05":"Threats, vulnerabilities, likelihoods, and impacts are used to understand inherent risk and inform prioritization","ID.RA-06":"Risk responses are chosen, prioritized, planned, tracked, and communicated","ID.RA-07":"Changes and exceptions are managed, assessed for risk impact, recorded, and tracked","ID.RA-08":"Processes for receiving, analyzing, and responding to vulnerability disclosures are established","ID.RA-09":"The authenticity and integrity of hardware and software are assessed prior to acquisition and use","ID.RA-10":"Critical suppliers are assessed prior to acquisition","ID.IM-01":"Improvements are identified from evaluations","ID.IM-02":"Improvements are identified from security tests and exercises","ID.IM-03":"Improvements are identified from execution of operational processes, procedures, and activities","ID.IM-04":"Incident response plans and other cybersecurity plans that affect operations are established, communicated, maintained, and improved","PR.AA-01":"Identities and credentials for authorized users, services, and hardware are managed","PR.AA-02":"Identities are proofed and bound to credentials based on the context of interactions","PR.AA-03":"Users, services, and hardware are authenticated","PR.AA-04":"Identity assertions are protected, conveyed, and verified","PR.AA-05":"Access permissions, entitlements, and authorizations are defined, managed, enforced, and reviewed","PR.AA-06":"Physical access to assets is managed, monitored, and enforced commensurate with risk","PR.AT-01":"Personnel are provided with awareness and training for general tasks with cybersecurity risks in mind","PR.AT-02":"Individuals in specialized roles are provided with awareness and training for those roles","PR.DS-01":"The confidentiality, integrity, and availability of data-at-rest are protected","PR.DS-02":"The confidentiality, integrity, and availability of data-in-transit are protected","PR.DS-10":"The confidentiality, integrity, and availability of data-in-use are protected","PR.DS-11":"Backups of data are created, protected, maintained, and tested","PR.PS-01":"Configuration management practices are established and applied","PR.PS-02":"Software is maintained, replaced, and removed commensurate with risk","PR.PS-03":"Hardware is maintained, replaced, and removed commensurate with risk","PR.PS-04":"Log records are generated and made available for continuous monitoring","PR.PS-05":"Installation and execution of unauthorized software are prevented","PR.PS-06":"Secure software development practices are integrated and their performance is monitored","PR.IR-01":"Networks and environments are protected from unauthorized logical access and usage","PR.IR-02":"Technology assets are protected from environmental threats","PR.IR-03":"Mechanisms are implemented to achieve resilience requirements in normal and adverse situations","PR.IR-04":"Adequate resource capacity to ensure availability is maintained","DE.CM-01":"Networks and network services are monitored to find potentially adverse events","DE.CM-02":"The physical environment is monitored to find potentially adverse events","DE.CM-03":"Personnel activity and technology usage are monitored to find potentially adverse events","DE.CM-06":"External service provider activities and services are monitored to find potentially adverse events","DE.CM-09":"Computing hardware and software, runtime environments, and their data are monitored to find potentially adverse events","DE.AE-02":"Potentially adverse events are analyzed to better understand associated activities","DE.AE-03":"Information is correlated from multiple sources","DE.AE-04":"The estimated impact and scope of adverse events are understood","DE.AE-06":"Information on adverse events is provided to authorized staff and tools","DE.AE-07":"Cyber threat intelligence and other contextual information are integrated into the analysis","DE.AE-08":"Incidents are declared when adverse events meet the defined incident criteria","RS.MA-01":"The incident response plan is executed in coordination with relevant third parties once an incident is declared","RS.MA-02":"Incident reports are triaged and validated","RS.MA-03":"Incidents are categorized and prioritized","RS.MA-04":"Incidents are escalated or elevated as needed","RS.MA-05":"The criteria for initiating incident recovery are applied","RS.AN-03":"Analysis is performed to establish what has taken place during an incident and the root cause","RS.AN-06":"Actions performed during an investigation are recorded and the records' integrity and provenance are preserved","RS.AN-07":"Incident data and metadata are collected, and their integrity and provenance are preserved","RS.AN-08":"An incident's magnitude is estimated and validated","RS.CO-02":"Internal and external stakeholders are notified of incidents","RS.CO-03":"Information is shared with designated internal and external stakeholders","RS.MI-01":"Incidents are contained","RS.MI-02":"Incidents are eradicated","RC.RP-01":"The recovery portion of the incident response plan is executed once initiated","RC.RP-02":"Recovery actions are selected, scoped, prioritized, and performed","RC.RP-03":"The integrity of backups and other restoration assets is verified before using them for restoration","RC.RP-04":"Critical mission functions and cybersecurity risk management are considered to establish post-incident operational norms","RC.RP-05":"The integrity of restored assets is verified, systems and services are restored, and normal operating status is confirmed","RC.RP-06":"The end of incident recovery is declared based on criteria, and incident-related documentation is completed","RC.CO-03 04","ID-PRC-005","DE-PRC-003","RC-PLN-003"]},"acts":{"ACT-01":{"en":"Executive Kickoff and Mandate Meeting","th":"ประชุม Kickoff ผู้บริหารและการมอบอำนาจหน้าที่","purpose":["Secure executive sponsorship, agree why the organization is formalizing cybersecurity, and confirm who owns the program.","ได้รับการสนับสนุนจากผู้บริหาร ตกลงเหตุผลที่องค์กรต้องจัดระบบความมั่นคงปลอดภัยไซเบอร์ และยืนยันผู้รับผิดชอบแผนงาน"],"agenda":[["Trigger and business case: incidents in the sector, legal duties (CII, PDPA), customer demands","Program objectives for the first 12 months","Who sponsors, who owns, and who runs the program","Reporting line of the security lead and escalation route to the Board","Decisions needed: approve charter drafting, name the program owner, set the next meeting"],["เหตุผลและกรณีทางธุรกิจ: เหตุการณ์ในอุตสาหกรรม หน้าที่ตามกฎหมาย (CII, PDPA) และข้อกำหนดของลูกค้า","เป้าหมายของแผนงานใน 12 เดือนแรก","ผู้สนับสนุน เจ้าของ และผู้ดำเนินแผนงาน","สายการรายงานของผู้นำด้านความมั่นคงปลอดภัยและช่องทางยกระดับถึงคณะกรรมการ","เรื่องที่ต้องตัดสินใจ: อนุมัติการร่างกฎบัตร แต่งตั้งเจ้าของแผนงาน และกำหนดการประชุมครั้งถัดไป"]],"roles":["CEO","CIO","CFO","CISO","CRO","LEGAL"],"inputs":["Sector incident news, legal applicability notes","ข่าวเหตุการณ์ในอุตสาหกรรม บันทึกการประเมินกฎหมายที่เกี่ยวข้อง"],"duration":["90 minutes","90 นาที"],"cap":"GUIDED","freq":["One time","ครั้งเดียว"],"first":["Keep it short and decision focused. Bring one page with three decisions only. Without a named sponsor, every later document will stall at approval.","จัดให้สั้นและเน้นการตัดสินใจ เตรียมเอกสาร 1 หน้าที่มีเรื่องให้ตัดสินใจเพียง 3 เรื่อง หากไม่มีผู้สนับสนุนที่ระบุชื่อชัดเจน เอกสารทุกฉบับต่อจากนี้จะติดที่ขั้นอนุมัติ"],"outputs":["GV-CHR-001"]},"ACT-02":{"en":"Governance Structure and RACI Workshop","th":"Workshop โครงสร้างการกำกับดูแลและ RACI","purpose":["Design the steering committee, define roles across IT, security, privacy, risk, and audit, and agree a Responsible, Accountable, Consulted, Informed (RACI) matrix.","ออกแบบคณะกรรมการกำกับดูแล กำหนดบทบาทระหว่าง IT ความมั่นคงปลอดภัย ความเป็นส่วนตัว ความเสี่ยง และตรวจสอบ และตกลง RACI matrix"],"agenda":[["Current state: who does security work today, formally or informally","Steering committee membership, chair, quorum, and meeting frequency","Separation of duties: security versus IT operations versus internal audit","RACI for the top 15 security activities","Gaps that need a new role, a part-time assignment, or an external provider"],["สภาพปัจจุบัน: ใครทำงานด้านความมั่นคงปลอดภัยอยู่บ้าง ทั้งที่เป็นทางการและไม่เป็นทางการ","องค์ประกอบคณะกรรมการกำกับดูแล ประธาน องค์ประชุม และความถี่การประชุม","การแบ่งแยกหน้าที่: ความมั่นคงปลอดภัย กับงานปฏิบัติการ IT และตรวจสอบภายใน","RACI สำหรับกิจกรรมด้านความมั่นคงปลอดภัยหลัก 15 กิจกรรม","ช่องว่างที่ต้องตั้งตำแหน่งใหม่ มอบหมายแบบบางเวลา หรือจ้างผู้ให้บริการภายนอก"]],"roles":["CIO","CISO","HR","DPO","CRO","IA"],"inputs":["Organization chart, current job descriptions","ผังองค์กร คำบรรยายลักษณะงานปัจจุบัน"],"duration":["Half day","ครึ่งวัน"],"cap":"GUIDED","freq":["One time, then annual review","ครั้งเดียว และทบทวนรายปี"],"first":["Map real work before drawing boxes. A common trap is naming the IT Manager as both the person who operates systems and the person who checks them.","ทำแผนผังงานที่เกิดขึ้นจริงก่อนวาดผังองค์กร กับดักที่พบบ่อยคือกำหนดให้ผู้จัดการ IT เป็นทั้งผู้ดูแลระบบและผู้ตรวจสอบระบบในคนเดียวกัน"],"outputs":["GV-CHR-001","GV-CHR-002","GV-REG-003"]},"ACT-03":{"en":"Legal and Regulatory Applicability Review","th":"การทบทวนกฎหมายและกฎระเบียบที่บังคับใช้","purpose":["Confirm which laws, regulator notifications, and contracts apply, and translate each into concrete obligations and owners.","ยืนยันกฎหมาย ประกาศของหน่วยงานกำกับ และสัญญาที่บังคับใช้ และแปลงแต่ละข้อเป็นหน้าที่ที่ชัดเจนพร้อมผู้รับผิดชอบ"],"agenda":[["Is the organization a Critical Information Infrastructure (CII) operator under the Cybersecurity Act B.E. 2562","Personal data processed and whether sensitive data under PDPA s.26 is involved","Computer Crime Act duties if the organization provides network access to others","Sector regulator rules and key customer or partner contract clauses","Obligation list with owner, evidence, and deadline"],["องค์กรเป็นหน่วยงานโครงสร้างพื้นฐานสำคัญทางสารสนเทศ (CII) ตาม พ.ร.บ.การรักษาความมั่นคงปลอดภัยไซเบอร์ พ.ศ. 2562 หรือไม่","ข้อมูลส่วนบุคคลที่ประมวลผล และมีข้อมูลอ่อนไหวตาม PDPA มาตรา 26 หรือไม่","หน้าที่ตาม พ.ร.บ.คอมพิวเตอร์ฯ หากองค์กรให้บริการเครือข่ายแก่ผู้อื่น","กฎของหน่วยงานกำกับดูแลรายอุตสาหกรรม และเงื่อนไขในสัญญากับลูกค้าหรือคู่ค้าสำคัญ","รายการหน้าที่พร้อมผู้รับผิดชอบ หลักฐาน และกำหนดเวลา"]],"roles":["LEGAL","CISO","DPO","CIO"],"inputs":["Laws and notifications, key contracts, regulator letters","กฎหมายและประกาศ สัญญาสำคัญ หนังสือจากหน่วยงานกำกับ"],"duration":["2 to 3 working sessions","2 ถึง 3 รอบการทำงาน"],"cap":"SPEC","freq":["One time, then semiannual update","ครั้งเดียว และปรับปรุงทุก 6 เดือน"],"first":["Thai cybersecurity notifications change often. Have legal counsel or a specialist consultant confirm current CII and PDPC requirements before writing obligations into policy.","ประกาศด้านไซเบอร์ของไทยเปลี่ยนแปลงบ่อย ควรให้ที่ปรึกษากฎหมายหรือผู้เชี่ยวชาญยืนยันข้อกำหนด CII และ PDPC ฉบับปัจจุบันก่อนนำไปเขียนเป็นนโยบาย"],"outputs":["GV-REG-001","GV-POL-001","GV-REG-006","GV-POL-004","RS-PRC-003"]},"ACT-04":{"en":"Scope and Organizational Context Workshop","th":"Workshop ขอบเขตและบริบทองค์กร","purpose":["Agree what the security program covers: sites, services, systems, interfaces, and stakeholders.","ตกลงขอบเขตของแผนงาน: สถานที่ บริการ ระบบ จุดเชื่อมต่อ และผู้มีส่วนได้ส่วนเสีย"],"agenda":[["Critical services and the systems behind them","Sites, cloud services, and outsourced functions in and out of scope","Internal and external stakeholders and their expectations","Interfaces and dependencies with third parties","Draft scope statement and exclusions with justification"],["บริการสำคัญและระบบที่รองรับ","สถานที่ บริการคลาวด์ และงานที่จ้างภายนอก ทั้งที่อยู่ในและนอกขอบเขต","ผู้มีส่วนได้ส่วนเสียภายในและภายนอก และความคาดหวัง","จุดเชื่อมต่อและการพึ่งพาบุคคลภายนอก","ร่างเอกสารขอบเขตและข้อยกเว้นพร้อมเหตุผล"]],"roles":["CISO","CIO","CRO","SYSOWN"],"inputs":["Service catalog, system list, legal obligation list","รายการบริการ รายการระบบ รายการหน้าที่ตามกฎหมาย"],"duration":["Half day","ครึ่งวัน"],"cap":"GUIDED","freq":["One time, then annual review","ครั้งเดียว และทบทวนรายปี"],"first":["Start narrow if resources are thin, such as the critical services only, and widen the scope each year.","หากทรัพยากรจำกัด ให้เริ่มจากขอบเขตแคบ เช่น เฉพาะบริการสำคัญ แล้วขยายขอบเขตทุกปี"],"outputs":["GV-RPT-001","GV-REG-002"]},"ACT-05":{"en":"Asset Discovery and Inventory Reconciliation","th":"การสำรวจและกระทบยอดทะเบียนทรัพย์สิน","purpose":["Build a trusted inventory of hardware, software, cloud services, and data by comparing several sources.","จัดทำทะเบียนทรัพย์สินที่เชื่อถือได้ ทั้งฮาร์ดแวร์ ซอฟต์แวร์ บริการคลาวด์ และข้อมูล โดยเปรียบเทียบจากหลายแหล่ง"],"agenda":[["Collect sources: network scan, endpoint agent, directory service, finance asset register, purchase records","Reconcile differences and identify unknown or unmanaged devices","Assign an owner and criticality to each asset","Agree the system of record and the update trigger (purchase, change, disposal)"],["รวบรวมแหล่งข้อมูล: การสแกนเครือข่าย endpoint agent directory service ทะเบียนทรัพย์สินฝ่ายการเงิน และบันทึกการจัดซื้อ","กระทบยอดความแตกต่าง และระบุอุปกรณ์ที่ไม่รู้จักหรือไม่มีผู้ดูแล","กำหนดเจ้าของและระดับความสำคัญของทรัพย์สินแต่ละรายการ","ตกลงระบบหลักที่ใช้บันทึกและเหตุการณ์ที่ต้องปรับปรุงทะเบียน (จัดซื้อ เปลี่ยนแปลง จำหน่าย)"]],"roles":["ITM","SYSOWN","CFO","FAC"],"inputs":["Scan results, directory export, finance register","ผลการสแกน ข้อมูลจาก directory ทะเบียนทรัพย์สินฝ่ายการเงิน"],"duration":["2 to 6 weeks","2 ถึง 6 สัปดาห์"],"cap":"IT","freq":["Initial build, then continuous","จัดทำครั้งแรก แล้วปรับปรุงต่อเนื่อง"],"first":["IT can run this alone. Do not wait for a perfect list; 90 percent coverage with owners is enough to start risk assessment.","ทีม IT ดำเนินการเองได้ ไม่ต้องรอให้ทะเบียนสมบูรณ์ ความครอบคลุมราว 90 เปอร์เซ็นต์ที่มีเจ้าของชัดเจนก็เพียงพอสำหรับเริ่มประเมินความเสี่ยง"],"outputs":["ID-REG-001","ID-REG-002","ID-RPT-001","ID-REG-004"]},"ACT-06":{"en":"Data Mapping Interviews","th":"การสัมภาษณ์เพื่อจัดทำแผนผังข้อมูล","purpose":["Find out what personal and sensitive data each department collects, why, where it is stored, and who receives it.","ค้นหาว่าแต่ละหน่วยงานเก็บข้อมูลส่วนบุคคลและข้อมูลอ่อนไหวอะไร เพื่ออะไร เก็บที่ไหน และส่งต่อให้ใคร"],"agenda":[["Processing activities per department and their purpose","Lawful basis for each activity under PDPA","Systems, storage locations, and retention period","Transfers to processors and cross-border transfers","Follow-up items: missing consent, missing contract, excessive retention"],["กิจกรรมการประมวลผลของแต่ละหน่วยงานและวัตถุประสงค์","ฐานทางกฎหมายของแต่ละกิจกรรมตาม PDPA","ระบบ ที่จัดเก็บ และระยะเวลาการเก็บรักษา","การส่งต่อให้ผู้ประมวลผลและการโอนข้อมูลไปต่างประเทศ","รายการติดตาม: ขาดความยินยอม ขาดสัญญา เก็บข้อมูลนานเกินจำเป็น"]],"roles":["DPO","SYSOWN","LEGAL","ITM"],"inputs":["Department list, forms and systems used to collect data","รายชื่อหน่วยงาน แบบฟอร์มและระบบที่ใช้เก็บข้อมูล"],"duration":["45 to 60 minutes per department","45 ถึง 60 นาทีต่อหน่วยงาน"],"cap":"GUIDED","freq":["Initial, then annual refresh","ครั้งแรก และทบทวนรายปี"],"first":["Use a short questionnaire before each interview. Lawful basis decisions need privacy counsel or a DPO service if no one in-house has PDPA experience.","ส่งแบบสอบถามสั้นก่อนการสัมภาษณ์ทุกครั้ง การกำหนดฐานทางกฎหมายต้องอาศัยที่ปรึกษาด้านความเป็นส่วนตัวหรือบริการ DPO หากภายในองค์กรไม่มีผู้มีประสบการณ์ด้าน PDPA"],"outputs":["GV-REG-007","GV-TPL-002","ID-REG-003"]},"ACT-07":{"en":"Business Impact Analysis (BIA) Interviews and Validation Workshop","th":"การสัมภาษณ์และ Workshop ยืนยันผลการวิเคราะห์ผลกระทบทางธุรกิจ (BIA)","purpose":["Determine how long each critical service can be down, how much data it can lose, and which systems and suppliers it depends on.","กำหนดว่าบริการสำคัญแต่ละบริการหยุดได้นานเท่าใด สูญเสียข้อมูลได้มากเท่าใด และพึ่งพาระบบและผู้ให้บริการรายใด"],"agenda":[["Impact over time: 1 hour, 4 hours, 1 day, 3 days (safety, financial, legal, reputation)","Maximum tolerable downtime, Recovery Time Objective (RTO), and Recovery Point Objective (RPO) per service","Dependencies: systems, people, suppliers, facilities","Manual workarounds and how long they can run","Validation workshop: management confirms RTO and RPO and accepts the cost implications"],["ผลกระทบตามช่วงเวลา: 1 ชั่วโมง 4 ชั่วโมง 1 วัน 3 วัน (ความปลอดภัย การเงิน กฎหมาย ชื่อเสียง)","ระยะเวลาหยุดชะงักสูงสุดที่ยอมรับได้ Recovery Time Objective (RTO) และ Recovery Point Objective (RPO) ของแต่ละบริการ","การพึ่งพา: ระบบ บุคลากร ผู้ให้บริการ และสถานที่","วิธีปฏิบัติงานด้วยมือทดแทน และระยะเวลาที่ทำได้","Workshop ยืนยันผล: ผู้บริหารยืนยัน RTO และ RPO และยอมรับผลกระทบด้านค่าใช้จ่าย"]],"roles":["BCM","SYSOWN","CIO","CFO","RISK"],"inputs":["Service list, asset inventory, incident history","รายการบริการ ทะเบียนทรัพย์สิน ประวัติเหตุการณ์"],"duration":["1 to 2 hours per service, plus a 2 hour validation workshop","1 ถึง 2 ชั่วโมงต่อบริการ และ Workshop ยืนยันผล 2 ชั่วโมง"],"cap":"SPEC","freq":["Annual","รายปี"],"first":["Business owners tend to say every service needs zero downtime. A facilitator experienced in ISO 22301 must challenge the numbers and show the cost of each RTO.","เจ้าของธุรกิจมักตอบว่าทุกบริการหยุดไม่ได้เลย ผู้ดำเนินการที่มีประสบการณ์ ISO 22301 ต้องตั้งคำถามกับตัวเลขและแสดงต้นทุนของ RTO แต่ละระดับ"],"outputs":["ID-RPT-002","RC-PLN-001"]},"ACT-08":{"en":"Risk Appetite Workshop","th":"Workshop ระดับความเสี่ยงที่ยอมรับได้","purpose":["Have executives state how much cybersecurity risk the organization will accept, in measurable terms.","ให้ผู้บริหารกำหนดระดับความเสี่ยงด้านไซเบอร์ที่องค์กรยอมรับได้ในรูปแบบที่วัดผลได้"],"agenda":[["Recap of top business objectives and recent sector incidents","Appetite by risk area: service disruption, data breach, regulatory breach, fraud","Tolerance thresholds and Key Risk Indicators (KRI) that trigger escalation","Who may accept which level of risk","Approval route to the Board or its committee"],["สรุปเป้าหมายธุรกิจหลักและเหตุการณ์ล่าสุดในอุตสาหกรรม","ระดับความเสี่ยงที่ยอมรับได้รายด้าน: การหยุดชะงักของบริการ ข้อมูลรั่วไหล การไม่ปฏิบัติตามกฎหมาย การทุจริต","เกณฑ์ความเสี่ยงที่ยอมรับได้และ Key Risk Indicators (KRI) ที่ต้องยกระดับ","ผู้มีอำนาจยอมรับความเสี่ยงแต่ละระดับ","เส้นทางการอนุมัติไปยังคณะกรรมการหรือคณะกรรมการชุดย่อย"]],"roles":["CEO","CFO","CIO","CRO","CISO","BOARD"],"inputs":["Enterprise risk framework, BIA results","กรอบการบริหารความเสี่ยงองค์กร ผล BIA"],"duration":["2 hours","2 ชั่วโมง"],"cap":"SPEC","freq":["Annual","รายปี"],"first":["Executives rarely state appetite unprompted. Prepare scenario cards with impact in baht and hours of downtime, then ask which ones they would accept.","ผู้บริหารมักไม่กำหนดระดับความเสี่ยงที่ยอมรับได้เอง ควรเตรียมการ์ดสถานการณ์ที่ระบุผลกระทบเป็นจำนวนเงินบาทและชั่วโมงที่หยุดชะงัก แล้วถามว่ายอมรับสถานการณ์ใดได้"],"outputs":["GV-STM-001"]},"ACT-09":{"en":"Risk Methodology Design and Calibration Session","th":"การออกแบบและปรับเทียบวิธีการประเมินความเสี่ยง","purpose":["Define the likelihood and impact scales, risk matrix, and treatment rules, aligned with enterprise risk management and NIST SP 800-30.","กำหนดเกณฑ์โอกาสและผลกระทบ ตารางความเสี่ยง และกฎการจัดการความเสี่ยง ให้สอดคล้องกับการบริหารความเสี่ยงองค์กรและ NIST SP 800-30"],"agenda":[["Align scales with the enterprise risk framework","Impact criteria: patient or customer safety, financial, legal, operational, reputation","Likelihood criteria tied to threat and control evidence","Treatment options and acceptance authority per risk level","Trial run on three known risks to calibrate scoring"],["ปรับเกณฑ์ให้สอดคล้องกับกรอบการบริหารความเสี่ยงองค์กร","เกณฑ์ผลกระทบ: ความปลอดภัยข ปี และเมื่อมีการเปลี่ยนแปลงสำคัญ"],"first":["Threat scenarios and control effectiveness need security judgment. IT can supply facts, but a specialist should lead scoring in the first year.","สถานการณ์ภัยคุกคามและประสิทธิผลของมาตรการต้องใช้วิจารณญาณด้านความมั่นคงปลอดภัย ทีม IT ให้ข้อเท็จจริงได้ แต่ควรให้ผู้เชี่ยวชาญนำการให้คะแนนในปีแรก"],"outputs":["ID-REG-005","ID-PLN-001","ID-RPT-003"]},"ACT-11":{"en":"Current State Assessment and CSF Profile Gap Analysis","th":"การประเมินสภาพปัจจุบันและวิเคราะห์ช่องว่างตาม CSF Profile","purpose":["Measure current practice against NIST CSF 2.0, set a Target Profile, and list the gaps that drive the roadmap.","วัดการปฏิบัติปัจจุบันเทียบกับ NIST CSF 2.0 กำหนด Target Profile และระบุช่องว่างที่เป็นตัวกำหนดแผนงาน"],"agenda":[["Interviews and evidence review per CSF Category","Current Profile and Tier rating","Target Profile agreed with management, informed by risk appetite and legal duties","Gap list with priority and effort","Read-out to the steering committee"],["สัมภาษณ์และตรวจหลักฐานราย CSF Category","Current Profile และระดับ Tier","Target Profile ที่ตกลงกับผู้บริหาร โดยพิจารณาระดับความเสี่ยงที่ยอมรับได้และหน้าที่ตามกฎหมาย","รายการช่องว่างพร้อมลำดับความสำคัญและปริมาณงาน","นำเสนอผลต่อคณะกรรมการกำกับดูแล"]],"roles":["CISO","CIO","SYSOWN","IA"],"inputs":["Existing policies, technical evidence, prior audit findings","นโยบายที่มีอยู่ หลักฐานทางเทคนิค ข้อตรวจพบจากการตรวจสอบครั้งก่อน"],"duration":["3 to 6 weeks","3 ถึง 6 สัปดาห์"],"cap":"SPEC","freq":["Annual","รายปี"],"first":["An independent assessor gives a more credible baseline than self-assessment, and the result is easier to defend in a budget request.","ผู้ประเมินอิสระให้ผลตั้งต้นที่น่าเชื่อถือกว่าการประเมินตนเอง และนำไปใช้ประกอบคำของบประมาณได้ง่ายกว่า"],"outputs":["GV-STR-001","GV-REG-005","GV-REG-006","ID-RPT-003"]},"ACT-12":{"en":"Strategy, Roadmap, and Budget Planning Session","th":"การประชุมวางยุทธศาสตร์ แผนงาน และงบประมาณ","purpose":["Turn the gap analysis and risk register i บ","ร่างสุดท้ายเพื่อเสนออนุมัติ"]],"roles":["CISO","ITM","HR","LEGAL","SYSOWN"],"inputs":["Template, legal obligation list, risk register","แม่แบบ รายการหน้าที่ตามกฎหมาย ทะเบียนความเสี่ยง"],"duration":["1 to 2 weeks per document","1 ถึง 2 สัปดาห์ต่อฉบับ"],"cap":"GUIDED","freq":["Per document","ทุกฉบับ"],"first":["A policy copied from a template without a feasibility check creates instant noncompliance. Review with operations before approval, not after.","นโยบายที่คัดลอกจากแม่แบบโดยไม่ตรวจความเป็นไปได้จะทำให้เกิดการไม่ปฏิบัติตามทันที ควรทบทวนกับหน่วยปฏิบัติก่อนอนุมัติ ไม่ใช่หลังอนุมัติ"],"outputs":["GV-POL-002","GV-STD-001","GV-POL-001","GV-POL-003","GV-POL-005","GV-POL-004","GV-PRC-004","GV-PRC-005","GV-POL-006","ID-STD-001","PR-POL-001","PR-POL-002","PR-POL-003","PR-STD-004","PR-STD-005","PR-STD-007","PR-STD-009","PR-STD-013","RC-POL-001"]},"ACT-14":{"en":"Policy Approval and Communication","th":"การอนุมัติและสื่อสารนโยบาย","purpose":["Obtain formal approval, publish the document, and record that staff have read and accepted it.","ได้รับการอนุมัติอย่างเป็นทางการ เผยแพร่เอกสาร และบันทึกว่าพนักงานได้อ่านและยอมรับแล้ว"],"agenda":[["Present the document and the summary of changes to the approver","Approval decision and effective date","Publication channel and version control","Staff acknowledgment and briefing plan"],["นำเสนอเอกสารและสรุปการเปลี่ยนแปลงต่อผู้อนุมัติ","การตัดสินอนุมัติและวันที่มีผลบังคับใช้","ช่องทางเผยแพร่และการควบคุมเวอร์ชัน","การรับทราบของพนักงานและแผนการชี้แจง"]],"roles":["CISO","ISSC","HR","COMMS"],"inputs":["Final draft, document control procedure","ร่างสุดท้าย ระเบียบปฏิบัติการควบคุมเอกสาร"],"duration":["30 minutes at the approval meeting, 2 to 4 weeks for rollout","30 นาทีในที่ประชุมอนุมัติ และ 2 ถึง 4 สัปดาห์สำหรับการเผยแพร่"],"cap":"IT","freq":["Per document","ทุกฉบับ"],"first":["Keep evidence of approval and acknowledgment. Auditors ask for it before they read the content.","เก็บหลักฐานการอนุมัติและการรับทราบไว้ ผู้ตรวจสอบจะขอดูหลักฐานเหล่านี้ และฝ่ายบัญชีเจ้าหนี้","เกณฑ์: การเข้าถึงข้อมูล การเข้าถึงระบบ ความสำคัญของบริการ ความสามารถในการทดแทน","การกำหนดระดับและวิธีการประเมินของแต่ละระดับ","เงื่อนไขในสัญญาที่ต้องมีในแต่ละระดับ"]],"roles":["PROC","CISO","LEGAL","DPO","ITM"],"inputs":["Supplier list, contracts, remote access list","รายชื่อผู้ให้บริการ สัญญา รายการการเข้าถึงระยะไกล"],"duration":["Half day","ครึ่งวัน"],"cap":"GUIDED","freq":["Annual","รายปี"],"first":["Start with suppliers that have remote access or hold personal data. These cause most supply chain incidents.","เริ่มจากผู้ให้บริการที่เข้าถึงระบบจากระยะไกลหรือถือครองข้อมูลส่วนบุคคล กลุ่มนี้เป็นต้นเหตุของเหตุการณ์ด้านห่วงโซ่อุปทานส่วนใหญ่"],"outputs":["GV-PRC-008","GV-REG-009","GV-FRM-006","GV-STD-002"]},"ACT-17":{"en":"Incident Response Readiness Workshop","th":"Workshop เตรียมความพร้อมรับมือเหตุการณ์","purpose":["Agree who does what in an incident, how it is escalated, and how regulators and data subjects are notified.","ตกลงว่าใครทำอะไรเมื่อเกิดเหตุการณ์ การยกระดับ และการแจ้งหน่วยงานกำกับและเจ้าของข้อมูล"],"agenda":[["Incident team roles and backups, including out-of-hours contacts","Severity levels and escalation triggers","Regulatory notification duties and time limits (CII, PDPA) [VERIFY current notifications]","External support: incident response retainer, forensics, legal, insurer","Decision rights: shutting down systems, paying for recovery, public statements"],["บทบาทของทีมรับมือเหตุการณ์และผู้ปฏิบัติหน้าที่แทน รวมถึงผู้ติดต่อนอกเวลาทำการ","ระดับความรุนแรงและเงื่อนไขการยกระดับ","หน้าที่การแจ้งหน่วยงานกำกับและกำหนดเวลา (CII, PDPA) [VERIFY ประกาศฉบับปัจจุบัน]","ความช่วยเหลือจากภายนอก: บริการรับมือเหตุการณ์แบบ retainer นิติวิทยาศาสตร์ดิจิทัล กฎหมาย และบริษัทประกัน","อำนาจตัดสินใจ: การปิดระบบ การจ่ายค่ากู้คืน และการออกแถลงการณ์"]],"roles":["CISO","CIO","DPO","LEGAL","COMMS","CEO"],"inputs":["Contact list, legal obligation list, insurance policy","รายชื่อผู้ติดต่อ รายการหน้าที่ตามกฎหมาย กรมธรรม์ประกันภัย"],"duration":["Half day","ครึ่งวัน"],"cap":"SPEC","freq":["One time, then annual","ครั้งเดียว และทบทวนรายปี"],"first":["Without in-house incident experience, sign an incident response retainer first. The plan must name who you will call.","หากไม่มีประสบการณ์รับมือเหตุการณ์ภายในองค์กร ให้ทำสัญญาบริการรับมือเหตุการณ์แบบ retainer ก่อน แผนต้องระบุว่าจะติดต่อใคร"],"outputs":["DE-STD-002","RS-PLN-001","RS-PRC-001","RS-PLB-001","RS-PLB-002","RS-PLB-003","RS-PLB-004","RS-PRC-002","RS-PRC-003"]},"ACT-18":{"en":"Backup and Restore Validation Test","th":"การทดสอบการสำรองและกู้คืนข้อมูล","purpose":["Prove that critical systems can be restored from backup within the agreed RTO and RPO, including from an offline copy.","พิสูจน์ว่าระบบสำคัญกู้คืนจากข้อมูลสำรองได้ภายใน RTO และ RPO ที่ตกลงไว้ รวมถึงจากสำเนาแบบ offline"],"agenda":[["Select systems and the backup set to restore","Restore into an isolated environment","Measure time to restore and data loss","Confirm the offline or immutable copy is usable","Record result and fix gaps"],["เลือกระบบและชุดข้อมูลสำรองที่จะกู้คืน","กู้คืนในสภาพแวดล้อมที่แยกออกมา","วัดเวลาในการกู้คืนและปริมาณข้อมูลที่สูญเสีย","ยืนยันว่าสำเนาแบบ offline หรือ immutable ใช้งานได้","บันทึกผลและแก้ไขช่องว่าง"]],"roles":["ITM","SYSOWN","CISO"],"inputs":["Backup schedule, BIA results","ตารางการสำรองข้อมูล ผล BIA"],"duration":["1 to 3 days per system","1 ถึง 3 วันต่อระบบ"],"cap":"IT","freq":["Quarterly for critical systems","รายไตรมาสสำหรับระบบสำคัญ"],"first":["Many organizations discover in the first test that backups are incomplete or encrypted together with production. Run the test before writing the procedure.","หลายองค์กรพบในการทดสอบครั้งแรกว่าข้อมูลสำรองไม่ครบ หรือถูกเข้ารหัสไปพร้อมกับระบบจริง ควรทดสอบก่อนเขียนระเบียบปฏิบัติ"],"outputs":["PR-STD-006","PR-PRC-005","PR-REC-003","RC-PLN-002","RC-PRC-001"]},"ACT-19":{"en":"Identity and Privileged Access Review","th":"การทบทวนตัวตนและสิทธิ์ระดับสูง","purpose":["Find all administrator and service accounts, check Multi-Factor Authentication (MFA) coverage, and remove unneeded privilege.","ค้นหาบัญชีผู้ดูแลระบบและบัญชีบริการทั้งหมด ตรวจความครอบคลุมของ Multi-Factor Authentication (MFA) และถอดสิทธิ์ที่ไม่จำเป็น"],"agenda":[["Export privileged groups from directory, cloud, network, and key applications","Confirm owner and business need for each account","MFA coverage for remote access, email, and administrators","Shared and vendor accounts","Clean-up actions and owners"],["ดึงรายชื่อกลุ่มสิทธิ์ระดับสูงจาก directory คลาวด์ อุปกรณ์เครือข่าย และแอปพลิเคชันสำคัญ","ยืนยันเจ้าของและความจำเป็นทางธุรกิจของแต่ละบัญชี","ความครอบคลุมของ MFA สำหรับการเข้าถึงระยะไกล อีเมล และผู้ดูแลระบบ","บัญชีที่ใช้ร่วมกันและบัญชีของผู้ให้บริการ","รายการแก้ไขและผู้รับผิดชอบ"]],"roles":["ITM","CISO","SYSOWN"],"inputs":["Directory export, cloud admin roles, vendor access list","ข้อมูลจาก directory บทบาทผู้ดูแลบนคลาวด์ รายการการเข้าถึงของผู้ให้บริการ"],"duration":["1 to 2 weeks","1 ถึง 2 สัปดาห์"],"cap":"IT","freq":["Quarterly","รายไตรมาส"],"first":["IT can run the review. Expect to find accounts of former staff and vendors with permanent domain admin rights.","ทีม IT ดำเนินการทบทวนเองได้ คาดว่าจะพบบัญชีของอดีตพนักงานและผู้ให้บริการที่มีสิทธิ์ domain admin ถาวร"],"outputs":["PR-STD-001","PR-STD-002","PR-STD-003","PR-REC-001","PR-REG-001"]},"ACT-20":{"en":"Tabletop Exercise","th":"การฝึกซ้อมแบบ Tabletop","purpose":["Walk executives and responders through a realistic scenario to test the plan, decisions, and communication.","พาผู้บริหารและทีมรับมือผ่านสถานการณ์สมจริงเพื่อทดสอบแผน การตัดสินใจ และการสื่อสาร"],"agenda":[["Scenario briefing, for example ransomware on the core system at night","Injects every 15 to 20 minutes: spread, media call, regulator deadline, ransom note","Decisions and who made them","Hot debrief: what worked, what failed","Action list with owners and dates"],["ชี้แจงสถานการณ์ เช่น ransomware โจมตีระบบหลักในเวลากลางคืน","เพิ่มเหตุการณ์ทุก 15 ถึง 20 นาที: การแพร่กระจาย สื่อโทรมา กำหนดเวลาแจ้งหน่วยงานกำกับ และจดหมายเรียกค่าไถ่","การตัดสินใจและผู้ตัดสินใจ","สรุปผลทันที: สิ่งที่ได้ผล สิ่งที่ล้มเหลว","รายการปรับปรุงพร้อมผู้รับผิดชอบและกำหนดเวลา"]],"roles":["CEO","CIO","CISO","DPO","LEGAL","COMMS","BCM"],"inputs":["Incident response plan, playbooks, contact list","แผนรับมือเหตุการณ์ Playbook รายชื่อผู้ติดต่อ"],"duration":["2 to 3 hours","2 ถึง 3 ชั่วโมง"],"cap":"SPEC","freq":["At least annually","อย่างน้อยปีละครั้ง"],"first":["A realistic scenario needs an experienced facilitator who has handled real incidents. Internal facilitators tend to make it too easy.","สถานการณ์ที่สมจริงต้องอาศัยผู้ดำเนินการที่เคยรับมือเหตุการณ์จริง ผู้ดำเนินการภายในมักออกแบบสถานการณ์ง่ายเกินไป"],"outputs":["ID-PLN-002","RS-PLB-001","RC-PLN-003"]},"ACT-21":{"en":"Business Continuity and Disaster Recovery Exercise","th":"การฝึกซ้อมความต่อเนื่องทางธุรกิจและการกู้คืนระบบ","purpose":["Test failover, manual workarounds, and recovery sequence against RTO and RPO.","ทดสอบการสลับระบบ วิธีปฏิบัติงานด้วยมือ และลำดับการกู้คืนเทียบกับ RTO และ RPO"],"agenda":[["Exercise objectives and success criteria","Execution: failover or restore, manual workaround activation","Timing against RTO and RPO","Issues log and recovery sign-off","Report and improvement actions"],["วัตถุประสงค์และเกณฑ์ความสำเร็จของการฝึกซ้อม","การปฏิบัติ: สลับระบบหรือกู้คืน และเปิดใช้วิธีปฏิบัติงานด้วยมือ","การจับเวลาเทียบกับ RTO และ RPO","บันทึกปัญหาและการลงนามยืนยันการกู้คืน","รายงานและรายการปรับปรุง"]],"roles":["BCM","ITM","SYSOWN","CIO"],"inputs":["BCP, DRP, runbooks","BCP DRP และ Runbook"],"duration":["Half day to 2 days","ครึ่งวันถึง 2 วัน"],"cap":"GUIDED","freq":["Annual","รายปี"],"first":["Start with a walkthrough test before a live failover. A failed live test on a production system causes the outage it was meant to prevent.","เริ่มจากการทดสอบแบบ walkthrough ก่อนสลับระบบจริง การทดสอบจริงที่ล้มเหลวบนระบบที่ให้บริการอยู่จะทำให้เกิดการหยุดชะงักที่ต้องการป้องกัน"],"outputs":["ID-PLN-002","RC-REC-001"]},"ACT-22":{"en":"Security Monitoring Design Session","th":"การประชุมออกแบบการเฝ้าระวังความมั่นคงปลอดภัย","purpose":["Decide which logs to collect, which threats to detect first, and whether monitoring runs in-house or through an MSSP.","ตัดสินใจว่าจะเก็บ log ใด ตรวจจับภัยคุกคามใดก่อน และเฝ้าระวังเองหรือผ่าน MSSP"],"agenda":[["Log sources by criticality and legal retention duty","Priority detection use cases based on top risks","Operating model: in-house, hybrid, or MSSP; 24 by 7 coverage","Escalation from monitoring to incident response","Metrics: coverage, mean time to detect, false positive rate"],["แหล่ง log ตามความสำคัญและหน้าที่การเก็บรักษาตามกฎหมาย","Use case การตรวจจับที่มีลำดับความสำคัญตามความเสี่ยงหลัก","รูปแบบการดำเนินงาน: ทำเอง แบบผสม หรือ MSSP และการเฝ้าระวังตลอด 24 ชั่วโมง","การยกระดับจากการเฝ้าระวังไปสู่การรับมือเหตุการณ์","ตัวชี้วัด: ความครอบคลุม เวลาเฉลี่ยในการตรวจพบ อัตราการแจ้งเตือนผิดพลาด"]],"roles":["CISO","ITM","SOC","CIO"],"inputs":["Asset inventory, risk register, logging standard","ทะเบียนทรัพย์สิน ทะเบียนความเสี่ยง มาตรฐานการบันทึก log"],"duration":["Two half-day sessions","2 ครั้ง ครั้งละครึ่งวัน"],"cap":"SPEC","freq":["One time, then annual review","ครั้งเดียว และทบทวนรายปี"],"first":["Detection engineering is a specialist skill. Most organizations without a security team should buy monitoring as a service and keep oversight in-house.","การออกแบบการตรวจจับเป็นทักษะเฉพาะทาง องค์กรส่วนใหญ่ที่ไม่มีทีมความมั่นคงปลอดภัยควรซื้อบริการเฝ้าระวัง และคงการกำกับดูแลไว้ภายในองค์กร"],"outputs":["PR-STD-011","DE-STD-001","DE-PRC-001","DE-REG-001","DE-GDL-001","DE-PRC-002","DE-REG-002"]},"ACT-23":{"en":"Training Needs Analysis and Awareness Planning","th":"การวิเคราะห์ความต้องการฝึกอบรมและการวางแผนสร้างความตระหนักรู้","purpose":["Identify required knowledge per role and plan awareness and technical training for the year.","ระบุความรู้ที่จำเป็นของแต่ละบทบาท และวางแผนการสร้างความตระหนักรู้และการฝึกอบรมทางเทคนิคประจำปี"],"agenda":[["Role groups and required topics","Delivery channels and frequency","Phishing simulation approach and consequence policy","Completion targets and reporting"],["กลุ่มบทบาทและหัวข้อที่จำเป็น","ช่องทางและความถี่ในการอบรม","แนวทางการทดสอบ phishing และนโยบายผลที่ตามมา","เป้าหมายการอบรมให้ครบและการรายงาน"]],"roles":["CISO","HR","ITM"],"inputs":["RACI, incident history, phishing results","RACI ประวัติเหตุการณ์ ผลการทดสอบ phishing"],"duration":["2 hours","2 ชั่วโมง"],"cap":"IT","freq":["Annual","รายปี"],"first":["Short, frequent, role-specific content works better than one long annual session.","เนื้อหาสั้น บ่อย และเฉพาะบทบาท ได้ผลดีกว่าการอบรมยาวปีละครั้ง"],"outputs":["PR-PLN-001","PR-REG-002","PR-REC-002","PR-PRC-004"]},"ACT-24":{"en":"Management Review Meeting","th":"การประชุมทบทวนของฝ่ายบริหาร","purpose":["Have top management review program performance and decide on changes, as required by ISO/IEC 27001:2022 Clause 9.3.","ให้ผู้บริหารระดับสูงทบทวนผลการดำเนินงานของแผนงานและตัดสินใจปรับปรุง ตาม ISO/IEC 27001:2022 Clause 9.3"],"agenda":[["Status of actions from previous reviews","Changes in context, risks, and legal duties","Metrics, audit results, incidents, and nonconformities","Risk treatment status and resource needs","Decisions and improvement actions"],["สถานะการดำเนินการจากการทบทวนครั้งก่อน","การเปลี่ยนแปลงของบริบท ความเสี่ยง และหน้าที่ตามกฎหมาย","ตัวชี้วัด ผลการตรวจสอบ เหตุการณ์ และข้อบกพร่อง","สถานะการจัดการความเสี่ยงและความต้องการทรัพยากร","การตัดสินใจและรายการปรับปรุง"]],"roles":["ISSC","CEO","CIO","CISO","IA"],"inputs":["Metrics catalog, audit reports, risk register","ทะเบียนตัวชี้วัด รายงานการตรวจสอบ ทะเบียนความเสี่ยง"],"duration":["2 hours","2 ชั่วโมง"],"cap":"GUIDED","freq":["At planned intervals (ISO/IEC 27001:2022 Clause 9.3); common practice is at least annually, quarterly in the first year","ตามรอบที่วางแผนไว้ (ISO/IEC 27001:2022 ข้อ 9.3) แนวปฏิบัติทั่วไปคืออย่างน้อยปีละครั้ง และรายไตรมาสในปีแรก"],"first":["Use the agenda above as the minutes structure so every required input is covered and recorded.","ใช้หัวข้อการประชุมข้างต้นเป็นโครงสร้างรายง <li><b>Required and its trigger applies:</b> must have it, whatever the package. Example: the Statement of Applicability is Extended but Required for ISO/IEC 27001 certification.</li>
<li><b>Essential:</b> yes, start now.</li>
<li><b>Core:</b> yes for mid-sized and larger organizations; a small organization may merge or defer with a documented reason.</li>
<li><b>Extended:</b> only when the profile, a regulator, or a customer calls for it.</li></ol>
<h3>The packages</h3><table>
<tr><th><span class="pk Essential">ES</span> Essential</th><td>${PKG.Essential[0]}</td></tr>
<tr><th><span class="pk Core">CO</span> Core</th><td>${PKG.Core[0]}</td></tr>
<tr><th><span class="pk Extended">EX</span> Extended</th><td>${PKG.Extended[0]}</td></tr></table>
<p>${PKGNOTE[0]}</p>
<p><b>Can we have Core without Essential?</b> No. Every Core document sits under an Essential document in the cascade, and most need one as direct input. A Core procedure without its Essential policy has no authority to rely on.</p>
<p><b>Why the package is not inside the level block:</b> the two answer different questions. One combined block would hide the cases that matter most, such as a Required document in the Extended package. Tick <b>Show package</b> to add a separate package tag to every document.</p>
<h3>How the 142 documents spread across Level and Package</h3>__LPM_EN__`,
TH:`<h3>Level, Package และ Wave ตอบคำถามคนละข้อ</h3>
<table><tr><th></th><th>คำถามที่ตอบ</th><th>ค่า</th><th>ตัดสินจาก</th></tr>
<tr><th>Level (ระดับ)</th><td>ต้องมีเอกสารนี้หรือไม่</td><td>Required, Expected, Optional</td><td>กฎหมาย หน่วยงานกำกับ หรือมาตรฐานที่ขอรับรองได้ และองค์กรเข้าเงื่อนไข Trigger (PDPA, CII, CCA, การขอรับรอง ISO) หรือไม่</td></tr>
<tr><th>Package (ชุด)</th><td>ควรมีมากแค่ไหนตามขนาดองค์กร</td><td>Essential, Core, Extended</td><td>ขนาดและความพร้อมขององค์กร</td></tr>
<tr><th>Wave (ระลอก)</th><td>ควรเขียนเมื่อใด</td><td>W0 ถึง W5, Track A หรือ B</td><td>ความเชื่อมโยงระหว่างเอกสารและแรงกดดันจากภัยคุกคาม</td></tr></table>
<h3>ต้องมีเอกสารนี้หรือไม่: ใช้กฎตามลำดับ</h3><ol>
<li><b>Required และเข้าเงื่อนไข Trigger:</b> ต้องมี ไม่ว่าอยู่ในชุดใด ตัวอย่าง: Statement of Applicability อยู่ในชุด Extended แต่เป็น Required เมื่อขอรับรอง ISO/IEC 27001</li>
<li><b>Essential:</b> ต้องมี เริ่มทันที</li>
<li><b>Core:</b> ควรมีสำหรับองค์กรขนาดกลางขึ้นไป องค์กรเล็กรวมหรือเลื่อนออกไปได้โดยบันทึกเหตุผล</li>
<li><b>Extended:</b> ทำเมื่อลักษณะองค์กร หน่วยงานกำกับ หรือลูกค้ากำหนดเท่านั้น</li></ol>
<h3>ชุดเอกสาร</h3><table>
<tr><th><span class="pk Essential">ES</span> Essential</th><td>${PKG.Essential[1]}</td></tr>
<tr><th><span class="pk Core">CO</span> Core</th><td>${PKG.Core[1]}</td></tr>
<tr><th><span class="pk Extended">EX</span> Extended</th><td>${PKG.Extended[1]}</td></tr></table>
<p>${PKGNOTE[1]}</p>
<p><b>มี Core โดยไม่มี Essential ได้หรือไม่:</b> ไม่ได้ เอกสาร Core ทุกฉบับอยู่ใต้เอกสาร Essential ในสายการถ่ายทอด และส่วนใหญ่ใช้เอกสาร Essential เป็นข้อมูลนำเข้าโดยตรง ระเบียบปฏิบัติใน Core ที่ไม่มีนโยบาย Essential รองรับจะไม่มีอำนาจอ้างอิง</p>
<p><b>ทำไมไม่รวม Package ไว้ในบล็อกระดับ:</b> ทั้งสองตอบคำถามคนละข้อ หากรวมเป็นบล็อกเดียวจะซ่อนกรณีที่สำคัญที่สุด เช่น เอกสาร Required ที่อยู่ในชุด Extended เลือก <b>แสดงชุดเอกสาร</b> เพื่อเพิ่มป้ายชุดแยกบนทุกเอกสาร</p>
<h3>การกระจายของเอกสาร 142 ฉบับตาม Level และ Package</h3>__LPM_TH__`};

EN:`<h3>Specialist-guided (G) versus Specialist-required (S)</h3><table>
<tr><th></th><th><span class="cap GUIDED">G</span> Specialist-guided</th><th><span class="cap SPEC">S</span> Specialist-required</th></tr>
<tr><th>Who holds the pen</th><td>IT or the document owner drafts</td><td>The specialist writes it or leads the work</td></tr>
<tr><th>What the specialist does</th><td>Facilitates one workshop or reviews the draft</td><td>Designs the method, makes the technical judgments, and often runs the activity</td></tr>
<tr><th>Typical specialist time</th><td>A few hours to two days per document</td><td>Several days per document, or an ongoing service</td></tr>
<tr><th>If no specialist is involved</th><td>The document exists but has blind spots; usually fixable at the next review</td><td>The document is wrong or cannot be produced, for example risk scores that cannot be compared, or an incident plan no one can execute</td></tr>
<tr><th>Typical sourcing</th><td>Part-time consultant review, peer review, DPO service</td><td>Security FTE, consultant engagement, MSSP, incident response retainer, co-sourced audit</td></tr>

<tr><th>Test question</th><td>Could IT write a credible draft if someone experienced checks it? Yes.</td><td>Would an IT draft still be wrong after a review? Yes.</td></tr></table>
<p class="mini">Time estimates are practitioner guidance for planning, not a standard.</p>`,
TH:`<h3>Specialist-guided (G) เทียบกับ Specialist-required (S)</h3><table>

const FLOWBUILD={
EN:`<h3>Flow order versus build order</h3>
<p>The two orders answer different questions. <b>Flow order</b> is how work runs: who does what first when an event happens. <b>Build order</b> is which document must exist first so that another document can rely on it. Think of a house: people walk from the front door to the living room to the kitchen, but builders pour the foundation before the walls and the roof.</p>
<p>The incident flow shows the difference. Triage (step 2) runs before severity classification (step 3), but the triage procedure says "classify per DE-STD-002", so the severity standard has to be written first. Reporting, the ransomware playbook, and the incident register are written in the first weeks (Track B) even though they sit in the middle of the flow, because a new program receives its first incidents from users and vendors long before it can detect them itself.</p>
__FBT__
<h3>What goes wrong if you use the wrong order</h3><table>
<tr><th>Write in flow order</th><td>Procedures cite documents that do not exist yet and must be rewritten later; auditors raise document control findings; each analyst judges severity differently in the meantime.</td></tr>
<tr><th>Build in order but never walk the flow</th><td>Each document is correct on its own, but the handoffs break: a form says "send to the incident team" while no procedure says who receives it, within how long, or where it is recorded.</td></tr>
<tr><th>No cover for the gap period</th><td>Between month 1 and month 9 the flow runs with missing steps. Without interim content, nobody knows which events must reach management.</td></tr></table>
<h3>The rule: write in build order, design and test in flow order</h3><ol>
<li><b>Plan</b> with Recommended order; it already respects dependencies and threat pressure.</li>
<li><b>While drafting</b> each document, open its flow and confirm three things: what it receives from the step before, what it hands to the step after, and who hands over, within how long, recorded where.</li>
<li><b>Cover the gap</b> with interim content in a document that already exists. Example: put a simple three-level severity table in the escalation section of the interim incident response plan (#__IRP__) until DE-STD-002 (#__SEV__) is approved, then replace the table with a reference. The detail panel lists these links under "Interim: align later to".</li>
<li><b>Test</b> each flow end to end with a walkthrough or tabletop once its documents exist. A step you cannot walk through is a broken handoff.</li></ol>
<p>In Process flows, the grey "build #" beside each step shows where that document sits in the build order.</p>`,
TH:`<h3>ลำดับใน flow กับลำดับการจัดทำ</h3>
<p>ลำดับทั้งสองตอบคำถามคนละข้อ <b>ลำดับใน flow</b> คือวิธีที่งานเกิดขึ้นจริง ใครทำอะไรก่อนเมื่อมีเหตุการณ์ <b>ลำดับการจัดทำ</b> คือเอกสารใดต้องมีก่อนเพื่อให้เอกสารอื่นอ้างอิงได้ เปรียบกับบ้าน: คนเดินจากประตูหน้าไปห้องนั่งเล่นแล้วไปห้องครัว แต่ช่างต้องทำฐานรากก่อนผนังและหลังคา</p>
<p>flow การจัดการเหตุการณ์แสดงความต่างชัดเจน การคัดกรอง (ขั้นที่ 2) เกิดก่อนการจัดระดับความรุนแรง (ขั้นที่ 3) แต่ระเบียบปฏิบัติการคัดกรองเขียนว่า "จัดระดับตาม DE-STD-002" จึงต้องเขียนมาตรฐานระดับความรุนแรงก่อน ส่วนการรับแจ้ง playbook ransomware และทะเบียนเหตุการณ์เขียนในสัปดาห์แรก ๆ (Track B) แม้จะอยู่กลาง flow เพราะแผนงานที่เพิ่งเริ่มจะได้รับแจ้งเหตุการณ์แรกจากผู้ใช้และผู้ให้บริการ นานก่อนที่จะตรวจจับได้เอง</p>
__FBT__
<h3>ถ้าใช้ลำดับผิดจะเกิดอะไร</h3><table>
<tr><th>เขียนตามลำดับใน flow</th><td>ระเบียบปฏิบัติอ้างเอกสารที่ยังไม่มีและต้องแก้ภายหลัง ผู้ตรวจสอบพบเป็นข้อบกพร่องด้านการควบคุมเอกสาร และระหว่างนั้นแต่ละคนตัดสินระดับความรุนแรงต่างกัน</td></tr>
<tr><th>เขียนตามลำดับการจัดทำแต่ไม่เคยไล่ flow</th><td>เอกสารแต่ละฉบับถูกต้องในตัวเอง แต่รอยต่อขาด เช่น แบบฟอร์มเขียนว่า "ส่งให้ทีมรับมือ" แต่ไม่มีระเบียบปฏิบัติระบุว่าใครรับ ภายในกี่ชั่วโมง และบันทึกที่ใด</td></tr>
<tr><th>ไม่มีสิ่งรองรับช่วงรอยต่อ</th><td>ระหว่างเดือนที่ 1 ถึง 9 flow ทำงานโดยขาดบางขั้น หากไม่มีเนื้อหาชั่วคราว จะไม่มีใครรู้ว่าเหตุการณ์ใดต้องแจ้งผู้บริหาร</td></tr></table>
<h3>หลักการ: เขียนตามลำดับการจัดทำ ออกแบบและทดสอบตามลำดับใน flow</h3><ol>
<li><b>วางแผน</b> ด้วยลำดับที่แนะนำ ซึ่งคำนึงถึงเอกสารที่ต้องมีก่อนและแรงกดดันจากภัยคุกคามแล้ว</li>
<li><b>ขณะร่าง</b> เอกสารแต่ละฉบับ ให้เปิด flow ของเอกสารนั้นและยืนยัน 3 เรื่อง: รับอะไรจากขั้นก่อนหน้า ส่งอะไรให้ขั้นถัดไป และใครส่งต่อ ภายในเวลาเท่าใด บันทึกที่ใด</li>
<li><b>รองรับช่วงรอยต่อ</b> ด้วยเนื้อหาชั่วคราวในเอกสารที่มีอยู่แล้ว เช่น ใส่ตารางระดับความรุนแรงแบบง่าย 3 ระดับไว้ในหัวข้อการยกระดับของแผนรับมือเหตุการณ์ฉบับชั่วคราว (#__IRP__) จนกว่า DE-STD-002 (#__SEV__) จะได้รับอนุมัติ แล้วแทนตารางด้วยการอ้างอิง แผงรายละเอียดแสดงความเชื่อมโยงนี้ในหัวข้อ "ฉบับชั่วคราว: ปรับให้สอดคล้องภายหลังกับ"</li>
<li><b>ทดสอบ</b> แต่ละ flow ตั้งแต่ต้นจนจบด้วย walkthrough หรือ tabletop เมื่อเอกสารครบ ขั้นที่ไล่ผ่านไม่ได้คือรอยต่อที่ขาด</li></ol>
<p>ในมุมมองลำดับกระบวนการ ป้ายสีเทา "จัดทำ #" ข้างแต่ละขั้นแสดงตำแหน่งของเอกสารนั้นในลำดับการจัดทำ</p>`};

  $("split").innerHTML=`<div class="svcbar">${bar}</div>${info}<div class="callout">${Li?"แถวบนไม่ได้แปลว่าต้องจ้างภายนอกเสมอ หากองค์กรมีพนักงานประจำด้านความมั่นคงปลอดภัยที่มีทักษะ งานในแถวบนย้ายมาทำภายในได้ การแบ่งงานคำนวณจาก capability flag และเป็นแนวทางจากผู้ปฏิบัติงาน":"The top lane does not mean outsourcing is mandatory. If the organization has a qualified security FTE, top-lane work moves in-house. The split is derived from the capability flags and is practitioner guidance."}</div>${g}`;}

/* ---------- tree diagram ---------- */
const KIDS={};D.forEach(d=>KIDS[d.id]=D.filter(c=>c.parents[0]===d.id).map(c=>c.id).sort((a,b)=>BY[a].seq-BY[b].seq));
const ROOTS=D.filter(d=>!d.parents.length).map(d=>d.id);
function depthOf(id){let n=0,p=BY[id].parents[0];while(p){n++;p=BY[p].parents[0];}return n;}
D.forEach(d=>{if(depthOf(d.id)<1)topen.add(d.id);});
function lineage(id){const s=new Set([id]);const up=x=>BY[x].parents.forEach(p=>{if(!s.has(p)){s.add(p);up(p);}});const dn=x=>BY[x].children.forEach(c=>{if(!s.has(c)){s.add(c);dn(c);}});up(id);dn(id);return s;}
function renderTree(){
  const NW=270,CW=300,RH=34,TOP=30,LEFT=12;let row=0;const pos={};const vis=[];
  function walk(id,dep){vis.push(id);const ks=topen.has(id)?KIDS[id]:[];let y;
    if(!ks.length){y=TOP+row*RH;row++;} else {const ys=ks.map(k=>walk(k,dep+1));y=(ys[0]+ys[ys.length-1])/2;}
    pos[id]={x:LEFT+dep*CW,y};return y;}
  ROOTS.forEach(r=>walk(r,0));
  const maxDep=Math.max(...vis.map(v=>(pos[v].x-LEFT)/CW));const W=LEFT+(maxDep+1)*CW+20,H=TOP+row*RH+10;
  const lin=sel&&BY[sel]?lineage(sel):null;
  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
  const curve=(a,b,st)=>{const x1=a.x+NW-4,y1=a.y+11,x2=b.x,y2=b.y+11,mx=(x1+x2)/2;return `<path d="M${x1} ${y1} C${mx} ${y1},${mx} ${y2},${x2} ${y2}" fill="none" ${st}/>`;};
  const curveAny=(a,b,st)=>{const x1=a.x+(a.x<b.x?NW-4:0),y1=a.y+11,x2=b.x+(a.x<b.x?0:NW-4),y2=b.y+11,mx=(x1+x2)/2+(a.x===b.x?60:0);return `<path d="M${x1} ${y1} C${mx} ${y1},${mx} ${y2},${x2} ${y2}" fill="none" ${st}/>`;};
  vis.forEach(id=>{const p=BY[id].parents[0];if(p&&pos[p]){const on=!lin||(lin.has(id)&&lin.has(p));svg+=curve(pos[p],pos[id],`stroke="var(--edge)" stroke-width="${on&&lin?2.2:1.4}" opacity="${on?1:.2}"`);}});
  vis.forEach(id=>BY[id].parents.slice(1).forEach(p=>{if(pos[p]){const on=!lin||(lin.has(id)&&lin.has(p));svg+=curveAny(pos[p],pos[id],`stroke="var(--edge2)" stroke-width="2" stroke-dasharray="6 4" opacity="${on?1:.25}"`);}}));
  if(sel&&$("t-deps").checked&&pos[sel]){BY[sel].deps.forEach(dp=>{if(pos[dp]&&!BY[sel].parents.includes(dp))svg+=curveAny(pos[dp],pos[sel],`stroke="var(--dep)" stroke-width="2" stroke-dasharray="2 3"`);});
    BY[sel].unlocks.forEach(u=>{if(pos[u]&&!BY[u].parents.includes(sel))svg+=curveAny(pos[sel],pos[u],`stroke="var(--dep)" stroke-width="1.6" stroke-dasharray="2 3" opacity=".7"`);});}
  svg+="</svg>";
  let heads="";for(let i=0;i<=maxDep;i++)heads+=`<div class="colhead" style="left:${LEFT+i*CW+30}px">${lang==="TH"?"ระดับ":"Level"} ${i}</div>`;
  let nodes=vis.map(id=>{const d=BY[id],k=KIDS[id].length,o=topen.has(id);const fade=lin&&!lin.has(id);const extra=d.parents.length>1?`<span class="mp" title="${esc(d.parents.slice(1).join(", "))}">+${d.parents.length-1}P</span>`:"";
    return `<div class="tn${fade?" fade":""}" style="left:${pos[id].x}px;top:${pos[id].y}px">${chip(d)}${k?`<button class="tog" data-ttog="${id}" aria-expanded="${o}" title="${k}">${o?"−":"+"}</button>`:""}${extra}</div>`;}).join("");
  $("diag").innerHTML=`<div style="position:relative;width:${W}px;height:${H}px">${svg}${heads}${nodes}</div>`;
  if(sel&&pos[sel]&&scrollSel){const dg=$("diag");dg.scrollTo({top:Math.max(0,pos[sel].y-dg.clientHeight/2),left:Math.max(0,pos[sel].x-dg.clientWidth/3)});scrollSel=false;}}
